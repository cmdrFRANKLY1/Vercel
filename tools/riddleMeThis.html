<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dust Particles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body class="relative w-full h-full">

    <div class="absolute inset-0 p-6 flex justify-between items-start z-10 pointer-events-none">
        <!-- Top Left: Back Button -->
        <a href="index.html" class="pointer-events-auto flex items-center gap-2 text-gray-400 hover:text-white transition-colors duration-300 group bg-black/30 px-4 py-2 rounded-full backdrop-blur-sm border border-gray-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="text-sm tracking-wider uppercase font-semibold">Back</span>
        </a>

        <!-- Top Right: Date and Time -->
        <div class="pointer-events-auto text-right bg-black/30 px-4 py-2 rounded-xl backdrop-blur-sm border border-gray-800 flex flex-col items-end">
            <div id="time-display" class="text-xl font-light tracking-widest font-mono text-gray-200 mb-1">--:--:--</div>
            <div id="date-display" class="text-xs text-gray-400 tracking-widest uppercase">--</div>
        </div>
    </div>

    <!-- Center Text for Interaction -->
    <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
        <h1 id="main-text" class="pointer-events-auto text-5xl md:text-7xl font-bold tracking-widest cursor-pointer transition-all duration-500 hover:scale-110 hover:text-blue-300 text-center drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
            Are you ready?
        </h1>
        
        <!-- Category Grid -->
        <div id="category-grid" class="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0 pointer-events-none transition-all duration-700 transform translate-y-8 max-w-5xl px-6 w-full">
        </div>

        <!-- Question Container -->
        <div id="question-container" class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none opacity-0 transition-all duration-700 transform translate-y-8 max-w-5xl px-6 w-full mx-auto">
            <h2 id="question-text" class="text-2xl md:text-4xl font-semibold tracking-wide text-center drop-shadow-md mb-12 text-gray-100 px-4">
                <!-- Question populates here -->
            </h2>
            <div id="answer-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-4xl px-4">
                <!-- Answers populate here -->
            </div>
            
            <button id="back-to-categories-btn" class="mt-12 px-6 py-3 bg-white/5 hover:bg-white/10 border border-gray-600 rounded-full text-xs uppercase tracking-widest transition-all duration-300 opacity-0 pointer-events-none hover:shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                Back to Categories
            </button>
        </div>
    </div>

    <canvas id="dust-canvas" class="fixed top-0 left-0 w-full h-full z-0 pointer-events-none"></canvas>

    <script>
        // Clock Logic
        function updateClock() {
            const now = new Date();
            const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', dateOptions);
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('time-display').textContent = now.toLocaleTimeString('en-US', timeOptions);
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Particle Engine Logic
        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const particleCount = 700;
        let warpSpeed = 0, targetWarpSpeed = 0, isWarping = false;
        let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
        let warpColorOverride = null;
        let activeQuestions = [];

        window.addEventListener('mousemove', (e) => {
            targetMouseX = (e.clientX - width / 2) * 0.05;
            targetMouseY = (e.clientY - height / 2) * 0.05;
        });

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.prevX = this.x;
                this.prevY = this.y;
                
                const layerRandom = Math.random();
                if (layerRandom > 0.90) {
                    this.layer = 3; this.z = 1.0; this.radius = Math.random() * 1.5 + 1.2; this.baseAlpha = Math.random() * 0.5 + 0.5;
                } else if (layerRandom > 0.40) {
                    this.layer = 2; this.z = 0.5; this.radius = Math.random() * 0.8 + 0.6; this.baseAlpha = Math.random() * 0.4 + 0.2;
                } else {
                    this.layer = 1; this.z = 0.2; this.radius = Math.random() * 0.4 + 0.2; this.baseAlpha = Math.random() * 0.2 + 0.1;
                }
                
                this.vx = (Math.random() - 0.5) * 0.2 * this.z;
                this.vy = (Math.random() - 0.5) * 0.2 * this.z - (0.1 * this.z);

                const colors = ['255, 255, 255', '210, 230, 255', '255, 240, 210'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * this.baseAlpha;
                this.alphaChange = (Math.random() - 0.5) * 0.015;
            }

            update() {
                this.prevX = this.x; this.prevY = this.y;
                this.x += this.vx; this.y += this.vy;

                if (warpSpeed !== 0) {
                    const dx = this.x - width / 2; const dy = this.y - height / 2;
                    this.x += dx * warpSpeed * this.z * 0.005; this.y += dy * warpSpeed * this.z * 0.005;

                    if (warpSpeed < -2) {
                        const distSq = dx * dx + dy * dy;
                        if (distSq < 100) {
                            const angle = Math.random() * Math.PI * 2; const dist = Math.max(width, height) * 0.7; 
                            this.x = width / 2 + Math.cos(angle) * dist; this.y = height / 2 + Math.sin(angle) * dist;
                            this.prevX = this.x; this.prevY = this.y;
                        }
                    }
                }

                if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                    if (warpSpeed > 2) {
                        const angle = Math.random() * Math.PI * 2; const dist = Math.random() * (Math.min(width, height) * 0.15); 
                        this.x = width / 2 + Math.cos(angle) * dist; this.y = height / 2 + Math.sin(angle) * dist;
                    } else if (warpSpeed < -2) {
                    } else {
                        if (this.x < -10) this.x = width + 10;
                        if (this.x > width + 10) this.x = -10;
                        if (this.y < -10) this.y = height + 10;
                        if (this.y > height + 10) this.y = -10;
                    }
                    this.prevX = this.x; this.prevY = this.y;
                }

                this.alpha += this.alphaChange;
                if (this.alpha <= 0.05 || this.alpha >= this.baseAlpha) {
                    this.alphaChange = -this.alphaChange;
                }
            }

            draw(parallaxOffsetX, parallaxOffsetY) {
                const drawX = this.x + (parallaxOffsetX * this.z);
                const drawY = this.y + (parallaxOffsetY * this.z);
                const drawPrevX = this.prevX + (parallaxOffsetX * this.z);
                const drawPrevY = this.prevY + (parallaxOffsetY * this.z);

                const activeColor = warpColorOverride ? warpColorOverride : this.color;

                if (Math.abs(warpSpeed) > 1) {
                    ctx.beginPath();
                    ctx.moveTo(drawPrevX, drawPrevY); ctx.lineTo(drawX, drawY);
                    ctx.strokeStyle = `rgba(${activeColor}, ${Math.max(0, this.alpha)})`;
                    ctx.lineWidth = this.radius * (this.layer === 3 ? 2 : 1);
                    ctx.lineCap = 'round'; ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${activeColor}, ${Math.max(0, this.alpha)})`;
                    ctx.fill();
                    
                    if (this.layer === 3) {
                        ctx.beginPath();
                        ctx.arc(drawX, drawY, this.radius * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${activeColor}, ${Math.max(0, this.alpha * 0.2)})`;
                        ctx.fill();
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) { particles.push(new Particle()); }
        }

        function animate() {
            if (Math.abs(warpSpeed) > 1) { ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(0, 0, width, height); } 
            else { ctx.clearRect(0, 0, width, height); }
            
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            warpSpeed += (targetWarpSpeed - warpSpeed) * 0.15;
            
            particles.forEach(p => { p.update(); p.draw(mouseX, mouseY); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); animate();

        // Game/UI Logic
        const mainText = document.getElementById('main-text');
        mainText.addEventListener('click', () => {
            if (isWarping) return;
            isWarping = true;
            mainText.style.opacity = 0;
            mainText.style.transform = 'scale(0.8)';
            targetWarpSpeed = 40;
            
            setTimeout(() => {
                mainText.textContent = "Pick a Category";
                targetWarpSpeed = 0;
                mainText.style.opacity = 1;
                mainText.style.transform = 'scale(1) translateY(-20px)';
                mainText.style.pointerEvents = 'none';
                loadCategories();
            }, 525); 
        });

        function formatTopicName(filename) {
            return filename.replace('topicRMT.', '').replace('.json', '').replace(/_/g, ' ');
        }

        async function loadCategories() {
            const grid = document.getElementById('category-grid');
            let files = [];
            
            try {
                // Primary Fetch: Vercel API
                const response = await fetch('/api/topics');
                if (!response.ok) throw new Error('Network response was not ok');
                files = await response.json();
                if (!Array.isArray(files) || files.length === 0) throw new Error('Empty array returned');
            } catch (error) {
                console.warn("Primary API failed. Initiating GitHub Fallback...", error);
                try {
                    // Fallback Fetch: GitHub API Directory Listing
                    const ghResponse = await fetch('https://api.github.com/repos/cmdrFRANKLY1/Vercel/contents/resources/riddleMeThis');
                    if (!ghResponse.ok) throw new Error('GitHub API response not ok');
                    const ghData = await ghResponse.json();
                    
                    if (Array.isArray(ghData)) {
                        // Extract just the filenames from the GitHub payload
                        files = ghData.map(item => item.name);
                    }
                } catch (ghError) {
                    console.error("GitHub fallback failed as well.", ghError);
                    files = [];
                }
            }

            grid.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-8');
            grid.classList.add('opacity-100');
            
            // Filter strictly for our specific json files
            files = files.filter(f => typeof f === 'string' && f.startsWith('topicRMT.') && f.endsWith('.json'));

            if (files.length === 0) {
                // Fallback UI if NO files were successfully fetched
                const btn = document.createElement('button');
                btn.className = "pointer-events-auto px-6 py-4 bg-black/40 border border-gray-700 rounded-xl backdrop-blur-md text-white font-semibold tracking-wider hover:bg-gray-800/80 transition-all duration-300 hover:-translate-y-1 opacity-0 col-span-1 md:col-start-2";
                btn.textContent = "Back (Failed to connect to Databanks)";
                btn.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s`;
                btn.onclick = () => { triggerReverseWarp(); };
                grid.appendChild(btn);
                return;
            }

            // Populate Grid with real categories
            files.forEach((file, index) => {
                const btn = document.createElement('button');
                btn.className = "pointer-events-auto px-6 py-4 bg-black/40 border border-gray-700 rounded-xl backdrop-blur-md text-white font-semibold tracking-wider hover:bg-blue-900/40 hover:border-blue-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_0_20px_rgba(96,165,250,0.4)] opacity-0 flex items-center justify-center text-center h-full break-words";
                btn.textContent = formatTopicName(file);
                btn.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.1}s`;
                
                btn.onclick = () => {
                    btn.style.transform = 'scale(0.95)';
                    btn.classList.add('bg-blue-600/60', 'border-blue-400');
                    loadQuestion(file);
                };
                grid.appendChild(btn);
            });
        }

        async function loadQuestion(filename) {
            if (isWarping) return;
            isWarping = true;
            targetWarpSpeed = 40;
            warpColorOverride = null;
            
            const grid = document.getElementById('category-grid');
            const mainText = document.getElementById('main-text');
            grid.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
            grid.classList.remove('opacity-100');
            mainText.style.opacity = 0; 
            
            let questions = [];
            
            try {
                // Primary Fetch: Local Folder
                const response = await fetch(`../resources/riddleMeThis/${filename}`);
                if (!response.ok) throw new Error('Failed to fetch local JSON');
                questions = await response.json();
            } catch (error) {
                console.warn("Local fetch failed. Fetching Raw JSON from GitHub Fallback...", error);
                try {
                    // Fallback Fetch: Raw GitHub File
                    const ghResponse = await fetch(`https://raw.githubusercontent.com/cmdrFRANKLY1/Vercel/main/resources/riddleMeThis/${filename}`);
                    if (!ghResponse.ok) throw new Error('Failed to fetch GitHub Raw Data');
                    questions = await ghResponse.json();
                } catch (ghError) {
                    console.error("Error loading question data from GitHub:", ghError);
                }
            }

            // Shuffle all loaded questions
            activeQuestions = questions.sort(() => Math.random() - 0.5);

            setTimeout(() => {
                presentNextQuestion(null);
            }, 525);
        }

        function presentNextQuestion(colorOverride = null) {
            const qContainer = document.getElementById('question-container');
            const answerGrid = document.getElementById('answer-grid');
            const questionText = document.getElementById('question-text');
            const backBtn = document.getElementById('back-to-categories-btn');
            
            // If warping between questions, trigger effects
            if (colorOverride) {
                isWarping = true;
                targetWarpSpeed = 40;
                warpColorOverride = colorOverride;
                qContainer.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
                qContainer.classList.remove('opacity-100', 'pointer-events-auto');
            }

            // Wait for warp visual to peak before updating text
            setTimeout(() => {
                answerGrid.innerHTML = '';
                
                if (!activeQuestions || activeQuestions.length === 0) {
                    questionText.textContent = "Category Complete!";
                    backBtn.classList.remove('opacity-0', 'pointer-events-none');
                    backBtn.classList.add('opacity-100', 'pointer-events-auto');
                } else {
                    const q = activeQuestions.pop();
                    const allAnswers = [q.richtigeAntwort, ...q.falscheAntworten].sort(() => Math.random() - 0.5); 
                    
                    questionText.textContent = q.frage;
                    backBtn.classList.add('opacity-0', 'pointer-events-none');
                    backBtn.classList.remove('opacity-100', 'pointer-events-auto');
                    
                    allAnswers.forEach(ans => {
                        const btn = document.createElement('button');
                        btn.className = "pointer-events-auto px-6 py-4 bg-black/40 border border-gray-600 rounded-xl backdrop-blur-md text-gray-200 font-medium text-lg hover:bg-white/10 hover:border-gray-400 transition-all duration-300 w-full text-center md:text-left min-h-[80px] shadow-lg break-words";
                        btn.textContent = ans;
                        
                        btn.onclick = () => {
                            const buttons = answerGrid.querySelectorAll('button');
                            buttons.forEach(b => {
                                b.disabled = true;
                                b.classList.remove('hover:bg-white/10', 'hover:border-gray-400', 'pointer-events-auto');
                                b.classList.add('cursor-not-allowed', 'opacity-60');
                            });
                            
                            const isCorrect = ans === q.richtigeAntwort;
                            
                            if (isCorrect) {
                                btn.classList.remove('bg-black/40', 'border-gray-600', 'opacity-60');
                                btn.classList.add('bg-green-600/80', 'border-green-400', 'text-white', 'opacity-100', 'scale-105');
                            } else {
                                btn.classList.remove('bg-black/40', 'border-gray-600', 'opacity-60');
                                btn.classList.add('bg-red-600/80', 'border-red-400', 'text-white', 'opacity-100');
                                buttons.forEach(b => {
                                    if(b.textContent === q.richtigeAntwort) {
                                        b.classList.remove('bg-black/40', 'border-gray-600', 'opacity-60');
                                        b.classList.add('bg-green-600/80', 'border-green-400', 'text-white', 'opacity-100');
                                    }
                                });
                            }
                            
                            // Delay to let user see the answer, then warp to next
                            setTimeout(() => {
                                presentNextQuestion(isCorrect ? '34, 197, 94' : '239, 68, 68'); 
                            }, 1200);
                        };
                        answerGrid.appendChild(btn);
                    });
                }

                targetWarpSpeed = 0;
                qContainer.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-8');
                qContainer.classList.add('opacity-100', 'pointer-events-auto');
                
                // End Warp
                setTimeout(() => { 
                    isWarping = false; 
                    warpColorOverride = null;
                }, 100);

            }, colorOverride ? 525 : 0);
        }

        // Standard Reverse Warp Logic
        function triggerReverseWarp() {
            if (isWarping) return;
            isWarping = true;
            targetWarpSpeed = -40; 
            
            const grid = document.getElementById('category-grid');
            mainText.style.opacity = 0;
            mainText.style.transform = 'scale(0.8) translateY(-20px)';
            grid.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
            grid.classList.remove('opacity-100');
            
            setTimeout(() => {
                grid.innerHTML = '';
                targetWarpSpeed = 0;
                mainText.textContent = "Are you ready?";
                mainText.style.opacity = 1;
                mainText.style.transform = 'scale(1)';
                
                setTimeout(() => {
                    mainText.style.pointerEvents = 'auto';
                    isWarping = false;
                }, 100);
            }, 525);
        }

        document.getElementById('back-to-categories-btn').addEventListener('click', () => {
            if (isWarping) return;
            isWarping = true;
            targetWarpSpeed = -40;
            
            const qContainer = document.getElementById('question-container');
            qContainer.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
            qContainer.classList.remove('opacity-100', 'pointer-events-auto');
            
            const backBtn = document.getElementById('back-to-categories-btn');
            backBtn.classList.add('opacity-0', 'pointer-events-none');
            backBtn.classList.remove('opacity-100', 'pointer-events-auto');
            
            setTimeout(() => {
                targetWarpSpeed = 0;
                const mainText = document.getElementById('main-text');
                mainText.textContent = "Pick a Category";
                mainText.style.opacity = 1;
                loadCategories(); 
                
                setTimeout(() => { isWarping = false; }, 100);
            }, 525);
        });

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
