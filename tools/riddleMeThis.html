<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dust Particles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrollbars from particles */
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body class="relative w-full h-full">

    <div class="absolute inset-0 p-6 flex justify-between items-start z-10 pointer-events-none">
        
        <!-- Top Left: Back Button -->
        <a href="index.html" class="pointer-events-auto flex items-center gap-2 text-gray-400 hover:text-white transition-colors duration-300 group bg-black/30 px-4 py-2 rounded-full backdrop-blur-sm border border-gray-800">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:-translate-x-1 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span class="text-sm tracking-wider uppercase font-semibold">Back</span>
        </a>

        <!-- Top Right: Date and Time -->
        <div class="pointer-events-auto text-right bg-black/30 px-4 py-2 rounded-xl backdrop-blur-sm border border-gray-800 flex flex-col items-end">
            <div id="time-display" class="text-xl font-light tracking-widest font-mono text-gray-200 mb-1">--:--:--</div>
            <div id="date-display" class="text-xs text-gray-400 tracking-widest uppercase">--</div>
        </div>

    </div>

    <!-- Center Text for Interaction -->
    <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
        <h1 id="main-text" class="pointer-events-auto text-5xl md:text-7xl font-bold tracking-widest cursor-pointer transition-all duration-500 hover:scale-110 hover:text-blue-300 text-center drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">
            Are you ready?
        </h1>
        
        <!-- Category Grid (Initially Hidden) -->
        <div id="category-grid" class="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 opacity-0 pointer-events-none transition-all duration-700 transform translate-y-8 max-w-5xl px-6 w-full">
            <!-- Dynamically populated buttons will go here -->
        </div>
    </div>

    <!-- Fixed position to ensure it spans the entire viewport perfectly -->
    <canvas id="dust-canvas" class="fixed top-0 left-0 w-full h-full z-0 pointer-events-none"></canvas>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format Date: e.g., Mon, Aug 24, 2026
            const dateOptions = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', dateOptions);
            
            // Format Time (24-hour): e.g., 18:20:44
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('time-display').textContent = now.toLocaleTimeString('en-US', timeOptions);
        }

        // Initialize and set interval for the clock
        updateClock();
        setInterval(updateClock, 1000);

        const canvas = document.getElementById('dust-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        const particleCount = 700; // Increased density for depth
        
        // Variables for lightspeed effect
        let warpSpeed = 0;
        let targetWarpSpeed = 0;
        let isWarping = false;

        // Variables for interactive mouse parallax
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            // Calculate mouse offset from the center of the screen
            targetMouseX = (e.clientX - width / 2) * 0.05;
            targetMouseY = (e.clientY - height / 2) * 0.05;
        });

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Full re-initialization on resize guarantees perfectly even coverage across the entire screen
            initParticles();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.prevX = this.x;
                this.prevY = this.y;
                
                // Assign to one of 3 distinct Z-layers for parallax
                const layerRandom = Math.random();
                if (layerRandom > 0.90) {
                    // Layer 3: Foreground (fastest, largest, brightest)
                    this.layer = 3;
                    this.z = 1.0; 
                    this.radius = Math.random() * 1.5 + 1.2;
                    this.baseAlpha = Math.random() * 0.5 + 0.5;
                } else if (layerRandom > 0.40) {
                    // Layer 2: Midground (medium speed and size)
                    this.layer = 2;
                    this.z = 0.5;
                    this.radius = Math.random() * 0.8 + 0.6;
                    this.baseAlpha = Math.random() * 0.4 + 0.2;
                } else {
                    // Layer 1: Deep Background (slowest, smallest, dimmest)
                    this.layer = 1;
                    this.z = 0.2;
                    this.radius = Math.random() * 0.4 + 0.2;
                    this.baseAlpha = Math.random() * 0.2 + 0.1;
                }
                
                // Base drifting velocity scales with Z-index
                this.vx = (Math.random() - 0.5) * 0.2 * this.z;
                this.vy = (Math.random() - 0.5) * 0.2 * this.z - (0.1 * this.z); // Slight upward drift

                const colors = ['255, 255, 255', '210, 230, 255', '255, 240, 210'];
                this.color = colors[Math.floor(Math.random() * colors.length)];

                this.alpha = Math.random() * this.baseAlpha;
                this.alphaChange = (Math.random() - 0.5) * 0.015;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                // Apply constant drift
                this.x += this.vx;
                this.y += this.vy;

                // Apply warp speed (radial expansion or contraction)
                if (warpSpeed !== 0) {
                    const dx = this.x - width / 2;
                    const dy = this.y - height / 2;
                    this.x += dx * warpSpeed * this.z * 0.005;
                    this.y += dy * warpSpeed * this.z * 0.005;

                    // If zooming out, reset particles that get too close to the center
                    if (warpSpeed < -2) {
                        const distSq = dx * dx + dy * dy;
                        if (distSq < 100) {
                            const angle = Math.random() * Math.PI * 2;
                            const dist = Math.max(width, height) * 0.7; 
                            this.x = width / 2 + Math.cos(angle) * dist;
                            this.y = height / 2 + Math.sin(angle) * dist;
                            this.prevX = this.x;
                            this.prevY = this.y;
                        }
                    }
                }

                // Screen wrapping for infinite universe effect
                if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                    if (warpSpeed > 2) {
                        // Spawn near center during warp in to simulate zoom
                        const angle = Math.random() * Math.PI * 2;
                        const dist = Math.random() * (Math.min(width, height) * 0.15); 
                        this.x = width / 2 + Math.cos(angle) * dist;
                        this.y = height / 2 + Math.sin(angle) * dist;
                    } else if (warpSpeed < -2) {
                        // Ignore standard wrapping during reverse warp (moving inwards)
                    } else {
                        // Standard screen wrapping
                        if (this.x < -10) this.x = width + 10;
                        if (this.x > width + 10) this.x = -10;
                        if (this.y < -10) this.y = height + 10;
                        if (this.y > height + 10) this.y = -10;
                    }
                    this.prevX = this.x;
                    this.prevY = this.y;
                }

                // Twinkle effect
                this.alpha += this.alphaChange;
                if (this.alpha <= 0.05 || this.alpha >= this.baseAlpha) {
                    this.alphaChange = -this.alphaChange;
                }
            }

            draw(parallaxOffsetX, parallaxOffsetY) {
                // Calculate final position by applying the parallax offset scaled by the Z-layer
                const drawX = this.x + (parallaxOffsetX * this.z);
                const drawY = this.y + (parallaxOffsetY * this.z);
                const drawPrevX = this.prevX + (parallaxOffsetX * this.z);
                const drawPrevY = this.prevY + (parallaxOffsetY * this.z);

                if (Math.abs(warpSpeed) > 1) {
                    // Lightspeed streak
                    ctx.beginPath();
                    ctx.moveTo(drawPrevX, drawPrevY);
                    ctx.lineTo(drawX, drawY);
                    ctx.strokeStyle = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
                    ctx.lineWidth = this.radius * (this.layer === 3 ? 2 : 1);
                    ctx.lineCap = 'round';
                    ctx.stroke();
                } else {
                    // Draw core star
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, this.alpha)})`;
                    ctx.fill();
                    
                    // Ambient glow for foreground stars
                    if (this.layer === 3) {
                        ctx.beginPath();
                        ctx.arc(drawX, drawY, this.radius * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${this.color}, ${Math.max(0, this.alpha * 0.2)})`;
                        ctx.fill();
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // Leave a slight trail during warp for extra motion blur
            if (Math.abs(warpSpeed) > 1) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, width, height);
            } else {
                ctx.clearRect(0, 0, width, height);
            }
            
            // Smoothly interpolate the mouse parallax offset and warp speed
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            warpSpeed += (targetWarpSpeed - warpSpeed) * 0.15; // Increased acceleration to fit shorter time
            
            particles.forEach(p => {
                p.update();
                p.draw(mouseX, mouseY);
            });

            requestAnimationFrame(animate);
        }

        // Setup
        window.addEventListener('resize', resizeCanvas);
        
        // Interaction Logic
        const mainText = document.getElementById('main-text');
        mainText.addEventListener('click', () => {
            if (isWarping) return;
            isWarping = true;
            
            // Fade out current text
            mainText.style.opacity = 0;
            mainText.style.transform = 'scale(0.8)';
            
            // Trigger lightspeed jump
            targetWarpSpeed = 40;
            
            setTimeout(() => {
                // Change text and drop out of lightspeed
                mainText.textContent = "Pick a Category";
                targetWarpSpeed = 0;
                
                // Fade in new text and move it up slightly to make room for grid
                mainText.style.opacity = 1;
                mainText.style.transform = 'scale(1) translateY(-20px)';
                mainText.style.pointerEvents = 'none'; // Disable further clicks on title
                
                // Fetch and display the categories
                loadCategories();
            }, 525); // Decreased length by another 30% (750ms * 0.7)
        });

        // Formats "topicRMT.IT_System_Integration.json" into "IT System Integration"
        function formatTopicName(filename) {
            return filename
                .replace('topicRMT.', '')
                .replace('.json', '')
                .replace(/_/g, ' ');
        }

        async function loadCategories() {
            const grid = document.getElementById('category-grid');
            let files = [];
            
            try {
                // Attempt to fetch from the local directory
                const response = await fetch('../resources/riddleMeThis/');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    // If an API endpoint served JSON
                    files = await response.json();
                } else {
                    // If a static directory listing was served, scrape it for file names
                    const text = await response.text();
                    const matches = text.match(/topicRMT\.[a-zA-Z0-9_]+\.json/g);
                    if (matches) {
                        files = [...new Set(matches)]; // Ensure uniqueness
                    } else {
                        throw new Error('No valid JSON files found');
                    }
                }
            } catch (error) {
                console.warn("Dynamic fetch failed or returned no items. Displaying Back fallback.");
                files = []; // Ensure it triggers the fallback logic
            }

            // Reveal the grid container (we unhide it before adding buttons so animations play properly)
            grid.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-8');
            grid.classList.add('opacity-100');
            
            if (files.length === 0) {
                // No files found: Display fallback "Back" button
                const btn = document.createElement('button');
                // Use col-span logic to center it
                btn.className = "pointer-events-auto px-6 py-4 bg-black/40 border border-gray-700 rounded-xl backdrop-blur-md text-white font-semibold tracking-wider hover:bg-gray-800/80 transition-all duration-300 hover:-translate-y-1 opacity-0 col-span-1 md:col-start-2";
                btn.textContent = "Back";
                btn.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s`;
                
                btn.onclick = () => {
                    // Trigger Zoom out effect
                    isWarping = true;
                    targetWarpSpeed = -40; // Negative warp speed means flying backwards
                    
                    // Fade out current state
                    mainText.style.opacity = 0;
                    mainText.style.transform = 'scale(0.8) translateY(-20px)';
                    grid.classList.add('opacity-0', 'pointer-events-none', 'translate-y-8');
                    grid.classList.remove('opacity-100');
                    
                    setTimeout(() => {
                        grid.innerHTML = ''; // Clear grid
                        
                        // Drop out of reverse lightspeed
                        targetWarpSpeed = 0;
                        mainText.textContent = "Are you ready?";
                        
                        // Fade in initial text
                        mainText.style.opacity = 1;
                        mainText.style.transform = 'scale(1)';
                        
                        // Re-enable clicks shortly after animation completes
                        setTimeout(() => {
                            mainText.style.pointerEvents = 'auto';
                            isWarping = false;
                        }, 100);
                    }, 525);
                };
                grid.appendChild(btn);
                return;
            }

            // Normal file population logic
            files = files.filter(f => f.startsWith('topicRMT.') && f.endsWith('.json'));

            files.forEach((file, index) => {
                    const topicName = formatTopicName(file);
                    
                    const btn = document.createElement('button');
                    btn.className = "pointer-events-auto px-6 py-4 bg-black/40 border border-gray-700 rounded-xl backdrop-blur-md text-white font-semibold tracking-wider hover:bg-blue-900/40 hover:border-blue-400 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_0_20px_rgba(96,165,250,0.4)] opacity-0 flex items-center justify-center text-center h-full";
                    btn.textContent = topicName;
                    
                    // Staggered fade in animation
                    btn.style.animation = `fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.1}s`;
                    
                    // Click handler for when a user selects a category
                    btn.onclick = () => {
                        console.log(`Loading topic logic for: ${file} (../resources/riddleMeThis/${file})`);
                        // Visual feedback on click
                        btn.style.transform = 'scale(0.95)';
                        btn.classList.add('bg-blue-600/60', 'border-blue-400');
                    };
                    
                    grid.appendChild(btn);
                });
        }

        // Add CSS keyframes dynamically for the staggered button reveal
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // Call resizeCanvas initially to set dimensions and initialize particles
        resizeCanvas();
        animate();
    </script>
</body>
</html>
