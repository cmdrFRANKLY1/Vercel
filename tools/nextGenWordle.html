<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Wordle · Topic Edition</title>
    <style>
        /* ===== THEMES ===== */
        :root {
            --bg-primary: #f0f4f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-game: #f8fafc;
            --bg-input: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #6b7f99;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --shadow-color: rgba(0,0,0,0.04);
            --shadow-hover: rgba(0,0,0,0.12);
            --cell-bg: #ffffff;
            --cell-border: #d1d5db;
            --cell-correct: #10b981;
            --cell-present: #f59e0b;
            --cell-absent: #6b7280;
            --topic-hover: #eef2f6;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #0d0d0d;
            --bg-game: #1a1a1a;
            --bg-input: #1a1a1a;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --border-color: #262626;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --shadow-color: rgba(0,0,0,0.4);
            --shadow-hover: rgba(0,0,0,0.6);
            --cell-bg: #1a1a1a;
            --cell-border: #404040;
            --cell-correct: #10b981;
            --cell-present: #f59e0b;
            --cell-absent: #4a4a4a;
            --topic-hover: #262626;
        }

        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 2rem 1.5rem;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 1.25rem;
        }
        .header h1 {
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header h1 i { color: var(--accent-color); }
        .header-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .toggle-group {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .toggle-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .toggle-btn i { font-size: 0.9rem; }
        .toggle-btn.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .toggle-btn:hover:not(.active) { background: var(--topic-hover); }

        /* ===== TOPIC LIST ===== */
        .topic-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .topic-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px var(--shadow-color);
        }
        .topic-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow-hover);
        }
        .topic-card h3 {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topic-card h3 i { color: var(--accent-color); }
        .topic-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .topic-card .word-count {
            display: inline-block;
            background: var(--bg-game);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* ===== WORDLE GAME ===== */
        .game-container {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px var(--shadow-color);
            margin-top: 1rem;
            display: none;
        }
        .game-container.active { display: block; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .game-header h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .game-header h2 i { color: var(--accent-color); }
        .game-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .game-actions button {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: var(--bg-game);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .game-actions button:hover { background: var(--topic-hover); }
        .game-actions button.primary {
            background: var(--accent-color);
            color: white;
            border: none;
        }
        .game-actions button.primary:hover { background: var(--accent-hover); }

        .wordle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 350px;
            margin: 0 auto 1.5rem;
        }
        .wordle-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--cell-bg);
            border: 2px solid var(--cell-border);
            border-radius: 8px;
            transition: 0.2s;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }
        .wordle-cell.correct {
            background: var(--cell-correct);
            border-color: var(--cell-correct);
            color: white;
        }
        .wordle-cell.present {
            background: var(--cell-present);
            border-color: var(--cell-present);
            color: white;
        }
        .wordle-cell.absent {
            background: var(--cell-absent);
            border-color: var(--cell-absent);
            color: white;
        }
        .wordle-cell.filled {
            border-color: var(--text-secondary);
        }

        .wordle-input-area {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .wordle-input-area input {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
            width: 200px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }
        .wordle-input-area input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .wordle-input-area button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .wordle-input-area button:hover { background: var(--accent-hover); }
        .wordle-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .wordle-message {
            text-align: center;
            font-weight: 600;
            min-height: 30px;
            font-size: 1rem;
        }
        .wordle-message.success { color: var(--success-color); }
        .wordle-message.error { color: var(--error-color); }
        .wordle-message.info { color: var(--accent-color); }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.2rem;
            background: var(--bg-game);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .back-btn:hover { background: var(--topic-hover); }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .loading i { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent-color); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: start; gap: 0.8rem; }
            .header-right { width: 100%; justify-content: space-between; }
            .topic-list { grid-template-columns: 1fr; }
            .game-container { padding: 1.2rem; }
            .wordle-grid { max-width: 280px; }
            .wordle-cell { font-size: 1.4rem; }
            .game-header { flex-direction: column; align-items: start; }
            .game-actions { width: 100%; }
        }
        @media (max-width: 480px) {
            .wordle-grid { max-width: 220px; gap: 5px; }
            .wordle-cell { font-size: 1.1rem; }
            .wordle-input-area input { width: 150px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-book"></i> Wordle · Topic Edition</h1>
        <div class="header-right">
            <div class="toggle-group" id="themeToggle">
                <button class="toggle-btn active" data-theme="light"><i class="fas fa-sun"></i></button>
                <button class="toggle-btn" data-theme="dark"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </div>

    <!-- Topic List -->
    <div id="topicView">
        <h2 style="margin-bottom: 0.5rem; color: var(--text-secondary);">
            <i class="fas fa-folder-open"></i> Select a topic
        </h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
            Choose a topic to start playing Wordle with words from that category.
        </p>
        <div id="topicList" class="topic-list">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i><br>Loading topics...</div>
        </div>
    </div>

    <!-- Game View -->
    <div id="gameView" class="game-container">
        <button class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i> Back to topics</button>
        <div class="game-header">
            <h2><i class="fas fa-gamepad"></i> <span id="gameTopicName">Topic</span></h2>
            <div class="game-actions">
                <button id="newWordBtn"><i class="fas fa-random"></i> New Word</button>
                <button class="primary" id="showHintBtn"><i class="fas fa-lightbulb"></i> Hint</button>
            </div>
        </div>
        <div class="wordle-grid" id="wordleGrid"></div>
        <div class="wordle-input-area">
            <input type="text" id="wordleInput" maxlength="15" placeholder="Type word..." autofocus>
            <button id="wordleSubmit">Guess</button>
        </div>
        <div class="wordle-message" id="wordleMessage"></div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== THEME =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('wordle-theme', theme);
            document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        function initTheme() {
            const saved = localStorage.getItem('wordle-theme') || 'light';
            setTheme(saved);
        }

        document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setTheme(this.dataset.theme);
            });
        });

        initTheme();

        // ===== STATE =====
        let currentTopic = null;
        let currentWords = [];
        let wordleAnswer = '';
        let wordleGuesses = [];
        let wordleMaxGuesses = 6;
        let wordleGameOver = false;
        let wordleWordLength = 0;
        let currentHint = '';

        // ===== DOM =====
        const topicListEl = document.getElementById('topicList');
        const topicView = document.getElementById('topicView');
        const gameView = document.getElementById('gameView');
        const gameTopicName = document.getElementById('gameTopicName');
        const wordleGrid = document.getElementById('wordleGrid');
        const wordleInput = document.getElementById('wordleInput');
        const wordleSubmit = document.getElementById('wordleSubmit');
        const wordleMessage = document.getElementById('wordleMessage');
        const backBtn = document.getElementById('backBtn');
        const newWordBtn = document.getElementById('newWordBtn');
        const showHintBtn = document.getElementById('showHintBtn');

        // ===== FETCH TOPICS =====
        // GitHub repo path for wordle sources
        const REPO_OWNER = 'cmdrFRANKLY1';
        const REPO_NAME = 'Viona';
        const REPO_PATH = 'resources/wordle/sources';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_PATH}`;
        const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${REPO_PATH}`;

        async function fetchTopics() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                const jsonFiles = data.filter(item => 
                    item.type === 'file' && 
                    item.name.endsWith('.json')
                );

                if (jsonFiles.length === 0) {
                    topicListEl.innerHTML = `
                        <div class="loading" style="grid-column: 1/-1;">
                            <i class="fas fa-exclamation-triangle"></i><br>
                            No topic files found in ${REPO_PATH}
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const file of jsonFiles) {
                    const topicName = file.name.replace('.json', '');
                    const wordCount = await getWordCount(file.download_url || `${RAW_BASE}/${encodeURIComponent(file.name)}`);
                    html += `
                        <div class="topic-card" data-topic="${topicName}" data-url="${file.download_url || `${RAW_BASE}/${encodeURIComponent(file.name)}`}">
                            <h3><i class="fas fa-tag"></i> ${topicName}</h3>
                            <p>${wordCount || 'Loading...'} words available</p>
                            <span class="word-count"><i class="fas fa-database"></i> ${wordCount || '?'} terms</span>
                        </div>
                    `;
                }
                topicListEl.innerHTML = html;

                // Add click listeners
                document.querySelectorAll('.topic-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const topic = this.dataset.topic;
                        const url = this.dataset.url;
                        loadTopic(topic, url);
                    });
                });

            } catch (err) {
                console.error('Error fetching topics:', err);
                topicListEl.innerHTML = `
                    <div class="loading" style="grid-column: 1/-1; border: 1px solid var(--error-color); border-radius: 16px; padding: 2rem;">
                        <i class="fas fa-exclamation-triangle" style="color: var(--error-color);"></i><br>
                        Error loading topics: ${err.message}
                        <br><br>
                        <button onclick="location.reload()" style="padding: 0.5rem 1.5rem; background: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer;">Retry</button>
                    </div>
                `;
            }
        }

        async function getWordCount(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) return '?';
                const data = await response.json();
                return data.length || '?';
            } catch {
                return '?';
            }
        }

        // ===== LOAD TOPIC =====
        async function loadTopic(topicName, url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    wordleMessage.textContent = 'No words found in this topic!';
                    wordleMessage.className = 'wordle-message error';
                    return;
                }

                currentTopic = topicName;
                currentWords = data;
                
                // Switch to game view
                topicView.style.display = 'none';
                gameView.classList.add('active');
                gameTopicName.textContent = topicName;
                
                // Start game
                startNewWordle();
                
            } catch (err) {
                console.error('Error loading topic:', err);
                wordleMessage.textContent = 'Error loading topic: ' + err.message;
                wordleMessage.className = 'wordle-message error';
            }
        }

        // ===== WORDLE GAME =====
        function startNewWordle() {
            if (!currentWords || currentWords.length === 0) {
                wordleMessage.textContent = 'No words available!';
                wordleMessage.className = 'wordle-message error';
                return;
            }

            // Pick a random word
            const randomEntry = currentWords[Math.floor(Math.random() * currentWords.length)];
            
            // Handle different JSON structures
            let word = '';
            let hint = '';
            
            if (typeof randomEntry === 'string') {
                word = randomEntry;
                hint = '';
            } else if (randomEntry.word) {
                word = randomEntry.word;
                // Use description based on language
                const lang = document.documentElement.lang || 'en';
                hint = randomEntry.description_en || randomEntry.description_de || randomEntry.description || '';
            } else {
                // Try to find any property that looks like a word
                const keys = Object.keys(randomEntry);
                const wordKey = keys.find(k => k.toLowerCase().includes('word') || k === 'term' || k === 'name');
                word = wordKey ? randomEntry[wordKey] : JSON.stringify(randomEntry);
                hint = '';
            }

            word = word.toUpperCase().trim();
            
            if (!word || word.length < 2) {
                // Try again with a different word
                startNewWordle();
                return;
            }

            wordleAnswer = word;
            wordleWordLength = word.length;
            currentHint = hint;
            wordleGuesses = [];
            wordleGameOver = false;
            wordleInput.disabled = false;
            wordleSubmit.disabled = false;
            wordleInput.maxLength = wordleWordLength;
            wordleInput.placeholder = `${wordleWordLength} letters`;
            wordleInput.value = '';
            wordleMessage.textContent = `Guess the ${wordleWordLength}-letter word!`;
            wordleMessage.className = 'wordle-message info';
            
            // Dynamically adjust grid columns based on word length
            const grid = wordleGrid;
            grid.style.gridTemplateColumns = `repeat(${Math.min(wordleWordLength, 8)}, 1fr)`;
            
            renderWordleGrid();
            wordleInput.focus();
        }

        function renderWordleGrid() {
            const grid = wordleGrid;
            grid.innerHTML = '';
            
            const cols = Math.min(wordleWordLength, 8);
            
            for (let row = 0; row < wordleMaxGuesses; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'wordle-cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    grid.appendChild(cell);
                }
            }

            // Fill in guesses
            for (let row = 0; row < wordleGuesses.length; row++) {
                const guess = wordleGuesses[row];
                const result = getWordleResult(guess);
                for (let col = 0; col < Math.min(guess.length, cols); col++) {
                    const idx = row * cols + col;
                    const cell = grid.children[idx];
                    if (cell) {
                        cell.textContent = guess[col] || '';
                        cell.className = 'wordle-cell ' + result[col];
                    }
                }
            }

            // Fill current row (partial)
            const currentInput = wordleInput.value.toUpperCase();
            if (currentInput && wordleGuesses.length < wordleMaxGuesses && !wordleGameOver) {
                const row = wordleGuesses.length;
                for (let col = 0; col < Math.min(currentInput.length, cols); col++) {
                    const idx = row * cols + col;
                    const cell = grid.children[idx];
                    if (cell) {
                        cell.textContent = currentInput[col] || '';
                        cell.className = 'wordle-cell filled';
                    }
                }
            }
        }

        function getWordleResult(guess) {
            const cols = Math.min(wordleWordLength, 8);
            const result = new Array(cols).fill('absent');
            const answerArr = wordleAnswer.split('');
            const guessArr = guess.split('');
            const used = new Array(cols).fill(false);

            // First pass: correct letters
            for (let i = 0; i < Math.min(cols, guessArr.length); i++) {
                if (guessArr[i] === answerArr[i]) {
                    result[i] = 'correct';
                    used[i] = true;
                }
            }
            // Second pass: present letters
            for (let i = 0; i < Math.min(cols, guessArr.length); i++) {
                if (result[i] === 'correct') continue;
                for (let j = 0; j < Math.min(cols, answerArr.length); j++) {
                    if (!used[j] && guessArr[i] === answerArr[j]) {
                        result[i] = 'present';
                        used[j] = true;
                        break;
                    }
                }
            }
            return result;
        }

        function handleGuess() {
            if (wordleGameOver) {
                wordleMessage.textContent = 'Game over! Click "New Word" to play again.';
                wordleMessage.className = 'wordle-message error';
                return;
            }

            const guess = wordleInput.value.toUpperCase().trim();
            const cols = Math.min(wordleWordLength, 8);

            if (!guess) {
                wordleMessage.textContent = 'Please enter a word!';
                wordleMessage.className = 'wordle-message error';
                return;
            }

            if (guess.length !== wordleWordLength) {
                wordleMessage.textContent = `Word must be exactly ${wordleWordLength} letters long!`;
                wordleMessage.className = 'wordle-message error';
                return;
            }

            if (wordleGuesses.length >= wordleMaxGuesses) {
                wordleMessage.textContent = 'No more guesses! Click "New Word" to try again.';
                wordleMessage.className = 'wordle-message error';
                return;
            }

            wordleGuesses.push(guess);
            renderWordleGrid();

            const result = getWordleResult(guess);
            const isWin = result.every(r => r === 'correct');

            if (isWin) {
                wordleMessage.textContent = `🎉 You got it! The word was "${wordleAnswer}" in ${wordleGuesses.length} guesses!`;
                wordleMessage.className = 'wordle-message success';
                wordleGameOver = true;
                wordleInput.disabled = true;
                wordleSubmit.disabled = true;
            } else if (wordleGuesses.length >= wordleMaxGuesses) {
                wordleMessage.textContent = `😢 Game over! The word was "${wordleAnswer}"`;
                wordleMessage.className = 'wordle-message error';
                wordleGameOver = true;
                wordleInput.disabled = true;
                wordleSubmit.disabled = true;
            } else {
                wordleMessage.textContent = `Guess ${wordleGuesses.length} of ${wordleMaxGuesses}`;
                wordleMessage.className = 'wordle-message info';
            }

            wordleInput.value = '';
            wordleInput.focus();
            renderWordleGrid();
        }

        function showHint() {
            if (currentHint) {
                wordleMessage.textContent = `💡 Hint: ${currentHint}`;
                wordleMessage.className = 'wordle-message info';
            } else {
                // Show first and last letter as hint
                if (wordleAnswer && wordleAnswer.length > 0) {
                    const first = wordleAnswer[0];
                    const last = wordleAnswer[wordleAnswer.length - 1];
                    wordleMessage.textContent = `💡 Hint: Starts with "${first}", ends with "${last}" (${wordleAnswer.length} letters)`;
                    wordleMessage.className = 'wordle-message info';
                }
            }
        }

        // ===== EVENT LISTENERS =====
        // Back button
        backBtn.addEventListener('click', function() {
            gameView.classList.remove('active');
            topicView.style.display = 'block';
            wordleMessage.textContent = '';
        });

        // New word
        newWordBtn.addEventListener('click', startNewWordle);

        // Show hint
        showHintBtn.addEventListener('click', showHint);

        // Submit guess
        wordleSubmit.addEventListener('click', handleGuess);

        wordleInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleGuess();
            }
            // Update grid while typing
            setTimeout(renderWordleGrid, 10);
        });

        wordleInput.addEventListener('input', function() {
            // Auto-uppercase
            this.value = this.value.toUpperCase();
            renderWordleGrid();
        });

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            // Ctrl+Shift+R to reset current game
            if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                e.preventDefault();
                if (gameView.classList.contains('active')) {
                    startNewWordle();
                }
            }
            // Escape to go back
            if (e.key === 'Escape' && gameView.classList.contains('active')) {
                backBtn.click();
            }
        });

        // ===== INIT =====
        console.log('📚 Wordle · Topic Edition loaded!');
        console.log('💡 Keyboard shortcuts:');
        console.log('   Ctrl+Shift+R - New word');
        console.log('   Escape - Back to topics');
        console.log(`📂 Fetching topics from: ${REPO_PATH}`);
        
        fetchTopics();

    })();
</script>
</body>
</html>
