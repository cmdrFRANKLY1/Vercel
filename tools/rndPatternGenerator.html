<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet">

<body class="min-h-screen bg-neutral-950 text-neutral-100 flex flex-col selection:bg-white selection:text-black">

                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>

    <main class="flex-1 p-4 md:p-8 max-w-[90rem] mx-auto w-full flex flex-col gap-8">
        <div id="matrixGrid" class="flex flex-col gap-8">
            <!-- Categories populated via JS -->
        </div>
    </main>

    <div id="downloadModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2 uppercase tracking-wider">Select Export Resolution</h3>
            <p class="text-xs text-neutral-400 mb-6 font-mono">Choose target canvas pixel dimensions for high-fidelity asset export.</p>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="executeDownload(1280, 720)" class="p-3 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded-xl text-left transition group cursor-pointer">
                    <div class="text-xs font-bold text-white group-hover:text-white">HD (720p)</div>
                    <div class="text-[10px] text-neutral-500 font-mono">1280 x 720 px</div>
                </button>
                <button onclick="executeDownload(1920, 1080)" class="p-3 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded-xl text-left transition group cursor-pointer">
                    <div class="text-xs font-bold text-white group-hover:text-white">Full HD (1080p)</div>
                    <div class="text-[10px] text-neutral-500 font-mono">1920 x 1080 px</div>
                </button>
                <button onclick="executeDownload(2560, 1440)" class="p-3 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded-xl text-left transition group cursor-pointer">
                    <div class="text-xs font-bold text-white group-hover:text-white">QHD (1440p)</div>
                    <div class="text-[10px] text-neutral-500 font-mono">2560 x 1440 px</div>
                </button>
                <button onclick="executeDownload(3840, 2160)" class="p-3 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded-xl text-left transition group cursor-pointer">
                    <div class="text-xs font-bold text-white group-hover:text-white">4K UHD</div>
                    <div class="text-[10px] text-neutral-500 font-mono">3840 x 2160 px</div>
                </button>
            </div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-bold text-xs uppercase tracking-widest rounded-xl transition cursor-pointer">
                Cancel
            </button>
        </div>
    </div>

    <script>
        class Random {
            constructor(seed) {
                this.seed = seed;
            }
            next() {
                let x = Math.sin(this.seed++) * 10000;
                return x - Math.floor(x);
            }
            range(min, max) {
                return min + this.next() * (max - min);
            }
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function getComplementaryColor() {
            const h = Math.random() * 360;
            const s = Math.floor(Math.random() * 30) + 70;
            const l = Math.floor(Math.random() * 30) + 35;
            const c1 = hslToHex(h, s, l);
            const c2 = hslToHex((h + 180) % 360, s, l);
            return [c1, c2];
        }

        function getRandomNonComplementaryColor() {
            const h1 = Math.random() * 360;
            const h2 = (h1 + 40 + Math.random() * 100) % 360;
            const s = Math.floor(Math.random() * 30) + 70;
            const l = Math.floor(Math.random() * 30) + 35;
            const c1 = hslToHex(h1, s, l);
            const c2 = hslToHex(h2, s, l);
            return [c1, c2];
        }
    </script>

    <script>
        let activeDownloadIndex = null;
        const cardColors = {};
        const activeConfigs = {};
        const bgModes = ['Black', 'White', 'Chroma Green', 'Chroma Blue', 'Red', 'Yellow', 'Transparent'];
        let matrix4CurrentBg = 'Black';
        
        const categories = [
            {
                title: 'Military Dazzle Camouflage',
                link: 'https://en.wikipedia.org/wiki/Dazzle_camouflage',
                styles: [
                    { id: 1, name: 'Severe Angular Shards', mode: 'bw' },
                    { id: 2, name: 'Optical Zebra Bands', mode: 'comp' },
                    { id: 3, name: 'Chaotic Polygon Slices', mode: 'noncomp' },
                    { id: 8, name: 'Geometric Dazzle Shards (B&W)', mode: 'bw' },
                    { id: 9, name: 'Geometric Dazzle Shards (Comp)', mode: 'comp' },
                    { id: 10, name: 'Geometric Dazzle Shards (Non-Comp)', mode: 'noncomp' }
                ]
            },
            {
                title: 'Emojis',
                link: null,
                styles: [
                    { id: 4, name: 'Emoji Scatter (Custom BG)', mode: 'emoji4' },
                    { id: 5, name: 'Emoji Dense Pack (Full Canvas)', mode: 'emoji5' },
                    { id: 6, name: 'Emoji Dual-Tone + Shapes', mode: 'emoji6' },
                    { id: 7, name: 'Emoji B&W Dual-Tone + Shapes', mode: 'emoji7' }
                ]
            }
        ];

        const allMatrixStyles = categories.flatMap(c => c.styles);

        function initCards() {
            const grid = document.getElementById('matrixGrid');
            grid.innerHTML = '';

            categories.forEach((cat, catIdx) => {
                const categoryContainer = document.createElement('div');
                categoryContainer.className = 'border border-neutral-800 rounded-3xl p-6 md:p-8 bg-neutral-900/30 relative flex flex-col gap-6 shadow-2xl';
                
                let titleHtml = '';
                if (cat.link) {
                    titleHtml = `
                        <a href="${cat.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2.5 text-xs font-black tracking-widest uppercase text-neutral-400 hover:text-white transition group">
                            <span class="w-2.5 h-2.5 bg-neutral-700 group-hover:bg-white transition"></span>
                            <span>${cat.title}</span>
                            <svg class="w-3.5 h-3.5 opacity-60 group-hover:translate-x-0.5 group-hover:opacity-100 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>
                    `;
                } else {
                    titleHtml = `
                        <div class="inline-flex items-center gap-2.5 text-xs font-black tracking-widest uppercase text-neutral-400">
                            <span class="w-2.5 h-2.5 bg-neutral-700"></span>
                            <span>${cat.title}</span>
                        </div>
                    `;
                }

                categoryContainer.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-neutral-800 pb-4">
                        ${titleHtml}
                        <div class="flex items-center gap-2">
                            <button onclick="openModal('cat_${catIdx}')" class="px-4 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-white font-bold text-xs uppercase tracking-widest rounded-lg active:scale-95 transition flex items-center gap-2 shadow cursor-pointer">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Download All
                            </button>
                            <button onclick="reloadCategory(${catIdx})" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-white font-bold text-xs uppercase tracking-widest rounded-lg active:scale-95 transition flex items-center gap-2 shadow cursor-pointer">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                Reload
                            </button>
                        </div>
                    </div>
                    <div id="subGrid_${catIdx}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                `;
                grid.appendChild(categoryContainer);

                const subGrid = document.getElementById(`subGrid_${catIdx}`);

                cat.styles.forEach((style) => {
                    if (!cardColors[style.id]) {
                        if (style.mode === 'bw' || style.mode === 'emoji7' || style.id === 8) {
                            cardColors[style.id] = { c1: '#000000', c2: '#ffffff' };
                        } else if (style.mode === 'comp' || style.id === 9) {
                            const cols = getComplementaryColor();
                            cardColors[style.id] = { c1: cols[0], c2: cols[1] };
                        } else if (style.mode === 'noncomp' || style.id === 10) {
                            const cols = getRandomNonComplementaryColor();
                            cardColors[style.id] = { c1: cols[0], c2: cols[1] };
                        } else if (style.mode === 'emoji6') {
                            const cols = getRandomNonComplementaryColor();
                            cardColors[style.id] = { c1: cols[0], c2: cols[1] };
                        } else {
                            const cols = getComplementaryColor();
                            cardColors[style.id] = { c1: cols[0], c2: cols[1] };
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden flex flex-col shadow-xl group';
                    
                    let extraHeaderControls = '';
                    if (style.id === 4) {
                        extraHeaderControls = `
                            <select onchange="changeMatrixBg(4, this.value)" class="bg-neutral-950 border border-neutral-800 text-[10px] text-neutral-300 font-mono rounded px-1.5 py-1 focus:outline-none cursor-pointer">
                                ${bgModes.map(m => `<option value="${m}" ${matrix4CurrentBg === m ? 'selected' : ''}>BG: ${m}</option>`).join('')}
                            </select>
                        `;
                    }

                    card.innerHTML = `
                        <div class="px-4 py-3 bg-neutral-950/80 border-b border-neutral-800 flex items-center justify-between gap-2">
                            <span class="text-xs font-bold text-white tracking-wider uppercase truncate max-w-[140px] sm:max-w-[180px]" title="${style.name}">${style.id}. ${style.name}</span>
                            <div class="flex items-center gap-2">
                                ${extraHeaderControls}
                                <button onclick="reloadSingle(${style.id})" title="Reload Matrix" class="p-1.5 text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-lg transition cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                </button>
                                <button onclick="openModal(${style.id})" title="Download Matrix" class="p-1.5 text-neutral-400 hover:text-white hover:bg-neutral-800 rounded-lg transition cursor-pointer">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="p-4 flex-1 flex items-center justify-center bg-neutral-950 aspect-video relative overflow-hidden">
                            <canvas id="canvas_${style.id}" class="w-full h-full object-contain shadow-inner rounded"></canvas>
                        </div>
                    `;
                    subGrid.appendChild(card);
                    reloadSingle(style.id);
                });
            });
        }
    </script>

    <script>
        const emojiSets = {
            4: ['😀', '😎', '🥳', '🤖', '👻', '💀', '👽', '🤡', '💩', '🔥', '⚡', '💥', '🌀', '🎯', '🚀', '⭐'],
            5: ['😀', '😎', '🥳', '🤖', '👻', '💀', '👽', '🤡', '💩', '🔥', '⚡', '💥', '🌀', '🎯', '🚀', '⭐', '💎', '👑', '🍕', '🎉', '🪐', '🦄', '🌈', '🧨'],
            6: ['🌍', '🌙', '⭐', '🔥', '💧', '⚡', '🌵', '🌸', '🦊', '🐱', '🦋', '🐝', '🐙', '🦖', '🐉', '☄️'],
            7: ['🌍', '🌙', '⭐', '🔥', '💧', '⚡', '🌵', '🌸', '🦊', '🐱', '🦋', '🐝', '🐙', '🦖', '🐉', '☄️']
        };

        function generatePatternConfig(seed, index) {
            const rng = new Random(seed);
            
            if (index === 4) {
                const emojis = emojiSets[4];
                const count = Math.floor(rng.range(35, 75));
                const items = [];
                for (let i = 0; i < count; i++) {
                    items.push({
                        emoji: emojis[Math.floor(rng.range(0, emojis.length))],
                        x: rng.range(-0.1, 1.1),
                        y: rng.range(-0.1, 1.1),
                        size: rng.range(20, 90),
                        rotation: rng.range(0, Math.PI * 2),
                        opacity: rng.range(0.4, 1.0)
                    });
                }
                return { type: 'emoji', items };
            }

            if (index === 5) {
                const emojis = emojiSets[5];
                const count = Math.floor(rng.range(500, 800));
                const items = [];
                for (let i = 0; i < count; i++) {
                    items.push({
                        emoji: emojis[Math.floor(rng.range(0, emojis.length))],
                        x: rng.range(-0.15, 1.15),
                        y: rng.range(-0.15, 1.15),
                        size: rng.range(35, 95),
                        rotation: rng.range(0, Math.PI * 2),
                        opacity: 1.0
                    });
                }
                return { type: 'emoji', items };
            }

            if (index === 6 || index === 7) {
                const emojis = emojiSets[index];
                const count = Math.floor(rng.range(45, 85));
                const items = [];
                for (let i = 0; i < count; i++) {
                    items.push({
                        emoji: emojis[Math.floor(rng.range(0, emojis.length))],
                        x: rng.range(-0.1, 1.1),
                        y: rng.range(-0.1, 1.1),
                        size: rng.range(25, 85),
                        rotation: rng.range(0, Math.PI * 2),
                        opacity: rng.range(0.5, 1.0)
                    });
                }

                const bgShapes = [];
                const shapeCount = Math.floor(rng.range(12, 22));
                for (let s = 0; s < shapeCount; s++) {
                    const typeRand = rng.next();
                    let type = 'circle';
                    if (typeRand > 0.6) type = 'square';
                    else if (typeRand > 0.3) type = 'triangle';
                    else type = 'polygon';

                    const points = [];
                    if (type === 'polygon') {
                        const ptCount = Math.floor(rng.range(3, 6));
                        const px = rng.range(-0.1, 1.1);
                        const py = rng.range(-0.1, 1.1);
                        const spread = rng.range(0.15, 0.5);
                        for (let p = 0; p < ptCount; p++) {
                            const ang = (p / ptCount) * Math.PI * 2 + rng.range(-0.5, 0.5);
                            const dist = rng.range(0.05, spread);
                            points.push({
                                x: px + Math.cos(ang) * dist,
                                y: py + Math.sin(ang) * dist
                            });
                        }
                    }
                    bgShapes.push({
                        type,
                        x: rng.range(-0.1, 1.1),
                        y: rng.range(-0.1, 1.1),
                        size: rng.range(0.05, 0.35),
                        points,
                        altColor: rng.next() > 0.5,
                        opacity: rng.range(0.3, 0.7),
                        rotation: rng.range(0, Math.PI * 2)
                    });
                }
                return { type: 'emoji', items, bgShapes };
            }

            if (index === 8 || index === 9 || index === 10) {
                const bgShapes = [];
                const shapeCount = Math.floor(rng.range(30, 60));
                for (let s = 0; s < shapeCount; s++) {
                    const typeRand = rng.next();
                    let type = 'circle';
                    if (typeRand > 0.75) type = 'square';
                    else if (typeRand > 0.5) type = 'triangle';
                    else if (typeRand > 0.25) type = 'polygon';
                    else type = 'line';

                    const points = [];
                    if (type === 'polygon' || type === 'triangle') {
                        const ptCount = type === 'triangle' ? 3 : Math.floor(rng.range(3, 6));
                        const px = rng.range(-0.1, 1.1);
                        const py = rng.range(-0.1, 1.1);
                        const spread = rng.range(0.08, 0.4);
                        for (let p = 0; p < ptCount; p++) {
                            const ang = (p / ptCount) * Math.PI * 2 + rng.range(-0.5, 0.5);
                            const dist = rng.range(0.03, spread);
                            points.push({
                                x: px + Math.cos(ang) * dist,
                                y: py + Math.sin(ang) * dist
                            });
                        }
                    }
                    bgShapes.push({
                        type,
                        x: rng.range(-0.1, 1.1),
                        y: rng.range(-0.1, 1.1),
                        x2: rng.range(-0.1, 1.1),
                        y2: rng.range(-0.1, 1.1),
                        size: rng.range(0.04, 0.3),
                        points,
                        altColor: rng.next() > 0.5,
                        opacity: rng.range(0.4, 0.95),
                        rotation: rng.range(0, Math.PI * 2),
                        lineWidth: rng.range(2, 16)
                    });
                }
                return { type: 'shapes', bgShapes };
            }

            const faultLines = [];
            const shards = [];
            const rays = [];

            const styleIdx = (index - 1) % 3;
            const faultLineCount = Math.floor(rng.range(12 + styleIdx * 4, 25 + styleIdx * 5));
            const wedgeClusterCount = Math.floor(rng.range(6, 18));
            const hyperShardCount = Math.floor(rng.range(40, 100));
            const opticalRaysCount = Math.floor(rng.range(15, 45));

            for (let f = 0; f < faultLineCount; f++) {
                faultLines.push({
                    x1: rng.range(-0.4, 1.4), y1: rng.range(-0.4, 1.4),
                    x2: rng.range(-0.4, 1.4), y2: rng.range(-0.4, 1.4),
                    altColor: rng.next() > 0.5, width: rng.range(3, 25)
                });
            }
            for (let w = 0; w < wedgeClusterCount; w++) {
                const cx = rng.range(-0.1, 1.1), cy = rng.range(-0.1, 1.1);
                const useAltColor = rng.next() > 0.5;
                const subCount = Math.floor(rng.range(3, 10));
                for (let s = 0; s < subCount; s++) {
                    const points = [];
                    const count = Math.floor(rng.range(3, 7));
                    const spread = rng.range(0.1, 0.8);
                    const angOffset = rng.range(0, Math.PI * 2);
                    for (let i = 0; i < count; i++) {
                        const angle = angOffset + (i / count) * Math.PI * 2 + rng.range(-0.8, 0.8);
                        const dist = rng.range(0.03, spread);
                        points.push({
                            x: cx + Math.cos(angle) * dist + rng.range(-0.25, 0.25),
                            y: cy + Math.sin(angle) * dist + rng.range(-0.25, 0.25)
                        });
                    }
                    shards.push({ points, altColor: (s % 2 === 0) ? !useAltColor : useAltColor });
                }
            }
            for (let h = 0; h < hyperShardCount; h++) {
                const px = rng.range(-0.3, 1.3), py = rng.range(-0.3, 1.3), sz = rng.range(0.05, 0.35);
                const points = [
                    { x: px + rng.range(-sz, sz), y: py + rng.range(-sz, sz) },
                    { x: px + rng.range(-sz, sz), y: py + rng.range(-sz, sz) },
                    { x: px + rng.range(-sz, sz), y: py + rng.range(-sz, sz) },
                    { x: px + rng.range(-sz, sz), y: py + rng.range(-sz, sz) }
                ];
                shards.push({ points, altColor: rng.next() > 0.45 });
            }
            for (let r = 0; r < opticalRaysCount; r++) {
                rays.push({
                    x1: rng.range(-0.5, 1.5), y1: rng.range(-0.5, 1.5),
                    x2: rng.range(-0.5, 1.5), y2: rng.range(-0.5, 1.5),
                    thickness: rng.range(8, 110), altColor: rng.next() > 0.5
                });
            }

            return { type: 'dazzle', faultLines, shards, rays };
        }

        function renderPatternToCanvas(config, canvas, targetWidth, targetHeight, index) {
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            const colors = cardColors[index] || { c1: '#000000', c2: '#ffffff' };

            if (index === 4) {
                let bgHex = '#000000';
                if (matrix4CurrentBg === 'White') bgHex = '#ffffff';
                else if (matrix4CurrentBg === 'Chroma Green') bgHex = '#00b140';
                else if (matrix4CurrentBg === 'Chroma Blue') bgHex = '#0047ab';
                else if (matrix4CurrentBg === 'Red') bgHex = '#ff0000';
                else if (matrix4CurrentBg === 'Yellow') bgHex = '#ffff00';
                
                if (matrix4CurrentBg !== 'Transparent') {
                    ctx.fillStyle = bgHex;
                    ctx.fillRect(0, 0, targetWidth, targetHeight);
                } else {
                    ctx.clearRect(0, 0, targetWidth, targetHeight);
                }

                config.items.forEach(item => {
                    ctx.save();
                    ctx.translate(item.x * targetWidth, item.y * targetHeight);
                    ctx.rotate(item.rotation);
                    ctx.globalAlpha = item.opacity;
                    ctx.font = `${item.size * (targetWidth / 800)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.emoji, 0, 0);
                    ctx.restore();
                });
                return;
            }

            if (index === 5) {
                ctx.fillStyle = '#0f0f0f';
                ctx.fillRect(0, 0, targetWidth, targetHeight);

                config.items.forEach(item => {
                    ctx.save();
                    ctx.translate(item.x * targetWidth, item.y * targetHeight);
                    ctx.rotate(item.rotation);
                    ctx.globalAlpha = item.opacity;
                    ctx.font = `${item.size * (targetWidth / 800)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.lineWidth = Math.max(3, (item.size * (targetWidth / 800)) * 0.08);
                    ctx.strokeStyle = '#000000';
                    ctx.lineJoin = 'round';
                    ctx.strokeText(item.emoji, 0, 0);
                    ctx.fillText(item.emoji, 0, 0);
                    ctx.restore();
                });
                return;
            }

            if (index === 6 || index === 7) {
                const grad = ctx.createLinearGradient(0, 0, targetWidth, targetHeight);
                grad.addColorStop(0, colors.c1);
                grad.addColorStop(1, colors.c2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, targetWidth, targetHeight);

                if (config.bgShapes) {
                    config.bgShapes.forEach(shape => {
                        ctx.save();
                        ctx.fillStyle = shape.altColor ? colors.c1 : colors.c2;
                        ctx.strokeStyle = shape.altColor ? colors.c2 : colors.c1;
                        ctx.globalAlpha = shape.opacity;
                        ctx.lineWidth = 3;

                        if (shape.type === 'circle') {
                            ctx.beginPath();
                            ctx.arc(shape.x * targetWidth, shape.y * targetHeight, shape.size * targetWidth, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape.type === 'square') {
                            ctx.save();
                            ctx.translate(shape.x * targetWidth, shape.y * targetHeight);
                            ctx.rotate(shape.rotation);
                            ctx.fillRect(-shape.size * targetWidth, -shape.size * targetWidth, shape.size * 2 * targetWidth, shape.size * 2 * targetWidth);
                            ctx.strokeRect(-shape.size * targetWidth, -shape.size * targetWidth, shape.size * 2 * targetWidth, shape.size * 2 * targetWidth);
                            ctx.restore();
                        } else if (shape.type === 'triangle' && shape.points && shape.points.length >= 3) {
                            ctx.beginPath();
                            ctx.moveTo(shape.points[0].x * targetWidth, shape.points[0].y * targetHeight);
                            for (let p = 1; p < shape.points.length; p++) {
                                ctx.lineTo(shape.points[p].x * targetWidth, shape.points[p].y * targetHeight);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape.type === 'polygon' && shape.points && shape.points.length >= 3) {
                            ctx.beginPath();
                            ctx.moveTo(shape.points[0].x * targetWidth, shape.points[0].y * targetHeight);
                            for (let p = 1; p < shape.points.length; p++) {
                                ctx.lineTo(shape.points[p].x * targetWidth, shape.points[p].y * targetHeight);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                        ctx.restore();
                    });
                }

                config.items.forEach(item => {
                    ctx.save();
                    ctx.translate(item.x * targetWidth, item.y * targetHeight);
                    ctx.rotate(item.rotation);
                    ctx.globalAlpha = item.opacity;
                    ctx.font = `${item.size * (targetWidth / 800)}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(item.emoji, 0, 0);
                    ctx.restore();
                });
                return;
            }

            if (index === 8 || index === 9 || index === 10) {
                ctx.fillStyle = colors.c1;
                ctx.fillRect(0, 0, targetWidth, targetHeight);

                if (config.bgShapes) {
                    config.bgShapes.forEach(shape => {
                        ctx.save();
                        ctx.fillStyle = shape.altColor ? colors.c1 : colors.c2;
                        ctx.strokeStyle = shape.altColor ? colors.c2 : colors.c1;
                        ctx.globalAlpha = shape.opacity;
                        ctx.lineWidth = shape.lineWidth * (targetWidth / 800);

                        if (shape.type === 'circle') {
                            ctx.beginPath();
                            ctx.arc(shape.x * targetWidth, shape.y * targetHeight, shape.size * targetWidth, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape.type === 'square') {
                            ctx.save();
                            ctx.translate(shape.x * targetWidth, shape.y * targetHeight);
                            ctx.rotate(shape.rotation);
                            ctx.fillRect(-shape.size * targetWidth, -shape.size * targetWidth, shape.size * 2 * targetWidth, shape.size * 2 * targetWidth);
                            ctx.strokeRect(-shape.size * targetWidth, -shape.size * targetWidth, shape.size * 2 * targetWidth, shape.size * 2 * targetWidth);
                            ctx.restore();
                        } else if (shape.type === 'triangle' && shape.points && shape.points.length >= 3) {
                            ctx.beginPath();
                            ctx.moveTo(shape.points[0].x * targetWidth, shape.points[0].y * targetHeight);
                            for (let p = 1; p < shape.points.length; p++) {
                                ctx.lineTo(shape.points[p].x * targetWidth, shape.points[p].y * targetHeight);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape.type === 'polygon' && shape.points && shape.points.length >= 3) {
                            ctx.beginPath();
                            ctx.moveTo(shape.points[0].x * targetWidth, shape.points[0].y * targetHeight);
                            for (let p = 1; p < shape.points.length; p++) {
                                ctx.lineTo(shape.points[p].x * targetWidth, shape.points[p].y * targetHeight);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        } else if (shape.type === 'line') {
                            ctx.beginPath();
                            ctx.moveTo(shape.x * targetWidth, shape.y * targetHeight);
                            ctx.lineTo(shape.x2 * targetWidth, shape.y2 * targetHeight);
                            ctx.stroke();
                        }
                        ctx.restore();
                    });
                }
                return;
            }

            ctx.fillStyle = colors.c1;
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            config.rays.forEach(r => {
                ctx.save();
                ctx.strokeStyle = r.altColor ? colors.c2 : colors.c1;
                ctx.lineWidth = r.thickness * (targetWidth / 800);
                ctx.beginPath();
                ctx.moveTo(r.x1 * targetWidth, r.y1 * targetHeight);
                ctx.lineTo(r.x2 * targetWidth, r.y2 * targetHeight);
                ctx.stroke();
                ctx.restore();
            });

            config.shards.forEach(sh => {
                if (!sh.points || sh.points.length < 3) return;
                ctx.save();
                ctx.fillStyle = sh.altColor ? colors.c2 : colors.c1;
                ctx.beginPath();
                ctx.moveTo(sh.points[0].x * targetWidth, sh.points[0].y * targetHeight);
                for (let i = 1; i < sh.points.length; i++) {
                    ctx.lineTo(sh.points[i].x * targetWidth, sh.points[i].y * targetHeight);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            config.faultLines.forEach(f => {
                ctx.save();
                ctx.strokeStyle = f.altColor ? colors.c2 : colors.c1;
                ctx.lineWidth = f.width * (targetWidth / 800);
                ctx.beginPath();
                ctx.moveTo(f.x1 * targetWidth, f.y1 * targetHeight);
                ctx.lineTo(f.x2 * targetWidth, f.y2 * targetHeight);
                ctx.stroke();
                ctx.restore();
            });
        }
    </script>

    <script>
        function reloadSingle(id) {
            const style = allMatrixStyles.find(s => s.id === id);
            if (!style) return;

            if (style.mode === 'comp' || style.id === 9) {
                const cols = getComplementaryColor();
                cardColors[id] = { c1: cols[0], c2: cols[1] };
            } else if (style.mode === 'noncomp' || style.id === 10) {
                const cols = getRandomNonComplementaryColor();
                cardColors[id] = { c1: cols[0], c2: cols[1] };
            } else if (style.mode === 'emoji6') {
                const cols = getRandomNonComplementaryColor();
                cardColors[id] = { c1: cols[0], c2: cols[1] };
            } else if (style.mode === 'emoji7' || style.mode === 'bw' || style.id === 8) {
                cardColors[id] = { c1: '#000000', c2: '#ffffff' };
            }

            const seed = Math.floor(Math.random() * 1000000);
            const config = generatePatternConfig(seed, id);
            activeConfigs[id] = config;

            const canvas = document.getElementById(`canvas_${id}`);
            if (canvas) {
                renderPatternToCanvas(config, canvas, 800, 450, id);
            }
        }

        function reloadCategory(catIdx) {
            const cat = categories[catIdx];
            if (!cat) return;
            cat.styles.forEach(style => reloadSingle(style.id));
        }

        function generateAllPatterns() {
            allMatrixStyles.forEach(style => reloadSingle(style.id));
        }

        function changeMatrixBg(matrixId, mode) {
            if (matrixId === 4) {
                matrix4CurrentBg = mode;
            }
            const canvas = document.getElementById(`canvas_${matrixId}`);
            if (canvas && activeConfigs[matrixId]) {
                renderPatternToCanvas(activeConfigs[matrixId], canvas, 800, 450, matrixId);
            }
        }

        function openModal(target) {
            activeDownloadIndex = target;
            document.getElementById('downloadModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('downloadModal').classList.add('hidden');
            activeDownloadIndex = null;
        }

        function executeDownload(w, h) {
            const tempCanvas = document.createElement('canvas');
            
            if (activeDownloadIndex === 'all') {
                allMatrixStyles.forEach((style) => {
                    if (activeConfigs[style.id]) {
                        renderPatternToCanvas(activeConfigs[style.id], tempCanvas, w, h, style.id);
                        const link = document.createElement('a');
                        link.download = `matrix_${style.id}_${style.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${w}x${h}.png`;
                        link.href = tempCanvas.toDataURL('image/png');
                        link.click();
                    }
                });
            } else if (typeof activeDownloadIndex === 'string' && activeDownloadIndex.startsWith('cat_')) {
                const catIdx = parseInt(activeDownloadIndex.split('_')[1]);
                const cat = categories[catIdx];
                if (cat) {
                    cat.styles.forEach(style => {
                        if (activeConfigs[style.id]) {
                            renderPatternToCanvas(activeConfigs[style.id], tempCanvas, w, h, style.id);
                            const link = document.createElement('a');
                            link.download = `matrix_${style.id}_${style.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${w}x${h}.png`;
                            link.href = tempCanvas.toDataURL('image/png');
                            link.click();
                        }
                    });
                }
            } else {
                const id = activeDownloadIndex;
                const style = allMatrixStyles.find(s => s.id === id);
                if (style && activeConfigs[id]) {
                    renderPatternToCanvas(activeConfigs[id], tempCanvas, w, h, id);
                    const link = document.createElement('a');
                    link.download = `matrix_${style.id}_${style.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${w}x${h}.png`;
                    link.href = tempCanvas.toDataURL('image/png');
                    link.click();
                }
            }

            closeModal();
        }

        window.onload = function() {
            initCards();
        };
    </script>
</body>
