<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📘 Berichtsheft · Viona · Detailansicht</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ===== CSS Variables for Themes ===== */
        :root {
            --bg-primary: #f0f4f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-day: #f8fafc;
            --bg-day-hover: #f1f5f9;
            --bg-controls: #ffffff;
            --bg-search: #f8fafc;
            --bg-badge: #eef2f8;
            --bg-badge-week: #f59e0b;
            --bg-badge-fisi: #2563eb;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #6b7f99;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --border-light: #e9edf4;
            --border-dashed: #c5d3e4;
            --shadow-color: rgba(0,0,0,0.04);
            --shadow-hover: rgba(0,0,0,0.12);
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --day-border: #2563eb;
            --scrollbar-thumb: #c5d3e4;
            --card-border: #e9edf4;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #0d0d0d;
            --bg-day: #1a1a1a;
            --bg-day-hover: #262626;
            --bg-controls: #0d0d0d;
            --bg-search: #1a1a1a;
            --bg-badge: #1a1a1a;
            --bg-badge-week: #b45309;
            --bg-badge-fisi: #1d4ed8;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --text-light: #525252;
            --border-color: #262626;
            --border-light: #1a1a1a;
            --border-dashed: #333333;
            --shadow-color: rgba(0,0,0,0.4);
            --shadow-hover: rgba(0,0,0,0.6);
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --day-border: #3b82f6;
            --scrollbar-thumb: #333333;
            --card-border: #1a1a1a;
        }

        /* ===== Reset & Base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 2rem 1.5rem;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }

        /* ===== Header ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 1.25rem;
        }
        .header h1 {
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header h1 i { color: var(--accent-color); }
        .header-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .repo-badge {
            background: var(--bg-badge);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .repo-badge a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .repo-badge a:hover { color: var(--accent-color); text-decoration: underline; }

        /* ===== Toggle Buttons ===== */
        .toggle-group {
            display: flex;
            gap: 4px;
            background: var(--bg-badge);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .toggle-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .toggle-btn i { font-size: 0.9rem; }
        .toggle-btn.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .toggle-btn:hover:not(.active) { background: var(--bg-day-hover); }

        /* ===== Controls ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--bg-controls);
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 10px var(--shadow-color);
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
        }
        .search-box {
            flex: 1 1 300px;
            display: flex;
            align-items: center;
            background: var(--bg-search);
            border-radius: 40px;
            padding: 0.2rem 1rem;
            border: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .search-box i { color: var(--text-muted); margin-right: 0.6rem; }
        .search-box input {
            border: none;
            background: transparent;
            padding: 0.6rem 0.2rem;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-primary);
        }
        .search-box input::placeholder { color: var(--text-light); }
        
        .controls-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            margin-left: auto;
        }
        .refresh-btn {
            background: var(--bg-badge);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-primary);
        }
        .refresh-btn i { color: var(--accent-color); }
        .refresh-btn:hover { background: var(--bg-day-hover); }

        /* ===== Stats ===== */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem 2.5rem;
            background: var(--bg-controls);
            padding: 1rem 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        .stat-item i { color: var(--accent-color); font-size: 1.2rem; }
        .stat-item strong { font-size: 1.2rem; color: var(--text-primary); }

        /* ===== Card Grid ===== */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 1rem;
        }
        .report-card {
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 8px 24px var(--shadow-color);
            padding: 1.8rem 2rem 2rem;
            border: 1px solid var(--card-border);
            transition: background 0.3s, border 0.3s, box-shadow 0.2s;
        }
        .report-card:hover {
            box-shadow: 0 16px 40px -12px var(--shadow-hover);
            border-color: var(--border-color);
        }
        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 1rem;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i { color: var(--accent-color); }
        .card-badges {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .badge {
            background: var(--bg-badge);
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-primary { background: var(--bg-badge-fisi); color: white; }
        .badge-success { background: var(--success-color); color: white; }
        .badge-week { background: var(--bg-badge-week); color: white; }

        /* ===== Day Grid - ALL 5 DAYS ===== */
        .day-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.8rem;
            margin-top: 0.5rem;
        }
        .day-card {
            background: var(--bg-day);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            border-left: 4px solid var(--day-border);
            transition: background 0.2s, border-color 0.2s;
            min-height: 100px;
            display: flex;
            flex-direction: column;
        }
        .day-card:hover { background: var(--bg-day-hover); }
        .day-card .day-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.3rem;
            flex-shrink: 0;
        }
        .day-card .day-name i { color: var(--accent-color); font-size: 0.85rem; }
        .day-card .day-hours {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-badge);
            padding: 0.05rem 0.5rem;
            border-radius: 20px;
            margin-left: auto;
        }
        .day-card .day-content {
            font-size: 0.82rem;
            line-height: 1.5;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 130px;
            overflow-y: auto;
            padding: 0.2rem 0;
            flex: 1;
        }
        .day-card .day-content::-webkit-scrollbar { width: 3px; }
        .day-card .day-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
        .day-empty {
            color: var(--text-light);
            font-style: italic;
            font-size: 0.8rem;
        }
        .day-card.weekend {
            opacity: 0.5;
            border-left-color: var(--text-light);
        }
        .day-card.weekend .day-name { color: var(--text-light); }

        /* ===== Card Footer ===== */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-light);
        }
        .download-link {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.4rem 1.4rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.15s;
        }
        .download-link:hover { background: var(--accent-hover); color: white; text-decoration: none; }

        /* ===== Empty / Loader ===== */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            background: var(--bg-day);
            border-radius: 60px;
            color: var(--text-secondary);
            border: 1px dashed var(--border-dashed);
        }
        .empty-state i { font-size: 3rem; color: var(--text-light); margin-bottom: 1rem; }
        .loader {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .loader i { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--accent-color); }

        /* ===== Footer ===== */
        .footer-note {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }

        /* ===== Responsive ===== */
        @media (max-width: 1200px) {
            .day-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .day-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: start; gap: 0.8rem; }
            .header-right { width: 100%; justify-content: space-between; }
            .controls { flex-direction: column; align-items: stretch; border-radius: 28px; }
            .search-box { width: 100%; }
            .controls-right { margin-left: 0; justify-content: flex-end; }
            .day-grid { grid-template-columns: 1fr; }
            .report-card { padding: 1.2rem; }
            .stats-bar { flex-direction: column; gap: 0.5rem; }
            .card-header { flex-direction: column; align-items: start; gap: 0.5rem; }
        }
        @media (max-width: 480px) {
            .day-grid { grid-template-columns: 1fr; }
            .toggle-btn { font-size: 0.7rem; padding: 0.3rem 0.6rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-calendar-day"></i> <span data-i18n="title">Berichtsheft · Detailansicht</span></h1>
        <div class="header-right">
            <!-- Language Toggle -->
            <div class="toggle-group" id="langToggle">
                <button class="toggle-btn active" data-lang="de"><i class="fas fa-language"></i> DE</button>
                <button class="toggle-btn" data-lang="en"><i class="fas fa-language"></i> EN</button>
            </div>
            <!-- Theme Toggle -->
            <div class="toggle-group" id="themeToggle">
                <button class="toggle-btn active" data-theme="light"><i class="fas fa-sun"></i></button>
                <button class="toggle-btn" data-theme="dark"><i class="fas fa-moon"></i></button>
            </div>
            <div class="repo-badge">
                <i class="fab fa-github"></i>
                <a href="https://github.com/cmdrFRANKLY1/Viona/tree/main/Reports" target="_blank">
                    cmdrFRANKLY1/Viona/Reports
                </a>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="🔍 Suche nach Woche, Thema, Tag ..." data-i18n-placeholder="search" />
        </div>
        <div class="controls-right">
            <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> <span data-i18n="refresh">Aktualisieren</span></button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-item"><i class="fas fa-file-word"></i> <span data-i18n="reports">Berichte</span>: <strong id="totalCount">0</strong></div>
        <div class="stat-item"><i class="fas fa-calendar-week"></i> <span data-i18n="weeks">Wochen</span>: <strong id="weekCount">0</strong></div>
        <div class="stat-item"><i class="fas fa-tasks"></i> <span data-i18n="days">Tage mit Einträgen</span>: <strong id="dayCount">0</strong></div>
    </div>

    <!-- Grid -->
    <div id="cardGrid" class="card-grid">
        <div class="loader"><i class="fas fa-spinner fa-pulse"></i><br><span data-i18n="loading">Lade Berichte …</span></div>
    </div>

    <div class="footer-note">
        <i class="fas fa-chevron-circle-down"></i> <span data-i18n="footer">Tag-für-Tag Übersicht aller Ausbildungsnachweise.</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== TRANSLATIONS =====
        const translations = {
            de: {
                title: 'Berichtsheft · Detailansicht',
                search: 'Suche nach Woche, Thema, Tag ...',
                refresh: 'Aktualisieren',
                reports: 'Berichte',
                weeks: 'Wochen',
                days: 'Tage mit Einträgen',
                loading: 'Lade Berichte …',
                footer: 'Tag-für-Tag Übersicht aller Ausbildungsnachweise.',
                noReports: 'Keine Berichte gefunden',
                noData: 'Keine .docx Dateien gefunden',
                error: 'Fehler beim Laden',
                retry: '🔄 Neu laden',
                open: 'Datei öffnen',
                daysList: ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'],
                noDetails: 'Keine Tagesdetails',
                noStructured: 'Keine strukturierten Daten gefunden'
            },
            en: {
                title: 'Training Log · Detailed View',
                search: 'Search by week, topic, day ...',
                refresh: 'Refresh',
                reports: 'Reports',
                weeks: 'Weeks',
                days: 'Days with entries',
                loading: 'Loading reports …',
                footer: 'Day-by-day overview of all training records.',
                noReports: 'No reports found',
                noData: 'No .docx files found',
                error: 'Error loading',
                retry: '🔄 Retry',
                open: 'Open file',
                daysList: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'],
                noDetails: 'No day details',
                noStructured: 'No structured data found'
            }
        };

        let currentLang = 'de';

        // ===== CONFIG =====
        const REPO_OWNER = 'cmdrFRANKLY1';
        const REPO_NAME = 'Viona';
        const REPO_PATH = 'Reports';
        const BASE_RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${REPO_PATH}`;
        const API_TREE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_PATH}`;

        // ===== DOM =====
        const grid = document.getElementById('cardGrid');
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const totalCount = document.getElementById('totalCount');
        const weekCount = document.getElementById('weekCount');
        const dayCount = document.getElementById('dayCount');

        let allReports = [];
        let filteredReports = [];
        let searchTerm = '';

        // ===== THEME =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('viona-theme', theme);
            document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        function initTheme() {
            const saved = localStorage.getItem('viona-theme') || 'light';
            setTheme(saved);
        }

        // ===== LANGUAGE =====
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('viona-lang', lang);
            document.querySelectorAll('#langToggle .toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            // Update all i18n elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.dataset.i18nPlaceholder;
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            // Re-render to update day names
            applyFilters();
        }

        function initLanguage() {
            const saved = localStorage.getItem('viona-lang') || 'de';
            setLanguage(saved);
        }

        // ===== DOCX PARSER - Enhanced for table structure =====
        async function extractDocxText(arrayBuffer) {
            try {
                const zip = await JSZip.loadAsync(arrayBuffer);
                const docFile = zip.file('word/document.xml');
                if (!docFile) return { text: '', days: {} };

                const xmlText = await docFile.async('string');
                
                // Extract all text between <w:t> tags
                const textMatches = xmlText.match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || [];
                const texts = textMatches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(t => t.length > 0);
                
                // Join with spaces to preserve structure
                const fullText = texts.join(' ').replace(/\s+/g, ' ').trim();
                
                // Extract days with their content and hours
                const days = extractDaysFromTable(fullText);
                return { text: fullText, days };
            } catch (e) {
                console.warn('DOCX Parse error:', e);
                return { text: '⚠️ Fehler beim Parsen', days: {} };
            }
        }

        function extractDaysFromTable(text) {
            const days = {};
            const lang = currentLang;
            const dayNames = translations[lang].daysList;
            
            // Pattern to match: "DayName" followed by content, then "8" (or other number) at the end
            for (let i = 0; i < dayNames.length; i++) {
                const dayName = dayNames[i];
                const nextDay = i < dayNames.length - 1 ? dayNames[i + 1] : '$';
                const regex = new RegExp(
                    dayName + '[\\s\\-:;]*([\\s\\S]*?)(?=' + nextDay + '|$)', 
                    'i'
                );
                const match = text.match(regex);
                if (match) {
                    let content = match[1].trim();
                    // Extract hours
                    let hours = '8';
                    const hourMatch = content.match(/(\d+)\s*(?:h|Std\.|Stunden)/i);
                    if (hourMatch) {
                        hours = hourMatch[1];
                        content = content.replace(hourMatch[0], '').trim();
                    }
                    const hourMatch2 = content.match(/\b(\d+)\s*$|\b(\d+)\s*(?:h|Std)/i);
                    if (hourMatch2 && !hourMatch) {
                        hours = hourMatch2[1] || hourMatch2[2] || '8';
                        content = content.replace(/\s*\d+\s*(?:h|Std\.|Stunden)?\s*$/, '').trim();
                    }
                    
                    // Clean up content
                    content = content.replace(/[–\-]\s*Selbständig.*$/gim, '').trim();
                    content = content.replace(/Selbstständiges\s*Lernen/gi, '').trim();
                    content = content.replace(/\s+/g, ' ').trim();
                    content = content.replace(/^[\s\-•]*/, '').trim();
                    
                    if (content.length > 0) {
                        days[dayName] = { content, hours };
                    } else {
                        days[dayName] = { content: '—', hours: hours };
                    }
                }
            }
            
            // Fallback: simple pattern
            if (Object.keys(days).length === 0) {
                const simpleRegex = new RegExp(
                    '(' + dayNames.join('|') + ')\\s*[:;]?\\s*([^\\n]+)', 'gi'
                );
                let m;
                while ((m = simpleRegex.exec(text)) !== null) {
                    let content = m[2].trim();
                    let hours = '8';
                    const hMatch = content.match(/(\d+)\s*(?:h|Std)/i);
                    if (hMatch) {
                        hours = hMatch[1];
                        content = content.replace(hMatch[0], '').trim();
                    }
                    content = content.replace(/[–\-]\s*Selbständig.*$/gim, '').trim();
                    content = content.replace(/Selbstständiges\s*Lernen/gi, '').trim();
                    content = content.replace(/\s+/g, ' ').trim();
                    if (content.length > 0) {
                        days[m[1].trim()] = { content, hours };
                    }
                }
            }
            
            return days;
        }

        // ===== GITHUB API =====
        async function fetchReportFiles() {
            try {
                const response = await fetch(API_TREE_URL);
                if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Invalid response');

                const docFiles = data.filter(item => 
                    item.type === 'file' && 
                    (item.name.toLowerCase().endsWith('.doc') || item.name.toLowerCase().endsWith('.docx'))
                );
                
                const reports = docFiles.map(item => {
                    const fileName = item.name;
                    const rawUrl = `${BASE_RAW_URL}/${encodeURIComponent(fileName)}`;
                    const weekInfo = extractWeekFromFilename(fileName);
                    let weekLabel = 'Woche unbekannt';
                    if (weekInfo) weekLabel = `${weekInfo.start} – ${weekInfo.end}`;
                    const isFisi = fileName.includes('FISI') || fileName.toLowerCase().includes('fisi');
                    return {
                        name: fileName,
                        url: rawUrl,
                        week: weekLabel,
                        year: '2026',
                        isFisi: isFisi,
                        contentPreview: '📄 Lade ...',
                        days: {},
                        rawText: ''
                    };
                });

                reports.sort((a, b) => {
                    const getStart = (r) => {
                        if (r.week && r.week.includes('–')) {
                            const start = r.week.split('–')[0].trim().split('.');
                            if (start.length === 3) return new Date(start[2], start[1]-1, start[0]);
                        }
                        return new Date(0);
                    };
                    return getStart(a) - getStart(b);
                });

                return reports;
            } catch (err) {
                console.error('Error fetching files:', err);
                throw err;
            }
        }

        function extractWeekFromFilename(filename) {
            const match = filename.match(/(\d{1,2}\.\d{1,2}\.\d{4})\s*-\s*(\d{1,2}\.\d{1,2}\.\d{4})/);
            return match ? { start: match[1], end: match[2] } : null;
        }

        // ===== FETCH & PARSE =====
        async function fetchAndParseDocx(report) {
            try {
                const response = await fetch(report.url);
                if (!response.ok) {
                    report.contentPreview = '⚠️ Datei nicht erreichbar';
                    return;
                }
                const arrayBuffer = await response.arrayBuffer();
                const result = await extractDocxText(arrayBuffer);
                report.rawText = result.text;
                report.days = result.days || {};
                
                const dayEntries = Object.entries(report.days).slice(0, 3);
                if (dayEntries.length > 0) {
                    report.contentPreview = dayEntries.map(([day, data]) => 
                        `📌 ${day} (${data.hours}h): ${data.content.substring(0, 50)}${data.content.length > 50 ? '…' : ''}`
                    ).join('\n');
                } else {
                    report.contentPreview = result.text.substring(0, 200) + (result.text.length > 200 ? ' …' : '');
                }
            } catch (e) {
                console.warn(`Error parsing ${report.name}:`, e);
                report.contentPreview = '⚠️ Vorschau nicht verfügbar';
            }
        }

        // ===== RENDER =====
        function render(reports) {
            const lang = currentLang;
            const t = translations[lang];
            const dayNames = t.daysList.slice(0, 5);

            if (reports.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>${t.noReports}</h3>
                    </div>
                `;
                updateStats([]);
                return;
            }

            let html = '';
            let totalDays = 0;
            for (const report of reports) {
                const dayEntries = Object.entries(report.days);
                totalDays += dayEntries.length;

                const dayMap = {};
                dayEntries.forEach(([day, data]) => {
                    dayMap[day] = data;
                });

                html += `
                    <div class="report-card" data-week="${report.week}" data-name="${report.name}">
                        <div class="card-header">
                            <div class="card-title">
                                <i class="far fa-file-word"></i>
                                ${report.name.replace(/\.(doc|docx)$/i, '').substring(0, 50)}
                            </div>
                            <div class="card-badges">
                                <span class="badge badge-week"><i class="far fa-calendar-alt"></i> ${report.week}</span>
                                ${report.isFisi ? '<span class="badge badge-primary"><i class="fas fa-server"></i> FISI</span>' : ''}
                                <span class="badge"><i class="far fa-clock"></i> ${report.year}</span>
                            </div>
                        </div>

                        <div class="day-grid">
                            ${dayNames.map(day => {
                                const data = dayMap[day];
                                const hasContent = data && data.content && data.content.length > 0 && data.content !== '—';
                                const hours = data && data.hours ? data.hours : '';
                                const content = data && data.content ? data.content : '';
                                return `
                                    <div class="day-card">
                                        <div class="day-name">
                                            <i class="fas fa-${getDayIcon(day)}"></i> ${day}
                                            ${hours ? `<span class="day-hours"><i class="far fa-clock"></i> ${hours}h</span>` : ''}
                                        </div>
                                        <div class="day-content">
                                            ${hasContent ? content : `<span class="day-empty">—</span>`}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        <div class="card-footer">
                            <span class="badge"><i class="fas fa-list"></i> ${dayEntries.length} ${t.days}</span>
                            <a href="${report.url}" target="_blank" class="download-link" download>
                                <i class="fas fa-download"></i> ${t.open}
                            </a>
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
            updateStats(reports);
        }

        function getDayIcon(day) {
            const map = {
                'Montag': 'moon', 'Monday': 'moon',
                'Dienstag': 'fire', 'Tuesday': 'fire',
                'Mittwoch': 'cloud', 'Wednesday': 'cloud',
                'Donnerstag': 'bolt', 'Thursday': 'bolt',
                'Freitag': 'star', 'Friday': 'star',
                'Samstag': 'sun', 'Saturday': 'sun',
                'Sonntag': 'coffee', 'Sunday': 'coffee'
            };
            return map[day] || 'calendar-day';
        }

        function updateStats(reports) {
            totalCount.textContent = reports.length;
            const weeks = new Set(reports.map(r => r.week));
            weekCount.textContent = weeks.size;
            let days = 0;
            reports.forEach(r => days += Object.keys(r.days).length);
            dayCount.textContent = days;
        }

        // ===== FILTERS =====
        function applyFilters() {
            let result = [...allReports];

            if (searchTerm.trim() !== '') {
                const term = searchTerm.trim().toLowerCase();
                result = result.filter(r => {
                    const dayContent = Object.values(r.days).map(d => d.content).join(' ');
                    return r.name.toLowerCase().includes(term) ||
                           r.week.toLowerCase().includes(term) ||
                           dayContent.toLowerCase().includes(term);
                });
            }

            filteredReports = result;
            render(filteredReports);
        }

        // ===== LOAD =====
        async function loadData(showLoader = true) {
            const lang = currentLang;
            const t = translations[lang];

            if (showLoader) {
                grid.innerHTML = `
                    <div class="loader">
                        <i class="fas fa-spinner fa-pulse"></i><br>
                        ${t.loading}
                    </div>
                `;
            }

            try {
                const reports = await fetchReportFiles();
                if (!reports || reports.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-folder-open"></i>
                            <h3>${t.noData}</h3>
                        </div>
                    `;
                    allReports = [];
                    filteredReports = [];
                    updateStats([]);
                    return;
                }

                allReports = reports;

                for (let i = 0; i < allReports.length; i++) {
                    await fetchAndParseDocx(allReports[i]);
                    if (i % 2 === 0 || i === allReports.length - 1) {
                        applyFilters();
                    }
                }

                applyFilters();

            } catch (err) {
                console.error(err);
                const tErr = translations[lang];
                grid.innerHTML = `
                    <div class="empty-state" style="border-color:#f1c0c0;">
                        <i class="fas fa-exclamation-triangle" style="color:#b91c1c;"></i>
                        <h3>${tErr.error}</h3>
                        <p>${err.message || 'Netzwerkfehler. Versuche später erneut.'}</p>
                        <button onclick="location.reload();" style="margin-top:1.2rem; background:var(--accent-color); border:none; color:white; padding:0.4rem 2rem; border-radius:60px; font-weight:500; cursor:pointer;">${tErr.retry}</button>
                    </div>
                `;
            }
        }

        // ===== EVENT LISTENERS =====
        // Search
        searchInput.addEventListener('input', function() {
            searchTerm = this.value;
            applyFilters();
        });

        // Refresh
        refreshBtn.addEventListener('click', () => loadData(true));

        // Language toggle
        document.querySelectorAll('#langToggle .toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                setLanguage(lang);
                for (const report of allReports) {
                    if (report.rawText) {
                        const result = extractDaysFromTable(report.rawText);
                        report.days = result || {};
                    }
                }
                applyFilters();
            });
        });

        // Theme toggle
        document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const theme = this.dataset.theme;
                setTheme(theme);
            });
        });

        // ===== INIT =====
        initTheme();
        initLanguage();
        loadData(true);
    })();
</script>
</body>
</html>
