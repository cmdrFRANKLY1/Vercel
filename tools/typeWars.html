<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechType Drop - Special Words Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #000000;
            color: #ededed;
            overflow: hidden;
            user-select: none;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between relative bg-black transition-colors duration-200" id="body-container">

    <header class="w-full p-4 flex flex-col space-y-3 bg-black border-b border-zinc-800 z-20 transition-colors duration-200" id="header-container">
        <div class="flex justify-between items-center w-full">
            <div class="flex items-center space-x-3">
                <div class="w-2.5 h-2.5 bg-white transition-colors duration-200" id="logo-indicator"></div>
                <h1 class="font-bold text-sm tracking-widest text-white transition-colors duration-200" id="logo-text">TECHTYPE_DROP</h1>
            </div>
            <div class="flex items-center space-x-4 md:space-x-6">
                <div class="flex items-center space-x-2">
                    <button id="lang-toggle" class="px-2 py-1 border border-zinc-700 text-xs text-zinc-300 hover:text-white hover:border-white transition tracking-wider">LANG: EN</button>
                    <button id="theme-toggle" class="px-2 py-1 border border-zinc-700 text-xs text-zinc-300 hover:text-white hover:border-white transition tracking-wider">THEME: DARK</button>
                </div>
                <div class="hidden lg:block text-xs md:text-sm tracking-wider text-zinc-400" id="clock-display">00/00/0000 00:00:00</div>
            </div>
        </div>
        <div class="flex space-x-6 text-xs md:text-sm tracking-wider text-zinc-400 pt-1 border-t border-zinc-800/60" id="stats-row">
            <div>SCORE: <span id="score-val" class="text-white font-bold transition-colors duration-200">0</span></div>
            <div>WPM: <span id="wpm-val" class="text-white font-bold transition-colors duration-200">0</span></div>
            <div>APM: <span id="apm-val" class="text-white font-bold transition-colors duration-200">0</span></div>
            <div>HP: <span id="hp-val" class="text-white font-bold transition-colors duration-200">100</span></div>
            <div id="moon-gravity-badge" class="hidden text-purple-400 font-bold animate-pulse">🌙 MOON GRAVITY: <span id="moon-timer">5</span>s</div>
        </div>
    </header>

    <main id="playfield" class="flex-1 relative overflow-hidden bg-black cursor-crosshair transition-colors duration-200">
        <div id="particle-container" class="absolute inset-0 pointer-events-none z-15 overflow-hidden">
            <canvas id="particle-canvas" class="w-full h-full block"></canvas>
        </div>
        <div id="landscape-container" class="absolute bottom-0 left-0 w-full h-24 z-10 pointer-events-none overflow-hidden">
            <canvas id="landscape-canvas" class="w-full h-full block"></canvas>
        </div>
        <div id="overlay" class="absolute inset-0 bg-black/95 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center transition-colors duration-200">
            <h2 id="overlay-title" class="text-3xl md:text-5xl font-bold text-white mb-4 tracking-wider transition-colors duration-200">TECHTYPE DROP</h2>
            <p id="overlay-desc" class="text-zinc-500 max-w-md mb-8 text-xs md:text-sm leading-relaxed">
                Type the falling computer science terminology. Special colored words grant unique abilities!
            </p>
            <button id="action-btn" class="px-6 py-3 bg-white text-black font-bold rounded-none hover:bg-zinc-200 transition text-sm tracking-widest">INITIALIZE_GAME</button>
        </div>
    </main>

    <footer class="w-full p-4 bg-black border-t border-zinc-800 z-20 flex justify-center items-center transition-colors duration-200" id="footer-container">
        <div class="w-full max-w-xl relative">
            <input type="text" id="type-input" autofocus autocomplete="off" autocapitalize="off" spellcheck="false"
                placeholder="Type falling words here..."
                class="w-full bg-black border border-zinc-700 focus:border-white rounded-none px-4 py-3 text-white placeholder-zinc-700 outline-none tracking-wider text-sm transition">
        </div>
    </footer>

    <script>
        const WORDS_EN = [
            "algorithm", "backend", "binary", "browser", "buffer", "cache", "closure", "compiler", 
            "cookie", "coroutine", "database", "debugging", "deploy", "desktop", "domain", "dynamic", 
            "encryption", "endpoint", "firewall", "framework", "frontend", "function", "gateway", 
            "git", "hash", "http", "indexing", "interface", "kernel", "latency", "library", "linux", 
            "loops", "memory", "microservice", "middleware", "monolith", "network", "node", "null", 
            "object", "packet", "paradigm", "parser", "pipeline", "pointer", "protocol", "proxy", 
            "query", "queue", "react", "recursion", "refactor", "render", "repository", "router", 
            "runtime", "script", "server", "session", "socket", "stack", "syntax", "terminal", 
            "thread", "token", "typescript", "unicode", "variable", "virtual", "vulnerability", "websocket"
        ];

        const WORDS_DE = [
            "algorithmus", "backend", "binär", "browser", "puffer", "cache", "schliessung", "compiler", 
            "kookie", "coroutine", "datenbank", "debugging", "bereitstellung", "desktop", "domain", "dynamisch", 
            "verschlüsselung", "endpunkt", "firewall", "framework", "frontend", "funktion", "gateway", 
            "git", "hash", "http", "indizierung", "schnittstelle", "kern", "latenz", "bibliothek", "linux", 
            "schleife", "speicher", "mikroservice", "middleware", "monolith", "netzwerk", "knoten", "null", 
            "objekt", "paket", "paradigma", "parser", "pipeline", "zeiger", "protokoll", "proxy", 
            "abfrage", "warteschlange", "rekursion", "refactoring", "rendern", "repository", "router", 
            "laufzeit", "skript", "server", "sitzung", "socket", "stapel", "syntax", "terminal", 
            "faden", "token", "typskript", "unicode", "variable", "virtuell", "schwachstelle", "websocket"
        ];

        // Special word types
        const SPECIAL_TYPES = ['red', 'blue', 'yellow', 'rainbow'];
        const SPECIAL_COLORS = {
            red: { border: 'border-red-500', glow: 'shadow-[0_0_15px_rgba(239,68,68,0.5)]', text: 'text-red-400' },
            blue: { border: 'border-blue-500', glow: 'shadow-[0_0_15px_rgba(59,130,246,0.5)]', text: 'text-blue-400' },
            yellow: { border: 'border-yellow-500', glow: 'shadow-[0_0_15px_rgba(234,179,8,0.5)]', text: 'text-yellow-400' },
            rainbow: { border: 'border-purple-500', glow: 'shadow-[0_0_15px_rgba(168,85,247,0.5)]', text: 'text-purple-400' }
        };

        let gameState = 'IDLE';
        let score = 0;
        let hp = 100;
        let wordsOnScreen = [];
        let activeWordId = null;
        let lastFrameTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 1800;
        let gameSpeedMultiplier = 1;
        let totalCharsTyped = 0;
        let totalActions = 0;
        let gameStartTime = 0;
        let isDarkMode = true;
        let currentLang = 'EN';
        let particles = [];
        let moonGravityActive = false;
        let moonGravityTimer = 0;
        const MOON_GRAVITY_DURATION = 5000;

        const bodyContainer = document.getElementById('body-container');
        const headerContainer = document.getElementById('header-container');
        const footerContainer = document.getElementById('footer-container');
        const logoIndicator = document.getElementById('logo-indicator');
        const logoText = document.getElementById('logo-text');
        const scoreVal = document.getElementById('score-val');
        const wpmVal = document.getElementById('wpm-val');
        const apmVal = document.getElementById('apm-val');
        const hpVal = document.getElementById('hp-val');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const langToggleBtn = document.getElementById('lang-toggle');
        const playfield = document.getElementById('playfield');
        const inputField = document.getElementById('type-input');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const actionBtn = document.getElementById('action-btn');
        const landscapeCanvas = document.getElementById('landscape-canvas');
        const landscapeCtx = landscapeCanvas.getContext('2d');
        const particleCanvas = document.getElementById('particle-canvas');
        const particleCtx = particleCanvas.getContext('2d');
        const clockDisplay = document.getElementById('clock-display');
        const moonBadge = document.getElementById('moon-gravity-badge');
        const moonTimerSpan = document.getElementById('moon-timer');

        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            if (clockDisplay) {
                clockDisplay.textContent = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        let landscapeHeights = [];
        let initialLandscapeArea = 0;

        function initLandscape() {
            landscapeCanvas.width = playfield.clientWidth;
            landscapeCanvas.height = 96;
            particleCanvas.width = playfield.clientWidth;
            particleCanvas.height = playfield.clientHeight;
            landscapeHeights = [];
            let currentHeight = 35 + Math.random() * 25;
            for (let i = 0; i < landscapeCanvas.width; i++) {
                if (Math.random() < 0.25) {
                    currentHeight += (Math.random() - 0.5) * 12;
                    currentHeight = Math.max(18, Math.min(80, currentHeight));
                }
                landscapeHeights.push(Math.floor(currentHeight));
            }
            initialLandscapeArea = landscapeHeights.reduce((sum, h) => sum + h, 0);
            if (initialLandscapeArea === 0) initialLandscapeArea = 1;
            updateHpFromLandscape();
            drawLandscape();
        }

        function updateHpFromLandscape() {
            const currentArea = landscapeHeights.reduce((sum, h) => sum + h, 0);
            const percentage = Math.max(0, Math.min(100, Math.round((currentArea / initialLandscapeArea) * 100)));
            hp = percentage;
            hpVal.textContent = hp;
        }

        function drawLandscape() {
            landscapeCtx.clearRect(0, 0, landscapeCanvas.width, landscapeCanvas.height);
            const isDark = isDarkMode;
            for (let x = 0; x < landscapeHeights.length; x++) {
                const h = landscapeHeights[x];
                if (h <= 0) continue;
                const y = landscapeCanvas.height - h;
                landscapeCtx.fillStyle = isDark ? '#18181b' : '#e4e4e7';
                landscapeCtx.fillRect(x, y, 1, h);
                landscapeCtx.fillStyle = isDark ? '#a1a1aa' : '#3f3f46';
                landscapeCtx.fillRect(x, y, 1, 1);
            }
        }

        function triggerPixelExplosion(impactX, impactY, colorOverride = null) {
            const numParticles = 85;
            const isDark = isDarkMode;
            const particleColor = colorOverride || (isDark ? '#a1a1aa' : '#3f3f46');
            for (let i = 0; i < numParticles; i++) {
                const angle = (Math.random() * Math.PI) + Math.PI;
                const speed = Math.random() * 6 + 1.0;
                particles.push({
                    x: impactX + (Math.random() - 0.5) * 45,
                    y: impactY + (Math.random() - 0.5) * 8,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed * (Math.random() * 0.8 + 0.5),
                    size: Math.random() > 0.4 ? 2 : 1,
                    alpha: 1.0,
                    decay: Math.random() * 0.025 + 0.012,
                    color: particleColor
                });
            }
        }

        function updateParticles(delta) {
            particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            if (particles.length === 0) return;
            const gravity = moonGravityActive ? -0.05 : 0.15;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * (delta / 16);
                p.y += p.vy * (delta / 16);
                p.vy += gravity * (delta / 16);
                p.alpha -= p.decay * (delta / 16);
                if (p.alpha <= 0 || p.y > particleCanvas.height) {
                    particles.splice(i, 1);
                    continue;
                }
                particleCtx.fillStyle = p.color;
                particleCtx.globalAlpha = Math.max(0, p.alpha);
                particleCtx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
            }
            particleCtx.globalAlpha = 1.0;
        }

        function damageLandscape(impactX) {
            const centerCol = Math.round(impactX);
            const radius = 18;
            for (let x = centerCol - radius; x <= centerCol + radius; x++) {
                if (x >= 0 && x < landscapeHeights.length) {
                    const distance = Math.abs(x - centerCol);
                    const depthReduction = Math.floor(Math.sqrt(Math.max(0, (radius * radius) - (distance * distance))) * 0.75);
                    landscapeHeights[x] = Math.max(0, landscapeHeights[x] - depthReduction);
                }
            }
            drawLandscape();
            updateHpFromLandscape();
            const groundY = playfield.clientHeight - (landscapeHeights[centerCol] || 20);
            triggerPixelExplosion(centerCol, groundY);
        }

        function triggerWordExplosion(word, color = '#fbbf24') {
            if (!word || !word.element) return;
            const rect = word.element.getBoundingClientRect();
            const playRect = playfield.getBoundingClientRect();
            const cx = rect.left + rect.width/2 - playRect.left;
            const cy = rect.top + rect.height/2 - playRect.top;
            triggerPixelExplosion(cx, cy, color);
        }

        function getRandomSpecialType() {
            const types = ['red', 'blue', 'yellow', 'rainbow'];
            return types[Math.floor(Math.random() * types.length)];
        }

        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            const statsRow = document.getElementById('stats-row');
            if (isDarkMode) {
                themeToggleBtn.textContent = "THEME: DARK";
                themeToggleBtn.className = "px-2 py-1 border border-zinc-700 text-xs text-zinc-300 hover:text-white hover:border-white transition tracking-wider";
                langToggleBtn.className = "px-2 py-1 border border-zinc-700 text-xs text-zinc-300 hover:text-white hover:border-white transition tracking-wider";
                bodyContainer.className = "h-full flex flex-col justify-between relative bg-black transition-colors duration-200";
                headerContainer.className = "w-full p-4 flex flex-col space-y-3 bg-black border-b border-zinc-800 z-20 transition-colors duration-200";
                statsRow.className = "flex space-x-6 text-xs md:text-sm tracking-wider text-zinc-400 pt-1 border-t border-zinc-800/60";
                footerContainer.className = "w-full p-4 bg-black border-t border-zinc-800 z-20 flex justify-center items-center transition-colors duration-200";
                overlay.className = "absolute inset-0 bg-black/95 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center transition-colors duration-200";
                playfield.className = "flex-1 relative overflow-hidden bg-black cursor-crosshair transition-colors duration-200";
                logoIndicator.className = "w-2.5 h-2.5 bg-white transition-colors duration-200";
                logoText.className = "font-bold text-sm tracking-widest text-white transition-colors duration-200";
                scoreVal.className = "text-white font-bold transition-colors duration-200";
                wpmVal.className = "text-white font-bold transition-colors duration-200";
                hpVal.className = "text-white font-bold transition-colors duration-200";
                overlayTitle.className = "text-3xl md:text-5xl font-bold text-white mb-4 tracking-wider transition-colors duration-200";
                actionBtn.className = "px-6 py-3 bg-white text-black font-bold rounded-none hover:bg-zinc-200 transition text-sm tracking-widest";
                inputField.className = "w-full bg-black border border-zinc-700 focus:border-white rounded-none px-4 py-3 text-white placeholder-zinc-700 outline-none tracking-wider text-sm transition";
            } else {
                themeToggleBtn.textContent = "THEME: LIGHT";
                themeToggleBtn.className = "px-2 py-1 border border-zinc-300 text-xs text-zinc-600 hover:text-black hover:border-black transition tracking-wider";
                langToggleBtn.className = "px-2 py-1 border border-zinc-300 text-xs text-zinc-600 hover:text-black hover:border-black transition tracking-wider";
                bodyContainer.className = "h-full flex flex-col justify-between relative bg-white transition-colors duration-200";
                headerContainer.className = "w-full p-4 flex flex-col space-y-3 bg-white border-b border-zinc-200 z-20 transition-colors duration-200";
                statsRow.className = "flex space-x-6 text-xs md:text-sm tracking-wider text-zinc-500 pt-1 border-t border-zinc-200";
                footerContainer.className = "w-full p-4 bg-white border-t border-zinc-200 z-20 flex justify-center items-center transition-colors duration-200";
                overlay.className = "absolute inset-0 bg-white/95 backdrop-blur-sm z-30 flex flex-col items-center justify-center p-6 text-center transition-colors duration-200";
                playfield.className = "flex-1 relative overflow-hidden bg-white cursor-crosshair transition-colors duration-200";
                logoIndicator.className = "w-2.5 h-2.5 bg-black transition-colors duration-200";
                logoText.className = "font-bold text-sm tracking-widest text-black transition-colors duration-200";
                scoreVal.className = "text-black font-bold transition-colors duration-200";
                wpmVal.className = "text-black font-bold transition-colors duration-200";
                hpVal.className = "text-black font-bold transition-colors duration-200";
                overlayTitle.className = "text-3xl md:text-5xl font-bold text-black mb-4 tracking-wider transition-colors duration-200";
                actionBtn.className = "px-6 py-3 bg-black text-white font-bold rounded-none hover:bg-zinc-800 transition text-sm tracking-widest";
                inputField.className = "w-full bg-white border border-zinc-300 focus:border-black rounded-none px-4 py-3 text-black placeholder-zinc-400 outline-none tracking-wider text-sm transition";
            }
            wordsOnScreen.forEach(w => w.updateHTML());
            drawLandscape();
        });

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'EN' ? 'DE' : 'EN';
            langToggleBtn.textContent = `LANG: ${currentLang}`;
            if (currentLang === 'DE') {
                overlayDesc.textContent = "Tippe die herabfallenden Informatik-Begriffe. Spezielle farbige Wörter verleihen einzigartige Fähigkeiten!";
                actionBtn.textContent = "SPIEL_STARTEN";
                inputField.placeholder = "Tippe fallende Wörter hier...";
            } else {
                overlayDesc.textContent = "Type the falling computer science terminology. Special colored words grant unique abilities!";
                actionBtn.textContent = "INITIALIZE_GAME";
                inputField.placeholder = "Type falling words here...";
            }
        });

        class FallingWord {
            constructor(text, specialType = null) {
                this.id = Math.random().toString(36).substring(2, 9);
                this.text = text;
                this.specialType = specialType;
                this.typedIndex = 0;
                this.x = Math.random() * (playfield.clientWidth - 150) + 20;
                this.y = -40;
                this.speed = (Math.random() * 0.8 + 0.8) * 0.08;
                this.element = this.createElement();
            }

            createElement() {
                const el = document.createElement('div');
                const baseClass = isDarkMode 
                    ? 'word-card absolute px-3 py-1 bg-black border text-xs tracking-wider flex items-center space-x-1 pointer-events-none transition-colors duration-200' 
                    : 'word-card absolute px-3 py-1 bg-white border text-xs tracking-wider flex items-center space-x-1 pointer-events-none transition-colors duration-200';
                
                let extraClass = '';
                if (this.specialType) {
                    const colors = SPECIAL_COLORS[this.specialType];
                    extraClass = `${colors.border} ${colors.glow}`;
                } else {
                    extraClass = isDarkMode ? 'border-zinc-800' : 'border-zinc-200';
                }
                el.className = `${baseClass} ${extraClass}`;
                el.style.left = `${this.x}px`;
                el.style.top = `${this.y}px`;
                this.updateHTMLContent(el);
                playfield.appendChild(el);
                return el;
            }

            updateHTMLContent(el) {
                if (!el) return;
                const typed = this.text.substring(0, this.typedIndex);
                const remaining = this.text.substring(this.typedIndex);
                const isActive = el === activeWordElement();
                const colorClass = this.specialType ? SPECIAL_COLORS[this.specialType].text : '';
                
                let bgClass, borderClass;
                if (isDarkMode) {
                    bgClass = isActive ? 'bg-zinc-900' : 'bg-black';
                    borderClass = this.specialType ? SPECIAL_COLORS[this.specialType].border : (isActive ? 'border-white' : 'border-zinc-800');
                } else {
                    bgClass = isActive ? 'bg-zinc-100' : 'bg-white';
                    borderClass = this.specialType ? SPECIAL_COLORS[this.specialType].border : (isActive ? 'border-black' : 'border-zinc-200');
                }
                const glowClass = this.specialType ? SPECIAL_COLORS[this.specialType].glow : '';
                el.className = `word-card absolute px-3 py-1 ${bgClass} border ${borderClass} ${glowClass} text-xs tracking-wider flex items-center space-x-1 pointer-events-none transition-colors duration-200`;
                
                if (isDarkMode) {
                    el.innerHTML = `<span class="text-white underline ${colorClass}">${typed}</span><span class="text-zinc-500 ${colorClass}">${remaining}</span>`;
                } else {
                    el.innerHTML = `<span class="text-black underline ${colorClass}">${typed}</span><span class="text-zinc-400 ${colorClass}">${remaining}</span>`;
                }
            }

            updateHTML() {
                this.updateHTMLContent(this.element);
            }

            update(delta) {
                this.y += this.speed * delta * gameSpeedMultiplier;
                this.element.style.top = `${this.y}px`;
            }

            setActive(isActive) {
                this.updateHTML();
            }

            destroy() {
                if (this.element && this.element.parentNode) {
                    this.element.parentNode.removeChild(this.element);
                }
            }
        }

        function activeWordElement() {
            const word = wordsOnScreen.find(w => w.id === activeWordId);
            return word ? word.element : null;
        }

        function startGame() {
            wordsOnScreen.forEach(w => w.destroy());
            wordsOnScreen = [];
            score = 0;
            hp = 100;
            activeWordId = null;
            spawnTimer = 0;
            spawnInterval = 1800;
            gameSpeedMultiplier = 1;
            totalCharsTyped = 0;
            totalActions = 0;
            moonGravityActive = false;
            moonGravityTimer = 0;
            moonBadge.classList.add('hidden');
            gameStartTime = performance.now();
            initLandscape();
            scoreVal.textContent = score;
            hpVal.textContent = hp;
            wpmVal.textContent = 0;
            apmVal.textContent = 0;
            overlay.classList.add('hidden');
            inputField.value = '';
            inputField.focus();
            gameState = 'PLAYING';
            lastFrameTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            overlayTitle.textContent = currentLang === 'DE' ? "SYSTEM_ANGEHALTEN" : "SYSTEM_HALTED";
            overlayDesc.innerHTML = `${currentLang === 'DE' ? 'Endstand' : 'Final Score'}: <span class="text-white font-bold">${score}</span><br>${currentLang === 'DE' ? 'Getippte Zeichen' : 'Total Characters Typed'}: <span class="text-white font-bold">${totalCharsTyped}</span><br>APM: <span class="text-white font-bold">${apmVal.textContent}</span>`;
            actionBtn.textContent = currentLang === 'DE' ? "NEU_STARTEN" : "REBOOT_SYSTEM";
            overlay.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;
            const delta = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            // Moon gravity timer
            if (moonGravityActive) {
                moonGravityTimer -= delta;
                const remainingSecs = Math.max(0, Math.ceil(moonGravityTimer / 1000));
                moonTimerSpan.textContent = remainingSecs;
                if (moonGravityTimer <= 0) {
                    moonGravityActive = false;
                    moonBadge.classList.add('hidden');
                }
            }

            updateParticles(delta);
            spawnTimer += delta;
            if (spawnTimer >= spawnInterval) {
                spawnTimer = 0;
                const activeWordSet = currentLang === 'DE' ? WORDS_DE : WORDS_EN;
                const randomWord = activeWordSet[Math.floor(Math.random() * activeWordSet.length)];
                // 25% chance for special word
                const isSpecial = Math.random() < 0.25;
                const specialType = isSpecial ? getRandomSpecialType() : null;
                wordsOnScreen.push(new FallingWord(randomWord, specialType));
                if (spawnInterval > 800) spawnInterval -= 30;
                gameSpeedMultiplier += 0.005;
            }

            const playfieldHeight = playfield.clientHeight - 96 - 30;
            for (let i = wordsOnScreen.length - 1; i >= 0; i--) {
                const word = wordsOnScreen[i];
                word.update(delta);
                if (word.y >= playfieldHeight) {
                    damageLandscape(word.x + 40);
                    if (word.id === activeWordId) {
                        activeWordId = null;
                        inputField.value = '';
                    }
                    word.destroy();
                    wordsOnScreen.splice(i, 1);
                    if (hp <= 0) {
                        gameOver();
                        return;
                    }
                }
            }

            const elapsedMinutes = (timestamp - gameStartTime) / 60000;
            if (elapsedMinutes > 0) {
                const currentWpm = Math.round((totalCharsTyped / 5) / elapsedMinutes);
                const currentApm = Math.round(totalActions / elapsedMinutes);
                wpmVal.textContent = currentWpm;
                apmVal.textContent = currentApm;
            }
            requestAnimationFrame(gameLoop);
        }

        function completeWord(word) {
            // Base score
            score += word.text.length * 10;
            totalCharsTyped += word.text.length;
            scoreVal.textContent = score;

            // Handle special word effects
            if (word.specialType) {
                const color = SPECIAL_COLORS[word.specialType].text.replace('text-', '');
                const colorMap = {
                    'red-400': '#ef4444',
                    'blue-400': '#3b82f6',
                    'yellow-400': '#eab308',
                    'purple-400': '#a855f7'
                };
                const particleColor = colorMap[color] || '#fbbf24';

                switch(word.specialType) {
                    case 'red': // EXPLOSION - auto-complete nearby words
                        triggerWordExplosion(word, particleColor);
                        const blastRadius = 180;
                        const caughtWords = wordsOnScreen.filter(w => w.id !== word.id && 
                            Math.hypot(w.x - word.x, w.y - word.y) <= blastRadius);
                        caughtWords.forEach(cw => {
                            triggerWordExplosion(cw, particleColor);
                            score += cw.text.length * 10;
                            totalCharsTyped += cw.text.length;
                            cw.destroy();
                        });
                        wordsOnScreen = wordsOnScreen.filter(w => w.id === word.id || !caughtWords.includes(w));
                        scoreVal.textContent = score;
                        break;

                    case 'blue': // ELECTRIC CHAIN - complete 1 nearby normal word
                        const chainRadius = 200;
                        const chainTargets = wordsOnScreen.filter(w => w.id !== word.id && 
                            w.specialType === null && 
                            Math.hypot(w.x - word.x, w.y - word.y) <= chainRadius);
                        if (chainTargets.length > 0) {
                            const target = chainTargets[0];
                            triggerWordExplosion(target, '#60a5fa');
                            score += target.text.length * 10;
                            totalCharsTyped += target.text.length;
                            target.destroy();
                            wordsOnScreen = wordsOnScreen.filter(w => w.id !== target.id);
                            scoreVal.textContent = score;
                        }
                        break;

                    case 'yellow': // MOON GRAVITY - 5 seconds, stackable
                        triggerWordExplosion(word, particleColor);
                        moonGravityActive = true;
                        moonGravityTimer += MOON_GRAVITY_DURATION;
                        moonBadge.classList.remove('hidden');
                        break;

                    case 'rainbow': // COLOR CHANGING - auto-complete ALL words on screen
                        triggerWordExplosion(word, '#a78bfa');
                        const allWords = [...wordsOnScreen].filter(w => w.id !== word.id);
                        allWords.forEach(w => {
                            triggerWordExplosion(w, '#a78bfa');
                            score += w.text.length * 10;
                            totalCharsTyped += w.text.length;
                            w.destroy();
                        });
                        wordsOnScreen = wordsOnScreen.filter(w => w.id === word.id);
                        scoreVal.textContent = score;
                        break;
                }
            }

            word.destroy();
            wordsOnScreen = wordsOnScreen.filter(w => w.id !== word.id);
            activeWordId = null;
            inputField.value = '';
        }

        inputField.addEventListener('input', (e) => {
            if (gameState !== 'PLAYING') return;
            totalActions++;
            const val = inputField.value;

            if (!activeWordId) {
                const matchedWord = wordsOnScreen.find(w => w.text.startsWith(val) && w.typedIndex === 0);
                if (matchedWord) {
                    activeWordId = matchedWord.id;
                    matchedWord.typedIndex = val.length;
                    matchedWord.setActive(true);
                    matchedWord.updateHTML();
                    if (matchedWord.typedIndex === matchedWord.text.length) {
                        completeWord(matchedWord);
                    }
                } else {
                    inputField.value = '';
                }
            } else {
                const activeWord = wordsOnScreen.find(w => w.id === activeWordId);
                if (activeWord) {
                    if (activeWord.text.startsWith(val)) {
                        activeWord.typedIndex = val.length;
                        activeWord.updateHTML();
                        if (activeWord.typedIndex === activeWord.text.length) {
                            completeWord(activeWord);
                        }
                    } else {
                        inputField.value = activeWord.text.substring(0, activeWord.typedIndex);
                    }
                } else {
                    activeWordId = null;
                    inputField.value = '';
                }
            }
        });

        actionBtn.addEventListener('click', startGame);
        playfield.addEventListener('click', () => {
            if (gameState === 'PLAYING') inputField.focus();
        });

        window.addEventListener('resize', () => {
            const maxW = playfield.clientWidth - 150;
            wordsOnScreen.forEach(w => {
                if (w.x > maxW) w.x = Math.max(10, maxW);
                w.element.style.left = `${w.x}px`;
            });
            initLandscape();
        });

        window.addEventListener('load', initLandscape);
    </script>
</body>
