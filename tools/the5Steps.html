        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomInterval(min = 15000, max = 30000) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }

        function renderSteps() {
            const container = document.getElementById('steps-container');
            const loadingState = document.getElementById('loading-state');
            
            loadingState.classList.add('hidden');
            container.classList.remove('hidden');
            container.innerHTML = '';

            data.categories.forEach((cat, index) => {
                const randomExplanation = getRandomItem(cat.explanations);
                
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-[#0a0a0a] border border-slate-200/90 dark:border-neutral-900 rounded-2xl p-5 flex flex-col justify-between shadow-sm hover:shadow-md hover:border-indigo-500/50 dark:hover:border-indigo-500/40 transition-all duration-300 group relative overflow-hidden";
                
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl group-hover:bg-indigo-500/10 transition-all pointer-events-none"></div>
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-100 dark:border-indigo-500/25">
                                Schritt ${cat.step}
                            </span>
                            <span class="text-[10px] uppercase font-mono tracking-wider text-slate-400 dark:text-slate-500 bg-slate-50 dark:bg-black px-2 py-0.5 rounded border border-slate-200 dark:border-neutral-800">0${cat.step}</span>
                        </div>
                        <h2 class="font-bold text-slate-900 dark:text-white text-base mb-3 group-hover:text-indigo-600 dark:group-hover:text-indigo-300 transition-colors">${cat.name}</h2>
                        <div class="relative min-h-[90px] flex items-center">
                            <p id="expl-${index}" class="text-slate-700 dark:text-slate-300 text-sm leading-relaxed fade-text opacity-100">
                                "${randomExplanation}"
                            </p>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                // Start independent staggered random timer for each step card (between 15s and 30s)
                scheduleNextUpdate(index);
            });
        }

        function scheduleNextUpdate(index) {
            const randomMs = getRandomInterval(15000, 30000);
            setTimeout(() => {
                updateSingleStepText(index);
                scheduleNextUpdate(index); // Schedule subsequent updates recursively
            }, randomMs);
        }

        function updateSingleStepText(index) {
            const p = document.getElementById(`expl-${index}`);
            if (p) {
                // Phase 1: Fade out text over 1.5s
                p.style.opacity = '0';
                setTimeout(() => {
                    // Phase 2: Swap content midway
                    const cat = data.categories[index];
                    p.textContent = `"${getRandomItem(cat.explanations)}"`;
                    // Phase 3: Fade back in over 1.5s
                    p.style.opacity = '1';
                }, 1500);
            }
        }

        window.onload = function() {
            renderSteps();
        };
    </script>
