<!DOCTYPE html>
<html lang="de" class="dark">

    <script>
        tailwind.config = {
            darkMode: 'class',
        }

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .btn-hover-fx {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .dark .btn-hover-fx:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .ability-btn:not(:disabled) {
            animation: pulseGlowLight 2s infinite alternate;
        }
        .dark .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            animation: pulseGlowDark 2s infinite alternate;
        }
        @keyframes pulseGlowLight {
            from { box-shadow: 0 0 5px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            to { box-shadow: 0 0 15px rgba(59,130,246,0.5); border-color: rgba(59,130,246,0.6); }
        }
        @keyframes pulseGlowDark {
            from { box-shadow: 0 0 5px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
            to { box-shadow: 0 0 20px rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.8); }
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
        .floating-text {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .shake-screen {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flash-warning {
            animation: flashBg 0.4s ease-in-out;
        }
        @keyframes flashBg {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(234, 88, 12, 0.25); border-color: rgba(234, 88, 12, 0.8); }
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
        }

</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-200 overflow-hidden">

        let questions = [];

        let globalSeconds = 0;
        let questionTimer = null;
        let questionSecondsLeft = 45;
        let minigameTimer = null;
        let minigameTimeLeft = 0;
        let isFirstQuestion = true;
        let clusters = [];

        document.addEventListener('DOMContentLoaded', () => {
            initMenu();
        });

        function extractCategories() {
            const uniqueCats = [...new Set(rawQuestions.map(q => q.kategorie).filter(Boolean))];
            return uniqueCats.sort();
        }

        function initMenu() {
            const infoEl = document.getElementById('total-questions-info');
            if (infoEl) {
                infoEl.textContent = `📊 DATENBANK BEREIT: ${rawQuestions.length} FRAGEN`;
                infoEl.className = 'mt-6 font-mono text-xs sm:text-sm text-green-500 dark:text-green-400 tracking-wider';
            }
            
            const categories = extractCategories();
            
            clusters = categories.map(cat => ({
                items: [cat],
                displayName: cat
            }));

            const selectContainer = document.getElementById('category-select-container');
            const selectEl = document.getElementById('category-select');
            
            if (selectContainer && selectEl) {
                selectEl.innerHTML = '<option value="all">🎲 ZUFÄLLIG (ALLE KATEGORIEN)</option>';
                
                clusters.forEach((cluster, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    const count = rawQuestions.filter(q => q.kategorie === cluster.items[0]).length;
                    opt.textContent = `${cluster.displayName} (${count})`;
                    selectEl.appendChild(opt);
                });

                selectEl.removeEventListener('change', updateInfoText);
                selectEl.addEventListener('change', updateInfoText);
                selectContainer.classList.remove('hidden');
            }

            const startBtn = document.getElementById('start-btn');
            const btnText = document.getElementById('start-btn-text');
            btnText.textContent = '[ 🚀 SPIEL STARTEN ]';
            startBtn.disabled = false;
            startBtn.onclick = startGame;
        }

        function updateInfoText() {
            const selectEl = document.getElementById('category-select');
            const val = selectEl.value;
            let count = rawQuestions.length;
            let label = 'ALLE KATEGORIEN';
            if (val !== 'all') {
                const cluster = clusters[val];
                count = rawQuestions.filter(q => q.kategorie === cluster.items[0]).length;
                label = cluster.displayName;
            }
            const infoEl = document.getElementById('total-questions-info');
            infoEl.textContent = `📊 ${label}: ${count} FRAGEN GEFILTERT`;
            infoEl.className = 'mt-6 font-mono text-xs sm:text-sm text-green-500 dark:text-green-400 tracking-wider';
        }

        function startGame() {
            const selectEl = document.getElementById('category-select');
            let filtered = rawQuestions;
            if (selectEl && selectEl.value !== 'all') {
                const cluster = clusters[selectEl.value];
                filtered = rawQuestions.filter(q => q.kategorie === cluster.items[0]);
            }

            questions = [...filtered].sort(() => Math.random() - 0.5);
            if (questions.length === 0) {
                questions = [...rawQuestions].sort(() => Math.random() - 0.5);
                if (questions.length === 0) return;
            }

            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            streak = 0;
            multiplier = 1;
            globalSeconds = 0;
            isFirstQuestion = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            if (globalTimer) clearInterval(globalTimer);
            globalTimer = setInterval(() => {
                globalSeconds++;
                const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
                const secs = (globalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('global-timer').textContent = `${mins}:${secs}`;
            }, 1000);

            updateUI();
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (lives <= 0) {
                gameOver();
                return;
            }

            if (currentQuestionIndex >= questions.length) {
                questions = [...questions].sort(() => Math.random() - 0.5);
                currentQuestionIndex = 0;
            }

            if (!isFirstQuestion && Math.random() < 0.2) {
                triggerMinigame();
                return;
            }

            isFirstQuestion = false;

            const q = questions[currentQuestionIndex];
            currentQuestionIndex++;

            document.getElementById('question-panel').classList.remove('hidden');
            document.getElementById('minigame-panel').classList.add('hidden');

            document.getElementById('question-text').textContent = q.frage;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';
            answersContainer.style.opacity = '0';

            let answers = [...(q.falscheAntworten || []), q.richtigeAntwort];
            answers = answers.sort(() => Math.random() - 0.5);

            answers.forEach((ans) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-white dark:bg-slate-800/80 border border-slate-300 dark:border-slate-600 rounded-xl p-3 sm:p-4 text-sm sm:text-base transition-all duration-300 btn-hover-fx shadow-lg text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-700';
                btn.textContent = ans;
                btn.dataset.correct = (ans === q.richtigeAntwort);
                btn.onclick = () => handleAnswer(btn.dataset.correct === 'true', btn);
                answersContainer.appendChild(btn);
            });

            setTimeout(() => {
                answersContainer.style.opacity = '1';
            }, 50);

            startQuestionTimer();
            updateUI();
        }

        function startQuestionTimer() {
            if (questionTimer) clearInterval(questionTimer);
            questionSecondsLeft = 45;
            const bar = document.getElementById('question-timer-bar');
            const text = document.getElementById('question-timer-text');
            
            bar.style.width = '100%';
            bar.classList.remove('bg-red-500');
            bar.classList.add('bg-blue-500', 'dark:bg-slate-200');
            text.textContent = '45s';

            questionTimer = setInterval(() => {
                questionSecondsLeft--;
                text.textContent = `${questionSecondsLeft}s`;
                const pct = (questionSecondsLeft / 45) * 100;
                bar.style.width = `${pct}%`;

                if (questionSecondsLeft <= 10) {
                    bar.classList.remove('bg-blue-500', 'dark:bg-slate-200');
                    bar.classList.add('bg-red-500');
                }

                if (questionSecondsLeft <= 0) {
                    clearInterval(questionTimer);
                    handleAnswer(false, null, true);
                }
            }, 1000);
        }

        function handleAnswer(isCorrect, btnElement, isTimeout = false) {
            if (questionTimer) clearInterval(questionTimer);
            
            const buttons = document.querySelectorAll('#answers-container button');
            buttons.forEach(b => b.disabled = true);

            const scoreEl = document.getElementById('score-display');

            if (isCorrect) {
                streak++;
                const earned = 100 * multiplier;
                score += earned;

                scoreEl.style.transform = 'scale(1.25)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);

                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-green-100 dark:bg-slate-700 border border-green-500 dark:border-slate-400 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-green-800 dark:text-white transition-all';
                    const rect = btnElement.getBoundingClientRect();
                    spawnFloatingText(`+${earned}P`, rect.x + rect.width / 2, rect.y, '#22c55e');
                }
                
                if (streak > 0 && streak % 3 === 0 && multiplier < 5) {
                    multiplier++;
                }

                if (streak >= 5) {
                    streak = 0;
                    lives++;
                    triggerConfetti();
                    spawnFloatingText('+1 LEBEN!', window.innerWidth / 2, window.innerHeight / 2, '#22c55e');
                }
            } else {
                streak = 0;
                multiplier = 1;
                lives--;
                
                document.body.classList.add('shake-screen');
                setTimeout(() => document.body.classList.remove('shake-screen'), 300);

                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-red-100 dark:bg-slate-900 border border-red-500 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-red-800 dark:text-red-300 transition-all';
                }
                buttons.forEach(b => {
                    if (b.dataset.correct === 'true') {
                        b.className = 'w-full text-left bg-green-50 dark:bg-slate-800 border border-green-400 dark:border-slate-300 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-green-700 dark:text-slate-100 transition-all';
                    }
                });
            }

            updateUI();
            setTimeout(() => loadNextQuestion(), 1200);
        }

        function updateUI() {
            const livesDisplay = document.getElementById('lives-display');
            livesDisplay.innerHTML = '♥'.repeat(Math.max(0, lives));

            document.getElementById('score-display').textContent = score.toString().padStart(3, '0');

            const multiBadge = document.getElementById('multiplier-badge');
            if (multiplier > 1) {
                multiBadge.textContent = `x${multiplier} MULTI`;
                multiBadge.classList.remove('opacity-0', 'scale-90');
            } else {
                multiBadge.classList.add('opacity-0', 'scale-90');
            }

            const streakBars = document.querySelectorAll('#streak-bar div');
            streakBars.forEach((bar, i) => {
                if (i < streak) {
                    bar.className = "w-8 sm:w-12 rounded-full bg-blue-500 dark:bg-slate-200 shadow-[0_0_10px_rgba(59,130,246,0.8)] dark:shadow-[0_0_10px_rgba(255,255,255,0.8)] transition-colors duration-300";
                } else {
                    bar.className = "w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300";
                }
            });

            const ab1 = document.getElementById('ab-remove1');
            const ab2 = document.getElementById('ab-remove2');
            const ab3 = document.getElementById('ab-skip');

            ab1.disabled = streak < 2;
            ab1.classList.toggle('opacity-50', streak < 2);
            ab1.classList.toggle('pointer-events-none', streak < 2);

            ab2.disabled = streak < 3;
            ab2.classList.toggle('opacity-50', streak < 3);
            ab2.classList.toggle('pointer-events-none', streak < 3);

            ab3.disabled = streak < 4;
            ab3.classList.toggle('opacity-50', streak < 4);
            ab3.classList.toggle('pointer-events-none', streak < 4);
        }

        function useAbility(type) {
            const buttons = document.querySelectorAll('#answers-container button');
            const wrongButtons = Array.from(buttons).filter(b => b.dataset.correct === 'false' && !b.disabled);

            if (type === 'remove1' && streak >= 2) {
                streak -= 2;
                if (wrongButtons.length > 0) {
                    const target = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
                    target.disabled = true;
                    target.style.opacity = '0.2';
                }
            } else if (type === 'remove2' && streak >= 3) {
                streak -= 3;
                wrongButtons.slice(0, 2).forEach(b => {
                    b.disabled = true;
                    b.style.opacity = '0.2';
                });
            } else if (type === 'skip' && streak >= 4) {
                streak -= 4;
                if (questionTimer) clearInterval(questionTimer);
                spawnFloatingText('FRAGE ÜBERSPRUNGEN', window.innerWidth / 2, window.innerHeight / 2, '#3b82f6');
                loadNextQuestion();
                return;
            }
            updateUI();
        }

        function triggerMinigame() {
            if (questionTimer) clearInterval(questionTimer);
            document.getElementById('question-panel').classList.add('hidden');
            const panel = document.getElementById('minigame-panel');
            panel.classList.remove('hidden');

            panel.classList.add('flash-warning');
            setTimeout(() => panel.classList.remove('flash-warning'), 500);

            setupStratagemGame();
        }

        function startMinigameTimer(duration, onComplete) {
            minigameTimeLeft = duration;
            const timerEl = document.getElementById('minigame-timer');
            timerEl.textContent = `${minigameTimeLeft.toFixed(1)}s`;

            if (minigameTimer) clearInterval(minigameTimer);
            minigameTimer = setInterval(() => {
                minigameTimeLeft -= 0.1;
                timerEl.textContent = `${Math.max(0, minigameTimeLeft).toFixed(1)}s`;

                if (minigameTimeLeft <= 0) {
                    clearInterval(minigameTimer);
                    onComplete(false);
                }
            }, 100);
        }

        function endMinigame(success) {
            if (minigameTimer) clearInterval(minigameTimer);
            const scoreEl = document.getElementById('score-display');
            window.onkeydown = null;

            if (success) {
                const bonus = 250 * multiplier;
                score += bonus;
                scoreEl.style.transform = 'scale(1.25)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);

                triggerConfetti();
                spawnFloatingText(`+${bonus}P (AUFGABE GELÖST)`, window.innerWidth / 2, window.innerHeight / 2, '#22c55e');
            } else {
                lives--;
                document.body.classList.add('shake-screen');
                setTimeout(() => document.body.classList.remove('shake-screen'), 300);
                spawnFloatingText('AUFGABE FEHLGESCHLAGEN (-1 LEBEN)', window.innerWidth / 2, window.innerHeight / 2, '#ef4444');
            }
            updateUI();
            setTimeout(() => loadNextQuestion(), 1000);
        }

        let stratSequence = [];
        let stratIndex = 0;
        const stratArrows = { 'UP': '▲', 'DOWN': '▼', 'LEFT': '◀', 'RIGHT': '▶' };
        const stratKeys = ['UP', 'DOWN', 'LEFT', 'RIGHT'];

        function setupStratagemGame() {
            document.getElementById('minigame-title').textContent = "STRATAGEM EINGABE";
            
            stratSequence = [];
            for (let i = 0; i < 5; i++) {
                stratSequence.push(stratKeys[Math.floor(Math.random() * stratKeys.length)]);
            }
            stratIndex = 0;

            renderStratagemUI();
            startMinigameTimer(14.0, (res) => endMinigame(res));

            window.onkeydown = (e) => {
                if (document.getElementById('minigame-panel').classList.contains('hidden')) return;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') handleStratInput('UP');
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleStratInput('DOWN');
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleStratInput('LEFT');
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleStratInput('RIGHT');
            };
        }

        function renderStratagemUI() {
            const content = document.getElementById('minigame-content');
            let sequenceHTML = stratSequence.map((dir, i) => {
                if (i < stratIndex) {
                    return `<div class="w-8 h-8 border border-slate-400 flex items-center justify-center text-slate-800 rounded text-lg bg-slate-200 shadow-[0_0_10px_rgba(255,255,255,0.6)]">${stratArrows[dir]}</div>`;
                } else if (i === stratIndex) {
                    return `<div class="w-8 h-8 border-2 border-blue-500 dark:border-white flex items-center justify-center text-blue-600 dark:text-white rounded text-lg bg-blue-100 dark:bg-slate-800 animate-pulse">${stratArrows[dir]}</div>`;
                } else {
                    return `<div class="w-8 h-8 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-400 dark:text-slate-500 rounded text-lg bg-slate-100 dark:bg-slate-900">${stratArrows[dir]}</div>`;
                }
            }).join('');

            content.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full gap-4 w-full">
                    <div class="flex gap-2 mb-2">${sequenceHTML}</div>
                    <div class="grid grid-cols-3 gap-2 w-36 mx-auto">
                        <div class="col-start-2"><button onclick="handleStratInput('UP')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▲</button></div>
                        <div class="col-start-1 row-start-2"><button onclick="handleStratInput('LEFT')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">◀</button></div>
                        <div class="col-start-2 row-start-2"><button onclick="handleStratInput('DOWN')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▼</button></div>
                        <div class="col-start-3 row-start-2"><button onclick="handleStratInput('RIGHT')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▶</button></div>
                    </div>
                </div>
            `;
        }

        function handleStratInput(dir) {
            if (document.getElementById('minigame-panel').classList.contains('hidden')) return;
            if (dir === stratSequence[stratIndex]) {
                stratIndex++;
                renderStratagemUI();
                if (stratIndex === stratSequence.length) {
                    window.onkeydown = null;
                    endMinigame(true);
                }
            } else {
                stratIndex = 0;
                renderStratagemUI();
            }
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 6 + 4,
                    color: ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7'][Math.floor(Math.random() * 5)],
                    alpha: 1
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.alpha -= 0.015;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();

        function spawnFloatingText(text, x, y, color = '#ffffff') {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function gameOver() {
            if (globalTimer) clearInterval(globalTimer);
            if (questionTimer) clearInterval(questionTimer);
            if (minigameTimer) clearInterval(minigameTimer);
            window.onkeydown = null;

            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('flex');
            document.getElementById('final-score').textContent = score.toString().padStart(3, '0');
        }
    </script>
</body>
</html>
