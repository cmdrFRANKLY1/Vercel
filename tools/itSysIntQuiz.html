<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT SysInfo Roguelite Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .btn-hover-fx {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: rgba(96, 165, 250, 0.8);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 5px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            to { box-shadow: 0 0 20px rgba(59,130,246,0.6); border-color: rgba(96,165,250,0.8); }
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
        .floating-text {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950 text-slate-200 overflow-hidden">
    
    <canvas id="confetti-canvas"></canvas>

    <div class="relative z-10 w-full max-w-4xl p-2 sm:p-6 h-full flex flex-col hide-scrollbar overflow-y-auto overflow-x-hidden mx-auto">
        
        <!-- Start Screen -->
        <div id="start-screen" class="relative text-center flex flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-mono font-bold mb-4 sm:mb-6 tracking-widest uppercase border-b border-slate-700 pb-4 sm:pb-6 inline-block text-white">
                SYS_INFO<br/><span class="text-2xl sm:text-3xl text-slate-400">ROGUELITE</span>
            </h1>
            
            <div class="mt-4 mb-8 w-full max-w-xs mx-auto">
                <label for="category-select" class="block text-slate-400 font-mono text-xs mb-2 tracking-widest">KATEGORIE AUSWÄHLEN</label>
                <select id="category-select" class="w-full bg-slate-900 border border-slate-600 text-white rounded-xl p-3 font-mono text-sm focus:outline-none focus:border-slate-400 transition-colors shadow-inner cursor-pointer text-center">
                    <option value="all">ZUFÄLLIG (ALLE)</option>
                    <!-- Kategorien werden hier injiziert -->
                </select>
            </div>

            <button id="start-btn" onclick="startGame()" class="font-sans font-bold rounded-xl border border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg">
                [ START ]
            </button>
            <div id="total-questions-info" class="mt-6 font-mono text-xs sm:text-sm text-slate-400 tracking-wider">DATENBANK: 250 FRAGEN GELADEN</div>
        </div>

        <!-- Game Screen -->
        <div id="game-ui" class="w-full flex-col min-h-full h-auto hidden py-4 sm:py-8">
            
            <!-- Top HUD -->
            <div class="flex justify-between items-start mb-4 sm:mb-6 font-mono tracking-widest uppercase shrink-0">
                <div class="flex flex-col gap-2 sm:gap-3">
                    <div class="flex items-center gap-3 sm:gap-6">
                        <div id="lives-display" class="flex gap-1 sm:gap-2 text-xl sm:text-2xl drop-shadow-md text-red-500">
                            <!-- Hearts injected here -->
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-slate-500 text-[10px] sm:text-xs">SYS_ZEIT</span>
                            <span id="global-timer" class="text-slate-300 font-mono text-base sm:text-lg drop-shadow-md">00:00</span>
                        </div>
                    </div>
                </div>
                <div class="text-right flex flex-col gap-1 sm:gap-2 glass-panel px-4 py-2 sm:px-6 sm:py-3 rounded-2xl relative">
                    <div id="multiplier-badge" class="absolute -top-3 -left-4 bg-blue-600 border border-blue-400 text-white text-[9px] sm:text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-[0_0_10px_rgba(37,99,235,0.8)] transition-all opacity-0 scale-90">x1 MULTI</div>
                    <div id="score-display" class="text-xl sm:text-3xl font-bold text-white transition-transform origin-right">000</div>
                    <div class="text-[10px] sm:text-xs text-slate-400">PUNKTE</div>
                </div>
            </div>

            <!-- Main Question Area -->
            <div class="flex-grow flex flex-col justify-center max-w-3xl mx-auto w-full min-h-0">
                
                <!-- Abilities HUD -->
                <div id="abilities-hud" class="mb-4 flex flex-col items-center shrink-0 w-full">
                    <div class="text-[10px] sm:text-xs font-mono tracking-widest text-slate-400 mb-2">STREAK-ENERGIE</div>
                        
                        <!-- Streak Progress Bar -->
                        <div class="flex gap-1 sm:gap-2 mb-3 sm:mb-4 h-2 sm:h-3" id="streak-bar">
                            <div class="w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300"></div>
                        </div>

                        <!-- Ability Buttons -->
                        <div class="flex gap-1 sm:gap-3 w-full justify-center font-mono text-xs sm:text-sm">
                            <button onclick="useAbility('remove1')" id="ab-remove1" disabled class="ability-btn flex-1 max-w-[140px] bg-slate-800 border border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50">
                                <span class="text-[8px] sm:text-[10px] text-slate-400">KOSTEN 2</span>
                                <span class="font-bold text-slate-100 text-[10px] sm:text-base">-1 FALSCH</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 1 falsche Antwort</span>
                            </button>
                            <button onclick="useAbility('remove2')" id="ab-remove2" disabled class="ability-btn flex-1 max-w-[140px] bg-slate-800 border border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50">
                                <span class="text-[8px] sm:text-[10px] text-slate-400">KOSTEN 3</span>
                                <span class="font-bold text-slate-100 text-[10px] sm:text-base">50 / 50</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 2 falsche Antworten</span>
                            </button>
                            <button onclick="useAbility('skip')" id="ab-skip" disabled class="ability-btn flex-1 max-w-[140px] bg-slate-800 border border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50">
                                <span class="text-[8px] sm:text-[10px] text-slate-400">KOSTEN 4</span>
                                <span class="font-bold text-slate-100 text-[10px] sm:text-base">ÜBERSPRINGEN</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Frage sicher überspringen</span>
                            </button>
                        </div>
                    </div>

                    <div id="question-panel" class="glass-panel p-4 sm:p-8 lg:p-10 rounded-2xl sm:rounded-3xl shadow-xl w-full flex-grow flex flex-col">
                        
                        <!-- Question Timer -->
                        <div class="mb-4 sm:mb-6 flex flex-col gap-2 shrink-0">
                            <div class="flex justify-between text-[10px] sm:text-xs font-mono text-slate-400 tracking-widest">
                                <span>ZEITLIMIT</span>
                                <span id="question-timer-text">30s</span>
                            </div>
                            <div class="w-full bg-slate-900/80 h-1.5 rounded-full overflow-hidden border border-slate-700/50">
                                <div id="question-timer-bar" class="h-full bg-blue-400 w-full shadow-[0_0_10px_rgba(96,165,250,0.5)]" style="transition: width 1s linear, background-color 0.3s ease;"></div>
                            </div>
                        </div>

                        <!-- Question Container -->
                        <div class="mb-6 sm:mb-8 min-h-[60px] sm:min-h-[80px] flex items-center shrink-0">
                            <h2 id="question-text" class="text-lg sm:text-xl lg:text-2xl leading-relaxed tracking-wide text-white font-semibold"></h2>
                        </div>

                        <!-- Answers Container -->
                        <div id="answers-container" class="grid grid-cols-1 gap-2 sm:gap-4 opacity-0 transition-opacity duration-500 pb-2 sm:pb-4 flex-grow content-center">
                            <!-- Buttons injected via JS -->
                        </div>
                    </div>

                    <!-- Minigame Panel -->
                    <div id="minigame-panel" class="hidden glass-panel p-4 sm:p-10 rounded-2xl sm:rounded-3xl shadow-xl w-full border-orange-500/50 border-2 bg-orange-950/20 my-auto">
                        <div class="text-orange-400 font-mono text-xs sm:text-sm tracking-widest mb-4 animate-pulse border-b border-orange-500/30 pb-2 flex items-center gap-2">
                            <span>⚠️</span> SYSTEM-OVERRIDE // DRINGENDE AUFGABE
                        </div>
                        <div class="flex justify-between items-center mb-4 sm:mb-6">
                            <h2 id="minigame-title" class="text-lg sm:text-2xl text-white font-bold tracking-wide">TASK_NAME</h2>
                            <div id="minigame-timer" class="text-orange-400 font-mono text-lg sm:text-2xl shadow-[0_0_10px_rgba(234,88,12,0.5)] px-3 py-1 bg-slate-900 rounded-lg">8.0s</div>
                        </div>
                        <div id="minigame-content" class="w-full h-48 sm:h-56 relative bg-slate-950 rounded-xl overflow-hidden border border-slate-700 shadow-inner">
                            <!-- Content -->
                        </div>
                    </div>

                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden text-center flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
                <h1 class="text-4xl sm:text-6xl lg:text-7xl font-mono font-bold mb-4 sm:mb-6 tracking-widest text-red-500 drop-shadow-lg">SYSTEMAUSFALL</h1>
                <p class="text-lg sm:text-2xl mb-2 font-mono tracking-widest text-slate-400">ENDSTAND</p>
                <p id="final-score" class="text-5xl sm:text-8xl font-bold mb-8 sm:mb-12 font-mono text-white">000</p>
                
                <button onclick="startGame()" class="font-sans font-bold rounded-xl border border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg">
                    [ SYSTEM NEU STARTEN ]
                </button>
            </div>
        </div>
    </div>

    <script>
        const rawQuestions = [
          {
            "id": 1,
            "frage": "Welche Aufgabe hat ein DHCP-Server?",
            "richtigeAntwort": "Er vergibt automatisch IP-Konfigurationen an Clients.",
            "falscheAntworten": [
              "Er übersetzt Domainnamen in IP-Adressen.",
              "Er verschlüsselt sämtliche Netzwerkpakete.",
              "Er speichert Webseiten für Benutzer."
            ],
            "kategorie": "Netzwerke",
            "schwierigkeit": "leicht"
          },
          {
            "id": 2,
            "frage": "Welche Aufgabe hat ein DNS-Server?",
            "richtigeAntwort": "Er löst Domainnamen in IP-Adressen auf.",
            "falscheAntworten": [
              "Er vergibt automatisch MAC-Adressen.",
              "Er verschlüsselt Festplatten.",
              "Er verteilt Arbeitsspeicher an Clients."
            ],
            "kategorie": "Netzwerke",
            "schwierigkeit": "leicht"
          },
          {
            "id": 3,
            "frage": "Welche IP-Adresse gehört zum privaten IPv4-Netz 192.168.0.0/16?",
            "richtigeAntwort": "192.168.10.25",
            "falscheAntworten": [
              "8.8.8.8",
              "172.300.10.1",
              "200.100.50.1"
            ],
            "kategorie": "Netzwerke",
            "schwierigkeit": "leicht"
          },
          {
            "id": 4,
            "frage": "Wie viele Bits besitzt eine IPv4-Adresse?",
            "richtigeAntwort": "32 Bit",
            "falscheAntworten": [
              "16 Bit",
              "64 Bit",
              "128 Bit"
            ],
            "kategorie": "Netzwerke",
            "schwierigkeit": "leicht"
          },
          {
            "id": 5,
            "frage": "Wie viele Bits besitzt eine IPv6-Adresse?",
            "richtigeAntwort": "128 Bit",
            "falscheAntworten": [
              "32 Bit",
              "64 Bit",
              "256 Bit"
            ],
            "kategorie": "Netzwerke",
            "schwierigkeit": "leicht"
          }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let streak = 0;
        let multiplier = 1;
        let globalTimer = null;
        let globalSeconds = 0;
        let questionTimer = null;
        let questionSecondsLeft = 30;
        let minigameActive = false;
        let minigameTimer = null;
        let minigameTimeLeft = 0;
        let isFirstQuestion = true;

        // Kategorien laden und Anzeige der Gesamtfragen aktualisieren
        document.addEventListener('DOMContentLoaded', () => {
            const selectEl = document.getElementById('category-select');
            
            // Einzigartige Kategorien extrahieren und alphabetisch sortieren
            const categories = [...new Set(rawQuestions.map(q => q.kategorie))].sort();
            
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat.toUpperCase();
                selectEl.appendChild(option);
            });

            const infoEl = document.getElementById('total-questions-info');
            
            function updateInfoText() {
                const selectedCat = selectEl.value;
                let count = rawQuestions.length;
                if (selectedCat !== 'all') {
                    count = rawQuestions.filter(q => q.kategorie === selectedCat).length;
                }
                if (infoEl) {
                    infoEl.textContent = `DATENBANK: ${count} FRAGEN BEREIT`;
                }
            }

            // Initiale Aktualisierung
            updateInfoText();

            // Aktualisierung bei Änderung des Dropdowns
            selectEl.addEventListener('change', updateInfoText);
        });

        // Konfetti-System
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12,
                    size: Math.random() * 6 + 4,
                    color: ['#60a5fa', '#34d399', '#f43f5e', '#fbbf24', '#a855f7'][Math.floor(Math.random() * 5)],
                    alpha: 1
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4; // gravity
                p.alpha -= 0.015;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();

        function spawnFloatingText(text, x, y, color = '#ffffff') {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function startGame() {
            const selectedCat = document.getElementById('category-select').value;
            let filteredQuestions = rawQuestions;
            
            // Fragen nach Kategorie filtern, falls ausgewählt
            if (selectedCat !== 'all') {
                filteredQuestions = rawQuestions.filter(q => q.kategorie === selectedCat);
            }

            questions = [...filteredQuestions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            streak = 0;
            multiplier = 1;
            globalSeconds = 0;
            isFirstQuestion = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            if (globalTimer) clearInterval(globalTimer);
            globalTimer = setInterval(() => {
                globalSeconds++;
                const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
                const secs = (globalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('global-timer').textContent = `${mins}:${secs}`;
            }, 1000);

            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (lives <= 0) {
                gameOver();
                return;
            }

            if (currentQuestionIndex >= questions.length) {
                questions = [...rawQuestions].sort(() => Math.random() - 0.5);
                currentQuestionIndex = 0;
            }

            // 20% Chance for a Minigame before question
            if (Math.random() < 0.2) {
                triggerMinigame();
                return;
            }

            const q = questions[currentQuestionIndex];
            currentQuestionIndex++;

            document.getElementById('question-panel').classList.remove('hidden');
            document.getElementById('minigame-panel').classList.add('hidden');

            document.getElementById('question-text').textContent = q.frage;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';
            answersContainer.style.opacity = '0';

            let answers = [...q.falscheAntworten, q.richtigeAntwort];
            answers = answers.sort(() => Math.random() - 0.5);

            answers.forEach((ans) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-slate-800/80 border border-slate-600 rounded-xl p-3 sm:p-5 text-sm sm:text-base transition-all duration-300 btn-hover-fx shadow-lg text-slate-100 hover:bg-slate-700';
                btn.textContent = ans;
                btn.dataset.correct = (ans === q.richtigeAntwort);
                btn.onclick = () => handleAnswer(btn.dataset.correct === 'true', btn);
                answersContainer.appendChild(btn);
            });

            setTimeout(() => {
                answersContainer.style.opacity = '1';
            }, 50);

            startQuestionTimer();
            updateUI();
        }

        function startQuestionTimer() {
            if (questionTimer) clearInterval(questionTimer);
            questionSecondsLeft = 30;
            const bar = document.getElementById('question-timer-bar');
            const text = document.getElementById('question-timer-text');
            
            bar.style.width = '100%';
            bar.style.backgroundColor = '#60a5fa';
            text.textContent = '30s';

            questionTimer = setInterval(() => {
                questionSecondsLeft--;
                text.textContent = `${questionSecondsLeft}s`;
                const pct = (questionSecondsLeft / 30) * 100;
                bar.style.width = `${pct}%`;

                if (questionSecondsLeft <= 10) {
                    bar.style.backgroundColor = '#f43f5e';
                }

                if (questionSecondsLeft <= 0) {
                    clearInterval(questionTimer);
                    handleAnswer(false, null, true); // Timeout
                }
            }, 1000);
        }

        function handleAnswer(isCorrect, btnElement, isTimeout = false) {
            if (questionTimer) clearInterval(questionTimer);
            
            const buttons = document.querySelectorAll('#answers-container button');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                streak++;
                score += 100 * multiplier;
                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-green-900/60 border border-green-500 rounded-xl p-3 sm:p-5 text-sm sm:text-base shadow-lg text-green-200 transition-all';
                    const rect = btnElement.getBoundingClientRect();
                    spawnFloatingText(`+${100 * multiplier}P`, rect.x + rect.width / 2, rect.y, '#34d399');
                }
                
                // Multiplier check (every 3 streak)
                if (streak > 0 && streak % 3 === 0 && multiplier < 5) {
                    multiplier++;
                }

                if (streak >= 5) {
                    streak = 0;
                    lives++;
                    triggerConfetti();
                    spawnFloatingText('+1 LEBEN!', window.innerWidth / 2, window.innerHeight / 2, '#f43f5e');
                }
            } else {
                streak = 0;
                multiplier = 1;
                lives--;
                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-red-900/60 border border-red-500 rounded-xl p-3 sm:p-5 text-sm sm:text-base shadow-lg text-red-200 transition-all';
                }
                // Highlight correct answer
                buttons.forEach(b => {
                    if (b.dataset.correct === 'true') {
                        b.className = 'w-full text-left bg-green-900/40 border border-green-600 rounded-xl p-3 sm:p-5 text-sm sm:text-base shadow-lg text-green-300 transition-all';
                    }
                });
            }

            updateUI();

            setTimeout(() => {
                loadNextQuestion();
            }, 1200);
        }

        function updateUI() {
            const livesDisplay = document.getElementById('lives-display');
            livesDisplay.innerHTML = '♥'.repeat(Math.max(0, lives));

            document.getElementById('score-display').textContent = score.toString().padStart(3, '0');

            const multiBadge = document.getElementById('multiplier-badge');
            if (multiplier > 1) {
                multiBadge.textContent = `x${multiplier} MULTI`;
                multiBadge.classList.remove('opacity-0', 'scale-90');
            } else {
                multiBadge.classList.add('opacity-0', 'scale-90');
            }

            const streakBars = document.querySelectorAll('#streak-bar div');
            streakBars.forEach((bar, i) => {
                if (i < streak) {
                    bar.className = "w-8 sm:w-12 rounded-full bg-blue-400 shadow-[0_0_10px_#60a5fa] transition-colors duration-300";
                } else {
                    bar.className = "w-8 sm:w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300";
                }
            });

            // Abilities availability
            const ab1 = document.getElementById('ab-remove1');
            const ab2 = document.getElementById('ab-remove2');
            const ab3 = document.getElementById('ab-skip');

            const prevAb1State = !ab1.disabled;
            const prevAb2State = !ab2.disabled;
            const prevAb3State = !ab3.disabled;

            ab1.disabled = streak < 2;
            ab1.classList.toggle('opacity-50', streak < 2);
            if (!prevAb1State && streak >= 2) spawnFloatingText('FÄHIGKEIT FREIGESCHALTET!', window.innerWidth / 2 - 100, 150, '#60a5fa');

            ab2.disabled = streak < 3;
            ab2.classList.toggle('opacity-50', streak < 3);
            if (!prevAb2State && streak >= 3) spawnFloatingText('FÄHIGKEIT FREIGESCHALTET!', window.innerWidth / 2, 150, '#60a5fa');

            ab3.disabled = streak < 4;
            ab3.classList.toggle('opacity-50', streak < 4);
            if (!prevAb3State && streak >= 4) spawnFloatingText('FÄHIGKEIT FREIGESCHALTET!', window.innerWidth / 2 + 100, 150, '#60a5fa');
        }

        function useAbility(type) {
            const buttons = document.querySelectorAll('#answers-container button');
            const wrongButtons = Array.from(buttons).filter(b => b.dataset.correct === 'false' && !b.disabled);

            if (type === 'remove1' && streak >= 2) {
                streak -= 2;
                if (wrongButtons.length > 0) {
                    const target = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
                    target.disabled = true;
                    target.style.opacity = '0.2';
                }
            } else if (type === 'remove2' && streak >= 3) {
                streak -= 3;
                wrongButtons.slice(0, 2).forEach(b => {
                    b.disabled = true;
                    b.style.opacity = '0.2';
                });
            } else if (type === 'skip' && streak >= 4) {
                streak -= 4;
                if (questionTimer) clearInterval(questionTimer);
                spawnFloatingText('FRAGE ÜBERSPRUNGEN', window.innerWidth / 2, window.innerHeight / 2, '#fbbf24');
                loadNextQuestion();
                return;
            }
            updateUI();
        }

        function triggerMinigame() {
            if (questionTimer) clearInterval(questionTimer);
            document.getElementById('question-panel').classList.add('hidden');
            const panel = document.getElementById('minigame-panel');
            panel.classList.remove('hidden');

            const minigames = [setupWiresGame, setupShieldsGame, setupStratagemGame];
            const chosen = minigames[Math.floor(Math.random() * minigames.length)];
            chosen();
        }

        function startMinigameTimer(duration, onComplete) {
            minigameTimeLeft = duration;
            const timerEl = document.getElementById('minigame-timer');
            timerEl.textContent = `${minigameTimeLeft.toFixed(1)}s`;

            if (minigameTimer) clearInterval(minigameTimer);
            minigameTimer = setInterval(() => {
                minigameTimeLeft -= 0.1;
                timerEl.textContent = `${Math.max(0, minigameTimeLeft).toFixed(1)}s`;

                if (minigameTimeLeft <= 0) {
                    clearInterval(minigameTimer);
                    onComplete(false);
                }
            }, 100);
        }

        function endMinigame(success) {
            if (minigameTimer) clearInterval(minigameTimer);
            if (success) {
                score += 250 * multiplier;
                triggerConfetti();
                spawnFloatingText(`+${250 * multiplier}P (TASK ERFOLGREICH)`, window.innerWidth / 2, window.innerHeight / 2, '#34d399');
            } else {
                lives--;
                spawnFloatingText('TASK FEHLGESCHLAGEN (-1 LEBEN)', window.innerWidth / 2, window.innerHeight / 2, '#f43f5e');
            }
            updateUI();
            setTimeout(() => {
                loadNextQuestion();
            }, 1000);
        }

        // Minigame 1: Wires
        let wireColors = ['#f43f5e', '#3b82f6', '#22c55e', '#eab308'];
        let wiresLeft = [], wiresRight = [], selectedLeft = null, matchedCount = 0;

        function setupWiresGame() {
            document.getElementById('minigame-title').textContent = "KABEL VERBINDEN";
            const content = document.getElementById('minigame-content');
            
            wiresLeft = [...wireColors].sort(() => Math.random() - 0.5);
            wiresRight = [...wireColors].sort(() => Math.random() - 0.5);
            selectedLeft = null;
            matchedCount = 0;

            let html = `<div class="flex justify-between items-center h-full px-4 sm:px-16 relative"><div class="flex flex-col justify-around h-full py-3" id="wires-left">`;
            wiresLeft.forEach((col, i) => {
                html += `<button onclick="selectWireLeft('${col}', this)" class="w-10 h-10 rounded-full border-2 border-slate-600 flex items-center justify-center shadow-lg" style="background:${col}"></button>`;
            });
            html += `</div><div class="flex flex-col justify-around h-full py-3" id="wires-right">`;
            wiresRight.forEach((col, i) => {
                html += `<button onclick="selectWireRight('${col}', this)" class="w-10 h-10 rounded-full border-2 border-slate-600 flex items-center justify-center shadow-lg" style="background:${col}"></button>`;
            });
            html += `</div></div>`;
            content.innerHTML = html;

            startMinigameTimer(8.0, (res) => endMinigame(res));
        }

        function selectWireLeft(col, el) {
            document.querySelectorAll('#wires-left button').forEach(b => b.classList.remove('ring-4', 'ring-white'));
            el.classList.add('ring-4', 'ring-white');
            selectedLeft = col;
        }

        function selectWireRight(col, el) {
            if (!selectedLeft) return;
            if (selectedLeft === col) {
                el.style.opacity = '0.2';
                el.disabled = true;
                // find corresponding left
                document.querySelectorAll('#wires-left button').forEach(b => {
                    if (b.style.backgroundColor === selectedLeft || b.style.background === selectedLeft) {
                        b.style.opacity = '0.2';
                        b.disabled = true;
                    }
                });
                matchedCount++;
                selectedLeft = null;
                if (matchedCount === 4) {
                    endMinigame(true);
                }
            } else {
                selectedLeft = null;
                document.querySelectorAll('#wires-left button').forEach(b => b.classList.remove('ring-4', 'ring-white'));
            }
        }

        // Minigame 2: Shields
        let shieldsNodes = [];
        function setupShieldsGame() {
            document.getElementById('minigame-title').textContent = "SCHILDE PRIMEN";
            const content = document.getElementById('minigame-content');
            shieldsNodes = [false, false, false, false, false, false];

            let html = `<div class="grid grid-cols-3 gap-3 h-full p-6 place-items-center">`;
            shieldsNodes.forEach((active, i) => {
                const isActive = Math.random() < 0.6;
                shieldsNodes[i] = isActive;
                const bg = isActive ? 'bg-red-500 shadow-[0_0_15px_#ef4444]' : 'bg-slate-800 border border-slate-600';
                html += `<button id="shield-${i}" onclick="toggleShield(${i})" class="w-16 h-16 rounded-xl ${bg} transition-all flex items-center justify-center font-mono text-white font-bold">${isActive ? '⚡' : '✓'}</button>`;
            });
            html += `</div>`;
            content.innerHTML = html;

            startMinigameTimer(6.0, (res) => endMinigame(res));
        }

        function toggleShield(i) {
            shieldsNodes[i] = false;
            const btn = document.getElementById(`shield-${i}`);
            btn.className = "w-16 h-16 rounded-xl bg-slate-800 border border-slate-600 transition-all flex items-center justify-center font-mono text-white font-bold";
            btn.textContent = "✓";

            if (shieldsNodes.every(n => !n)) {
                endMinigame(true);
            }
        }

        // Minigame 3: Helldivers Stratagem
        let stratSequence = [];
        let stratIndex = 0;
        const stratArrows = { 'UP': '▲', 'DOWN': '▼', 'LEFT': '◀', 'RIGHT': '▶' };
        const stratKeys = ['UP', 'DOWN', 'LEFT', 'RIGHT'];

        function setupStratagemGame() {
            document.getElementById('minigame-title').textContent = "STRATAGEM EINGABE";
            const content = document.getElementById('minigame-content');
            
            stratSequence = [];
            for (let i = 0; i < 5; i++) {
                stratSequence.push(stratKeys[Math.floor(Math.random() * stratKeys.length)]);
            }
            stratIndex = 0;

            renderStratagemUI();
            startMinigameTimer(7.0, (res) => endMinigame(res));
        }

        function renderStratagemUI() {
            const content = document.getElementById('minigame-content');
            let sequenceHTML = stratSequence.map((dir, i) => {
                if (i < stratIndex) {
                    return `<div class="w-8 h-8 border border-green-400 flex items-center justify-center text-white rounded text-lg bg-green-600 shadow-[0_0_10px_#22c55e]">${stratArrows[dir]}</div>`;
                } else if (i === stratIndex) {
                    return `<div class="w-8 h-8 border-2 border-yellow-400 flex items-center justify-center text-yellow-400 rounded text-lg bg-slate-800 animate-pulse">${stratArrows[dir]}</div>`;
                } else {
                    return `<div class="w-8 h-8 border border-slate-700 flex items-center justify-center text-slate-600 rounded text-lg bg-slate-900">${stratArrows[dir]}</div>`;
                }
            }).join('');

            content.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full gap-4 w-full">
                    <div class="flex gap-2 mb-2">${sequenceHTML}</div>
                    <div class="grid grid-cols-3 gap-2 w-36 mx-auto">
                        <div class="col-start-2"><button onclick="handleStratInput('UP')" class="w-10 h-10 bg-slate-800 border border-slate-600 rounded-lg shadow hover:bg-slate-700 text-white text-lg">▲</button></div>
                        <div class="col-start-1 row-start-2"><button onclick="handleStratInput('LEFT')" class="w-10 h-10 bg-slate-800 border border-slate-600 rounded-lg shadow hover:bg-slate-700 text-white text-lg">◀</button></div>
                        <div class="col-start-2 row-start-2"><button onclick="handleStratInput('DOWN')" class="w-10 h-10 bg-slate-800 border border-slate-600 rounded-lg shadow hover:bg-slate-700 text-white text-lg">▼</button></div>
                        <div class="col-start-3 row-start-2"><button onclick="handleStratInput('RIGHT')" class="w-10 h-10 bg-slate-800 border border-slate-600 rounded-lg shadow hover:bg-slate-700 text-white text-lg">▶</button></div>
                    </div>
                </div>
            `;
        }

        function handleStratInput(dir) {
            if (dir === stratSequence[stratIndex]) {
                stratIndex++;
                renderStratagemUI();
                if (stratIndex === stratSequence.length) {
                    endMinigame(true);
                }
            } else {
                stratIndex = 0; // reset sequence on mistake
                renderStratagemUI();
            }
        }

        function gameOver() {
            if (globalTimer) clearInterval(globalTimer);
            if (questionTimer) clearInterval(questionTimer);
            if (minigameTimer) clearInterval(minigameTimer);

            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('flex');
            document.getElementById('final-score').textContent = score.toString().padStart(3, '0');
        }
    </script>
</body>
</html>
