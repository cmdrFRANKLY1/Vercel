<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Minigame Hub</title>
    <style>
        /* ===== THEMES ===== */
        :root {
            --bg-primary: #f0f4f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-game: #f8fafc;
            --bg-input: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #6b7f99;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --shadow-color: rgba(0,0,0,0.04);
            --shadow-hover: rgba(0,0,0,0.12);
            --cell-bg: #ffffff;
            --cell-border: #d1d5db;
            --cell-correct: #10b981;
            --cell-present: #f59e0b;
            --cell-absent: #6b7280;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: #0d0d0d;
            --bg-game: #1a1a1a;
            --bg-input: #1a1a1a;
            --text-primary: #e5e5e5;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --border-color: #262626;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --shadow-color: rgba(0,0,0,0.4);
            --shadow-hover: rgba(0,0,0,0.6);
            --cell-bg: #1a1a1a;
            --cell-border: #404040;
            --cell-correct: #10b981;
            --cell-present: #f59e0b;
            --cell-absent: #4a4a4a;
        }

        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 2rem 1.5rem;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 1.25rem;
        }
        .header h1 {
            font-weight: 700;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header h1 i { color: var(--accent-color); }
        .header-right {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .toggle-group {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border-color);
        }
        .toggle-btn {
            background: transparent;
            border: none;
            padding: 0.4rem 0.9rem;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .toggle-btn i { font-size: 0.9rem; }
        .toggle-btn.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .toggle-btn:hover:not(.active) { background: var(--bg-game); }

        /* ===== GAME GRID ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        /* ===== GAME CARD ===== */
        .game-card {
            background: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 8px 24px var(--shadow-color);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s, box-shadow 0.2s;
            position: relative;
        }
        .game-card:hover {
            box-shadow: 0 16px 40px -12px var(--shadow-hover);
            border-color: var(--accent-color);
        }
        .game-card .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            line-height: 1;
            padding: 0 4px;
        }
        .game-card .close-btn:hover {
            color: var(--error-color);
            transform: scale(1.2);
        }
        .game-card h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 30px;
        }
        .game-card h2 i { color: var(--accent-color); }

        /* ===== INPUT GAME (was: Strategem Minigame) ===== */
        .input-game .display-text {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            padding: 1.5rem;
            background: var(--bg-game);
            border-radius: 16px;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-color);
        }
        .input-game .input-area {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .input-game .input-area input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
            min-width: 150px;
        }
        .input-game .input-area input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .input-game .input-area button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-game .input-area button:hover { background: var(--accent-hover); }
        .input-game .score {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* ===== TYPE QUICKLY ===== */
        .type-game .word-display {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            padding: 1.5rem;
            background: var(--bg-game);
            border-radius: 16px;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-color);
        }
        .type-game .type-input {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .type-game .type-input input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
            min-width: 150px;
        }
        .type-game .type-input input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .type-game .type-input button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .type-game .type-input button:hover { background: var(--accent-hover); }
        .type-game .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .type-game .stats span { display: flex; align-items: center; gap: 5px; }
        .type-game .stats i { color: var(--accent-color); }

        /* ===== WORDLE ===== */
        .wordle-game .wordle-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 0 auto 1rem;
        }
        .wordle-game .wordle-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--cell-bg);
            border: 2px solid var(--cell-border);
            border-radius: 8px;
            transition: 0.2s;
            color: var(--text-primary);
        }
        .wordle-game .wordle-cell.correct {
            background: var(--cell-correct);
            border-color: var(--cell-correct);
            color: white;
        }
        .wordle-game .wordle-cell.present {
            background: var(--cell-present);
            border-color: var(--cell-present);
            color: white;
        }
        .wordle-game .wordle-cell.absent {
            background: var(--cell-absent);
            border-color: var(--cell-absent);
            color: white;
        }
        .wordle-game .wordle-cell.filled {
            border-color: var(--text-secondary);
        }
        .wordle-game .wordle-input {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .wordle-game .wordle-input input {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            background: var(--bg-input);
            color: var(--text-primary);
            outline: none;
            transition: 0.2s;
            width: 180px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 4px;
        }
        .wordle-game .wordle-input input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .wordle-game .wordle-input button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .wordle-game .wordle-input button:hover { background: var(--accent-hover); }
        .wordle-game .wordle-message {
            text-align: center;
            margin-top: 0.8rem;
            font-weight: 600;
            min-height: 30px;
        }
        .wordle-game .wordle-message.success { color: var(--success-color); }
        .wordle-game .wordle-message.error { color: var(--error-color); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: start; gap: 0.8rem; }
            .header-right { width: 100%; justify-content: space-between; }
            .game-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .input-game .display-text { font-size: 1.8rem; }
            .type-game .word-display { font-size: 2rem; }
            .wordle-game .wordle-grid { max-width: 220px; }
            .wordle-game .wordle-cell { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <h1><i class="fas fa-gamepad"></i> Minigame Hub</h1>
        <div class="header-right">
            <!-- Theme Toggle -->
            <div class="toggle-group" id="themeToggle">
                <button class="toggle-btn active" data-theme="light"><i class="fas fa-sun"></i></button>
                <button class="toggle-btn" data-theme="dark"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </div>

    <!-- Game Grid -->
    <div class="game-grid">
        <!-- ===== INPUT GAME (renamed from Strategem) ===== -->
        <div class="game-card input-game" id="inputGame">
            <button class="close-btn" onclick="closeGame('inputGame')">✕</button>
            <h2><i class="fas fa-keyboard"></i> INPUT</h2>
            <div class="display-text" id="inputDisplay">Type this</div>
            <div class="input-area">
                <input type="text" id="inputField" placeholder="Type here..." autofocus>
                <button id="inputSubmit">Submit</button>
            </div>
            <div class="score">Score: <span id="inputScore">0</span> correct</div>
        </div>

        <!-- ===== TYPE QUICKLY ===== -->
        <div class="game-card type-game" id="typeGame">
            <button class="close-btn" onclick="closeGame('typeGame')">✕</button>
            <h2><i class="fas fa-bolt"></i> TYPE QUICKLY</h2>
            <div class="word-display" id="typeWord">apple</div>
            <div class="type-input">
                <input type="text" id="typeInput" placeholder="Type the word..." autofocus>
                <button id="typeSubmit">Enter</button>
            </div>
            <div class="stats">
                <span><i class="fas fa-check-circle"></i> Score: <strong id="typeScore">0</strong></span>
                <span><i class="fas fa-clock"></i> Time: <strong id="typeTime">0.0</strong>s</span>
            </div>
        </div>

        <!-- ===== WORDLE ===== -->
        <div class="game-card wordle-game" id="wordleGame">
            <button class="close-btn" onclick="closeGame('wordleGame')">✕</button>
            <h2><i class="fas fa-th"></i> WORDLE</h2>
            <div class="wordle-grid" id="wordleGrid"></div>
            <div class="wordle-input">
                <input type="text" id="wordleInput" maxlength="5" placeholder="Guess 5 letters" autofocus>
                <button id="wordleSubmit">Guess</button>
            </div>
            <div class="wordle-message" id="wordleMessage"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== THEME =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('minigame-theme', theme);
            document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        function initTheme() {
            const saved = localStorage.getItem('minigame-theme') || 'light';
            setTheme(saved);
        }

        document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setTheme(this.dataset.theme);
            });
        });

        initTheme();

        // ===== CLOSE GAME =====
        window.closeGame = function(gameId) {
            const el = document.getElementById(gameId);
            if (el) {
                el.style.display = 'none';
            }
        };

        // ===== INPUT GAME (renamed from Strategem) =====
        const inputWords = ['HELLO', 'WORLD', 'CODE', 'GAME', 'FAST', 'TYPE', 'KEY', 'FUN', 'WIN', 'PLAY'];
        let inputTarget = '';
        let inputScore = 0;

        function newInputWord() {
            inputTarget = inputWords[Math.floor(Math.random() * inputWords.length)];
            document.getElementById('inputDisplay').textContent = inputTarget;
            document.getElementById('inputField').value = '';
            document.getElementById('inputField').focus();
        }

        document.getElementById('inputSubmit').addEventListener('click', function() {
            const field = document.getElementById('inputField');
            const guess = field.value.trim().toUpperCase();
            if (!guess) return;
            if (guess === inputTarget) {
                inputScore++;
                document.getElementById('inputScore').textContent = inputScore;
                newInputWord();
            } else {
                field.style.borderColor = '#ef4444';
                setTimeout(() => { field.style.borderColor = ''; }, 300);
            }
        });

        document.getElementById('inputField').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('inputSubmit').click();
            }
        });

        // WASD support for INPUT game
        document.addEventListener('keydown', function(e) {
            const game = document.getElementById('inputGame');
            if (game.style.display === 'none') return;
            const field = document.getElementById('inputField');
            if (document.activeElement !== field) {
                const key = e.key.toUpperCase();
                if (['W', 'A', 'S', 'D'].includes(key)) {
                    e.preventDefault();
                    field.value += key;
                }
            }
        });

        newInputWord();

        // ===== TYPE QUICKLY =====
        const typeWords = ['apple', 'banana', 'cherry', 'dog', 'elephant', 'fish', 'grape', 'happy', 'ice', 'jump',
                           'king', 'lion', 'monkey', 'night', 'ocean', 'penguin', 'queen', 'rabbit', 'sun', 'tree',
                           'umbrella', 'violin', 'water', 'xenon', 'yellow', 'zebra', 'cat', 'bird', 'star', 'moon'];
        let typeScore = 0;
        let typeStartTime = 0;
        let typeTimerRunning = false;
        let typeCurrentWord = '';

        function newTypeWord() {
            typeCurrentWord = typeWords[Math.floor(Math.random() * typeWords.length)];
            document.getElementById('typeWord').textContent = typeCurrentWord;
            document.getElementById('typeInput').value = '';
            document.getElementById('typeInput').focus();
            if (!typeTimerRunning) {
                typeStartTime = performance.now();
                typeTimerRunning = true;
                updateTypeTimer();
            }
        }

        function updateTypeTimer() {
            if (!typeTimerRunning) return;
            const elapsed = (performance.now() - typeStartTime) / 1000;
            document.getElementById('typeTime').textContent = elapsed.toFixed(1);
            requestAnimationFrame(updateTypeTimer);
        }

        document.getElementById('typeSubmit').addEventListener('click', function() {
            const input = document.getElementById('typeInput');
            const guess = input.value.trim().toLowerCase();
            if (!guess) return;
            if (guess === typeCurrentWord) {
                typeScore++;
                document.getElementById('typeScore').textContent = typeScore;
                newTypeWord();
            } else {
                input.style.borderColor = '#ef4444';
                setTimeout(() => { input.style.borderColor = ''; }, 300);
            }
        });

        document.getElementById('typeInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('typeSubmit').click();
            }
        });

        newTypeWord();

        // ===== WORDLE =====
        const wordleWords = ['APPLE', 'BRAIN', 'CHESS', 'DANCE', 'EAGLE', 'FLAME', 'GRACE', 'HEART', 'IMAGE', 'JOKER',
                             'KNIFE', 'LIGHT', 'MAGIC', 'NIGHT', 'OCEAN', 'PEACE', 'QUEEN', 'RIVER', 'STONE', 'TIGER',
                             'UNITY', 'VOICE', 'WATER', 'XENON', 'YOUTH', 'ZEBRA', 'CLOUD', 'DREAM', 'FLOW', 'GHOST'];
        let wordleAnswer = '';
        let wordleGuesses = [];
        let wordleMaxGuesses = 6;
        let wordleGameOver = false;

        function initWordle() {
            wordleAnswer = wordleWords[Math.floor(Math.random() * wordleWords.length)];
            wordleGuesses = [];
            wordleGameOver = false;
            document.getElementById('wordleMessage').textContent = '';
            document.getElementById('wordleMessage').className = 'wordle-message';
            document.getElementById('wordleInput').value = '';
            document.getElementById('wordleInput').disabled = false;
            document.getElementById('wordleSubmit').disabled = false;
            renderWordleGrid();
            document.getElementById('wordleInput').focus();
        }

        function renderWordleGrid() {
            const grid = document.getElementById('wordleGrid');
            grid.innerHTML = '';
            for (let row = 0; row < wordleMaxGuesses; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'wordle-cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    grid.appendChild(cell);
                }
            }
            // Fill in guesses
            for (let row = 0; row < wordleGuesses.length; row++) {
                const guess = wordleGuesses[row];
                const result = getWordleResult(guess);
                for (let col = 0; col < 5; col++) {
                    const idx = row * 5 + col;
                    const cell = grid.children[idx];
                    cell.textContent = guess[col] || '';
                    cell.className = 'wordle-cell ' + result[col];
                }
            }
            // Fill current row (partial)
            const currentInput = document.getElementById('wordleInput').value.toUpperCase();
            if (currentInput && wordleGuesses.length < wordleMaxGuesses && !wordleGameOver) {
                const row = wordleGuesses.length;
                for (let col = 0; col < Math.min(currentInput.length, 5); col++) {
                    const idx = row * 5 + col;
                    const cell = grid.children[idx];
                    if (cell) {
                        cell.textContent = currentInput[col] || '';
                        cell.className = 'wordle-cell filled';
                    }
                }
            }
        }

        function getWordleResult(guess) {
            const result = ['absent', 'absent', 'absent', 'absent', 'absent'];
            const answerArr = wordleAnswer.split('');
            const guessArr = guess.split('');
            const used = [false, false, false, false, false];

            // First pass: find correct letters
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === answerArr[i]) {
                    result[i] = 'correct';
                    used[i] = true;
                }
            }
            // Second pass: find present letters
            for (let i = 0; i < 5; i++) {
                if (result[i] === 'correct') continue;
                for (let j = 0; j < 5; j++) {
                    if (!used[j] && guessArr[i] === answerArr[j]) {
                        result[i] = 'present';
                        used[j] = true;
                        break;
                    }
                }
            }
            return result;
        }

        document.getElementById('wordleSubmit').addEventListener('click', function() {
            const input = document.getElementById('wordleInput');
            const guess = input.value.toUpperCase().trim();
            if (wordleGameOver) {
                document.getElementById('wordleMessage').textContent = 'Game over! Start a new game.';
                document.getElementById('wordleMessage').className = 'wordle-message error';
                return;
            }
            if (guess.length !== 5) {
                document.getElementById('wordleMessage').textContent = 'Enter exactly 5 letters!';
                document.getElementById('wordleMessage').className = 'wordle-message error';
                return;
            }
            if (wordleGuesses.length >= wordleMaxGuesses) {
                document.getElementById('wordleMessage').textContent = 'No more guesses!';
                document.getElementById('wordleMessage').className = 'wordle-message error';
                return;
            }

            wordleGuesses.push(guess);
            renderWordleGrid();

            const result = getWordleResult(guess);
            const isWin = result.every(r => r === 'correct');

            if (isWin) {
                document.getElementById('wordleMessage').textContent = '🎉 You got it! The word was ' + wordleAnswer;
                document.getElementById('wordleMessage').className = 'wordle-message success';
                wordleGameOver = true;
                document.getElementById('wordleInput').disabled = true;
                document.getElementById('wordleSubmit').disabled = true;
            } else if (wordleGuesses.length >= wordleMaxGuesses) {
                document.getElementById('wordleMessage').textContent = '😢 Game over! The word was ' + wordleAnswer;
                document.getElementById('wordleMessage').className = 'wordle-message error';
                wordleGameOver = true;
                document.getElementById('wordleInput').disabled = true;
                document.getElementById('wordleSubmit').disabled = true;
            } else {
                document.getElementById('wordleMessage').textContent = 'Guess ' + wordleGuesses.length + ' of ' + wordleMaxGuesses;
                document.getElementById('wordleMessage').className = 'wordle-message';
            }

            input.value = '';
            input.focus();
            renderWordleGrid();
        });

        document.getElementById('wordleInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('wordleSubmit').click();
            }
            // Update grid while typing
            setTimeout(() => { renderWordleGrid(); }, 10);
        });

        document.getElementById('wordleInput').addEventListener('input', function() {
            renderWordleGrid();
        });

        initWordle();

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            // Ctrl+Shift+R to reset Wordle
            if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                e.preventDefault();
                initWordle();
            }
        });

        // Expose reset for testing
        window.resetWordle = initWordle;

        console.log('🎮 Minigame Hub loaded!');
        console.log('💡 Wordle: Ctrl+Shift+R to reset');
        console.log('🔄 INPUT game uses WASD keys too!');
    })();
</script>
</body>
</html>
