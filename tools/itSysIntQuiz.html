<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT SysInfo Roguelite Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .btn-hover-fx {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .dark .btn-hover-fx:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .ability-btn:not(:disabled) {
            animation: pulseGlowLight 2s infinite alternate;
        }
        .dark .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            animation: pulseGlowDark 2s infinite alternate;
        }
        @keyframes pulseGlowLight {
            from { box-shadow: 0 0 5px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            to { box-shadow: 0 0 15px rgba(59,130,246,0.5); border-color: rgba(59,130,246,0.6); }
        }
        @keyframes pulseGlowDark {
            from { box-shadow: 0 0 5px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
            to { box-shadow: 0 0 20px rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.8); }
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
        .floating-text {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .shake-screen {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flash-warning {
            animation: flashBg 0.4s ease-in-out;
        }
        @keyframes flashBg {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(234, 88, 12, 0.25); border-color: rgba(234, 88, 12, 0.8); }
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-200 overflow-hidden">
    
    <canvas id="confetti-canvas"></canvas>

    <div class="relative z-10 w-full max-w-4xl p-3 sm:p-6 h-full flex flex-col hide-scrollbar overflow-y-auto overflow-x-hidden mx-auto">
        
        <div id="start-screen" class="relative text-center flex flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-mono font-bold mb-4 sm:mb-6 tracking-widest uppercase border-b border-slate-300 dark:border-slate-700 pb-4 sm:pb-6 inline-block text-slate-900 dark:text-white">
                SYS_INFO<br/><span class="text-2xl sm:text-3xl text-slate-500 dark:text-slate-400">ROGUELITE</span>
            </h1>
            
            <div id="category-select-container" class="mt-2 mb-8 w-full max-w-xs mx-auto hidden">
                <label for="category-select" class="block text-slate-600 dark:text-slate-400 font-mono text-xs mb-2 tracking-widest">KATEGORIE FILTER</label>
                <select id="category-select" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white rounded-xl p-3 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-slate-500 transition-colors shadow-inner cursor-pointer text-center appearance-none">
                    <!-- Options injected via JS -->
                </select>
            </div>

            <button id="start-btn" disabled class="font-sans font-bold rounded-xl border border-slate-400 dark:border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-3">
                <span id="start-btn-text">[ VERBINDE MIT DATENBANK... ]</span>
                <span id="start-btn-spinner" class="loading-spinner"></span>
            </button>
            <div id="total-questions-info" class="mt-6 font-mono text-xs sm:text-sm text-slate-500 dark:text-slate-400 tracking-wider">LADE DATEI...</div>
        </div>

        <div id="game-ui" class="w-full flex-col min-h-full h-auto hidden py-2 sm:py-6">
            
            <!-- Top HUD -->
            <div class="flex justify-between items-start mb-3 sm:mb-6 font-mono tracking-widest uppercase shrink-0">
                <div class="flex flex-col gap-2 sm:gap-3">
                    <div class="flex items-center gap-3 sm:gap-6">
                        <div id="lives-display" class="flex gap-1 sm:gap-2 text-xl sm:text-2xl drop-shadow-md text-red-500"></div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-slate-500 dark:text-slate-500 text-[10px] sm:text-xs">SYS_ZEIT</span>
                            <span id="global-timer" class="text-slate-700 dark:text-slate-300 font-mono text-base sm:text-lg drop-shadow-md">00:00</span>
                        </div>
                    </div>
                </div>
                <div class="text-right flex flex-col gap-1 sm:gap-2 glass-panel px-4 py-2 sm:px-6 sm:py-3 rounded-2xl relative">
                    <div id="multiplier-badge" class="absolute -top-3 -left-4 bg-blue-500 dark:bg-slate-700 border border-blue-400 dark:border-slate-500 text-white text-[9px] sm:text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-md transition-all opacity-0 scale-90">x1 MULTI</div>
                    <div id="score-display" class="text-xl sm:text-3xl font-bold text-slate-900 dark:text-white transition-transform origin-right">000</div>
                    <div class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400">PUNKTE</div>
                </div>
            </div>

            <!-- Main Question Area -->
            <div class="flex-grow flex flex-col justify-center max-w-3xl mx-auto w-full min-h-0">
                
                <!-- Abilities HUD -->
                <div id="abilities-hud" class="mb-3 sm:mb-4 flex flex-col items-center shrink-0 w-full">
                    <div class="text-[10px] sm:text-xs font-mono tracking-widest text-slate-500 dark:text-slate-400 mb-2">STREAK-ENERGIE</div>
                        <div class="flex gap-1 sm:gap-2 mb-3 sm:mb-4 h-2 sm:h-3" id="streak-bar">
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                        </div>

                        <div class="flex gap-1 sm:gap-3 w-full justify-center font-mono text-xs sm:text-sm">
                            <button onclick="useAbility('remove1')" id="ab-remove1" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 2</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">-1 FALSCH</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 1 falsche Antwort</span>
                            </button>
                            <button onclick="useAbility('remove2')" id="ab-remove2" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 3</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">50 / 50</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 2 falsche Antworten</span>
                            </button>
                            <button onclick="useAbility('skip')" id="ab-skip" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 4</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">ÜBERSPRINGEN</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Frage sicher überspringen</span>
                            </button>
                        </div>
                    </div>

                    <div id="question-panel" class="glass-panel p-4 sm:p-8 lg:p-10 rounded-2xl sm:rounded-3xl shadow-xl w-full flex-grow flex flex-col">
                        <div class="mb-3 sm:mb-5 flex flex-col gap-2 shrink-0">
                            <div class="flex justify-between text-[10px] sm:text-xs font-mono text-slate-500 dark:text-slate-400 tracking-widest">
                                <span>ZEITLIMIT</span>
                                <span id="question-timer-text">45s</span>
                            </div>
                            <div class="w-full bg-slate-200 dark:bg-slate-900/80 h-1.5 rounded-full overflow-hidden border border-slate-300 dark:border-slate-700/50">
                                <div id="question-timer-bar" class="h-full bg-blue-500 dark:bg-slate-200 w-full transition-all ease-linear" style="transition: width 1s linear, background-color 0.3s ease;"></div>
                            </div>
                        </div>

                        <div class="mb-4 sm:mb-6 min-h-[50px] sm:min-h-[70px] flex items-center shrink-0">
                            <h2 id="question-text" class="text-base sm:text-xl lg:text-2xl leading-relaxed tracking-wide text-slate-900 dark:text-white font-semibold"></h2>
                        </div>

                        <div id="answers-container" class="grid grid-cols-1 gap-2 sm:gap-3 opacity-0 transition-opacity duration-500 pb-2 flex-grow content-center">
                            <!-- Injected -->
                        </div>
                    </div>

                    <!-- Minigame Panel -->
                    <div id="minigame-panel" class="hidden glass-panel p-4 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl w-full border-slate-400 dark:border-slate-500 border-2 bg-white/90 dark:bg-slate-900/90 my-auto">
                        <div class="text-slate-600 dark:text-slate-300 font-mono text-xs sm:text-sm tracking-widest mb-3 animate-pulse border-b border-slate-300 dark:border-slate-700 pb-2 flex items-center gap-2">
                            <span>⚠️</span> SYSTEM-OVERRIDE // 
                        </div>
                        <div class="flex justify-between items-center mb-4">
                            <h2 id="minigame-title" class="text-base sm:text-xl text-slate-900 dark:text-white font-bold tracking-wide">SEQUENZ AUSFÜHREN</h2>
                            <div id="minigame-timer" class="text-white font-mono text-base sm:text-xl shadow-md px-3 py-1 bg-slate-800 dark:bg-slate-950 rounded-lg">14.0s</div>
                        </div>
                        <div id="minigame-content" class="w-full h-44 sm:h-52 relative bg-slate-100 dark:bg-slate-950 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner flex flex-col items-center justify-center">
                            <!-- Injected -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden text-center flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
                <h1 class="text-4xl sm:text-6xl lg:text-7xl font-mono font-bold mb-4 sm:mb-6 tracking-widest text-slate-900 dark:text-slate-100 drop-shadow-lg">SYSTEMAUSFALL</h1>
                <p class="text-lg sm:text-2xl mb-2 font-mono tracking-widest text-slate-600 dark:text-slate-400">ENDSTAND</p>
                <p id="final-score" class="text-5xl sm:text-8xl font-bold mb-8 sm:mb-12 font-mono text-slate-900 dark:text-white">000</p>
                
                <button onclick="location.reload()" class="font-sans font-bold rounded-xl border border-slate-400 dark:border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg">
                    [ SYSTEM NEU STARTEN ]
                </button>
            </div>
        </div>

    <script>
        let rawQuestions = [];
        let clusters = [];
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let streak = 0;
        let multiplier = 1;
        let globalTimer = null;
        let globalSeconds = 0;
        let questionTimer = null;
        let questionSecondsLeft = 45;
        let minigameTimer = null;
        let minigameTimeLeft = 0;
        let isFirstQuestion = true;

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase();
        });

        async function loadDatabase() {
            const startBtn = document.getElementById('start-btn');
            const infoEl = document.getElementById('total-questions-info');
            const spinner = document.getElementById('start-btn-spinner');
            const btnText = document.getElementById('start-btn-text');
            
            // Pfade für Vercel optimiert
            const pathsToTry = [
                'itSysIntQuestions.json',
                './itSysIntQuestions.json',
                'resources/itSysIntQuestions.json',
                './resources/itSysIntQuestions.json',
                'public/resources/itSysIntQuestions.json',
                '/itSysIntQuestions.json',
                '/resources/itSysIntQuestions.json',
                'https://raw.githubusercontent.com/cmdrFRANKLY1/Vercel/main/itSysIntQuestions.json',
                'https://raw.githubusercontent.com/cmdrFRANKLY1/Vercel/main/resources/itSysIntQuestions.json'
            ];

            let loaded = false;
            let loadErrors = [];

            for (let path of pathsToTry) {
                try {
                    infoEl.textContent = `🔍 VERSUCHE: ${path}`;
                    console.log(`Versuche zu laden: ${path}`);
                    
                    const res = await fetch(path, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (res.ok) {
                        const data = await res.json();
                        if (Array.isArray(data) && data.length > 0) {
                            rawQuestions = data;
                            loaded = true;
                            console.log(`✅ Erfolgreich geladen von: ${path}`);
                            infoEl.textContent = `✅ GELADEN: ${rawQuestions.length} FRAGEN`;
                            break;
                        } else {
                            console.warn(`⚠️ Leere oder ungültige JSON von: ${path}`);
                        }
                    } else {
                        console.warn(`❌ HTTP ${res.status} von: ${path}`);
                        loadErrors.push(`${path} (${res.status})`);
                    }
                } catch (err) {
                    console.warn(`❌ Fehler bei ${path}:`, err.message);
                    loadErrors.push(`${path} (${err.message})`);
                }
            }

            // Spinner ausblenden
            if (spinner) spinner.style.display = 'none';
            
            if (loaded && rawQuestions.length > 0) {
                initMenu();
            } else {
                infoEl.textContent = '❌ KEINE FRAGEN GEFUNDEN - BITTE JSON PRÜFEN';
                infoEl.title = `Fehler beim Laden:\n${loadErrors.join('\n')}`;
                btnText.textContent = '[ NEU LADEN ]';
                startBtn.disabled = false;
                startBtn.onclick = () => location.reload();
            }
        }

        // Kategorien aus der JSON extrahieren
        function extractCategories() {
            const uniqueCats = [...new Set(rawQuestions.map(q => q.kategorie))];
            return uniqueCats.sort();
        }

        function initMenu() {
            const infoEl = document.getElementById('total-questions-info');
            if (infoEl) infoEl.textContent = `📊 DATENBANK: ${rawQuestions.length} FRAGEN GELADEN`;
            
            // Kategorien aus der JSON extrahieren
            const categories = extractCategories();
            
            // Cluster für die Anzeige erstellen (jede Kategorie einzeln)
            clusters = categories.map(cat => ({
                items: [cat],
                displayName: cat
            }));

            const selectContainer = document.getElementById('category-select-container');
            const selectEl = document.getElementById('category-select');
            
            if (selectContainer && selectEl) {
                selectEl.innerHTML = '<option value="all">🎲 ZUFÄLLIG (ALLE KATEGORIEN)</option>';
                
                clusters.forEach((cluster, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = cluster.displayName;
                    selectEl.appendChild(opt);
                });

                selectEl.addEventListener('change', updateInfoText);
                selectContainer.classList.remove('hidden');
            }

            const startBtn = document.getElementById('start-btn');
            const btnText = document.getElementById('start-btn-text');
            btnText.textContent = '[ 🚀 START ]';
            startBtn.disabled = false;
            startBtn.onclick = startGame;
        }

        function updateInfoText() {
            const selectEl = document.getElementById('category-select');
            const val = selectEl.value;
            let count = rawQuestions.length;
            if (val !== 'all') {
                const cluster = clusters[val];
                count = rawQuestions.filter(q => q.kategorie === cluster.items[0]).length;
            }
            document.getElementById('total-questions-info').textContent = `📊 DATENBANK: ${count} FRAGEN GEFILTERT`;
        }

        // ... (Rest des Codes bleibt gleich)
        // Der Rest des Codes (Confetti, Floating Text, Spielelogik, etc.)
        // bleibt unverändert, da er nicht von den Kategorien abhängt

        // Ich füge die wichtigsten Funktionen hier ein, die leicht angepasst wurden
        function startGame() {
            const selectEl = document.getElementById('category-select');
            let filtered = rawQuestions;
            if (selectEl && selectEl.value !== 'all') {
                const cluster = clusters[selectEl.value];
                filtered = rawQuestions.filter(q => q.kategorie === cluster.items[0]);
            }

            questions = [...filtered].sort(() => Math.random() - 0.5);
            if (questions.length === 0) {
                // Wenn keine Fragen gefiltert wurden, alle nehmen
                questions = [...rawQuestions].sort(() => Math.random() - 0.5);
                if (questions.length === 0) {
                    alert('Keine Fragen verfügbar!');
                    return;
                }
            }

            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            streak = 0;
            multiplier = 1;
            globalSeconds = 0;
            isFirstQuestion = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            if (globalTimer) clearInterval(globalTimer);
            globalTimer = setInterval(() => {
                globalSeconds++;
                const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
                const secs = (globalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('global-timer').textContent = `${mins}:${secs}`;
            }, 1000);

            loadNextQuestion();
        }

        // Alle anderen Funktionen (loadNextQuestion, handleAnswer, updateUI, 
        // useAbility, triggerMinigame, etc.) bleiben exakt gleich wie im Original.
        // Sie werden nicht von den Kategorien beeinflusst.
    </script>
</body>
</html>
