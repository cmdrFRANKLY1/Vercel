<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT SysInfo Roguelite Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .btn-hover-fx {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .dark .btn-hover-fx:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .ability-btn:not(:disabled) {
            animation: pulseGlowLight 2s infinite alternate;
        }
        .dark .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            animation: pulseGlowDark 2s infinite alternate;
        }
        @keyframes pulseGlowLight {
            from { box-shadow: 0 0 5px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            to { box-shadow: 0 0 15px rgba(59,130,246,0.5); border-color: rgba(59,130,246,0.6); }
        }
        @keyframes pulseGlowDark {
            from { box-shadow: 0 0 5px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
            to { box-shadow: 0 0 20px rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.8); }
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
        .floating-text {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .shake-screen {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flash-warning {
            animation: flashBg 0.4s ease-in-out;
        }
        @keyframes flashBg {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(234, 88, 12, 0.25); border-color: rgba(234, 88, 12, 0.8); }
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-center relative bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-200 overflow-hidden">
    
    <canvas id="confetti-canvas"></canvas>

    <div class="relative z-10 w-full max-w-4xl p-3 sm:p-6 h-full flex flex-col hide-scrollbar overflow-y-auto overflow-x-hidden mx-auto">
        
        <div id="start-screen" class="relative text-center flex flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-mono font-bold mb-4 sm:mb-6 tracking-widest uppercase border-b border-slate-300 dark:border-slate-700 pb-4 sm:pb-6 inline-block text-slate-900 dark:text-white">
                SYS_INFO<br/><span class="text-2xl sm:text-3xl text-slate-500 dark:text-slate-400">ROGUELITE</span>
            </h1>
            
            <div id="category-select-container" class="mt-2 mb-8 w-full max-w-xs mx-auto hidden">
                <label for="category-select" class="block text-slate-600 dark:text-slate-400 font-mono text-xs mb-2 tracking-widest">KATEGORIE FILTER</label>
                <select id="category-select" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white rounded-xl p-3 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-slate-500 transition-colors shadow-inner cursor-pointer text-center appearance-none">
                    <!-- Options injected via JS -->
                </select>
            </div>

            <button id="start-btn" disabled class="font-sans font-bold rounded-xl border border-slate-400 dark:border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                [ VERBINDE MIT DATENBANK... ]
            </button>
            <div id="total-questions-info" class="mt-6 font-mono text-xs sm:text-sm text-slate-500 dark:text-slate-400 tracking-wider">LADE DATEI...</div>
        </div>

        <div id="game-ui" class="w-full flex-col min-h-full h-auto hidden py-2 sm:py-6">
            
            <!-- Top HUD -->
            <div class="flex justify-between items-start mb-3 sm:mb-6 font-mono tracking-widest uppercase shrink-0">
                <div class="flex flex-col gap-2 sm:gap-3">
                    <div class="flex items-center gap-3 sm:gap-6">
                        <div id="lives-display" class="flex gap-1 sm:gap-2 text-xl sm:text-2xl drop-shadow-md text-red-500"></div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-slate-500 dark:text-slate-500 text-[10px] sm:text-xs">SYS_ZEIT</span>
                            <span id="global-timer" class="text-slate-700 dark:text-slate-300 font-mono text-base sm:text-lg drop-shadow-md">00:00</span>
                        </div>
                    </div>
                </div>
                <div class="text-right flex flex-col gap-1 sm:gap-2 glass-panel px-4 py-2 sm:px-6 sm:py-3 rounded-2xl relative">
                    <div id="multiplier-badge" class="absolute -top-3 -left-4 bg-blue-500 dark:bg-slate-700 border border-blue-400 dark:border-slate-500 text-white text-[9px] sm:text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-md transition-all opacity-0 scale-90">x1 MULTI</div>
                    <div id="score-display" class="text-xl sm:text-3xl font-bold text-slate-900 dark:text-white transition-transform origin-right">000</div>
                    <div class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400">PUNKTE</div>
                </div>
            </div>

            <!-- Main Question Area -->
            <div class="flex-grow flex flex-col justify-center max-w-3xl mx-auto w-full min-h-0">
                
                <!-- Abilities HUD -->
                <div id="abilities-hud" class="mb-3 sm:mb-4 flex flex-col items-center shrink-0 w-full">
                    <div class="text-[10px] sm:text-xs font-mono tracking-widest text-slate-500 dark:text-slate-400 mb-2">STREAK-ENERGIE</div>
                        <div class="flex gap-1 sm:gap-2 mb-3 sm:mb-4 h-2 sm:h-3" id="streak-bar">
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                            <div class="w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300"></div>
                        </div>

                        <div class="flex gap-1 sm:gap-3 w-full justify-center font-mono text-xs sm:text-sm">
                            <button onclick="useAbility('remove1')" id="ab-remove1" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 2</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">-1 FALSCH</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 1 falsche Antwort</span>
                            </button>
                            <button onclick="useAbility('remove2')" id="ab-remove2" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 3</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">50 / 50</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Entfernt 2 falsche Antworten</span>
                            </button>
                            <button onclick="useAbility('skip')" id="ab-skip" disabled class="ability-btn flex-1 max-w-[140px] bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-xl py-2 px-1 sm:px-2 flex flex-col items-center gap-0.5 opacity-50 pointer-events-none transition-all">
                                <span class="text-[8px] sm:text-[10px] text-slate-500 dark:text-slate-400">KOSTEN 4</span>
                                <span class="font-bold text-slate-800 dark:text-slate-100 text-[10px] sm:text-base">ÜBERSPRINGEN</span>
                                <span class="text-[7px] sm:text-[9px] text-slate-500 normal-case text-center leading-tight font-sans mt-1">Frage sicher überspringen</span>
                            </button>
                        </div>
                    </div>

                    <div id="question-panel" class="glass-panel p-4 sm:p-8 lg:p-10 rounded-2xl sm:rounded-3xl shadow-xl w-full flex-grow flex flex-col">
                        <div class="mb-3 sm:mb-5 flex flex-col gap-2 shrink-0">
                            <div class="flex justify-between text-[10px] sm:text-xs font-mono text-slate-500 dark:text-slate-400 tracking-widest">
                                <span>ZEITLIMIT</span>
                                <span id="question-timer-text">45s</span>
                            </div>
                            <div class="w-full bg-slate-200 dark:bg-slate-900/80 h-1.5 rounded-full overflow-hidden border border-slate-300 dark:border-slate-700/50">
                                <div id="question-timer-bar" class="h-full bg-blue-500 dark:bg-slate-200 w-full transition-all ease-linear" style="transition: width 1s linear, background-color 0.3s ease;"></div>
                            </div>
                        </div>

                        <div class="mb-4 sm:mb-6 min-h-[50px] sm:min-h-[70px] flex items-center shrink-0">
                            <h2 id="question-text" class="text-base sm:text-xl lg:text-2xl leading-relaxed tracking-wide text-slate-900 dark:text-white font-semibold"></h2>
                        </div>

                        <div id="answers-container" class="grid grid-cols-1 gap-2 sm:gap-3 opacity-0 transition-opacity duration-500 pb-2 flex-grow content-center">
                            <!-- Injected -->
                        </div>
                    </div>

                    <!-- Minigame Panel -->
                    <div id="minigame-panel" class="hidden glass-panel p-4 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl w-full border-slate-400 dark:border-slate-500 border-2 bg-white/90 dark:bg-slate-900/90 my-auto">
                        <div class="text-slate-600 dark:text-slate-300 font-mono text-xs sm:text-sm tracking-widest mb-3 animate-pulse border-b border-slate-300 dark:border-slate-700 pb-2 flex items-center gap-2">
                            <span>⚠️</span> SYSTEM-OVERRIDE // 
                        </div>
                        <div class="flex justify-between items-center mb-4">
                            <h2 id="minigame-title" class="text-base sm:text-xl text-slate-900 dark:text-white font-bold tracking-wide">SEQUENZ AUSFÜHREN</h2>
                            <div id="minigame-timer" class="text-white font-mono text-base sm:text-xl shadow-md px-3 py-1 bg-slate-800 dark:bg-slate-950 rounded-lg">14.0s</div>
                        </div>
                        <div id="minigame-content" class="w-full h-44 sm:h-52 relative bg-slate-100 dark:bg-slate-950 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-inner flex flex-col items-center justify-center">
                            <!-- Injected -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden text-center flex-col items-center justify-center min-h-full h-auto glass-panel rounded-3xl p-6 sm:p-12 shadow-2xl my-auto">
                <h1 class="text-4xl sm:text-6xl lg:text-7xl font-mono font-bold mb-4 sm:mb-6 tracking-widest text-slate-900 dark:text-slate-100 drop-shadow-lg">SYSTEMAUSFALL</h1>
                <p class="text-lg sm:text-2xl mb-2 font-mono tracking-widest text-slate-600 dark:text-slate-400">ENDSTAND</p>
                <p id="final-score" class="text-5xl sm:text-8xl font-bold mb-8 sm:mb-12 font-mono text-slate-900 dark:text-white">000</p>
                
                <button onclick="location.reload()" class="font-sans font-bold rounded-xl border border-slate-400 dark:border-slate-500 px-8 py-3 sm:px-10 sm:py-4 text-lg sm:text-xl tracking-widest btn-hover-fx bg-slate-800 text-white uppercase shadow-lg">
                    [ SYSTEM NEU STARTEN ]
                </button>
            </div>
        </div>

    <script>
        let rawQuestions = [];
        let clusters = [];
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let streak = 0;
        let multiplier = 1;
        let globalTimer = null;
        let globalSeconds = 0;
        let questionTimer = null;
        let questionSecondsLeft = 45;
        let minigameTimer = null;
        let minigameTimeLeft = 0;
        let isFirstQuestion = true;

        document.addEventListener('DOMContentLoaded', () => {
            loadDatabase();
        });

        async function loadDatabase() {
            const startBtn = document.getElementById('start-btn');
            const pathsToTry = [
                '/resources/itSysIntQuestions.json',
                'resources/itSysIntQuestions.json',
                './resources/itSysIntQuestions.json',
                '../resources/itSysIntQuestions.json'
            ];

            for (let path of pathsToTry) {
                try {
                    const res = await fetch(path);
                    if (res.ok) {
                        rawQuestions = await res.json();
                        initMenu();
                        return; // Erfolgreich geladen, Schleife abbrechen
                    }
                } catch (err) {
                    console.warn(`Pfad ${path} nicht gefunden, probiere nächsten...`);
                }
            }

            // Wenn alle Pfade fehlschlagen (z.B. in der Chat-Vorschau)
            startBtn.textContent = '[ RELOAD ]';
            startBtn.disabled = false;
            startBtn.onclick = () => location.reload();
        }

        // Kombiniert Kategorien dynamisch basierend auf Textüberschneidungen
        function getCommonPrefix(a, b) {
            let i = 0;
            while(i < a.length && i < b.length && a[i] === b[i]) i++;
            return a.substring(0, i);
        }

        function initMenu() {
            const infoEl = document.getElementById('total-questions-info');
            if (infoEl) infoEl.textContent = `DATENBANK: ${rawQuestions.length} FRAGEN GELADEN`;
            
            // Sammle alle einzigartigen Kategorien
            const uniqueCats = [...new Set(rawQuestions.map(q => q.kategorie))];
            clusters = [];
            
            // Clustere Kategorien basierend auf Namensähnlichkeiten (z.B. IT-Service, IT-Sicherheit)
            uniqueCats.forEach(cat => {
                let added = false;
                for (let cluster of clusters) {
                    let lcp = getCommonPrefix(cat.toUpperCase(), cluster.items[0].toUpperCase());
                    let isHyphenMatch = lcp.includes('-') && lcp.indexOf('-') >= 2;
                    let isWordMatch = lcp.length >= 4; // Mindestens 4 gleiche Buchstaben
                    
                    if (isHyphenMatch || isWordMatch) {
                        cluster.items.push(cat);
                        cluster.prefix = getCommonPrefix(cluster.prefix, cat.toUpperCase());
                        added = true;
                        break;
                    }
                }
                if (!added) {
                    clusters.push({ items: [cat], prefix: cat.toUpperCase() });
                }
            });

            const selectContainer = document.getElementById('category-select-container');
            const selectEl = document.getElementById('category-select');
            
            if (selectContainer && selectEl) {
                selectEl.innerHTML = '<option value="all">ZUFÄLLIG (ALLE)</option>';
                
                clusters.forEach((c) => {
                    let pfx = c.prefix;
                    if (pfx.endsWith('-') || pfx.endsWith(' ')) pfx = pfx.slice(0, -1);
                    c.displayName = c.items.length > 1 ? pfx + '*' : pfx;
                });
                
                clusters.sort((a,b) => a.displayName.localeCompare(b.displayName));
                
                clusters.forEach((c, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = c.displayName;
                    selectEl.appendChild(opt);
                });

                selectEl.addEventListener('change', updateInfoText);
                selectContainer.classList.remove('hidden');
            }

            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = '[ START ]';
            startBtn.disabled = false;
            startBtn.onclick = startGame;
        }

        function updateInfoText() {
            const selectEl = document.getElementById('category-select');
            const val = selectEl.value;
            let count = rawQuestions.length;
            if (val !== 'all') {
                const cluster = clusters[val];
                count = rawQuestions.filter(q => cluster.items.includes(q.kategorie)).length;
            }
            document.getElementById('total-questions-info').textContent = `DATENBANK: ${count} FRAGEN GEFILTERT`;
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.7) * 14,
                    size: Math.random() * 6 + 4,
                    color: ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7'][Math.floor(Math.random() * 5)],
                    alpha: 1
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4; // Gravity
                p.alpha -= 0.015;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();

        function spawnFloatingText(text, x, y, color = '#ffffff') {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function startGame() {
            const selectEl = document.getElementById('category-select');
            let filtered = rawQuestions;
            if (selectEl && selectEl.value !== 'all') {
                const cluster = clusters[selectEl.value];
                filtered = rawQuestions.filter(q => cluster.items.includes(q.kategorie));
            }

            questions = [...filtered].sort(() => Math.random() - 0.5);
            if (questions.length === 0) return;

            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            streak = 0;
            multiplier = 1;
            globalSeconds = 0;
            isFirstQuestion = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            if (globalTimer) clearInterval(globalTimer);
            globalTimer = setInterval(() => {
                globalSeconds++;
                const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
                const secs = (globalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('global-timer').textContent = `${mins}:${secs}`;
            }, 1000);

            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (lives <= 0) {
                gameOver();
                return;
            }

            if (currentQuestionIndex >= questions.length) {
                questions = [...questions].sort(() => Math.random() - 0.5);
                currentQuestionIndex = 0;
            }

            if (!isFirstQuestion && Math.random() < 0.2) {
                triggerMinigame();
                return;
            }

            isFirstQuestion = false;

            const q = questions[currentQuestionIndex];
            currentQuestionIndex++;

            document.getElementById('question-panel').classList.remove('hidden');
            document.getElementById('minigame-panel').classList.add('hidden');

            document.getElementById('question-text').textContent = q.frage;

            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';
            answersContainer.style.opacity = '0';

            let answers = [...q.falscheAntworten, q.richtigeAntwort];
            answers = answers.sort(() => Math.random() - 0.5);

            answers.forEach((ans) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-white dark:bg-slate-800/80 border border-slate-300 dark:border-slate-600 rounded-xl p-3 sm:p-4 text-sm sm:text-base transition-all duration-300 btn-hover-fx shadow-lg text-slate-800 dark:text-slate-100 hover:bg-slate-50 dark:hover:bg-slate-700';
                btn.textContent = ans;
                btn.dataset.correct = (ans === q.richtigeAntwort);
                btn.onclick = () => handleAnswer(btn.dataset.correct === 'true', btn);
                answersContainer.appendChild(btn);
            });

            setTimeout(() => {
                answersContainer.style.opacity = '1';
            }, 50);

            startQuestionTimer();
            updateUI();
        }

        function startQuestionTimer() {
            if (questionTimer) clearInterval(questionTimer);
            questionSecondsLeft = 45;
            const bar = document.getElementById('question-timer-bar');
            const text = document.getElementById('question-timer-text');
            
            bar.style.width = '100%';
            bar.classList.remove('bg-red-500');
            bar.classList.add('bg-blue-500', 'dark:bg-slate-200');
            text.textContent = '45s';

            questionTimer = setInterval(() => {
                questionSecondsLeft--;
                text.textContent = `${questionSecondsLeft}s`;
                const pct = (questionSecondsLeft / 45) * 100;
                bar.style.width = `${pct}%`;

                if (questionSecondsLeft <= 10) {
                    bar.classList.remove('bg-blue-500', 'dark:bg-slate-200');
                    bar.classList.add('bg-red-500');
                }

                if (questionSecondsLeft <= 0) {
                    clearInterval(questionTimer);
                    handleAnswer(false, null, true);
                }
            }, 1000);
        }

        function handleAnswer(isCorrect, btnElement, isTimeout = false) {
            if (questionTimer) clearInterval(questionTimer);
            
            const buttons = document.querySelectorAll('#answers-container button');
            buttons.forEach(b => b.disabled = true);

            const scoreEl = document.getElementById('score-display');

            if (isCorrect) {
                streak++;
                const earned = 100 * multiplier;
                score += earned;

                scoreEl.style.transform = 'scale(1.25)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);

                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-green-100 dark:bg-slate-700 border border-green-500 dark:border-slate-400 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-green-800 dark:text-white transition-all';
                    const rect = btnElement.getBoundingClientRect();
                    spawnFloatingText(`+${earned}P`, rect.x + rect.width / 2, rect.y, '#22c55e');
                }
                
                if (streak > 0 && streak % 3 === 0 && multiplier < 5) {
                    multiplier++;
                }

                if (streak >= 5) {
                    streak = 0;
                    lives++;
                    triggerConfetti();
                    spawnFloatingText('+1 LEBEN!', window.innerWidth / 2, window.innerHeight / 2, '#22c55e');
                }
            } else {
                streak = 0;
                multiplier = 1;
                lives--;
                
                document.body.classList.add('shake-screen');
                setTimeout(() => document.body.classList.remove('shake-screen'), 300);

                if (btnElement) {
                    btnElement.className = 'w-full text-left bg-red-100 dark:bg-slate-900 border border-red-500 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-red-800 dark:text-red-300 transition-all';
                }
                buttons.forEach(b => {
                    if (b.dataset.correct === 'true') {
                        b.className = 'w-full text-left bg-green-50 dark:bg-slate-800 border border-green-400 dark:border-slate-300 rounded-xl p-3 sm:p-4 text-sm sm:text-base shadow-lg text-green-700 dark:text-slate-100 transition-all';
                    }
                });
            }

            updateUI();
            setTimeout(() => loadNextQuestion(), 1200);
        }

        function updateUI() {
            const livesDisplay = document.getElementById('lives-display');
            livesDisplay.innerHTML = '♥'.repeat(Math.max(0, lives));

            document.getElementById('score-display').textContent = score.toString().padStart(3, '0');

            const multiBadge = document.getElementById('multiplier-badge');
            if (multiplier > 1) {
                multiBadge.textContent = `x${multiplier} MULTI`;
                multiBadge.classList.remove('opacity-0', 'scale-90');
            } else {
                multiBadge.classList.add('opacity-0', 'scale-90');
            }

            const streakBars = document.querySelectorAll('#streak-bar div');
            streakBars.forEach((bar, i) => {
                if (i < streak) {
                    bar.className = "w-8 sm:w-12 rounded-full bg-blue-500 dark:bg-slate-200 shadow-[0_0_10px_rgba(59,130,246,0.8)] dark:shadow-[0_0_10px_rgba(255,255,255,0.8)] transition-colors duration-300";
                } else {
                    bar.className = "w-8 sm:w-12 rounded-full bg-slate-300 dark:bg-slate-800 border border-slate-400 dark:border-slate-700 transition-colors duration-300";
                }
            });

            const ab1 = document.getElementById('ab-remove1');
            const ab2 = document.getElementById('ab-remove2');
            const ab3 = document.getElementById('ab-skip');

            ab1.disabled = streak < 2;
            ab1.classList.toggle('opacity-50', streak < 2);
            ab1.classList.toggle('pointer-events-none', streak < 2);

            ab2.disabled = streak < 3;
            ab2.classList.toggle('opacity-50', streak < 3);
            ab2.classList.toggle('pointer-events-none', streak < 3);

            ab3.disabled = streak < 4;
            ab3.classList.toggle('opacity-50', streak < 4);
            ab3.classList.toggle('pointer-events-none', streak < 4);
        }

        function useAbility(type) {
            const buttons = document.querySelectorAll('#answers-container button');
            const wrongButtons = Array.from(buttons).filter(b => b.dataset.correct === 'false' && !b.disabled);

            if (type === 'remove1' && streak >= 2) {
                streak -= 2;
                if (wrongButtons.length > 0) {
                    const target = wrongButtons[Math.floor(Math.random() * wrongButtons.length)];
                    target.disabled = true;
                    target.style.opacity = '0.2';
                }
            } else if (type === 'remove2' && streak >= 3) {
                streak -= 3;
                wrongButtons.slice(0, 2).forEach(b => {
                    b.disabled = true;
                    b.style.opacity = '0.2';
                });
            } else if (type === 'skip' && streak >= 4) {
                streak -= 4;
                if (questionTimer) clearInterval(questionTimer);
                spawnFloatingText('FRAGE ÜBERSPRUNGEN', window.innerWidth / 2, window.innerHeight / 2, '#3b82f6');
                loadNextQuestion();
                return;
            }
            updateUI();
        }

        function triggerMinigame() {
            if (questionTimer) clearInterval(questionTimer);
            document.getElementById('question-panel').classList.add('hidden');
            const panel = document.getElementById('minigame-panel');
            panel.classList.remove('hidden');

            panel.classList.add('flash-warning');
            setTimeout(() => panel.classList.remove('flash-warning'), 500);

            setupStratagemGame();
        }

        function startMinigameTimer(duration, onComplete) {
            minigameTimeLeft = duration;
            const timerEl = document.getElementById('minigame-timer');
            timerEl.textContent = `${minigameTimeLeft.toFixed(1)}s`;

            if (minigameTimer) clearInterval(minigameTimer);
            minigameTimer = setInterval(() => {
                minigameTimeLeft -= 0.1;
                timerEl.textContent = `${Math.max(0, minigameTimeLeft).toFixed(1)}s`;

                if (minigameTimeLeft <= 0) {
                    clearInterval(minigameTimer);
                    onComplete(false);
                }
            }, 100);
        }

        function endMinigame(success) {
            if (minigameTimer) clearInterval(minigameTimer);
            const scoreEl = document.getElementById('score-display');
            window.onkeydown = null;

            if (success) {
                const bonus = 250 * multiplier;
                score += bonus;
                scoreEl.style.transform = 'scale(1.25)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 200);

                triggerConfetti();
                spawnFloatingText(`+${bonus}P (AUFGABE GELÖST)`, window.innerWidth / 2, window.innerHeight / 2, '#22c55e');
            } else {
                lives--;
                document.body.classList.add('shake-screen');
                setTimeout(() => document.body.classList.remove('shake-screen'), 300);
                spawnFloatingText('AUFGABE FEHLGESCHLAGEN (-1 LEBEN)', window.innerWidth / 2, window.innerHeight / 2, '#ef4444');
            }
            updateUI();
            setTimeout(() => loadNextQuestion(), 1000);
        }

        let stratSequence = [];
        let stratIndex = 0;
        const stratArrows = { 'UP': '▲', 'DOWN': '▼', 'LEFT': '◀', 'RIGHT': '▶' };
        const stratKeys = ['UP', 'DOWN', 'LEFT', 'RIGHT'];

        function setupStratagemGame() {
            document.getElementById('minigame-title').textContent = "STRATAGEM EINGABE";
            
            stratSequence = [];
            for (let i = 0; i < 5; i++) {
                stratSequence.push(stratKeys[Math.floor(Math.random() * stratKeys.length)]);
            }
            stratIndex = 0;

            renderStratagemUI();
            startMinigameTimer(14.0, (res) => endMinigame(res));

            window.onkeydown = (e) => {
                if (document.getElementById('minigame-panel').classList.contains('hidden')) return;
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') handleStratInput('UP');
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleStratInput('DOWN');
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleStratInput('LEFT');
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleStratInput('RIGHT');
            };
        }

        function renderStratagemUI() {
            const content = document.getElementById('minigame-content');
            let sequenceHTML = stratSequence.map((dir, i) => {
                if (i < stratIndex) {
                    return `<div class="w-8 h-8 border border-slate-400 flex items-center justify-center text-slate-800 rounded text-lg bg-slate-200 shadow-[0_0_10px_rgba(255,255,255,0.6)]">${stratArrows[dir]}</div>`;
                } else if (i === stratIndex) {
                    return `<div class="w-8 h-8 border-2 border-blue-500 dark:border-white flex items-center justify-center text-blue-600 dark:text-white rounded text-lg bg-blue-100 dark:bg-slate-800 animate-pulse">${stratArrows[dir]}</div>`;
                } else {
                    return `<div class="w-8 h-8 border border-slate-300 dark:border-slate-700 flex items-center justify-center text-slate-400 dark:text-slate-500 rounded text-lg bg-slate-100 dark:bg-slate-900">${stratArrows[dir]}</div>`;
                }
            }).join('');

            content.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full gap-4 w-full">
                    <div class="flex gap-2 mb-2">${sequenceHTML}</div>
                    <div class="grid grid-cols-3 gap-2 w-36 mx-auto">
                        <div class="col-start-2"><button onclick="handleStratInput('UP')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▲</button></div>
                        <div class="col-start-1 row-start-2"><button onclick="handleStratInput('LEFT')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">◀</button></div>
                        <div class="col-start-2 row-start-2"><button onclick="handleStratInput('DOWN')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▼</button></div>
                        <div class="col-start-3 row-start-2"><button onclick="handleStratInput('RIGHT')" class="w-10 h-10 bg-slate-200 dark:bg-slate-800 border border-slate-400 dark:border-slate-600 rounded-lg shadow hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white text-lg transition-colors">▶</button></div>
                    </div>
                </div>
            `;
        }

        function handleStratInput(dir) {
            if (document.getElementById('minigame-panel').classList.contains('hidden')) return;
            if (dir === stratSequence[stratIndex]) {
                stratIndex++;
                renderStratagemUI();
                if (stratIndex === stratSequence.length) {
                    window.onkeydown = null;
                    endMinigame(true);
                }
            } else {
                stratIndex = 0;
                renderStratagemUI();
            }
        }

        function gameOver() {
            if (globalTimer) clearInterval(globalTimer);
            if (questionTimer) clearInterval(questionTimer);
            if (minigameTimer) clearInterval(minigameTimer);
            window.onkeydown = null;

            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('game-over-screen').classList.add('flex');
            document.getElementById('final-score').textContent = score.toString().padStart(3, '0');
        }
    </script>
</body>
</html>
