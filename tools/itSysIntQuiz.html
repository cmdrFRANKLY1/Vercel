        }
        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        .btn-hover-fx {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .dark .btn-hover-fx:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .ability-btn:not(:disabled) {
            animation: pulseGlowLight 2s infinite alternate;
        }
        .dark .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
            animation: pulseGlowDark 2s infinite alternate;
        }
        @keyframes pulseGlowLight {
            from { box-shadow: 0 0 5px rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.3); }
            to { box-shadow: 0 0 15px rgba(59,130,246,0.5); border-color: rgba(59,130,246,0.6); }
        }
        @keyframes pulseGlowDark {
            from { box-shadow: 0 0 5px rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
            to { box-shadow: 0 0 20px rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.8); }
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }
        .floating-text {
            position: absolute;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .shake-screen {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .flash-warning {
            animation: flashBg 0.4s ease-in-out;
        }
        @keyframes flashBg {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(234, 88, 12, 0.25); border-color: rgba(234, 88, 12, 0.8); }
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status-error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
        }
    </style>
</head>
