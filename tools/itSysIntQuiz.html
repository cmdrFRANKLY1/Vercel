        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: #f8fafc; /* slate-50 */
            overflow: hidden;
            user-select: none;
        }

        .font-mono {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Screen shake for errors */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* Success & Error Flashes */
        .flash-correct {
            animation: flashSuccess 0.6s ease-out;
        }
        @keyframes flashSuccess {
            0% { background-color: rgba(255, 255, 255, 0.2); }
            100% { background-color: transparent; }
        }

        .flash-error {
            animation: flashError 0.6s ease-out;
        }
        @keyframes flashError {
            0% { background-color: rgba(255, 0, 0, 0.1); }
            100% { background-color: transparent; }
        }
        
        /* Heart pulse */
        .flash-heart {
            animation: heartPulse 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes heartPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px #fff); }
            50% { transform: scale(1.6); filter: drop-shadow(0 0 10px #fff); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px #fff); }
        }

        /* Ambient Glitch / Scanline */
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.015),
                rgba(255, 255, 255, 0.015) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 50;
            opacity: 0.5;
        }

        /* Canvas for Confetti & Particles */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        /* Floating text animation */
        .floating-text {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        /* UI Enhancements */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); /* slate-800 with opacity */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-hover-fx {
            transition: all 0.2s ease;
        }
        .btn-hover-fx:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border-color: transparent;
        }
        .btn-hover-fx:active:not(:disabled) {
            transform: translateY(1px);
        }

        /* Abilities */
        .ability-btn {
            transition: all 0.3s ease;
        }
        .ability-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .ability-btn:not(:disabled) {
            box-shadow: 0 0 15px rgba(255,255,255,0.1);

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let lives = 3;
        let maxLives = 5;
        let streak = 0;
        let isTransitioning = false;
        
        let globalMultiplier = 1;
        let correctStreak = 0;
        let minigameInterval = null;
        let mgTime = 0;

        let globalTime = 0;
        let questionTime = 30;
        let globalInterval = null;
        let questionInterval = null;

        const startScreen = document.getElementById('start-screen');
        const gameUI = document.getElementById('game-ui');
        const gameOverScreen = document.getElementById('game-over-screen');
        const questionText = document.getElementById('question-text');
        const answersContainer = document.getElementById('answers-container');
        const livesDisplay = document.getElementById('lives-display');
        const scoreDisplay = document.getElementById('score-display');
        const finalScore = document.getElementById('final-score');
        
        // Ability Buttons & HUD
        const abRemove1 = document.getElementById('ab-remove1');
        const abRemove2 = document.getElementById('ab-remove2');
        const abSkip = document.getElementById('ab-skip');
        const streakBars = document.getElementById('streak-bar').children;

        window.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('start-btn');
            startBtn.textContent = "START";
            startBtn.disabled = false;
            startBtn.onclick = startGame;
        });

        function startGame() {
            questions = [...rawQuestions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            lives = 3;
            streak = 0;
            correctStreak = 0;
            globalMultiplier = 1;
            isTransitioning = false;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameUI.classList.remove('hidden');
            gameUI.classList.add('flex');
            
            document.getElementById('minigame-panel').classList.add('hidden');
            document.getElementById('abilities-hud').classList.remove('hidden');
            document.getElementById('question-panel').classList.remove('hidden');

            startGlobalTimer();
            updateUI();
            displayQuestion();
        }

        function updateUI() {
            // Render Hearts
            livesDisplay.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                const heart = document.createElement('span');
                heart.innerHTML = '♥';
                livesDisplay.appendChild(heart);
            }
            
            scoreDisplay.textContent = score.toString().padStart(3, '0');

            // Render Streak Bar
            for(let i=0; i<5; i++) {
                if (i < streak) {
                    streakBars[i].className = "w-12 rounded-full bg-blue-400 shadow-[0_0_10px_#60a5fa] transition-colors duration-300";
                } else {
                    streakBars[i].className = "w-12 rounded-full bg-slate-800 border border-slate-700 transition-colors duration-300";
                }
            }
            
            scoreDisplay.textContent = score.toString().padStart(3, '0');
            
            const badge = document.getElementById('multiplier-badge');
            if (globalMultiplier > 1) {
                badge.textContent = `x${globalMultiplier} MULTI`;
                if(globalMultiplier >= 4) {
                    badge.className = "absolute -top-3 -left-4 bg-orange-600 border border-orange-400 text-white text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-[0_0_15px_rgba(234,88,12,0.8)] transition-all opacity-100 scale-100 animate-pulse z-10";
                } else {
                    badge.className = "absolute -top-3 -left-4 bg-blue-600 border border-blue-400 text-white text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-[0_0_10px_rgba(37,99,235,0.8)] transition-all opacity-100 scale-100 z-10";
                }
            } else {
                badge.className = "absolute -top-3 -left-4 bg-blue-600 border border-blue-400 text-white text-[11px] font-mono tracking-widest font-bold px-2 py-1 rounded-lg shadow-[0_0_10px_rgba(37,99,235,0.8)] transition-all opacity-0 scale-90 -z-10";
            }

            // Update Ability Buttons
            abRemove1.disabled = streak < 2;
            abRemove2.disabled = streak < 3;
            abSkip.disabled = streak < 4;
        }

        function startGlobalTimer() {
            clearInterval(globalInterval);
            globalTime = 0;
            updateGlobalTimerUI();
            globalInterval = setInterval(() => {
                globalTime++;
                updateGlobalTimerUI();
            }, 1000);
        }

        function updateGlobalTimerUI() {
            const m = Math.floor(globalTime / 60).toString().padStart(2, '0');
            const s = (globalTime % 60).toString().padStart(2, '0');
            document.getElementById('global-timer').textContent = `${m}:${s}`;
        }

        function startQuestionTimer() {
            clearInterval(questionInterval);
            questionTime = 30;
            updateQuestionTimerUI();
            
            setTimeout(() => {
                questionInterval = setInterval(() => {
                    questionTime--;
                    updateQuestionTimerUI();
                    if (questionTime <= 0) {
                        clearInterval(questionInterval);
                        handleTimeout();
                    }
                }, 1000);
            }, 300); // Slight delay to sync with answer fade-in
        }

        function updateQuestionTimerUI() {
            document.getElementById('question-timer-text').textContent = `${questionTime}s`;
            const pct = (questionTime / 30) * 100;
            const bar = document.getElementById('question-timer-bar');
            bar.style.width = `${pct}%`;
            
            // Turn red when 5 seconds or less remain
            if (questionTime <= 5) {
                bar.classList.remove('bg-blue-400', 'shadow-[0_0_10px_rgba(96,165,250,0.5)]');
                bar.classList.add('bg-red-500', 'shadow-[0_0_10px_rgba(239,68,68,0.8)]');
            } else {
                bar.classList.add('bg-blue-400', 'shadow-[0_0_10px_rgba(96,165,250,0.5)]');
                bar.classList.remove('bg-red-500', 'shadow-[0_0_10px_rgba(239,68,68,0.8)]');
            }
        }

        function handleTimeout() {
            if (isTransitioning) return;
            isTransitioning = true;
            
            correctStreak = 0;
            globalMultiplier = 1;
            streak = 0;
            lives--;
            
            document.body.classList.add('shake', 'flash-error');
            setTimeout(() => document.body.classList.remove('shake', 'flash-error'), 400);
            
            const buttons = answersContainer.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            
            // Highlight the correct answer since they ran out of time
            buttons.forEach(btn => {
                if(btn.dataset.correct === 'true') {
                    btn.classList.add('border-white', 'text-white', 'bg-slate-700');
                }
            });

            updateUI();

            setTimeout(() => {
                nextStep();
            }, 1500);
        }

        function displayQuestion() {
            if (lives <= 0) return;
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            const q = questions[currentQuestionIndex];
            
            answersContainer.style.opacity = '0';
            answersContainer.innerHTML = '';
            
            questionText.textContent = `> ${q.frage}`;
            
            startQuestionTimer();

            // Brief pause before fading in answers
            setTimeout(() => {
                renderAnswers(q);
            }, 300);
        }

        function renderAnswers(q) {
            let answers = [...q.falscheAntworten, q.richtigeAntwort];
            answers = answers.sort(() => Math.random() - 0.5);

            answers.forEach((ans) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-slate-800/80 border border-slate-600 rounded-xl p-4 sm:p-5 text-sm sm:text-base transition-all duration-300 btn-hover-fx translate-y-2 opacity-0 shadow-lg';
                btn.textContent = ans;
                btn.dataset.correct = (ans === q.richtigeAntwort);
                
                btn.onclick = (e) => {
                    if(!isTransitioning) handleAnswer(btn.dataset.correct === 'true', btn, e);
                };
                answersContainer.appendChild(btn);
            });

            answersContainer.style.opacity = '1';
            
            // Staggered fade in
            const buttons = answersContainer.querySelectorAll('button');
            buttons.forEach((btn, index) => {
                setTimeout(() => {
                    btn.classList.remove('translate-y-2', 'opacity-0');
                }, index * 100 + 50);
            });
        }

        function handleAnswer(isCorrect, selectedBtn, event) {
            isTransitioning = true;
            
            clearInterval(questionInterval);
            
            const buttons = answersContainer.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true); // Prevent double clicking / ability use

            if (isCorrect) {
                correctStreak++;
                globalMultiplier = Math.min(1 + Math.floor(correctStreak / 3), 5); // Max x5 multiplier
                
                const points = 10 * globalMultiplier;
                score += points;
                streak++;
                
                document.body.classList.add('flash-correct');
                setTimeout(() => document.body.classList.remove('flash-correct'), 600);

                // Show floating text
                showFloatingText(`+${points}`, event.clientX, event.clientY);
                
                if (streak >= 5) {
                    lives++;
                    triggerConfetti(200); // Big explosion
                    const hearts = livesDisplay.querySelectorAll('span');
                    hearts.forEach(h => {
                        h.classList.add('flash-heart');
                        setTimeout(() => h.classList.remove('flash-heart'), 800);
                    });
                    showFloatingText("+1 LIFE", window.innerWidth/2, window.innerHeight/3);
                    streak = 0; // Reset streak after getting life
                }
                
                selectedBtn.classList.add('bg-green-600', 'text-white', 'border-green-400', 'shadow-[0_0_20px_rgba(34,197,94,0.6)]');
            } else {
                correctStreak = 0;
                globalMultiplier = 1;
                streak = 0;
                lives--;
                
                document.body.classList.add('shake', 'flash-error');
                setTimeout(() => document.body.classList.remove('shake', 'flash-error'), 400);
                
                selectedBtn.classList.remove('hover:bg-white', 'hover:text-black');
                selectedBtn.classList.add('bg-red-950', 'text-red-300', 'border-red-900', 'opacity-50'); 
                
                // Highlight correct answer
                buttons.forEach(btn => {
                    if(btn.dataset.correct === 'true') {
                        btn.classList.add('border-white', 'text-white', 'bg-slate-700');
                    }
                });
            }

            updateUI();

            setTimeout(() => {
                nextStep();
            }, 1200);
        }

        function useAbility(type) {
            if (isTransitioning) return;
            
            if (type === 'remove1' && streak >= 2) {
                streak -= 2;
                hideWrongAnswers(1);
            } else if (type === 'remove2' && streak >= 3) {
                streak -= 3;
                hideWrongAnswers(2);
            } else if (type === 'skip' && streak >= 4) {
                streak -= 4;
                isTransitioning = true;
                
                clearInterval(questionInterval);
                
                // Visual feedback for skip
                const buttons = answersContainer.querySelectorAll('button');
                buttons.forEach(btn => btn.disabled = true);
                
                showFloatingText("SKIPPED", window.innerWidth/2, window.innerHeight/2);
                triggerConfetti(50);
                updateUI();

                setTimeout(() => {
                    nextStep();
                }, 1000);
                return; // Return early, handled
            }
            updateUI();
        }

        function hideWrongAnswers(count) {
            const buttons = Array.from(answersContainer.querySelectorAll('button'));
            const wrongBtns = buttons.filter(btn => btn.dataset.correct === 'false' && !btn.disabled);
            
            // Shuffle wrong buttons so the removed ones are random
            wrongBtns.sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < count && i < wrongBtns.length; i++) {
                wrongBtns[i].disabled = true;
                wrongBtns[i].classList.remove('bg-slate-800/80', 'border-slate-600', 'shadow-lg');
                wrongBtns[i].classList.add('opacity-20', 'bg-slate-900', 'border-slate-800', 'cursor-not-allowed');
            }
        }

        function nextStep(skipMinigameCheck = false) {
            if (lives <= 0) {
                endGame();
                return;
            }
            
            if (!skipMinigameCheck) {
                currentQuestionIndex++;
            }
            
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }
            
            // 20% chance for a minigame if we have at least 1 correct streak (so it doesn't pop up immediately after dying)
            if (!skipMinigameCheck && correctStreak > 0 && Math.random() < 0.20) {
                startMinigame(); 
            } else {
                isTransitioning = false;
                displayQuestion();
            }
        }

        function startMinigame() {
            isTransitioning = true;
            clearInterval(questionInterval);
            
            document.getElementById('abilities-hud').classList.add('hidden');
            document.getElementById('question-panel').classList.add('hidden');
            document.getElementById('minigame-panel').classList.remove('hidden');
            
            const types = ['nodes', 'upload', 'keypad', 'shields', 'wires'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            mgTime = 80; // 8.0 seconds
            
            if(type === 'nodes') setupNodesGame();
            else if(type === 'upload') setupUploadGame();
            else if(type === 'keypad') setupKeypadGame();
            else if(type === 'shields') setupShieldsGame();
            else if(type === 'wires') setupWiresGame();
            
            document.getElementById('minigame-timer').textContent = (mgTime/10).toFixed(1) + 's';
            
            clearInterval(minigameInterval);
            minigameInterval = setInterval(() => {
                mgTime--;
                document.getElementById('minigame-timer').textContent = (mgTime/10).toFixed(1) + 's';
                if(mgTime <= 0) {
                    endMinigame(false);
                }
            }, 100);
        }

        let expectedNode = 1;
        function setupNodesGame() {
            document.getElementById('minigame-title').textContent = "CALIBRATE NODES (1-5)";
            const content = document.getElementById('minigame-content');
            content.innerHTML = '';
            expectedNode = 1;
            
            for(let i=1; i<=5; i++) {
                let btn = document.createElement('button');
                btn.className = 'absolute w-12 h-12 bg-slate-800 border-2 border-orange-500 rounded-full text-white font-bold flex items-center justify-center transition-colors shadow-lg';
                btn.style.left = Math.random() * 80 + '%';
                btn.style.top = Math.random() * 60 + 10 + '%';
                btn.textContent = i;
                
                btn.onclick = () => {
                    if(i === expectedNode) {
                        btn.classList.replace('bg-slate-800', 'bg-green-600');
                        btn.classList.replace('border-orange-500', 'border-green-400');
                        expectedNode++;
                        if(expectedNode > 5) endMinigame(true);
                    } else if (i > expectedNode) {
                        // wrong sequence - flash red and reset
                        content.classList.add('shake', 'bg-red-900/50');
                        setTimeout(() => content.classList.remove('shake', 'bg-red-900/50'), 300);
                        setupNodesGame();
                    }
                };
                content.appendChild(btn);
            }
        }

                html += `<button onclick="handleKp('${i}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-white font-mono text-lg sm:text-xl w-10 h-10 sm:w-12 sm:h-12 transition-colors">${i}</button>`;
            }
            html += `<button onclick="handleKp('0')" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg text-white font-mono text-lg sm:text-xl w-10 h-10 sm:w-12 sm:h-12 col-start-2 transition-colors">0</button>`;
            html += `</div></div>`;
            content.innerHTML = html;
        }

        window.handleKp = function(num) {
            enteredKeypad += num;
            const display = document.getElementById('kp-display');
            display.textContent = enteredKeypad.padEnd(4, '_');
            if(enteredKeypad.length === 4) {
                if(enteredKeypad === expectedKeypad) {
                    display.classList.add('text-green-500', 'bg-green-900/30');
                    setTimeout(() => endMinigame(true), 200);
                } else {
                    enteredKeypad = "";
                    display.textContent = "ERR_";
                    display.classList.add('text-red-500', 'shake');
                    setTimeout(() => {
                        display.classList.remove('text-red-500', 'shake');
                        display.textContent = "____";
                    }, 400);
                }
            }
        };

        let shieldsRemaining = 0;
        function setupShieldsGame() {
            document.getElementById('minigame-title').textContent = "PRIME SHIELDS";
            const content = document.getElementById('minigame-content');
            content.innerHTML = `<div class="grid grid-cols-3 gap-3 p-4 h-full max-w-sm mx-auto" id="shields-container"></div>`;
            const container = document.getElementById('shields-container');
            
            shieldsRemaining = 0;
            for(let i=0; i<6; i++) {
                const isRed = Math.random() > 0.3; // 70% chance to be red
                if(isRed) shieldsRemaining++;
                
                const btn = document.createElement('button');
                btn.className = `w-full h-full rounded-xl border-2 transition-colors shadow-md ${isRed ? 'bg-red-900 border-red-500 hover:bg-red-800' : 'bg-slate-800 border-slate-600'}`;
                btn.onclick = () => {
                    if(btn.classList.contains('bg-red-900')) {
                        btn.className = 'w-full h-full rounded-xl border-2 transition-colors shadow-md bg-slate-800 border-slate-600';
                        shieldsRemaining--;
                        if(shieldsRemaining <= 0) endMinigame(true);
                    }
                };
                container.appendChild(btn);
            }
            if(shieldsRemaining === 0) endMinigame(true);
        }

        let wireColors = ['#ef4444', '#3b82f6', '#eab308', '#22c55e'];
        let wiresLeft = [];
        let wiresRight = [];
        let selectedLeft = null;
        let matchedCount = 0;
        
        function setupWiresGame() {
            document.getElementById('minigame-title').textContent = "CONNECT WIRES";
            const content = document.getElementById('minigame-content');
            
            wiresLeft = [...wireColors].sort(() => Math.random() - 0.5);
            wiresRight = [...wireColors].sort(() => Math.random() - 0.5);
            selectedLeft = null;
            matchedCount = 0;
            
            let html = `<div class="flex justify-between items-center h-full px-10 sm:px-16 relative">
                <div class="flex flex-col justify-around h-full py-3" id="wires-left">`;
            wiresLeft.forEach((color, i) => {
                html += `<button id="wl-${i}" onclick="selectWireL(${i}, '${color}')" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-white/50 shadow-[0_0_15px_${color}] hover:scale-110 transition-transform" style="background-color: ${color}"></button>`;
            });
            html += `</div>
                <div class="flex flex-col justify-around h-full py-3" id="wires-right">`;
            wiresRight.forEach((color, i) => {
                html += `<button id="wr-${i}" onclick="selectWireR(${i}, '${color}')" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-white/50 shadow-[0_0_15px_${color}] hover:scale-110 transition-transform" style="background-color: ${color}"></button>`;
            });
            html += `</div></div>`;
            content.innerHTML = html;
        }
        
        window.selectWireL = function(idx, color) {
            for(let i=0; i<4; i++) {
                let el = document.getElementById('wl-'+i);
                if(el) el.classList.remove('border-4', 'border-white');
            }
            let el = document.getElementById('wl-'+idx);
            if(el) el.classList.add('border-4', 'border-white');
            selectedLeft = {idx, color};
        };
        
        window.selectWireR = function(idx, color) {
            if(!selectedLeft) return;
            if(selectedLeft.color === color) {
                let elL = document.getElementById('wl-'+selectedLeft.idx);
                let elR = document.getElementById('wr-'+idx);
                if(elL) { elL.style.opacity = '0.2'; elL.onclick = null; elL.classList.remove('border-4', 'border-white'); }
                if(elR) { elR.style.opacity = '0.2'; elR.onclick = null; }
                selectedLeft = null;
                matchedCount++;
                if(matchedCount >= 4) endMinigame(true);
            } else {
                const content = document.getElementById('minigame-content');
                content.classList.add('shake', 'bg-red-900/50');
                setTimeout(() => content.classList.remove('shake', 'bg-red-900/50'), 300);
                selectedLeft = null;
                for(let i=0; i<4; i++) {
                    let el = document.getElementById('wl-'+i);
                    if(el) el.classList.remove('border-4', 'border-white');
                }
            }
        };

        function endMinigame(success) {
            clearInterval(minigameInterval);
            
            if (success) {
                const points = 50 * globalMultiplier;
                score += points;
                showFloatingText(`TASK COMPLETE +${points}`, window.innerWidth/2, window.innerHeight/2);
                document.body.classList.add('flash-correct');
                setTimeout(() => document.body.classList.remove('flash-correct'), 600);
                updateUI();
            } else {
                showFloatingText("TASK FAILED", window.innerWidth/2, window.innerHeight/2);
                document.body.classList.add('shake', 'flash-error');
                setTimeout(() => document.body.classList.remove('shake', 'flash-error'), 400);
            }
            
            setTimeout(() => {
                document.getElementById('minigame-panel').classList.add('hidden');
                document.getElementById('abilities-hud').classList.remove('hidden');
                document.getElementById('question-panel').classList.remove('hidden');
                
                isTransitioning = false;
                nextStep(true); // Pass true to skip a back-to-back minigame
            }, 1200);
        }

        function showFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = text;
            el.style.left = (x - 20) + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function endGame() {
            clearInterval(globalInterval);
            clearInterval(questionInterval);
            
            gameUI.classList.add('hidden');
            gameUI.classList.remove('flex');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            finalScore.textContent = score.toString().padStart(3, '0');
        }

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.vx = (Math.random() - 0.5) * 25;
                this.vy = (Math.random() - 0.5) * 25;
                this.size = Math.random() * 5 + 2;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                
                // Nice premium colors: whites, light blues, silvers
                const colors = [
                    '255, 255, 255', // White
                    '148, 163, 184', // slate-400
                    '56, 189, 248',  // light blue
                    '226, 232, 240'  // slate-200
                ];
                const baseColor = colors[Math.floor(Math.random() * colors.length)];
                this.color = `rgba(${baseColor}, `;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Gravity
                this.life -= this.decay;
            }
            draw() {
                ctx.shadowBlur = 10;
                ctx.shadowColor = "rgba(255, 255, 255, 0.5)";
                ctx.fillStyle = this.color + this.life + ")";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function triggerConfetti(amount = 100) {
            for (let i = 0; i < amount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
