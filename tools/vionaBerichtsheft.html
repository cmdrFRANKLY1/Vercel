<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFCC · Berichtshefte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        *:not(input):not(textarea):not(.day-content) {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        input, textarea, .day-content, .day-content * {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
        }

        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sub-color: #475569;
            --border-color: #cbd5e1;
            --border-hover: #64748b;
            --box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover-border: #94a3b8;
            --hover-bg: #f1f5f9;
            --input-bg: #ffffff;
            --focus-ring: 0 0 0 3px rgba(100, 116, 139, 0.2);
            --card-radius: 12px;
            --toggle-radius: 12px;
            --badge-fisi: #64748b;
            --scrollbar-thumb: #cbd5e1;
            --calendar-border: #e2e8f0;
            --calendar-today-bg: #eff6ff;
            --calendar-today-border: #3b82f6;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --sub-color: #9aa0a6;
            --border-color: #3c4043;
            --border-hover: #9aa0a6;
            --box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            --btn-bg: #303134;
            --btn-border: #3c4043;
            --btn-hover-border: #5f6368;
            --hover-bg: #3c4043;
            --input-bg: #202124;
            --focus-ring: 0 0 0 3px rgba(154, 160, 166, 0.25);
            --badge-fisi: #5f6368;
            --scrollbar-thumb: #5f6368;
            --calendar-border: #3c4043;
            --calendar-today-bg: rgba(138, 180, 248, 0.1);
            --calendar-today-border: #8ab4f8;
        }

        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 84px;
            background-color: var(--bg-color);
            z-index: 900;
            transition: background-color 0.2s;
        }

        .top-right {
            position: fixed;
            top: 20px; right: 24px;
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; justify-content: flex-end; z-index: 1000;
        }

        .top-left {
            position: fixed;
            top: 20px; left: 24px;
            display: flex; align-items: center; gap: 10px;
            z-index: 1000;
            max-width: calc(100% - 350px);
        }

        .clickable-dt {
            font-size: 13px; font-weight: 600; color: var(--text-color);
            padding: 0 14px; border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border); background: var(--btn-bg);
            box-shadow: var(--box-shadow); cursor: pointer;
            height: 44px; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease; text-decoration: none;
        }
        .clickable-dt:hover:not(.no-hover) {
            background: var(--hover-bg);
            border-color: var(--border-hover);
        }
        .no-hover {
            cursor: default; pointer-events: none;
        }

        .view-tab {
            font-size: 13px; font-weight: 600;
            padding: 0 16px; border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border); background: var(--btn-bg);
            box-shadow: var(--box-shadow);
            height: 44px; display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s ease;
            color: var(--sub-color); fill: var(--sub-color);
        }
        .view-tab:hover {
            background: var(--hover-bg); border-color: var(--border-hover);
            color: var(--text-color); fill: var(--text-color);
        }
        .view-tab.active-tab {
            color: var(--text-color) !important;
            fill: var(--text-color) !important;
            border-color: var(--border-hover);
            background: var(--hover-bg);
        }
        .view-tab svg { width: 16px; height: 16px; transition: fill 0.2s; }

        .retention-part, .date-part, .time-part { font-weight: 600; }

        .lang-toggle, .theme-toggle {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            border-radius: var(--toggle-radius); height: 44px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--box-shadow); cursor: pointer;
            font-size: 14px; font-weight: 600; color: var(--text-color);
            transition: all 0.2s ease;
        }
        .lang-toggle { padding: 0 16px; }
        .theme-toggle { width: 44px; color: var(--sub-color); }
        .lang-toggle:hover, .theme-toggle:hover { background: var(--hover-bg); border-color: var(--border-hover); }
        .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }

        .profile-container { position: relative; display: flex; align-items: center; }
        .profile-pic-wrapper {
            width: 44px; height: 44px; border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border); box-shadow: var(--box-shadow);
            cursor: pointer; background-color: var(--btn-bg);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            transition: all 0.2s ease;
        }
        .profile-pic-wrapper:hover { border-color: var(--border-hover); }
        .profile-fallback-icon { width: 24px; height: 24px; fill: var(--sub-color); }

        .main-content {
            margin-top: 84px; padding: 0 24px 60px 24px;
            max-width: 1600px; margin-left: auto; margin-right: auto;
            display: flex; flex-direction: column; gap: 24px;
        }

        .controls-row {
            display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
            position: sticky; top: 84px; z-index: 900;
            background-color: var(--bg-color);
            padding: 20px 24px 24px 24px; margin: 0 -24px; 
            border-bottom: 1px solid var(--border-color);
        }

        .search-wrapper {
            flex: 1; min-width: 250px; display: flex; align-items: center;
            padding: 0 16px; border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border); background: var(--input-bg);
            height: 44px; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-wrapper:focus-within { border-color: var(--border-hover); box-shadow: var(--focus-ring); }
        .search-wrapper svg { width: 18px; height: 18px; fill: var(--sub-color); margin-right: 12px; }
        .search-wrapper input {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-color); font-size: 14px; font-weight: 500; height: 100%;
        }

        .card-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        
        .report-card {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            border-radius: var(--card-radius); box-shadow: var(--box-shadow);
            transition: all 0.2s ease; overflow: hidden;
        }
        .report-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
        .card-header {
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
            padding: 24px; gap: 12px; cursor: pointer; user-select: none;
            transition: background 0.2s ease;
        }
        .card-header:hover { background: var(--hover-bg); }
        .report-card:not(.collapsed) .card-header { border-bottom: 1px solid var(--border-color); }
        .card-body { padding: 24px; display: block; }
        .report-card.collapsed .card-body { display: none; }

        .card-title { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 12px; }
        .card-title svg { width: 22px; height: 22px; fill: var(--border-hover); }

        .card-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge {
            background: var(--input-bg); padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600; color: var(--text-color);
            border: 1px solid var(--border-color); display: inline-flex; align-items: center; gap: 6px;
        }
        .badge-primary { background: var(--badge-fisi); color: #fff; border-color: var(--badge-fisi); }

        .chevron { transition: transform 0.3s ease; color: var(--sub-color); }
        .report-card.collapsed .chevron { transform: rotate(-90deg); }

        .day-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
        .day-card {
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 14px; border-left: 4px solid var(--border-hover);
            display: flex; flex-direction: column; min-height: 120px;
        }
        .day-card:hover { background: var(--hover-bg); }
        .day-name {
            font-weight: 700; font-size: 13px; margin-bottom: 8px;
            padding-bottom: 8px; border-bottom: 1px solid var(--border-color);
        }
        .day-date-sub { font-size: 11px; font-weight: 500; color: var(--sub-color); margin-top: 2px; }
        
        .day-content {
            font-size: 13px; line-height: 1.5; color: var(--sub-color);
            white-space: pre-wrap; word-break: break-word; flex: 1;
            overflow-y: auto; max-height: 150px; padding-right: 4px;
        }
        .day-content::-webkit-scrollbar { width: 4px; }
        .day-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        .day-empty { color: var(--sub-color); font-style: italic; font-size: 12px; }

        .calendar-container { display: none; width: 100%; }
        .calendar-header-controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding: 0 4px; flex-wrap: wrap; gap: 12px;
        }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; width: 100%;
        }
        .cal-day-header {
            text-align: center; font-weight: 700; font-size: 13px; color: var(--sub-color);
            padding-bottom: 6px; border-bottom: 1px solid var(--border-color);
        }
        .cal-cell {
            background: var(--btn-bg); border: 1px solid var(--calendar-border);
            border-radius: 8px; min-height: 110px; padding: 8px;
            display: flex; flex-direction: column; transition: all 0.2s;
            overflow: hidden;
        }
        .cal-cell.empty { background: transparent; border-color: transparent; }
        .cal-cell.today { background: var(--calendar-today-bg); border-color: var(--calendar-today-border); }
        .cal-cell.has-entry { cursor: pointer; }
        .cal-cell.has-entry:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--box-shadow); }
        .cal-date { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
        .cal-preview { font-size: 11px; color: var(--sub-color); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; word-break: break-word; }

        .detailed-container { display: none; width: 100%; flex-direction: column; gap: 24px; }
        .analytics-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
        .analytics-card {
            background: var(--btn-bg); border: 1px solid var(--btn-border);
            border-radius: var(--card-radius); padding: 24px; box-shadow: var(--box-shadow);
            display: flex; flex-direction: column; gap: 16px;
        }
        .analytics-card.full-width { grid-column: span 2; }
        .analytics-card h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: var(--text-color); }
        .analytics-card h3 svg { width: 20px; height: 20px; fill: var(--border-hover); }
        .timer-display {
            font-family: "JetBrains Mono", monospace; font-size: 22px; font-weight: 700;
            color: var(--calendar-today-border); padding: 16px; background: var(--input-bg);
            border: 1px solid var(--border-color); border-radius: 8px; text-align: center;
        }
        .word-search-input {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--btn-border);
            background: var(--input-bg); color: var(--text-color); font-size: 13px; outline: none;
        }
        .word-search-input:focus { border-color: var(--border-hover); box-shadow: var(--focus-ring); }
        
        .pos-category-container { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .pos-section { display: flex; flex-direction: column; gap: 8px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; }
        .pos-title { font-size: 14px; font-weight: 700; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .word-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .word-list::-webkit-scrollbar { width: 4px; }
        .word-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        .word-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: var(--btn-bg); border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 13px; font-weight: 500;
        }
        .word-count-badge { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 12px; padding: 2px 8px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; }

        .empty-state {
            text-align: center; padding: 60px 20px; background: var(--btn-bg);
            border-radius: var(--card-radius); border: 1px dashed var(--border-hover);
        }
        .empty-state svg { width: 48px; height: 48px; fill: var(--sub-color); margin-bottom: 16px; }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 48px; height: 48px; border: 4px solid var(--border-color);
            border-top: 4px solid var(--border-hover); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 24px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 1200px) { 
            .day-grid { grid-template-columns: repeat(3, 1fr); }
            .pos-category-container { grid-template-columns: 1fr; }
        }
        @media (max-width: 900px) {
            body::before { display: none; }
            .day-grid { grid-template-columns: repeat(2, 1fr); }
            .top-left { max-width: 100%; position: relative; top: 0; left: 0; padding: 20px 24px 0; justify-content: center; flex-wrap: wrap; }
            .top-right { max-width: 100%; position: relative; top: 0; right: 0; padding: 20px 24px 0; justify-content: center; }
            .main-content { margin-top: 0; padding-top: 24px; }
            .controls-row { top: 0; padding-top: 16px; margin-top: -24px; }
            .calendar-grid { grid-template-columns: repeat(1, 1fr); }
            .cal-day-header { display: none; }
            .cal-cell { min-height: 80px; }
            .analytics-grid { grid-template-columns: 1fr; }
            .analytics-card.full-width { grid-column: span 1; }
        }
        @media (max-width: 600px) {
            .day-grid { grid-template-columns: 1fr; }
            .controls-row { flex-direction: column; align-items: stretch; }
            .search-wrapper { width: 100%; }
        }
    </style>
</head>
<body data-theme="dark">
    <div id="loadingScreen" class="loading-screen">
        <div id="loadingSpinner" class="spinner"></div>
        <div style="font-size: 20px; font-weight: 600; text-align: center;">
            Generating Environment...<br>
            <span id="statusLine" style="font-size: 14px; color: var(--sub-color); font-weight: 500;">Fetching Reports via GitHub API...</span>
        </div>
    </div>

    <div class="top-left">
        <a href="../index.html" class="clickable-dt" aria-label="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="clickable-dt no-hover">VIONA</div>
        
        <button class="view-tab active-tab" id="listViewBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
            <span id="subTitleText">Report Books</span>
        </button>
        <button class="view-tab" id="calViewBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            <span id="viewToggleText">Calendar View</span>
        </button>
        <button class="view-tab" id="detailViewBtn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            <span id="detailToggleText">Detailed View</span>
        </button>
    </div>

    <div class="top-right">
        <span class="clickable-dt retention-part no-hover" id="retentionClick">00:00:00</span>
        <span class="clickable-dt date-part no-hover" id="dateClick">---</span>
        <span class="clickable-dt time-part no-hover" id="timeClick">--:--:--</span>
        <button class="lang-toggle" id="langToggle">EN</button>
        <button class="theme-toggle" id="themeToggle">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
            </svg>
        </button>
        <div class="profile-container">
            <div class="profile-pic-wrapper" id="profilePicWrapper">
                <svg class="profile-fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="controls-row">
            <div class="search-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Search by week, topic, day..." />
            </div>
            <button class="clickable-dt" id="refreshBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                <span id="lblRefresh">Refresh</span>
            </button>
            <div class="clickable-dt no-hover"><span id="lblReports">Reports:</span> <strong id="totalCount" style="margin-left:6px;">0</strong></div>
            <div class="clickable-dt no-hover"><span id="lblWeeks">Weeks:</span> <strong id="weekCount" style="margin-left:6px;">0</strong></div>
            <div class="clickable-dt no-hover"><span id="lblDays">Days:</span> <strong id="dayCount" style="margin-left:6px;">0</strong></div>
        </div>

        <div id="cardGrid" class="card-grid"></div>

        <div id="calendarContainer" class="calendar-container">
            <div class="calendar-header-controls">
                <div style="display: flex; gap: 8px;">
                    <button class="clickable-dt" id="firstMonthBtn">« First</button>
                    <button class="clickable-dt" id="prevMonthBtn">‹ Prev</button>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <h2 id="calendarMonthTitle" style="font-size: 18px; font-weight: 700;">Month Year</h2>
                    <button class="clickable-dt" id="todayBtn" style="height: 30px; font-size: 12px; background: var(--input-bg);">Today</button>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="clickable-dt" id="nextMonthBtn">Next ›</button>
                    <button class="clickable-dt" id="lastMonthBtn">Last »</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div id="detailedContainer" class="detailed-container">
            <div class="analytics-grid">
                <div class="analytics-card">
                    <h3>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                        <span id="lblTimePassed">Time passed since Day One</span>

                    `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;
            });

            setInterval(() => {

                const locale = currentLang === "en" ? "en-US" : "de-DE";

                retentionSeconds++;

            listViewBtn.addEventListener('click', () => switchView('list'));

            async function fetchReportFiles() {
                const response = await fetch(`https://api.github.com/repos/cmdrFRANKLY1/Viona/contents/Reports`);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const data = await response.json();
                const docFiles = data.filter(i => i.type === 'file' && (i.name.toLowerCase().endsWith('.doc') || i.name.toLowerCase().endsWith('.docx')));
                
                const reports = docFiles.map(item => {
                    const rawUrl = `https://raw.githubusercontent.com/cmdrFRANKLY1/Viona/main/Reports/${encodeURIComponent(item.name)}`;
                    
                    let mondayDate = null;
                    const dateRegex = /(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{2,4})/;
                    const match = item.name.match(dateRegex);
                    
                    if (match) {
                        let d = parseInt(match[1]);
                        let m = parseInt(match[2]) - 1;
                        let y = parseInt(match[3]);
                        if (y < 100) y += 2000;
                        const parsed = new Date(y, m, d);
                        const day = parsed.getDay();
                        const diff = parsed.getDate() - day + (day === 0 ? -6 : 1);
                        mondayDate = new Date(parsed.setDate(diff));
                    }

                    return { name: item.name, url: rawUrl, mondayDate: mondayDate, isFisi: item.name.toLowerCase().includes('fisi'), days: {} };
                });
                return reports.sort((a, b) => (a.mondayDate ? a.mondayDate.getTime() : 0) - (b.mondayDate ? b.mondayDate.getTime() : 0));
            }

            async function fetchAndParseDocx(report) {
                try {
                    const response = await fetch(report.url);
                    if (!response.ok) return;
                    const zip = await JSZip.loadAsync(await response.arrayBuffer());
                    const docFile = zip.file('word/document.xml');
                    if (!docFile) return;
                    
                    const xmlText = await docFile.async('string');
                    const paragraphs = [];
                    const pRegex = /<w:p[^>]*>([\s\S]*?)<\/w:p>/g;
                    let pMatch;
                    while ((pMatch = pRegex.exec(xmlText)) !== null) {
                        const tMatches = pMatch[1].match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || [];
                        const pText = tMatches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(t => t.length > 0).join(' ');
                        if (pText) paragraphs.push(pText);
                    }

                    const excludePatterns = [/unterschrift/i, /signature/i, /auszubildende/i, /ausbildende/i, /bestätigt/i, /richtigkeit/i];
                    const fullText = paragraphs.filter(p => !excludePatterns.some(pat => pat.test(p.toLowerCase()))).join('\n');
                    
                    const days = {};
                    const daysPattern = PARSE_DAY_NAMES.join('|');
                    for (let i = 0; i < PARSE_DAY_NAMES.length; i++) {
                        const dayName = PARSE_DAY_NAMES[i];
                        let match = fullText.match(new RegExp('(?:^|\\n)\\s*' + dayName + '[\\s\\-:;]*([\\s\\S]*?)(?=\\n\\s*(?:' + daysPattern + ')|$)', 'i'));
                        if (!match) match = fullText.match(new RegExp(dayName + '[\\s\\-:;]*([\\s\\S]*?)(?=' + daysPattern + '|$)', 'i'));

                        if (match) {
                            let content = match[1].trim()
                                .replace(/\b\d+\s*(?:h|Std\.|Stunden)\b/gi, '')
                                .replace(/[–\-]\s*Selbständig.*$/gim, '')
                                .replace(/\d{2}\.\d{2}\.\d{4}\s*$/g, '');
                            
                            let formattedLines = [];
                            for (let line of content.split('\n').map(l => l.trim()).filter(l => l.length > 0)) {
                                line = line.replace(/-{2,}/g, '-');
                                if (/^[-*•+]\s/.test(line)) line = line.replace(/^[-*•+]\s*/, '• ');
                                else if (/^[-*•+]/.test(line)) line = line.replace(/^[-*•+]/, '• ');
                                formattedLines.push(line);
                            }
                            formattedLines = formattedLines.filter(l => l !== '•' && l !== '-' && l.trim().length > 0);
                            content = formattedLines.join('\n').trim();
                            days[dayName] = { content: content.length > 0 ? content : '—' };
                        }
                    }
                    report.days = days;
                } catch (e) { console.warn(`Parse error for ${report.name}`); }
            }

            function render(reports) {
                const lang = i18n[currentLang];
                
                if (reports.length === 0) {
                    grid.innerHTML = `<div class="empty-state"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm0 14H4V8h16v12z"/></svg><h3>${lang.noReports}</h3></div>`;
                    document.getElementById('totalCount').textContent = 0;
                    return;
                }

                let html = '';
                for (const report of reports) {
                    const cardState = expandedCards.has(report.name) ? '' : 'collapsed';
                    
                    let titleStr = report.name.replace(/\.(doc|docx)$/i, '');
                    if (report.mondayDate) {

                    }

                    html += `
                        <div class="report-card ${cardState}" data-name="${report.name}">
                            <div class="card-header">
                                <div class="card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                    ${titleStr}
                                </div>
                                <div class="card-badges">
                                    ${report.isFisi ? '<span class="badge badge-primary">💻 FISI</span>' : ''}
                                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="day-grid">
                                    ${PARSE_DAY_NAMES.map((parseDay, idx) => {
                                        const data = report.days[parseDay];
                                        const hasContent = data && data.content && data.content !== '—';
                                        
                                        let dateSub = '';
                                        if (report.mondayDate) {
                                            const dayD = new Date(report.mondayDate);
                                            dayD.setDate(dayD.getDate() + idx);
                                            dateSub = formatLocalizedDate(dayD);
                                        }

                                        return `
                                            <div class="day-card">
                                                <div class="day-name">
                                                    <div style="display:flex; align-items:center; gap:6px;">${DAY_EMOJIS[idx]} ${lang.daysList[idx]}</div>
                                                    ${dateSub ? `<div class="day-date-sub">${dateSub}</div>` : ''}
                                                </div>
                                                <div class="day-content">${hasContent ? data.content : `<span class="day-empty">No entries logged.</span>`}</div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>`;
                }
                grid.innerHTML = html;
                
                document.getElementById('totalCount').textContent = reports.length;
                document.getElementById('weekCount').textContent = new Set(reports.map(r => r.mondayDate?.getTime()).filter(t => t)).size;
                document.getElementById('dayCount').textContent = reports.reduce((acc, r) => acc + Object.values(r.days).filter(d => d.content && d.content !== '—').length, 0);
            }

            grid.addEventListener('click', (e) => {
                const header = e.target.closest('.card-header');
                if (header) {
                    const card = header.parentElement;
                    const reportName = card.getAttribute('data-name');
                    
                    if (card.classList.contains('collapsed')) {
                        grid.querySelectorAll('.report-card:not(.collapsed)').forEach(c => c.classList.add('collapsed'));
                        card.classList.remove('collapsed');
                        expandedCards.clear();
                        expandedCards.add(reportName);
                        
                        setTimeout(() => {
                            const offset = 84 + document.querySelector('.controls-row').offsetHeight + 24;
                            window.scrollTo({ top: card.getBoundingClientRect().top + window.scrollY - offset, behavior: 'smooth' });
                        }, 150);
                    } else {
                        card.classList.add('collapsed');
                        expandedCards.delete(reportName);
                    }
                }
            });

            function getMinMaxDates() {
                const validDates = allReports.map(r => r.mondayDate?.getTime()).filter(t => !isNaN(t));
                if (validDates.length === 0) return { min: new Date(), max: new Date() };
                return { min: new Date(Math.min(...validDates)), max: new Date(Math.max(...validDates)) };
            }

            function renderCalendarView() {
                const lang = i18n[currentLang];
                const now = new Date();
                
                document.getElementById('calendarMonthTitle').textContent = `${lang.monthNames[calendarMonth]} ${calendarYear}`;

                const entryMap = {};
                for (const r of allReports) {
                    if (!r.mondayDate) continue;
                    for (let i = 0; i < 5; i++) {
                        const d = r.days[PARSE_DAY_NAMES[i]];
                        if (d && d.content && d.content !== '—') {
                            const exact = new Date(r.mondayDate); exact.setDate(exact.getDate() + i);
                            const k = `${exact.getFullYear()}-${exact.getMonth()}-${exact.getDate()}`;
                            entryMap[k] = d.content;
                        }
                    }
                }

                const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
                const offset = firstDay === 0 ? 6 : firstDay - 1;
                const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

                let html = lang.shortDays.map(d => `<div class="cal-day-header">${d}</div>`).join('');
                for (let i = 0; i < offset; i++) html += `<div class="cal-cell empty"></div>`;

                for (let i = 1; i <= daysInMonth; i++) {
                    const isToday = now.getFullYear() === calendarYear && now.getMonth() === calendarMonth && now.getDate() === i;
                    const key = `${calendarYear}-${calendarMonth}-${i}`;
                    const content = entryMap[key];
                    
                    html += `
                        <div class="cal-cell ${isToday ? 'today' : ''} ${content ? 'has-entry' : ''}" ${content ? `data-key="${key}"` : ''}>
                            <div class="cal-date">${i}</div>
                            ${content ? `<div class="cal-preview">${content.replace(/<[^>]*>?/gm, '')}</div>` : ''}
                        </div>
                    `;
                }
                
                const gridEl = document.getElementById('calendarGrid');
                gridEl.innerHTML = html;

                gridEl.querySelectorAll('.has-entry').forEach(cell => {
                    cell.addEventListener('click', () => {
                        const k = cell.getAttribute('data-key');
                        const parts = k.split('-');
                        const d = new Date(parts[0], parts[1], parts[2]);
                        document.getElementById('modalTitle').textContent = formatLocalizedDate(d);
                        document.getElementById('modalContent').textContent = entryMap[k];
                        document.getElementById('calendarModal').style.display = 'flex';
                    });
                });

                const { min, max } = getMinMaxDates();
                const atMin = calendarYear < min.getFullYear() || (calendarYear === min.getFullYear() && calendarMonth <= min.getMonth());
                const atMax = calendarYear > max.getFullYear() || (calendarYear === max.getFullYear() && calendarMonth >= max.getMonth());

                document.getElementById('prevMonthBtn').disabled = atMin;
                document.getElementById('firstMonthBtn').disabled = atMin;
                document.getElementById('nextMonthBtn').disabled = atMax;
                document.getElementById('lastMonthBtn').disabled = atMax;
            }

            function getEarliestDate() {
                const validDates = allReports.map(r => r.mondayDate?.getTime()).filter(t => !isNaN(t));
                if (validDates.length === 0) return new Date();
                return new Date(Math.min(...validDates));
            }

            function updateDetailedTimers() {
                const earliest = getEarliestDate();
                const now = new Date();
                
                const diffMs = now.getTime() - earliest.getTime();
                if (diffMs >= 0) {
                    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    const hrs = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    const secs = Math.floor((diffMs % (1000 * 60)) / 1000).toString().padStart(2, '0');
                    document.getElementById('timePassedDisplay').textContent = `${days} days, ${hrs}h ${mins}m ${secs}s`;
                } else {
                    document.getElementById('timePassedDisplay').textContent = `0 days, 00h 00m 00s`;
                }

                const target = new Date(earliest);
                target.setFullYear(target.getFullYear() + 2);
                const targetMs = target.getTime() - now.getTime();
                
                if (targetMs >= 0) {
                    const tDays = Math.floor(targetMs / (1000 * 60 * 60 * 24));
                    const tHrs = Math.floor((targetMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    const tMins = Math.floor((targetMs % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    const tSecs = Math.floor((targetMs % (1000 * 60)) / 1000).toString().padStart(2, '0');
                    document.getElementById('countdownDisplay').textContent = `${tDays} days, ${tHrs}h ${tMins}m ${tSecs}s`;
                } else {
                    document.getElementById('countdownDisplay').textContent = `Target reached!`;
                }
            }

            let computedWordCountsByPOS = {};

            function classifyGermanPOS(word) {
                const w = word.toLowerCase();
                const articles = new Set(['der', 'die', 'das', 'dem', 'den', 'des', 'ein', 'eine', 'einen', 'einem', 'einer', 'eines']);
                if (articles.has(w)) return 'artikel';

                const pronouns = new Set(['ich', 'du', 'er', 'sie', 'es', 'wir', 'ihr', 'mein', 'dein', 'sein', 'unser', 'euer', 'ihr', 'dieser', 'diese', 'dieses', 'jener', 'wer', 'was', 'man', 'sich', 'mich', 'dich', 'ihn', 'uns', 'euch']);
                if (pronouns.has(w)) return 'pronomen';

                const prepositions = new Set(['in', 'auf', 'mit', 'ohne', 'für', 'an', 'zu', 'von', 'aus', 'bei', 'nach', 'über', 'unter', 'durch', 'gegen', 'um', 'vor', 'während', 'wegen', 'ab']);
                if (prepositions.has(w)) return 'praepositionen';

                const conjunctions = new Set(['und', 'oder', 'aber', 'denn', 'weil', 'dass', 'wenn', 'obwohl', 'als', 'wie', 'während', 'bevor', 'nachdem', 'solange']);
                if (conjunctions.has(w)) return 'konjunktionen';

                if (/^[A-ZÄÖÜ]/.test(word) || w.endsWith('ung') || w.endsWith('keit') || w.endsWith('heit') || w.endsWith('nis') || w.endsWith('schaft') || w.endsWith('lein') || w.endsWith('chen')) {
                    return 'nomen';
                }

                if (w.endsWith('en') || w.endsWith('ern') || w.endsWith('eln') || w.startsWith('ge') && w.endsWith('t')) {
                    return 'verben';
                }

                if (w.endsWith('ig') || w.endsWith('lich') || w.endsWith('isch') || w.endsWith('bar') || w.endsWith('sam') || w.endsWith('los')) {
                    return 'adjektive';
                }

                return 'sonstige';
            }

            function computeWordFrequencies() {
                const posCategories = {
                    nomen: {}, verben: {}, adjektive: {}, artikel: {},
                    pronomen: {}, praepositionen: {}, konjunktionen: {}, sonstige: {}
                };

                for (const r of allReports) {
                    for (const dayKey of PARSE_DAY_NAMES) {
                        const content = r.days[dayKey]?.content;
                        if (content && content !== '—') {
                            const rawTokens = content.replace(/[^\w\säöüßÄÖÜ]/g, '').split(/\s+/);
                            for (const token of rawTokens) {
                                if (token.length > 1) {
                                    const category = classifyGermanPOS(token);
                                    const cleanKey = token.toLowerCase();
                                    posCategories[category][cleanKey] = (posCategories[category][cleanKey] || 0) + 1;
                                }
                            }
                        }
                    }
                }
                computedWordCountsByPOS = posCategories;
                renderWordList();
            }

            function renderWordList() {
                const container = document.getElementById('wordListContainer');
                const term = wordSearchTerm.toLowerCase();
                const langDict = i18n[currentLang].posNames;

                const orderedKeys = [
                    'nomen', 'verben',
                    'adjektive', 'artikel',
                    'pronomen', 'praepositionen',
                    'konjunktionen', 'sonstige'
                ];

                let html = '';
                for (const posKey of orderedKeys) {
                    const wordMap = computedWordCountsByPOS[posKey] || {};
                    const filteredEntries = Object.entries(wordMap)
                        .filter(([word]) => !term || word.includes(term))
                        .sort((a, b) => b[1] - a[1]);

                    html += `
                        <div class="pos-section">
                            <div class="pos-title">
                                <span>${langDict[posKey] || posKey}</span>
                                <span style="font-size:12px; font-family:'JetBrains Mono', monospace;">(${filteredEntries.length})</span>
                            </div>
                            <div class="word-list">
                                ${filteredEntries.length > 0 ? filteredEntries.slice(0, 30).map(([word, count]) => `
                                    <div class="word-row">
                                        <span>${word}</span>
                                        <span class="word-count-badge">${count}</span>
                                    </div>
                                `).join('') : `<div style="text-align:center; padding:10px; color:var(--sub-color); font-size:12px; font-style:italic;">No matches</div>`}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            }

            wordSearchInput.addEventListener('input', function() {
                wordSearchTerm = this.value;
                renderWordList();
            });

            function renderDetailedView() {
                updateDetailedTimers();
                computeWordFrequencies();
            }

            document.getElementById('firstMonthBtn').addEventListener('click', () => {
                const { min } = getMinMaxDates();
                if (!isNaN(min.getTime())) {
                    calendarYear = min.getFullYear();
                    calendarMonth = min.getMonth();
                    renderCalendarView();
                }
            });
            document.getElementById('lastMonthBtn').addEventListener('click', () => {
                const { max } = getMinMaxDates();
                if (!isNaN(max.getTime())) {
                    calendarYear = max.getFullYear();
                    calendarMonth = max.getMonth();
                    renderCalendarView();
                }
            });
            document.getElementById('prevMonthBtn').addEventListener('click', () => {
                const { min } = getMinMaxDates();
                let newM = calendarMonth - 1;
                let newY = calendarYear;
                if (newM < 0) { newM = 11; newY--; }
                if (newY > min.getFullYear() || (newY === min.getFullYear() && newM >= min.getMonth())) {
                    calendarMonth = newM; calendarYear = newY;
                    renderCalendarView();
                }
            });
            document.getElementById('nextMonthBtn').addEventListener('click', () => {
                const { max } = getMinMaxDates();
                let newM = calendarMonth + 1;
                let newY = calendarYear;
                if (newM > 11) { newM = 0; newY++; }
                if (newY < max.getFullYear() || (newY === max.getFullYear() && newM <= max.getMonth())) {
                    calendarMonth = newM; calendarYear = newY;
                    renderCalendarView();
                }
            });
            document.getElementById('todayBtn').addEventListener('click', () => {
                const now = new Date();
                calendarYear = now.getFullYear(); calendarMonth = now.getMonth();
                renderCalendarView();
            });

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('calendarModal').style.display = 'none';
            });

            document.getElementById('copyModalBtn').addEventListener('click', () => {
                const title = document.getElementById('modalTitle').textContent;
                const content = document.getElementById('modalContent').textContent;
                const textToCopy = `${title}\n${content}`;
                
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    const btn = document.getElementById('copyModalBtn');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                    setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
                } catch (err) {
                    console.warn('Copy failed', err);
                }
                document.body.removeChild(textarea);
            });

            searchInput.addEventListener('input', function() { 
                searchTerm = this.value.toLowerCase();
                filteredReports = searchTerm ? allReports.filter(r => 
                    r.name.toLowerCase().includes(searchTerm) || 
                    Object.values(r.days).map(d => d.content).join(' ').toLowerCase().includes(searchTerm)
                ) : [...allReports];
                if (currentView === 'list') render(filteredReports);
            });

            document.getElementById('refreshBtn').addEventListener('click', loadData);

            async function loadData() {
                const ls = document.getElementById("loadingScreen");
                try {
                    if (ls) ls.style.display = "flex";
                    updateStatus('Connecting to GitHub API...', 'waiting');
                    
                    const reports = await fetchReportFiles();
                    if (!reports.length) throw new Error("No files found");
                    allReports = reports;
                    
                    updateStatus('Parsing Document Structures...', 'waiting');
                    for (let i = 0; i < allReports.length; i++) {
                        await fetchAndParseDocx(allReports[i]);
                    }
                    
                    filteredReports = [...allReports];
                    updateStaticUIText();
                    if (currentView === 'list') render(filteredReports);
                    else if (currentView === 'calendar') renderCalendarView();
                    else if (currentView === 'detailed') renderDetailedView();

                } catch (err) {
                    grid.innerHTML = `<div class="empty-state"><h3 style="color:#ef4444;">${i18n[currentLang].errorLoading}</h3><p>${err.message}</p></div>`;
                } finally {
                    if (ls) { ls.style.opacity = 0; setTimeout(() => ls.style.display = "none", 500); }
                }
            }

            updateStaticUIText();
            setTimeout(loadData, 300);
        })();
    </script>
</body>
</html>
