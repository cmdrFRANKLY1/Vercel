<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFCC · Berichtsheft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        *:not(input):not(textarea):not(.day-content) {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        input, textarea, .day-content, .day-content * {
            user-select: text !important;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
        }

        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sub-color: #475569;
            --border-color: #cbd5e1;
            --border-hover: #64748b;
            --box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover-border: #94a3b8;
            --btn-text: #0f172a;
            --hover-bg: #f1f5f9;
            --input-bg: #ffffff;
            --focus-ring: 0 0 0 3px rgba(100, 116, 139, 0.2);
            --card-radius: 12px;
            --toggle-radius: 12px;
            --lang-toggle-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f1f5f9;
            --dropdown-border: #cbd5e1;
            --quick-btn-bg: #ffffff;
            --quick-btn-hover: #f1f5f9;
            --quick-btn-border: #cbd5e1;
            --fallback-icon-bg: #e2e8f0;
            --fallback-icon-color: #64748b;
            --badge-fisi: #64748b;
            --scrollbar-thumb: #cbd5e1;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --sub-color: #9aa0a6;
            --border-color: #3c4043;
            --border-hover: #9aa0a6;
            --box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            --btn-bg: #303134;
            --btn-border: #3c4043;
            --btn-hover-border: #5f6368;
            --btn-text: #e8eaed;
            --hover-bg: #3c4043;
            --input-bg: #202124;
            --focus-ring: 0 0 0 3px rgba(154, 160, 166, 0.25);
            --lang-toggle-bg: #303134;
            --dropdown-bg: #303134;
            --dropdown-hover: #3c4043;
            --dropdown-border: #3c4043;
            --quick-btn-bg: #303134;
            --quick-btn-hover: #3c4043;
            --quick-btn-border: #3c4043;
            --fallback-icon-bg: #3c4043;
            --fallback-icon-color: #9aa0a6;
            --badge-fisi: #5f6368;
            --scrollbar-thumb: #5f6368;
        }

        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            will-change: background-color, color;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Fixed solid background to prevent scrolling content from going behind top buttons */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 84px;
            background-color: var(--bg-color);
            z-index: 900;
            transition: background-color 0.2s;
        }

        .top-right {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            z-index: 1000;
        }

        .top-left {
            position: fixed;
            top: 20px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            max-width: calc(100% - 350px);
        }

        .clickable-dt {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            padding: 0 14px;
            border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            box-shadow: var(--box-shadow);
            cursor: pointer;
            line-height: 1.3;
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .clickable-dt:hover {
            background: var(--hover-bg);
            border-color: var(--border-hover);
        }

        .retention-part, .date-part, .time-part { font-weight: 600; color: var(--text-color); }

        .lang-toggle {
            background: var(--lang-toggle-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--toggle-radius);
            padding: 0 16px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--box-shadow);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            outline: none;
            transition: all 0.2s ease;
        }
        .lang-toggle:hover { background: var(--hover-bg); border-color: var(--border-hover); }

        .theme-toggle {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--toggle-radius);
            box-shadow: var(--box-shadow);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--sub-color);
            outline: none;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: var(--hover-bg); border-color: var(--border-hover); }
        .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; display: block; }

        .dynamic-title-box {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            padding: 0 16px;
            border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            box-shadow: var(--box-shadow);
            line-height: 1.3;
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .dynamic-title-box:hover {
            background: var(--hover-bg);
            border-color: var(--border-hover);
        }
        .dynamic-subtitle-box {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub-color);
            padding: 0 16px;
            border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            box-shadow: var(--box-shadow);
            line-height: 1.3;
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
        }

        .profile-container { position: relative; display: flex; align-items: center; }
        .profile-pic-wrapper {
            width: 44px;
            height: 44px;
            border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border);
            box-shadow: var(--box-shadow);
            cursor: pointer;
            background-color: var(--fallback-icon-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .profile-pic-wrapper:hover { border-color: var(--border-hover); }
        .profile-pic { width: 100%; height: 100%; object-fit: cover; display: none; }
        .profile-fallback-icon { width: 24px; height: 24px; fill: var(--fallback-icon-color); display: block; }
        
        .profile-panel {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: var(--card-radius);
            box-shadow: var(--box-shadow);
            width: 260px;
            padding: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 1000;
        }
        .profile-panel.active { display: flex; }
        .profile-panel-img-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--btn-border);
            background-color: var(--fallback-icon-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .profile-panel-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .profile-panel-fallback-icon { width: 40px; height: 40px; fill: var(--fallback-icon-color); display: block; }
        .profile-name { font-size: 16px; font-weight: 600; color: var(--text-color); margin-bottom: 4px; }
        .profile-email { font-size: 13px; color: var(--sub-color); margin-bottom: 4px; }
        .profile-dnd {
            font-size: 12px;
            color: var(--sub-color);
            margin-bottom: 16px;
            text-align: center;
            line-height: 1.5;
            padding: 8px 12px;
            background: var(--btn-bg);
            border-radius: 8px;
            width: 100%;
            border: 1px solid var(--btn-border);
        }
        .profile-action-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--card-radius);
            padding: 8px 16px;
            width: 100%;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .profile-action-btn:last-child { margin-bottom: 0; }
        .profile-action-btn:hover { background: var(--hover-bg); border-color: var(--border-hover); }

        .main-content {
            margin-top: 84px;
            padding: 0 24px 60px 24px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            position: sticky;
            top: 84px;
            z-index: 900;
            background-color: var(--bg-color);
            padding: 20px 24px 24px 24px; 
            margin: 0 -24px; 
            transition: background-color 0.2s;
            border-bottom: 1px solid var(--border-color);
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-radius: var(--toggle-radius);
            border: 1px solid var(--btn-border);
            background: var(--input-bg);
            box-shadow: var(--box-shadow);
            height: 44px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-wrapper:focus-within {
            border-color: var(--border-hover);
            box-shadow: var(--focus-ring);
        }
        .search-wrapper svg {
            width: 18px;
            height: 18px;
            fill: var(--sub-color);
            margin-right: 12px;
        }
        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 500;
            height: 100%;
        }
        .search-wrapper input::placeholder {
            color: var(--sub-color);
            font-weight: 400;
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        .report-card {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--card-radius);
            box-shadow: var(--box-shadow);
            transition: all 0.2s ease;
            overflow: hidden;
        }
        .report-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            background: transparent;
            transition: background 0.2s ease;
        }
        .card-header:hover {
            background: var(--hover-bg);
        }
        
        .report-card:not(.collapsed) .card-header {
            border-bottom: 1px solid var(--border-color);
        }

        .card-body {
            padding: 24px;
            padding-top: 20px;
            display: block;
        }

        .report-card.collapsed .card-body {
            display: none;
        }

        .card-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-title svg {
            width: 22px;
            height: 22px;
            fill: var(--border-hover);
        }

        .card-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .badge {
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-primary { background: var(--badge-fisi); color: #fff; border-color: var(--badge-fisi); }

        .chevron {
            transition: transform 0.3s ease;
            color: var(--sub-color);
        }
        .report-card.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }
        .day-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            border-left: 4px solid var(--border-hover);
            display: flex;
            flex-direction: column;
            min-height: 120px;
            transition: background 0.2s;
        }
        .day-card:hover {
            background: var(--hover-bg);
        }
        .day-name {
            font-weight: 700;
            font-size: 13px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .day-hours {
            margin-left: auto;
            font-size: 11px;
            color: var(--sub-color);
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .day-content {
            font-size: 13px;
            line-height: 1.5;
            color: var(--sub-color);
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            overflow-y: auto;
            max-height: 150px;
            padding-right: 4px;
        }
        .day-content::-webkit-scrollbar { width: 4px; }
        .day-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        .day-empty {
            color: var(--sub-color);
            font-style: italic;
            font-size: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            margin-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .download-btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .download-btn:hover {
            background: var(--hover-bg);
            border-color: var(--border-hover);
            color: var(--border-hover);
        }
        .download-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .source-indicator {
            position: fixed;
            bottom: 16px;
            left: 20px;
            font-size: 12px;
            color: var(--sub-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 2px;
            pointer-events: none;
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--border-hover);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            text-align: center;
            line-height: 1.8;
        }
        .loading-text .status-line {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--sub-color);
            margin-top: 6px;
        }
        .fade-out { opacity: 0; pointer-events: none; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--btn-bg);
            border-radius: var(--card-radius);
            color: var(--text-color);
            border: 1px dashed var(--border-hover);
            box-shadow: var(--box-shadow);
        }
        .empty-state svg { width: 48px; height: 48px; fill: var(--sub-color); margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; color: var(--sub-color); }

        @media (max-width: 1200px) {
            .day-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            body::before { display: none; }
            .day-grid { grid-template-columns: repeat(2, 1fr); }
            .top-left { max-width: 100%; position: relative; top: 0; left: 0; padding: 20px 24px 0; justify-content: center;}
            .top-right { max-width: 100%; position: relative; top: 0; right: 0; padding: 20px 24px 0; justify-content: center; }
            .main-content { margin-top: 0; padding-top: 24px; }
            .controls-row { top: 0; padding-top: 16px; margin-top: -24px; }
        }
        @media (max-width: 600px) {
            .day-grid { grid-template-columns: 1fr; }
            .controls-row { flex-direction: column; align-items: stretch; }
            .search-wrapper { width: 100%; }
            .clickable-dt { justify-content: center; }
        }
    </style>
</head>
<body data-theme="dark">
    <div id="loadingScreen" class="loading-screen">
        <div id="loadingSpinner" class="spinner"></div>
        <div id="loadingText" class="loading-text">
            Generating Environment...
            <span id="statusLine" class="status-line">Fetching Reports via GitHub API...</span>
        </div>
    </div>

    <div class="top-left">
        <a href="../index.html" class="dynamic-title-box" style="text-decoration: none;" title="Back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="dynamic-subtitle-box" id="appTitle">VIONA Report Book</div>
    </div>

    <div class="top-right">
        <span class="clickable-dt retention-part" id="retentionClick" title="Retention time (click to reset)">00:00:00</span>
        <span class="clickable-dt date-part" id="dateClick" title="Toggle date format">---</span>
        <span class="clickable-dt time-part" id="timeClick" title="Toggle time format">--:--:--</span>
        <button class="lang-toggle" id="langToggle">EN</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
            </svg>
        </button>
        <div class="profile-container">
            <div class="profile-pic-wrapper" id="profilePicWrapper">
                <img src="" alt="Profile" class="profile-pic" id="profilePic" />
                <svg class="profile-fallback-icon" id="profileFallbackIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="profile-panel" id="profilePanel">
                <div class="profile-panel-img-wrapper">
                    <img src="" alt="Profile" class="profile-panel-img" />
                    <svg class="profile-panel-fallback-icon" id="panelFallbackIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-email" id="profileEmail">loading@local.host</div>
                <div class="profile-dnd" id="profileDnd">Loading profile...</div>
                <button class="profile-action-btn">Account Settings</button>
                <button class="profile-action-btn">Sign Out</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="controls-row">
            <div class="search-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>

                    if (themeIcon) {

                            `<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>` :
                            `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;

            function updateDateTime() {
                try {
                    const now = new Date();
                    if (timeEl) timeEl.textContent = now.toLocaleTimeString(timeLocale, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
                    if (dateEl) dateEl.textContent = now.toLocaleDateString(dateLocale, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
                } catch (e) {}
            }

            function updateRetentionTimer() {
                retentionSeconds++;
                const hrs = Math.floor(retentionSeconds / 3600).toString().padStart(2, '0');
                const mins = Math.floor((retentionSeconds % 3600) / 60).toString().padStart(2, '0');
                const secs = (retentionSeconds % 60).toString().padStart(2, '0');
                if (retentionEl) retentionEl.textContent = `${hrs}:${mins}:${secs}`;
            }

            updateDateTime();
            setInterval(updateDateTime, 1000);
            setInterval(updateRetentionTimer, 1000);
            setAvatarImages();
            if (profileName) profileName.textContent = "Alex Walker";
            if (profileEmail) profileEmail.textContent = "alex.walker@local.host";
            if (profileDnd) profileDnd.innerHTML = `🏛️ Earth • 🎯 Curiosity<br>⚔️ Intelligence • Creativity`;

            const PARSE_DAY_NAMES = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];
            const DAY_EMOJIS = ['🌙', '🔥', '💧', '⚡', '⭐'];

            const REPO_OWNER = 'cmdrFRANKLY1';
            const REPO_NAME = 'Viona';
            const REPO_PATH = 'Reports';
            const BASE_RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${REPO_PATH}`;
            const API_TREE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${REPO_PATH}`;

            const grid = document.getElementById('cardGrid');
            const searchInput = document.getElementById('searchInput');
            const refreshBtn = document.getElementById('refreshBtn');
            const totalCount = document.getElementById('totalCount');
            const weekCount = document.getElementById('weekCount');
            const dayCount = document.getElementById('dayCount');
            const dataSourceStatus = document.getElementById('dataSourceStatus');

            let allReports = [];
            let filteredReports = [];
            let searchTerm = '';
            let expandedCards = new Set();

            async function extractDocxText(arrayBuffer) {
                try {
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    const docFile = zip.file('word/document.xml');
                    if (!docFile) return { text: '', days: {} };
                    const xmlText = await docFile.async('string');
                    
                    const paragraphs = [];
                    const pRegex = /<w:p[^>]*>([\s\S]*?)<\/w:p>/g;
                    let pMatch;
                    while ((pMatch = pRegex.exec(xmlText)) !== null) {
                        const pContent = pMatch[1];
                        const tMatches = pContent.match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || [];
                        const pText = tMatches.map(m => m.replace(/<[^>]*>/g, '').trim()).filter(t => t.length > 0).join(' ');
                        if (pText) {
                            paragraphs.push(pText);
                        }
                    }

                    const excludePatterns = [
                        /unterschrift/i, /signature/i, /datum.*unterschrift/i,
                        /auszubildende.*r/i, /ausbildende.*r/i, /ausbilder.*in/i,
                        /bestätigt/i, /richtigkeit/i, /vollständigkeit/i, /nachfolgende.*unterschrift/i
                    ];
                    
                    const filteredParagraphs = paragraphs.filter(p => !excludePatterns.some(pat => pat.test(p.toLowerCase())));
                    
                    const fullText = filteredParagraphs.join('\n');
                    const filteredText = fullText.replace(/\d{2}\.\d{2}\.\d{4}\s*(?:Datum|Unterschrift|Signature|Bestätigt|Auszubildende|Ausbildende)/gi, '');
                    
                    const days = extractDaysFromTable(filteredText);
                    return { text: filteredText, days };
                } catch (e) {
                    return { text: '⚠️ Parsing error', days: {} };
                }
            }

            function extractDaysFromTable(text) {
                const days = {};
                const dayNames = PARSE_DAY_NAMES; 
                const daysPattern = dayNames.join('|');

                for (let i = 0; i < dayNames.length; i++) {
                    const dayName = dayNames[i];
                    
                    const regex = new RegExp('(?:^|\\n)\\s*' + dayName + '[\\s\\-:;]*([\\s\\S]*?)(?=\\n\\s*(?:' + daysPattern + ')|$)', 'i');
                    let match = text.match(regex);
                    
                    if (!match) {
                        const fallbackRegex = new RegExp(dayName + '[\\s\\-:;]*([\\s\\S]*?)(?=' + daysPattern + '|$)', 'i');
                        match = text.match(fallbackRegex);
                    }

                    if (match) {
                        let content = match[1].trim();
                        let hours = '8';
                        
                        const hourMatch = content.match(/(\d+)\s*(?:h|Std\.|Stunden)/i);
                        if (hourMatch) {
                            hours = hourMatch[1];
                            content = content.replace(hourMatch[0], '').trim();
                        } else {
                            const hourMatch2 = content.match(/\b(\d+)\s*$|\b(\d+)\s*(?:h|Std)/i);
                            if (hourMatch2) {
                                hours = hourMatch2[1] || hourMatch2[2] || '8';
                                content = content.replace(/\s*\d+\s*(?:h|Std\.|Stunden)?\s*$/, '').trim();
                            }
                        }

                        content = content
                            .replace(/[–\-]\s*Selbständig.*$/gim, '')
                            .replace(/Selbstständiges\s*Lernen/gi, '')
                            .replace(/\d{2}\.\d{2}\.\d{4}\s*$/g, '');

                        let lines = content.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        let formattedLines = [];

                        for (let line of lines) {
                            line = line.replace(/-{2,}/g, '-');
                            if (/^[-*•+]\s/.test(line)) {
                                line = line.replace(/^[-*•+]\s*/, '• ');
                            } else if (/^[-*•+]/.test(line)) {
                                line = line.replace(/^[-*•+]/, '• ');
                            }

                            if (line.includes(' - ')) {
                                const parts = line.split(' - ').filter(p => p.trim().length > 0);
                                if (parts.length > 1) {
                                    parts.forEach((p, idx) => {
                                        if (idx === 0 && p.startsWith('• ')) {
                                            formattedLines.push(p.trim());
                                        } else {
                                            formattedLines.push('• ' + p.replace(/^[-*•+]\s*/, '').trim());
                                        }
                                    });
                                    continue;
                                }
                            }
                            formattedLines.push(line);
                        }
                        
                        formattedLines = formattedLines.filter(l => l !== '•' && l !== '-' && l !== '• ' && l.trim().length > 0);
                        
                        content = formattedLines.join('\n').trim();
                        days[dayName] = { content: content.length > 0 ? content : '—', hours };
                    }
                }
                return days;
            }

            async function fetchReportFiles() {
                const response = await fetch(API_TREE_URL);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const data = await response.json();
                const docFiles = data.filter(i => i.type === 'file' && (i.name.toLowerCase().endsWith('.doc') || i.name.toLowerCase().endsWith('.docx')));
                
                const reports = docFiles.map(item => {
                    const rawUrl = `${BASE_RAW_URL}/${encodeURIComponent(item.name)}`;
                    
                    let weekLabel = item.name.replace(/\.docx?$/i, ''); // Fallback to filename
                    let mondayDate = null;
                    let yearStr = new Date().getFullYear().toString();
                    
                    // Match date ranges like: 16.10. - 20.10.2023 or 16.10.23-20.10.23
                    const rangeMatch = item.name.match(/(\d{1,2})\.\s*(\d{1,2})\.?\s*(?:(\d{2,4})\s*)?-\s*(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})/);
                    
                    if (rangeMatch) {
                        let startYear = rangeMatch[3];
                        let endYear = rangeMatch[6];
                        if (!startYear) startYear = endYear;
                        if (startYear.length === 2) startYear = '20' + startYear;
                        if (endYear.length === 2) endYear = '20' + endYear;
                        
                        yearStr = startYear;
                        weekLabel = `${rangeMatch[1].padStart(2, '0')}.${rangeMatch[2].padStart(2, '0')}.${startYear} – ${rangeMatch[4].padStart(2, '0')}.${rangeMatch[5].padStart(2, '0')}.${endYear}`;
                        
                        const parsedDate = new Date(parseInt(startYear), parseInt(rangeMatch[2]) - 1, parseInt(rangeMatch[1]));
                        const day = parsedDate.getDay();
                        const diff = parsedDate.getDate() - day + (day === 0 ? -6 : 1); // Anchor to Monday
                        mondayDate = new Date(parsedDate.setDate(diff));
                    } else {
                        // Match single date like: 16.10.2023 or 16.10.23
                        const singleMatch = item.name.match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})/);
                        if (singleMatch) {
                            let year = singleMatch[3];
                            if (year.length === 2) year = '20' + year;
                            yearStr = year;
                            weekLabel = `${singleMatch[1].padStart(2, '0')}.${singleMatch[2].padStart(2, '0')}.${year}`;
                            
                            const parsedDate = new Date(parseInt(year), parseInt(singleMatch[2]) - 1, parseInt(singleMatch[1]));
                            const day = parsedDate.getDay();
                            const diff = parsedDate.getDate() - day + (day === 0 ? -6 : 1);
                            mondayDate = new Date(parsedDate.setDate(diff));
                        }
                    }

                    return {
                        name: item.name,
                        url: rawUrl,
                        week: weekLabel,
                        mondayDate: mondayDate,
                        year: yearStr,
                        isFisi: item.name.toLowerCase().includes('fisi'),
                        days: {},
                        rawText: ''
                    };
                });
                return reports.sort((a, b) => {
                    const getStart = r => r.mondayDate ? r.mondayDate.getTime() : 0;
                    return getStart(a) - getStart(b);
                });
            }

            async function fetchAndParseDocx(report) {
                try {
                    const response = await fetch(report.url);
                    if (!response.ok) return;
                    const arrayBuffer = await response.arrayBuffer();
                    const result = await extractDocxText(arrayBuffer);
                    report.rawText = result.text;
                    report.days = result.days || {};
                } catch (e) {
                    console.warn(`Parse error for ${report.name}`);
                }
            }

            function render(reports) {
                const lang = i18n[currentLang];
                
                if (reports.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .89-2 2v12c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm0 14H4V8h16v12z"/></svg>
                            <h3>${lang.noReports}</h3>
                            <p>${lang.noReportsDesc}</p>
                        </div>`;
                    updateStats([]);
                    return;
                }

                let html = '';
                for (const report of reports) {
                    const validDaysCount = Object.values(report.days).filter(d => d.content && d.content !== '—').length;
                    const cardState = expandedCards.has(report.name) ? '' : 'collapsed';
                    
                    html += `
                        <div class="report-card ${cardState}" data-name="${report.name}">
                            <div class="card-header">
                                <div class="card-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                    ${report.name.replace(/\.(doc|docx)$/i, '')}
                                </div>
                                <div class="card-badges">
                                    ${report.week ? `<span class="badge">📅 ${report.week}</span>` : ''}
                                    ${report.isFisi ? '<span class="badge badge-primary">💻 FISI</span>' : ''}
                                    <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="day-grid">
                                    ${PARSE_DAY_NAMES.map((parseDay, idx) => {
                                        const displayDay = lang.daysList[idx];
                                        const data = report.days[parseDay];
                                        const hasContent = data && data.content && data.content !== '—';
                                        
                                        let dateString = '';
                                        if (report.mondayDate && !isNaN(report.mondayDate.getTime())) {
                                            const dayDate = new Date(report.mondayDate);
                                            dayDate.setDate(dayDate.getDate() + idx);
                                            dateString = dayDate.toLocaleDateString(dateLocale, { day: '2-digit', month: '2-digit', year: 'numeric' });
                                        }

                                        return `
                                            <div class="day-card">
                                                <div class="day-name" style="align-items: flex-start;">
                                                    <div style="display: flex; flex-direction: column; gap: 3px;">
                                                        <div style="display: flex; align-items: center; gap: 6px;">
                                                            ${DAY_EMOJIS[idx]} ${displayDay}
                                                        </div>
                                                        ${dateString ? `<span style="font-size: 11px; font-weight: 500; color: var(--sub-color); margin-left: 24px; line-height: 1;">${dateString}</span>` : ''}
                                                    </div>
                                                </div>
                                                <div class="day-content">
                                                    ${hasContent ? data.content : `<span class="day-empty">No entries logged.</span>`}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                                <div class="card-footer">
                                    <span class="badge" style="background:transparent; border:none; padding:0; font-size:13px; color:var(--sub-color);">📝 ${validDaysCount} ${lang.entriesLogged}</span>
                                    <a href="${report.url}" class="download-btn" download>
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                        ${lang.download}
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = html;
                updateStats(reports);
            }

            grid.addEventListener('click', (e) => {
                const header = e.target.closest('.card-header');
                if (header) {
                    const card = header.parentElement;
                    card.classList.toggle('collapsed');
                    const reportName = card.getAttribute('data-name');
                    if (card.classList.contains('collapsed')) {
                        expandedCards.delete(reportName);
                    } else {
                        expandedCards.add(reportName);
                    }
                }
            });

            function updateStats(reports) {
                totalCount.textContent = reports.length;
                weekCount.textContent = new Set(reports.map(r => r.week).filter(w => w)).size;
                dayCount.textContent = reports.reduce((acc, r) => acc + Object.values(r.days).filter(d => d.content && d.content !== '—').length, 0);
            }

            function applyFilters() {
                const term = searchTerm.toLowerCase();
                filteredReports = term ? allReports.filter(r => 
                    r.name.toLowerCase().includes(term) || r.week.toLowerCase().includes(term) || 
                    Object.values(r.days).map(d => d.content).join(' ').toLowerCase().includes(term)
                ) : [...allReports];
                render(filteredReports);
            }

            async function loadData() {
                const loadingScreen = document.getElementById("loadingScreen");
                try {
                    updateStatus('Connecting to GitHub API...', 'waiting');
                    if (loadingScreen) loadingScreen.style.display = "flex";
                    
                    const reports = await fetchReportFiles();
                    if (!reports.length) throw new Error("No files found");
                    allReports = reports;
                    
                    updateStatus('Parsing Document Structures...', 'waiting');
                    for (let i = 0; i < allReports.length; i++) {
                        await fetchAndParseDocx(allReports[i]);
                        if (i % 2 === 0 || i === allReports.length - 1) {
                            applyFilters();
                            updateStatus(`Parsed ${i+1}/${allReports.length} reports...`, 'waiting');
                        }
                    }
                    
                    updateStatus('✅ Control Center Sync Complete', 'success');
                    dataSourceStatus.textContent = 'Control Center Active · Data Synced';

                } catch (err) {
                    console.error(err);
                    const lang = i18n[currentLang];
                    updateStatus('⚠️ Failed to load reports', 'error');
                    grid.innerHTML = `
                        <div class="empty-state" style="border-color:#ef4444;">
                            <h3 style="color:#ef4444;">${lang.errorLoading}</h3>
                            <p>${err.message}</p>
                            <button onclick="location.reload();" style="margin-top:16px; padding:10px 24px; border-radius:20px; background:var(--btn-bg); border:1px solid var(--border-color); color:var(--text-color); font-weight:600; cursor:pointer;">${lang.retry}</button>
                        </div>`;
                } finally {
                    setTimeout(() => {
                        if (loadingScreen) {
                            loadingScreen.classList.add("fade-out");
                            setTimeout(() => loadingScreen.style.display = "none", 500);
                        }
                    }, 800);
                }
            }

            searchInput.addEventListener('input', function() { searchTerm = this.value; applyFilters(); });
            refreshBtn.addEventListener('click', loadData);
            
            updateStaticUIText();
            setTimeout(loadData, 300);

        })();
    </script>
</body>
</html>
