<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFCC Texture Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --sub-color: #475569;
            --border-color: #cbd5e1;
            --border-hover: #2563eb;
            --box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover-border: #94a3b8;
            --hover-bg: #f1f5f9;
            --input-bg: #ffffff;
            --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.2);
            --card-radius: 12px;
            --dropdown-bg: #ffffff;
            --dropdown-border: #cbd5e1;
            --dropdown-hover: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8eaed;
            --sub-color: #9aa0a6;
            --border-color: #3c4043;
            --border-hover: #8ab4f8;
            --box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            --btn-bg: #303134;
            --btn-border: #3c4043;
            --btn-hover-border: #5f6368;
            --hover-bg: #3c4043;
            --input-bg: #202124;
            --focus-ring: 0 0 0 3px rgba(138, 180, 248, 0.25);
            --dropdown-bg: #303134;
            --dropdown-border: #3c4043;
            --dropdown-hover: #3c4043;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
        }
        
        input {
            user-select: text;
            -webkit-user-select: text;
        }

        #dazzleCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: pointer;
        }

        .cfcc-title-box, .cfcc-subtitle-box {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            padding: 0 16px;
            border-radius: var(--card-radius);
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            box-shadow: var(--box-shadow);
            height: 44px;
            display: flex;
            align-items: center;
        }

        .cfcc-subtitle-box {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub-color);
        }

        .cfcc-toggle-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: var(--card-radius);
            padding: 0 16px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--box-shadow);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s ease;
        }
        
        .cfcc-toggle-btn:hover {
            background: var(--hover-bg);
            border-color: var(--border-hover);
        }
        
        .cfcc-toggle-btn.icon-only {
            width: 44px;
            padding: 0;
            color: var(--sub-color);
        }

        .cfcc-toggle-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .cfcc-panel {
            background: var(--dropdown-bg);
            border: 1px solid var(--dropdown-border);
            border-radius: var(--card-radius);
            box-shadow: var(--box-shadow);
        }

        .cfcc-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--sub-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            margin-top: 16px;
        }
        .cfcc-header:first-child {
            margin-top: 0;
        }

        .cfcc-list-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .cfcc-list-btn:hover {
            background: var(--hover-bg);
            border-color: var(--btn-hover-border);
        }
        
        .cfcc-list-btn.active {
            background: var(--hover-bg);
            border-color: var(--border-hover);
            font-weight: 600;
            color: var(--text-color);
        }

        .cfcc-input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            padding: 8px 12px;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            font-size: 13px;
        }
        .cfcc-input:focus {
            border-color: var(--border-hover);
            box-shadow: var(--focus-ring);
        }

        /* Custom minimal scrollbar matching CFCC */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--sub-color); 
        }
    </style>
</head>
<body data-theme="dark">

    <canvas id="dazzleCanvas"></canvas>

    <!-- Top Left Title -->
    <div class="absolute top-5 left-6 z-10 flex gap-3 pointer-events-none">
        <a href="../index.html" class="cfcc-toggle-btn pointer-events-auto" style="text-decoration: none;" title="Back to Control Center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Back
        </a>
        <div class="cfcc-title-box pointer-events-auto">CFCC</div>
        <div class="cfcc-subtitle-box pointer-events-auto">Texture Generator</div>
    </div>

    <!-- Top Right Controls -->
    <div class="absolute top-5 right-6 z-10 flex gap-3 pointer-events-none">
        
        <span class="cfcc-toggle-btn pointer-events-auto" id="retentionClick" title="Retention time (click to reset)">00:00:00</span>
        <span class="cfcc-toggle-btn pointer-events-auto" id="dateClick" title="Toggle date format">---</span>
        <span class="cfcc-toggle-btn pointer-events-auto" id="timeClick" title="Toggle time format">--:--:--</span>

        <button id="themeToggle" class="cfcc-toggle-btn icon-only pointer-events-auto" title="Toggle Theme">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
            </svg>
        </button>

        <button id="reloadBtn" class="cfcc-toggle-btn pointer-events-auto" title="Generate New Pattern">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            Regenerate
        </button>
        
        <div id="downloadContainer" class="relative pointer-events-auto">
            <button id="downloadDropdownBtn" class="cfcc-toggle-btn" title="Export Options">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                Export PNG
            </button>
            
            <div id="downloadMenu" class="hidden absolute right-0 mt-3 w-56 cfcc-panel p-2 z-50 overflow-hidden">
                <div class="px-3 py-2 text-[10px] font-bold text-[var(--sub-color)] uppercase tracking-wider mb-1">Download Size</div>
                <a href="#" class="download-opt block px-3 py-2 rounded-lg text-sm text-[var(--text-color)] hover:bg-[var(--dropdown-hover)] transition-colors" data-res="current">Viewport Size</a>
                <a href="#" class="download-opt block px-3 py-2 rounded-lg text-sm text-[var(--text-color)] hover:bg-[var(--dropdown-hover)] transition-colors" data-res="1280x720">720p HD</a>
                <a href="#" class="download-opt block px-3 py-2 rounded-lg text-sm text-[var(--text-color)] hover:bg-[var(--dropdown-hover)] transition-colors" data-res="1920x1080">1080p FHD</a>
                <a href="#" class="download-opt block px-3 py-2 rounded-lg text-sm text-[var(--text-color)] hover:bg-[var(--dropdown-hover)] transition-colors" data-res="2560x1440">1440p QHD</a>
                <div class="border-t border-[var(--border-color)] my-1 mx-2"></div>
                <a href="#" id="customResBtn" class="block px-3 py-2 rounded-lg text-sm font-semibold text-[var(--text-color)] hover:bg-[var(--dropdown-hover)] transition-colors">Custom Resolution...</a>
            </div>
        </div>
    </div>

    <!-- Left Sidebar Generators -->
    <div class="absolute top-24 left-6 bottom-6 z-10 flex items-start pointer-events-none">
        <div id="styleToolbar" class="cfcc-panel pointer-events-auto p-4 flex flex-col gap-1 w-56 overflow-y-auto" style="max-height: calc(100vh - 120px);">
            
            <h2 class="cfcc-header">Generators</h2>
            <button data-style="wwi" class="cfcc-list-btn active style-btn">WWI Dazzle</button>
            <button data-style="splinter" class="cfcc-list-btn style-btn">Splinter Tarn</button>
            <button data-style="tiger" class="cfcc-list-btn style-btn">Tiger Stripe</button>
            <button data-style="digital" class="cfcc-list-btn style-btn">Digital MARPAT</button>
            <button data-style="cubist" class="cfcc-list-btn style-btn">Cubist Abstract</button>
            <button data-style="flecktarn" class="cfcc-list-btn style-btn">Flecktarn</button>
            <button data-style="hex" class="cfcc-list-btn style-btn">Hex Tactical</button>
            <button data-style="brushstroke" class="cfcc-list-btn style-btn">Brushstroke</button>
            <button data-style="topographic" class="cfcc-list-btn style-btn">Topographic</button>
            
            <h2 class="cfcc-header">Organic / Textures</h2>
            <button data-style="zebra" class="cfcc-list-btn style-btn">Zebra</button>
            <button data-style="leopard" class="cfcc-list-btn style-btn">Leopard</button>
            <button data-style="rust" class="cfcc-list-btn style-btn">Rust</button>
            <button data-style="wood" class="cfcc-list-btn style-btn">Wood Grain</button>

            <h2 class="cfcc-header">Novelty</h2>
            <button data-style="emojis" class="cfcc-list-btn style-btn">Emojis</button>
            <button data-style="shapes" class="cfcc-list-btn style-btn">Shapes</button>

            <h2 class="cfcc-header">Tech / Synthetic</h2>
            <button data-style="wireframe" class="cfcc-list-btn style-btn">Wireframe</button>
            <button data-style="carbon" class="cfcc-list-btn style-btn">Carbon Fibre</button>
            <button data-style="circuit" class="cfcc-list-btn style-btn">Circuit Board</button>
            <button data-style="glitch" class="cfcc-list-btn style-btn">Data Glitch</button>
        </div>
    </div>

    <!-- Custom Resolution Modal -->
    <div id="customResModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center">
        <div class="cfcc-panel p-6 max-w-sm w-full mx-4" id="customResContent">
            <h3 class="text-[var(--text-color)] text-lg font-bold mb-4">Custom Canvas Size</h3>
            <div class="flex items-center gap-4 mb-2">
                <div class="flex-1">
                    <label class="block text-xs text-[var(--sub-color)] mb-1 font-semibold uppercase">Width (px)</label>
                    <input type="number" id="customW" value="3840" class="cfcc-input" />
                </div>
                <span class="text-[var(--sub-color)] mt-5 font-bold">X</span>
                <div class="flex-1">
                    <label class="block text-xs text-[var(--sub-color)] mb-1 font-semibold uppercase">Height (px)</label>
                    <input type="number" id="customH" value="2160" class="cfcc-input" />
                </div>
            </div>
            <p id="customError" class="text-red-500 text-xs h-4 mb-4 font-semibold"></p>
            <div class="flex justify-end gap-3 pt-2 border-t border-[var(--border-color)]">
                <button id="cancelCustom" class="px-4 py-2 text-sm font-semibold text-[var(--sub-color)] hover:text-[var(--text-color)] transition-colors">Cancel</button>
                <button id="downloadCustom" class="cfcc-toggle-btn !h-auto !py-2 !px-4 !bg-[var(--border-hover)] !text-white !border-transparent hover:!opacity-90">Download PNG</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('dazzleCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const reloadBtn = document.getElementById('reloadBtn');
        const downloadDropdownBtn = document.getElementById('downloadDropdownBtn');
        const downloadMenu = document.getElementById('downloadMenu');
        const downloadOptions = document.querySelectorAll('.download-opt');
        const customResBtn = document.getElementById('customResBtn');
        const customResModal = document.getElementById('customResModal');
        const cancelCustom = document.getElementById('cancelCustom');
        const downloadCustom = document.getElementById('downloadCustom');
        const customW = document.getElementById('customW');
        const customH = document.getElementById('customH');
        const customError = document.getElementById('customError');

        let retentionSeconds = 0;
        let timeLocale = "en-US";
        let dateLocale = "en-US";

        const timeEl = document.getElementById("timeClick");
        const dateEl = document.getElementById("dateClick");
        const retentionEl = document.getElementById("retentionClick");

        if (retentionEl) {
            retentionEl.addEventListener("click", (e) => {
                e.stopPropagation();
                retentionSeconds = 0;
                retentionEl.textContent = "00:00:00";
            });
        }

        if (timeEl) {
            timeEl.addEventListener("click", (e) => {
                e.stopPropagation();
                timeLocale = timeLocale === "en-US" ? "de-DE" : "en-US";
                updateDateTime();
            });
        }

        if (dateEl) {
            dateEl.addEventListener("click", (e) => {
                e.stopPropagation();
                dateLocale = dateLocale === "en-US" ? "de-DE" : "en-US";
                updateDateTime();
            });
        }

        function updateDateTime() {
            const now = new Date();
            if (timeEl) {
                timeEl.textContent = now.toLocaleTimeString(timeLocale, {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                });
            }
            if (dateEl) {
                dateEl.textContent = now.toLocaleDateString(dateLocale, {
                    weekday: "short",
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                });
            }
        }

        function updateRetentionTimer() {
            retentionSeconds++;
            const hrs = Math.floor(retentionSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((retentionSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (retentionSeconds % 60).toString().padStart(2, '0');
            if (retentionEl) {
                retentionEl.textContent = `${hrs}:${mins}:${secs}`;
            }
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);
        setInterval(updateRetentionTimer, 1000);

        // Theme Toggle Logic
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        const body = document.body;

        themeToggle.addEventListener("click", () => {
            const isDark = body.getAttribute("data-theme") === "dark";
            body.setAttribute("data-theme", isDark ? "light" : "dark");
            themeIcon.innerHTML = isDark ?
                `<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>` :
                `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;
        });

        // Seeded random number generator.
        let baseSeed = Math.random() * 10000;
        let currentSeed = baseSeed;
        let currentStyle = 'wwi';

        function random() {
            const x = Math.sin(currentSeed++) * 10000;
            return x - Math.floor(x);
        }

        // Camouflage color palettes by style category
        const stylePalettes = {
            wwi: [
                ['#101010', '#F0F0F0', '#404040', '#808080', '#C0C0C0'],
                ['#050505', '#B0B5B9', '#556370', '#2B3948', '#FFFFFF'],
                ['#FFFFFF', '#0B131A', '#4A6B8C', '#849180', '#D0D4D1']
            ],
            splinter: [
                ['#4A5320', '#3B4219', '#2E3414', '#D4C5A9', '#1C200C'],
                ['#313B2E', '#505E4C', '#72816D', '#222821', '#C5CFC3'],
                ['#594A3C', '#3D3227', '#736251', '#D6C8B5', '#241E18']
            ],
            tiger: [
                ['#2D3822', '#4B5C3C', '#6B7A59', '#182012', '#939E83'],
                ['#1E2229', '#3D4654', '#5D6B80', '#101317', '#8894A6'],
                ['#4A3525', '#7A5B40', '#A37C5A', '#2E2015', '#C4A88E']
            ],
            digital: [
                ['#3F4433', '#5D664D', '#2B2F23', '#8C9479', '#1C1F16'],
                ['#4A4238', '#736859', '#A39682', '#2B2721', '#C7BDAB'],
                ['#222B36', '#3B4B5E', '#5D7491', '#141A21', '#859AB5']
            ],
            cubist: [
                ['#1A2530', '#34495E', '#1ABC9C', '#E74C3C', '#ECF0F1'],
                ['#2C3E50', '#8E44AD', '#3498DB', '#E67E22', '#BDC3C7'],
                ['#111111', '#333333', '#E74C3C', '#F1C40F', '#3498DB']
            ],
            flecktarn: [
                ['#3B4232', '#2E3524', '#596547', '#1A1E14', '#7A6246'],
                ['#545148', '#3F3D36', '#727464', '#26241F', '#8C775D']
            ],
            hex: [
                ['#1E2226', '#2C3539', '#44535C', '#5F7380', '#0F1113'],
                ['#726C60', '#8F897B', '#A8A295', '#4A463D', '#C4BDB1']
            ],
            brushstroke: [
                ['#474B32', '#2F3420', '#63503B', '#1E2114', '#8B9467'],
                ['#2D2E30', '#4A4C4F', '#1F2021', '#74777C', '#0A0A0A']
            ],
            topographic: [
                ['#151C15', '#243024', '#3E503E', '#8F998F'],
                ['#0D1117', '#1A232E', '#2B394A', '#536E8C']
            ],
            zebra: [
                ['#F2F2F2', '#1A1A1A'],
                ['#DCD0C0', '#2B2B2B'],
                ['#E5D3B3', '#402619']
            ],
            leopard: [
                ['#E0B876', '#BA7A3A', '#201812'],
                ['#C8AB83', '#8C6239', '#1C1512'],
                ['#7B8C70', '#4A5D23', '#1F2416']
            ],
            rust: [
                ['#2C2621', '#5B3322', '#8F4321', '#C26331', '#1A1513', '#4A2A18'],
                ['#363D42', '#212426', '#693721', '#8C4623', '#111212', '#4D423D']
            ],
            wood: [
                ['#C19A6B', '#966F33', '#6F4E37', '#4A3219'],
                ['#A89689', '#786C63', '#4A413A', '#241E1A'],
                ['#8C3826', '#591B0F', '#381008', '#1A0602']
            ],
            wireframe: [
                ['#050505', '#00ffff', '#ff00ff'],
                ['#0a0a1a', '#4444ff', '#00ffaa'],
                ['#000000', '#00ff00', '#004400']
            ],
            carbon: [
                ['#111111', '#1f1f1f', '#2a2a2a', '#050505']
            ],
            circuit: [
                ['#003300', '#00ff00', '#00aa00', '#c0c0c0'], 
                ['#001133', '#00ffff', '#0066aa', '#ffd700'], 
                ['#1a0000', '#ff3333', '#aa0000', '#ffffff']  
            ],
            glitch: [
                ['#0f0f0f', '#ff0055', '#00ffff', '#ffffff', '#222222'],
                ['#000022', '#ff00ff', '#00ffaa', '#ffff00', '#222255']
            ]
        };

        let currentPalette = stylePalettes.wwi[0];

        function randomInt(min, max) {
            return Math.floor(random() * (max - min + 1) + min);
        }

        function randomChoice(arr) {
            return arr[Math.floor(random() * arr.length)];
        }

        function getContrastingColors() {
            const color1 = randomChoice(currentPalette);
            let color2 = randomChoice(currentPalette);
            while (color2 === color1) {
                color2 = randomChoice(currentPalette);
            }
            return [color1, color2];
        }

        let dpr = window.devicePixelRatio || 1;
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            
            currentSeed = baseSeed;
            generatePattern(ctx, window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(resizeCanvas, 150);
        });

        function createRandomPolygon(cx, cy, minRadius, maxRadius, verticesCount) {
            const vertices = [];
            let angleStart = random() * Math.PI * 2;
            for (let i = 0; i < verticesCount; i++) {
                const angle = angleStart + (i / verticesCount) * Math.PI * 2 + (random() - 0.5) * (Math.PI / verticesCount);
                const r = minRadius + random() * (maxRadius - minRadius);
                vertices.push({
                    x: cx + Math.cos(angle) * r,
                    y: cy + Math.sin(angle) * r
                });
            }
            return vertices;
        }

        function createIntersectingBand(width, height) {
            const cx = width / 2;
            const cy = height / 2;
            const maxDimension = Math.max(width, height);
            const angle = random() * Math.PI;
            const thickness = randomInt(50, 300);
            const length = maxDimension * 3;
            const offsetX = (random() - 0.5) * width;
            const offsetY = (random() - 0.5) * height;
            const dx = Math.cos(angle) * (length / 2);
            const dy = Math.sin(angle) * (length / 2);
            const tx = Math.cos(angle + Math.PI/2) * (thickness / 2);
            const ty = Math.sin(angle + Math.PI/2) * (thickness / 2);

            return [
                {x: cx + offsetX - dx + tx, y: cy + offsetY - dy + ty},
                {x: cx + offsetX + dx + tx, y: cy + offsetY + dy + ty},
                {x: cx + offsetX + dx - tx, y: cy + offsetY + dy - tx},
                {x: cx + offsetX - dx - tx, y: cy + offsetY - dy - ty}
            ];
        }

        function drawStripes(targetCtx, w, h, color1, color2, angle, stripeWidth) {
            const diag = Math.sqrt(w * w + h * h) * 1.5;
            targetCtx.save();
            targetCtx.translate(w / 2, h / 2);
            targetCtx.rotate(angle);
            const startY = -diag / 2;
            const endY = diag / 2;
            
            targetCtx.fillStyle = color1;
            targetCtx.fillRect(-diag/2, -diag/2, diag, diag);

            targetCtx.fillStyle = color2;
            for (let y = startY; y < endY; y += stripeWidth * 2) {
                const currentWidth = random() > 0.9 ? stripeWidth * 1.5 : stripeWidth;
                targetCtx.fillRect(-diag / 2, y, diag, currentWidth);
            }
            targetCtx.restore();
        }

        function applyPolygonPath(targetCtx, vertices) {
            targetCtx.beginPath();
            targetCtx.moveTo(vertices[0].x, vertices[0].y);
            for (let i = 1; i < vertices.length; i++) {
                targetCtx.lineTo(vertices[i].x, vertices[i].y);
            }
            targetCtx.closePath();
        }

        function generateWWIDazzle(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.wwi);
            const scaleFactor = Math.max(w, h) / 1500;
            const s = (val) => val * (scaleFactor > 0.5 ? scaleFactor : 1);

            const [baseColor1, baseColor2] = getContrastingColors();
            drawStripes(targetCtx, w, h, baseColor1, baseColor2, random() * Math.PI, s(randomInt(40, 150)));

            const numBands = randomInt(4, 10);
            for (let i = 0; i < numBands; i++) {
                targetCtx.save();
                applyPolygonPath(targetCtx, createIntersectingBand(w, h));
                targetCtx.clip();
                const [c1, c2] = getContrastingColors();
                if (random() < 0.3) {
                    targetCtx.fillStyle = c1;
                    targetCtx.fill();
                } else {
                    drawStripes(targetCtx, w, h, c1, c2, random() * Math.PI, s(randomInt(15, 80)));
                }
                targetCtx.restore();
            }

            const numBlocks = randomInt(8, 25);
            for (let i = 0; i < numBlocks; i++) {
                targetCtx.save();
                const cx = random() * w;
                const cy = random() * h;
                const minRad = s(randomInt(50, 150));
                applyPolygonPath(targetCtx, createRandomPolygon(cx, cy, minRad, minRad + s(randomInt(50, 300)), randomInt(3, 6)));
                targetCtx.clip();
                const [c1, c2] = getContrastingColors();
                if (random() < 0.4) {
                    targetCtx.fillStyle = c1;
                    targetCtx.fill();
                } else {
                    drawStripes(targetCtx, w, h, c1, c2, random() * Math.PI, s(randomInt(20, 60)));
                }
                targetCtx.restore();
            }
        }

        function generateSplinter(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.splinter);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const cols = 9;
            const rows = 9;
            const cellW = w / cols;
            const cellH = h / rows;

            for (let y = 0; y <= rows; y++) {
                for (let x = 0; x <= cols; x++) {
                    targetCtx.save();
                    const cx = x * cellW + (random() - 0.5) * cellW;
                    const cy = y * cellH + (random() - 0.5) * cellH;
                    const vertices = createRandomPolygon(cx, cy, cellW * 0.4, cellW * 1.3, randomInt(4, 7));
                    applyPolygonPath(targetCtx, vertices);
                    targetCtx.fillStyle = randomChoice(currentPalette);
                    targetCtx.fill();
                    targetCtx.lineWidth = 1.2;
                    targetCtx.strokeStyle = randomChoice(currentPalette);
                    targetCtx.stroke();
                    targetCtx.restore();
                }
            }
        }

        function generateTigerStripe(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.tiger);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const numStripes = 45;
            const angle = (random() - 0.5) * 0.4;

            targetCtx.save();
            targetCtx.translate(w/2, h/2);
            targetCtx.rotate(angle);
            targetCtx.translate(-w/2, -h/2);

            const stepY = h / numStripes;
            for (let i = -10; i < numStripes + 10; i++) {
                let y = i * stepY;
                targetCtx.beginPath();
                targetCtx.moveTo(-100, y);
                
                let cx = -100;
                while (cx < w + 200) {
                    cx += randomInt(40, 140);
                    y += (random() - 0.5) * 100;
                    targetCtx.lineTo(cx, y);
                }
                
                targetCtx.lineTo(w + 200, y + randomInt(40, 100));
                let bx = w + 200;
                while (bx > -100) {
                    bx -= randomInt(40, 140);
                    y -= (random() - 0.5) * 100;
                    targetCtx.lineTo(bx, y);
                }
                targetCtx.closePath();
                targetCtx.fillStyle = randomChoice(currentPalette);
                targetCtx.fill();
            }
            targetCtx.restore();
        }

        function generateDigital(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.digital);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const blockSize = Math.max(14, Math.floor(Math.min(w, h) / 55));
            const cols = Math.ceil(w / blockSize);
            const rows = Math.ceil(h / blockSize);

            const grid = Array.from({ length: rows }, () => Array(cols).fill(0));
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = Math.floor(random() * currentPalette.length);
                }
            }

            for (let iter = 0; iter < 3; iter++) {
                for (let r = 1; r < rows - 1; r++) {
                    for (let c = 1; c < cols - 1; c++) {
                        if (random() < 0.35) {
                            grid[r][c] = grid[r + (random() > 0.5 ? 1 : -1)][c + (random() > 0.5 ? 1 : -1)];
                        }
                    }
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    targetCtx.fillStyle = currentPalette[grid[r][c]];
                    targetCtx.fillRect(c * blockSize, r * blockSize, blockSize + 0.5, blockSize + 0.5);
                }
            }
        }

        function generateCubist(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.cubist);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const shapes = randomInt(45, 85);
            for (let i = 0; i < shapes; i++) {
                targetCtx.save();
                const cx = random() * w;
                const cy = random() * h;
                const size = randomInt(80, Math.max(w, h) * 0.45);
                
                targetCtx.beginPath();
                if (random() < 0.5) {
                    const vertices = createRandomPolygon(cx, cy, size * 0.2, size, 3);
                    applyPolygonPath(targetCtx, vertices);
                } else {
                    targetCtx.translate(cx, cy);
                    targetCtx.rotate(random() * Math.PI);
                    targetCtx.rect(-size/2, -size/4, size, size/2);
                }
                
                targetCtx.fillStyle = randomChoice(currentPalette);
                targetCtx.globalAlpha = 0.8 + random() * 0.2;
                targetCtx.fill();
                targetCtx.lineWidth = 2;
                targetCtx.strokeStyle = '#000000';
                targetCtx.stroke();
                targetCtx.restore();
            }
        }

        function generateEmojis(targetCtx, w, h) {
            targetCtx.fillStyle = '#111827'; 
            targetCtx.fillRect(0, 0, w, h);
            
            const emojiSets = [
                ['🪖', '🌿', '🌲', '🍂', '💥', '🚁', '🎖️', '💣', '🦅', '🐾', '🔥', '⚙️'], 
                ['💀', '👽', '👾', '👻', '🤖', '🎃', '☠️', '🩸', '🕸️', '🕷️', '🦇', '🌑'], 
                ['💎', '🔮', '✨', '🌟', '💫', '⚡', '🔥', '💥', '☄️', '🌌', '🛸', '🪐']  
            ];
            const currentEmojis = randomChoice(emojiSets);
            const numEmojis = randomInt(100, Math.floor((w * h) / 3500)); 

            for (let i = 0; i < numEmojis; i++) {
                const e = randomChoice(currentEmojis);
                const size = randomInt(20, Math.min(w, h) * 0.15);
                const x = random() * w;
                const y = random() * h;
                const angle = random() * Math.PI * 2;

                targetCtx.save();
                targetCtx.translate(x, y);
                targetCtx.rotate(angle);
                targetCtx.font = `${size}px sans-serif`;
                targetCtx.textAlign = 'center';
                targetCtx.textBaseline = 'middle';
                targetCtx.globalAlpha = 0.85 + random() * 0.15;
                targetCtx.fillText(e, 0, 0);
                targetCtx.restore();
            }
        }

        function generateShapes(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.cubist); 
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const numShapes = randomInt(80, Math.floor((w * h) / 4500));
            for (let i = 0; i < numShapes; i++) {
                const type = randomInt(0, 2);
                const cx = random() * w;
                const cy = random() * h;
                const size = randomInt(20, Math.min(w, h) * 0.25);
                const angle = random() * Math.PI * 2;

                targetCtx.save();
                targetCtx.translate(cx, cy);
                targetCtx.rotate(angle);
                targetCtx.fillStyle = randomChoice(currentPalette);
                targetCtx.globalAlpha = 0.5 + random() * 0.4;

                targetCtx.beginPath();
                if (type === 0) {
                    targetCtx.arc(0, 0, size / 2, 0, Math.PI * 2);
                } else if (type === 1) {
                    targetCtx.moveTo(0, -size / 2);
                    targetCtx.lineTo(size / 2, size / 2);
                    targetCtx.lineTo(-size / 2, size / 2);
                    targetCtx.closePath();
                } else {
                    const points = 5;
                    const inner = size / 4;
                    const outer = size / 2;
                    for (let j = 0; j < points * 2; j++) {
                        const r = j % 2 === 0 ? outer : inner;
                        const a = (j / (points * 2)) * Math.PI * 2;
                        if (j === 0) targetCtx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                        else targetCtx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    targetCtx.closePath();
                }
                
                targetCtx.fill();
                targetCtx.lineWidth = 1;
                targetCtx.strokeStyle = 'rgba(255,255,255,0.15)';
                targetCtx.stroke();
                targetCtx.restore();
            }
        }

        function generateFlecktarn(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.flecktarn);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const numClusters = Math.floor((w * h) / 8000);
            for (let i = 0; i < numClusters; i++) {
                const cx = random() * w;
                const cy = random() * h;
                const color = randomChoice(currentPalette.slice(1));
                const numDots = randomInt(8, 30);
                
                targetCtx.fillStyle = color;
                for (let j = 0; j < numDots; j++) {
                    const angle = random() * Math.PI * 2;
                    const dist = random() * randomInt(5, 80);
                    const radius = randomInt(2, 12);
                    targetCtx.beginPath();
                    targetCtx.arc(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist, radius, 0, Math.PI*2);
                    targetCtx.fill();
                }
            }
        }

        function generateHex(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.hex);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            const r = randomInt(15, 35);
            const dx = r * 1.5;
            const dy = r * Math.sqrt(3);

            targetCtx.lineWidth = 1.5;
            for (let y = -dy; y < h + dy; y += dy) {
                for (let x = -dx; x < w + dx; x += dx * 2) {
                    for (let offset of [0, 1]) {
                        const cx = x + (offset * dx);
                        const cy = y + (offset * (dy / 2));
                        
                        targetCtx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 180) * (60 * i);
                            const px = cx + r * Math.cos(angle);
                            const py = cy + r * Math.sin(angle);
                            if (i === 0) targetCtx.moveTo(px, py);
                            else targetCtx.lineTo(px, py);
                        }
                        targetCtx.closePath();
                        
                        const noiseVal = Math.sin(cx * 0.005) + Math.sin(cy * 0.005) + (random() * 0.4);
                        let colorIndex = Math.floor(Math.abs(noiseVal) * currentPalette.length) % currentPalette.length;
                        
                        targetCtx.fillStyle = currentPalette[colorIndex];
                        targetCtx.fill();
                        targetCtx.strokeStyle = 'rgba(0,0,0,0.15)';
                        targetCtx.stroke();
                        
                        if(random() > 0.6) {
                            targetCtx.beginPath();
                            for (let i = 0; i < 6; i++) {
                                const angle = (Math.PI / 180) * (60 * i);
                                const px = cx + (r * 0.5) * Math.cos(angle);
                                const py = cy + (r * 0.5) * Math.sin(angle);
                                if (i === 0) targetCtx.moveTo(px, py);
                                else targetCtx.lineTo(px, py);
                            }
                            targetCtx.closePath();
                            targetCtx.fillStyle = randomChoice(currentPalette);
                            targetCtx.fill();
                        }
                    }
                }
            }
        }

        function generateBrushstroke(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.brushstroke);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const numStrokes = Math.floor((w * h) / 4000);
            for (let i = 0; i < numStrokes; i++) {
                const cx = random() * w;
                const cy = random() * h;
                const length = randomInt(40, 200);
                const thickness = randomInt(8, 30);
                
                targetCtx.beginPath();
                targetCtx.moveTo(cx, cy);
                
                let px = cx;
                let py = cy;
                const segments = randomInt(2, 5);
                
                for (let j = 0; j < segments; j++) {
                    const dx = (length / segments) * (random() > 0.5 ? 1 : -1); 
                    const dy = (random() - 0.5) * 50;
                    const cp1x = px + dx / 2;
                    const cp1y = py + dy;
                    const cp2x = px + dx / 2;
                    const cp2y = py + dy;
                    px += dx;
                    py += dy;
                    targetCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, px, py);
                }
                
                targetCtx.lineWidth = thickness;
                targetCtx.lineCap = 'round';
                targetCtx.lineJoin = 'round';
                targetCtx.strokeStyle = randomChoice(currentPalette.slice(1));
                targetCtx.stroke();
            }
        }

        function generateTopographic(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.topographic);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const numPeaks = randomInt(4, 10);
            targetCtx.lineWidth = 1.5;
            
            for(let i = 0; i < numPeaks; i++) {
                const cx = random() * w;
                const cy = random() * h;
                const maxRad = randomInt(150, Math.max(w,h) * 0.8);
                const rings = randomInt(8, 25);
                
                for(let r = rings; r >= 1; r--) {
                    const baseRadius = (r / rings) * maxRad;
                    targetCtx.beginPath();
                    
                    const points = randomInt(20, 50);
                    for(let p = 0; p <= points; p++) {
                        const angle = (p / points) * Math.PI * 2;
                        const noise = (Math.sin(angle * randomInt(2, 6) + currentSeed) + Math.cos(angle * randomInt(1, 4) + i)) * (baseRadius * 0.15);
                        const finalR = Math.max(1, baseRadius + noise);
                        
                        const px = cx + Math.cos(angle) * finalR;
                        const py = cy + Math.sin(angle) * finalR;
                        
                        if (p === 0) targetCtx.moveTo(px, py);
                        else targetCtx.lineTo(px, py);
                    }
                    targetCtx.closePath();
                    
                    targetCtx.fillStyle = randomChoice(currentPalette);
                    targetCtx.fill();
                    
                    targetCtx.strokeStyle = 'rgba(0,0,0,0.3)';
                    targetCtx.stroke();
                }
            }
        }

        function generateZebra(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.zebra);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            targetCtx.fillStyle = currentPalette[1];

            const numStripes = Math.floor(w / 35);
            for(let i = -10; i < numStripes + 10; i++) {
                let x = i * 45;
                let branchY = random() * h;
                let branchSide = random() > 0.5 ? 1 : -1;
                
                let drawStripe = (startX, startY, sideDir, isBranch) => {
                    targetCtx.beginPath();
                    let pts1 = [], pts2 = [];
                    let cx = startX;
                    let width = randomInt(10, 35);
                    
                    for(let y = startY; y <= h + 50; y += 20) {
                        cx += Math.sin(y * 0.015 + i * 0.5 + currentSeed) * 20;
                        if (isBranch) {
                            cx += sideDir * 6;
                            width *= 0.92;
                        } else {
                            if (Math.abs(y - branchY) < 150) {
                                width = 25 + 15 * Math.sin((y - branchY)/150 * Math.PI);
                            }
                        }
                        if (width < 2) break;
                        
                        pts1.push({x: cx, y});
                        pts2.unshift({x: cx + width + Math.sin(y*0.08)*3, y});
                    }
                    
                    if(pts1.length > 0) {
                        targetCtx.moveTo(pts1[0].x, pts1[0].y);
                        for(let p of pts1) targetCtx.lineTo(p.x, p.y);
                        for(let p of pts2) targetCtx.lineTo(p.x, p.y);
                        targetCtx.fill();
                    }
                };
                
                drawStripe(x + (random()-0.5)*20, -50, 0, false);
                if (random() > 0.5) { 
                   drawStripe(x + Math.sin(branchY * 0.015 + i * 0.5 + currentSeed) * 20, branchY, branchSide, true);
                }
            }
        }

        function generateLeopard(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.leopard);
            targetCtx.fillStyle = currentPalette[0]; 
            targetCtx.fillRect(0, 0, w, h);

            const numSpots = Math.floor(w * h / 3500);
            for(let i=0; i<numSpots; i++) {
                const cx = random() * w;
                const cy = random() * h;
                const r = randomInt(12, 35);

                targetCtx.fillStyle = currentPalette[1];
                targetCtx.beginPath();
                for(let j=0; j<Math.PI*2; j+=0.5) {
                    let rad = r * (0.6 + random()*0.4);
                    if(j===0) targetCtx.moveTo(cx + Math.cos(j)*rad, cy + Math.sin(j)*rad);
                    else targetCtx.lineTo(cx + Math.cos(j)*rad, cy + Math.sin(j)*rad);
                }
                targetCtx.closePath();
                targetCtx.fill();

                targetCtx.strokeStyle = currentPalette[2];
                targetCtx.lineWidth = r * 0.35;
                targetCtx.lineCap = 'round';
                
                const numArcs = randomInt(2, 5);
                let angle = random() * Math.PI * 2;
                for(let a=0; a<numArcs; a++) {
                    const arcLen = (Math.PI * 2) / numArcs * (0.4 + random()*0.4);
                    targetCtx.beginPath();
                    targetCtx.arc(cx, cy, r*1.05, angle, angle + arcLen);
                    targetCtx.stroke();
                    angle += (Math.PI * 2) / numArcs + random()*0.3;
                }
                
                if(random() > 0.6) {
                    targetCtx.fillStyle = currentPalette[2];
                    targetCtx.beginPath();
                    const sCx = cx + randomInt(-r*2, r*2);
                    const sCy = cy + randomInt(-r*2, r*2);
                    targetCtx.arc(sCx, sCy, r*(0.2 + random()*0.3), 0, Math.PI*2);
                    targetCtx.fill();
                }
            }
        }

        function generateRust(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.rust);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            for(let i=0; i<150; i++) {
                targetCtx.fillStyle = randomChoice(currentPalette.slice(1, 4));
                targetCtx.globalAlpha = 0.05 + random()*0.15;
                const cx = random() * w;
                const cy = random() * h;
                const r = randomInt(80, 400);
                targetCtx.beginPath();
                targetCtx.arc(cx, cy, r, 0, Math.PI*2);
                targetCtx.fill();
            }

            targetCtx.globalAlpha = 0.3;
            for(let i=0; i<800; i++) {
                targetCtx.fillStyle = randomChoice(currentPalette.slice(2));
                const cx = random() * w;
                const cy = random() * h;
                const vertices = createRandomPolygon(cx, cy, 10, 45, randomInt(5,9));
                applyPolygonPath(targetCtx, vertices);
                targetCtx.fill();
            }

            targetCtx.globalAlpha = 0.8;
            for(let i=0; i<8000; i++) {
                targetCtx.fillStyle = randomChoice(currentPalette);
                const sz = randomInt(1, 5);
                targetCtx.fillRect(random()*w, random()*h, sz, sz);
            }
            
            targetCtx.globalAlpha = 0.9;
            for(let i=0; i<1000; i++) {
                targetCtx.fillStyle = currentPalette[currentPalette.length-1];
                targetCtx.beginPath();
                targetCtx.arc(random()*w, random()*h, random()*3, 0, Math.PI*2);
                targetCtx.fill();
            }
            targetCtx.globalAlpha = 1.0;
        }

        function generateWoodGrain(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.wood);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);

            targetCtx.globalAlpha = 0.8;
            for(let i=0; i<w; i+=4) {
                targetCtx.fillStyle = currentPalette[1];
                const noise = Math.sin(i * 0.05 + currentSeed) * 20;
                targetCtx.fillRect(i + noise, 0, randomInt(1,3), h);
            }
            
            const numKnots = randomInt(5, 15);
            for(let i=0; i<numKnots; i++) {
                const cx = random() * w;
                const cy = random() * h;
                const r = randomInt(10, 40);
                
                targetCtx.strokeStyle = currentPalette[2];
                for(let j=1; j<r; j+=3) {
                    targetCtx.beginPath();
                    targetCtx.ellipse(cx, cy, j, j*2, (random()-0.5)*0.2, 0, Math.PI*2);
                    targetCtx.stroke();
                }
            }
            targetCtx.globalAlpha = 1.0;
        }

        function generateWireframe(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.wireframe);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const cell = 50;
            const cols = Math.ceil(w / cell) + 1;
            const rows = Math.ceil(h / cell) + 1;
            
            targetCtx.lineWidth = 1.5;
            targetCtx.lineJoin = 'round';
            targetCtx.lineCap = 'round';
            
            const nodes = [];
            for (let r = 0; r < rows; r++) {
                nodes[r] = [];
                for (let c = 0; c < cols; c++) {
                    const noiseX = Math.sin(r * 0.4 + currentSeed) * 20;
                    const noiseY = Math.cos(c * 0.4 + currentSeed) * 20;
                    nodes[r][c] = { x: c * cell + noiseX, y: r * cell + noiseY };
                }
            }
            
            targetCtx.strokeStyle = currentPalette[1];
            targetCtx.shadowBlur = 15;
            targetCtx.shadowColor = currentPalette[1];
            
            targetCtx.beginPath();
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (c < cols - 1) {
                        targetCtx.moveTo(nodes[r][c].x, nodes[r][c].y);
                        targetCtx.lineTo(nodes[r][c+1].x, nodes[r][c+1].y);
                    }
                    if (r < rows - 1) {
                        targetCtx.moveTo(nodes[r][c].x, nodes[r][c].y);
                        targetCtx.lineTo(nodes[r+1][c].x, nodes[r+1][c].y);
                    }
                    if (r < rows - 1 && c < cols - 1 && (r+c)%2 === 0) {
                        targetCtx.moveTo(nodes[r][c].x, nodes[r][c].y);
                        targetCtx.lineTo(nodes[r+1][c+1].x, nodes[r+1][c+1].y);
                    }
                }
            }
            targetCtx.stroke();
            
            targetCtx.strokeStyle = currentPalette[2];
            targetCtx.shadowColor = currentPalette[2];
            targetCtx.lineWidth = 2.5;
            targetCtx.beginPath();
            const numAccents = randomInt(8, 20);
            for(let i = 0; i < numAccents; i++) {
                const sr = randomInt(0, rows-2);
                const sc = randomInt(0, cols-2);
                targetCtx.moveTo(nodes[sr][sc].x, nodes[sr][sc].y);
                if (random() > 0.5) targetCtx.lineTo(nodes[sr][sc+1].x, nodes[sr][sc+1].y);
                else targetCtx.lineTo(nodes[sr+1][sc].x, nodes[sr+1][sc].y);
            }
            targetCtx.stroke();
            targetCtx.shadowBlur = 0; 
        }

        function generateCarbonFibre(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.carbon);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const weaveSize = 20;
            const cols = Math.ceil(w / weaveSize);
            const rows = Math.ceil(h / weaveSize);
            
            for(let r = 0; r < rows; r++) {
                for(let c = 0; c < cols; c++) {
                    const x = c * weaveSize;
                    const y = r * weaveSize;
                    const isVertical = (r + c) % 2 === 0;
                    
                    targetCtx.fillStyle = isVertical ? currentPalette[1] : currentPalette[2];
                    targetCtx.fillRect(x, y, weaveSize, weaveSize);
                    
                    targetCtx.lineWidth = 2.5;
                    targetCtx.strokeStyle = currentPalette[3];
                    targetCtx.beginPath();
                    
                    if (isVertical) {
                        for(let i=3; i<weaveSize; i+=5) {
                            targetCtx.moveTo(x + i, y);
                            targetCtx.lineTo(x + i, y + weaveSize);
                        }
                    } else {
                        for(let i=3; i<weaveSize; i+=5) {
                            targetCtx.moveTo(x, y + i);
                            targetCtx.lineTo(x + weaveSize, y + i);
                        }
                    }
                    targetCtx.stroke();
                    
                    const sheen = (Math.sin(c*0.15 + r*0.1 + currentSeed*2) + 1) * 0.04;
                    targetCtx.fillStyle = `rgba(255,255,255,${sheen})`;
                    targetCtx.fillRect(x, y, weaveSize, weaveSize);
                }
            }
        }

        function generateCircuit(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.circuit);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const cell = 25;
            const cols = Math.floor(w / cell);
            const rows = Math.floor(h / cell);
            const numTraces = Math.floor((cols * rows) * 0.12);
            
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';
            
            for (let i = 0; i < numTraces; i++) {
                let currC = randomInt(1, cols - 2);
                let currR = randomInt(1, rows - 2);
                
                targetCtx.beginPath();
                targetCtx.moveTo(currC * cell, currR * cell);
                
                let length = randomInt(4, 18);
                let dir = randomInt(0, 7); 
                
                const getDirOffsets = (d) => {
                    const dx = [0, 1, 1, 1, 0, -1, -1, -1];
                    const dy = [-1, -1, 0, 1, 1, 1, 0, -1];
                    return [dx[d], dy[d]];
                };
                
                for (let j = 0; j < length; j++) {
                    if (random() > 0.65) {
                        dir = (dir + (random() > 0.5 ? 1 : -1) + 8) % 8;
                    }
                    
                    let [dc, dr] = getDirOffsets(dir);
                    currC += dc;
                    currR += dr;
                    
                    if (currC < 0 || currC >= cols || currR < 0 || currR >= rows) break;
                    targetCtx.lineTo(currC * cell, currR * cell);
                }
                
                targetCtx.lineWidth = 4;
                targetCtx.strokeStyle = random() > 0.6 ? currentPalette[2] : currentPalette[1];
                targetCtx.stroke();
                
                if (random() > 0.4) {
                    targetCtx.fillStyle = currentPalette[3];
                    targetCtx.beginPath();
                    if (random() > 0.5) {
                        targetCtx.arc(currC * cell, currR * cell, 6, 0, Math.PI*2);
                    } else {
                        targetCtx.rect(currC * cell - 5, currR * cell - 5, 10, 10);
                    }
                    targetCtx.fill();
                }
            }
        }

        function generateGlitch(targetCtx, w, h) {
            currentPalette = randomChoice(stylePalettes.glitch);
            targetCtx.fillStyle = currentPalette[0];
            targetCtx.fillRect(0, 0, w, h);
            
            const numBlocks = randomInt(30, 70);
            for(let i=0; i<numBlocks; i++) {
                targetCtx.fillStyle = currentPalette[4];
                targetCtx.fillRect(random()*w, random()*h, random()*400, random()*120);
            }
            
            for(let i=0; i<45; i++) {
                const x = random() * w;
                const y = random() * h;
                const bw = random() * 250 + 50;
                const bh = random() * 60 + 10;
                
                targetCtx.globalCompositeOperation = 'screen';
                
                targetCtx.fillStyle = currentPalette[1]; 
                targetCtx.fillRect(x - randomInt(8,30), y, bw, bh);
                
                targetCtx.fillStyle = currentPalette[2]; 
                targetCtx.fillRect(x + randomInt(8,30), y, bw, bh);
                
                targetCtx.globalCompositeOperation = 'source-over';
            }
            
            const numLines = randomInt(60, 200);
            for(let i=0; i<numLines; i++) {
                targetCtx.fillStyle = randomChoice(currentPalette.slice(1, 4));
                const y = random() * h;
                const lHeight = random() > 0.92 ? random()*12 : random()*3; 
                targetCtx.fillRect(0, y, w, lHeight);
            }
            
            targetCtx.fillStyle = currentPalette[3];
            for(let i=0; i<150; i++) {
                if (random() > 0.75) {
                   targetCtx.fillRect(random()*w, random()*h, randomInt(10,60), randomInt(3,15));
                }
            }
        }

        function generatePattern(targetCtx, w, h) {
            currentSeed = baseSeed;
            targetCtx.globalAlpha = 1.0;
            
            if (currentStyle === 'wwi') {
                generateWWIDazzle(targetCtx, w, h);
            } else if (currentStyle === 'splinter') {
                generateSplinter(targetCtx, w, h);
            } else if (currentStyle === 'tiger') {
                generateTigerStripe(targetCtx, w, h);
            } else if (currentStyle === 'digital') {
                generateDigital(targetCtx, w, h);
            } else if (currentStyle === 'cubist') {
                generateCubist(targetCtx, w, h);
            } else if (currentStyle === 'flecktarn') {
                generateFlecktarn(targetCtx, w, h);
            } else if (currentStyle === 'hex') {
                generateHex(targetCtx, w, h);
            } else if (currentStyle === 'brushstroke') {
                generateBrushstroke(targetCtx, w, h);
            } else if (currentStyle === 'topographic') {
                generateTopographic(targetCtx, w, h);
            } else if (currentStyle === 'zebra') {
                generateZebra(targetCtx, w, h);
            } else if (currentStyle === 'leopard') {
                generateLeopard(targetCtx, w, h);
            } else if (currentStyle === 'rust') {
                generateRust(targetCtx, w, h);
            } else if (currentStyle === 'wood') {
                generateWoodGrain(targetCtx, w, h);
            } else if (currentStyle === 'emojis') {
                generateEmojis(targetCtx, w, h);
            } else if (currentStyle === 'shapes') {
                generateShapes(targetCtx, w, h);
            } else if (currentStyle === 'wireframe') {
                generateWireframe(targetCtx, w, h);
            } else if (currentStyle === 'carbon') {
                generateCarbonFibre(targetCtx, w, h);
            } else if (currentStyle === 'circuit') {
                generateCircuit(targetCtx, w, h);
            } else if (currentStyle === 'glitch') {
                generateGlitch(targetCtx, w, h);
            }
        }

        function triggerNewPattern() {
            baseSeed = Math.random() * 10000;
            currentSeed = baseSeed;
            generatePattern(ctx, window.innerWidth, window.innerHeight);
        }

        // Generate / Reload Button
        reloadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            triggerNewPattern();
        });

        // Style Selection
        const styleButtons = document.querySelectorAll('.style-btn');
        styleButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                styleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentStyle = btn.getAttribute('data-style');
                triggerNewPattern();
            });
        });

        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            link.click();
        }

        function executeDownload(width, height) {
            if (width === 'current') {
                downloadImage(canvas.toDataURL('image/png'), `texture-viewport-${Date.now()}.png`);
            } else {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = width;
                offCanvas.height = height;
                const offCtx = offCanvas.getContext('2d');
                
                generatePattern(offCtx, width, height);
                downloadImage(offCanvas.toDataURL('image/png'), `texture-${width}x${height}-${Date.now()}.png`);
            }
        }

        canvas.addEventListener('click', () => {
            triggerNewPattern();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                triggerNewPattern();
            }
        });

        downloadDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            downloadMenu.classList.toggle('hidden');
        });
        
        window.addEventListener('click', (e) => {
            if (!downloadMenu.classList.contains('hidden') && !e.target.closest('#downloadContainer')) {
                downloadMenu.classList.add('hidden');
            }
        });

        downloadOptions.forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                downloadMenu.classList.add('hidden');
                const res = e.currentTarget.getAttribute('data-res');
                if (res === 'current') {
                    executeDownload('current', null);
                } else {
                    const [w, h] = res.split('x').map(Number);
                    executeDownload(w, h);
                }
            });
        });

        customResBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            downloadMenu.classList.add('hidden');
            customResModal.classList.remove('hidden');
            customError.textContent = '';
        });

        cancelCustom.addEventListener('click', () => {
            customResModal.classList.add('hidden');
        });

        downloadCustom.addEventListener('click', () => {
            const w = parseInt(customW.value);
            const h = parseInt(customH.value);
            if(w > 0 && h > 0) {
                customResModal.classList.add('hidden');
                executeDownload(w, h);
            } else {
                customError.textContent = 'Please enter valid numbers > 0';
            }
        });

        document.getElementById('customResContent').addEventListener('click', (e) => {
            e.stopPropagation(); 
        });

        // Initialize Canvas
        resizeCanvas();

    </script>
</body>
</html>
