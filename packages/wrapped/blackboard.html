<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebBoard · sTerminal Edition</title>
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --font-family: 'Courier New', Courier, monospace;
            --font-size: 12px;
            --infobar-size: 20px;
        }

        /* Inverted Theme (Paper/Light Mode) */
        body.inverted {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--font-size);
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Top Bar mimicking sTerminal infobar */
        #infobar {
            height: var(--infobar-size);
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-color);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            font-size: max(12px, calc(var(--font-size) - 2px));
            z-index: 1000;
            border-bottom: 1px solid var(--text-color);
        }

        .infobar-modules-left { display: flex; height: 100%; }
        .infobar-modules-right { padding: 0 8px; font-weight: bold; }

        /* Bottom Bar mimicking sTerminal tabs-bar */
        #tabs-bar {
            height: var(--infobar-size);
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-color);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            font-size: max(12px, calc(var(--font-size) - 2px));
            border-top: 1px solid var(--text-color);
            z-index: 1001;
            overflow-x: auto;
        }

        /* Button styling matching sTerminal tabs/options */
        .term-btn {
            background: transparent;
            color: var(--text-color);
            border: none;
            border-right: 1px solid var(--text-color);
            padding: 0 6px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            transition: background-color 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .term-btn:hover, .term-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* Workspace and Canvas */
        #workspace-container {
            flex-grow: 1;
            height: 0;
            position: relative;
            background-color: var(--bg-color);
            cursor: crosshair;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 8px;
            border-right: 1px solid var(--text-color);
            gap: 8px;
        }

        /* Terminal blocky slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            background: transparent;
            height: 100%;
            display: flex;
            align-items: center;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            background: var(--text-color);
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 12px;
            width: 6px;
            background: var(--text-color);
            cursor: pointer;
            margin-top: -5px;
            border-radius: 0;
        }

        /* Color Palette Blocks */
        .color-btn {
            width: 12px;
            height: 12px;
            cursor: pointer;
            border: 1px solid var(--text-color);
            box-sizing: border-box;
        }
        .color-btn.active {
            border: 2px solid var(--bg-color);
            outline: 1px solid var(--text-color);
        }
        
        input[type="color"]#color-picker {
            -webkit-appearance: none;
            appearance: none;
            border: 1px solid var(--text-color);
            width: 14px;
            height: 14px;
            padding: 0;
            background: transparent;
            cursor: pointer;
            box-sizing: border-box;
        }
        input[type="color"]#color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]#color-picker::-webkit-color-swatch {
            border: none;
        }
        input[type="color"]#color-picker.active {
            border: 2px solid var(--bg-color);
            outline: 1px solid var(--text-color);
        }
        
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }

        /* Context Menu */
        #shape-context-menu {
            position: fixed;
            display: none;
            flex-direction: column;
            background-color: var(--bg-color);
            border: 1px solid var(--text-color);
            z-index: 2000;
            font-family: inherit;
            font-size: var(--font-size);
            min-width: 120px;
        }
        .ctx-item {
            padding: 4px 10px;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--text-color);
        }
        .ctx-item:last-child {
            border-bottom: none;
        }
        .ctx-item:hover, .ctx-item.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* Image Search Panel */
        #image-search-panel {
            position: absolute;
            bottom: var(--infobar-size);
            left: 0;
            width: 100vw;
            height: 250px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--text-color);
            display: none;
            flex-direction: column;
            z-index: 1500;
        }
        .search-header {
            display: flex;
            padding: 4px 8px;
            border-bottom: 1px solid var(--text-color);
            gap: 8px;
            align-items: center;
        }
        .search-header input {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: inherit;
            padding: 2px 4px;
            flex-grow: 1;
            outline: none;
        }
        #image-search-results {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            overflow-y: auto;
            overflow-x: hidden;
            flex-grow: 1;
            align-items: flex-start;
            justify-content: center;
            align-content: flex-start;
        }
        .search-result-img {
            max-height: 100px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .search-result-img:hover {
            border: 1px solid var(--text-color);
        }

        /* Floating Image Overlays */
        .floating-img-wrapper {
            position: absolute;
            border: 1px dashed var(--text-color);
            box-sizing: border-box;
            z-index: 100;
        }
        .floating-img-wrapper.locked {
            border: 1px solid transparent;
            pointer-events: none; /* Clicks pass through to draw! */
        }
        .floating-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none; /* Prevent browser drag */
            display: block;
        }
        body.inverted .floating-img-wrapper img {
            filter: invert(1);
        }
        .floating-controls {
            position: absolute;
            top: -16px; right: -1px;
            display: flex;
            pointer-events: auto; /* Always clickable */
        }
        .floating-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--text-color);
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            height: 16px;
            user-select: none;
        }
        .floating-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
        .resize-handle {
            position: absolute;
            bottom: -5px; right: -5px;
            width: 10px; height: 10px;
            background: var(--text-color);
            cursor: se-resize;
            pointer-events: auto;
        }
        .drag-area {
            position: absolute;
            inset: 0;
            cursor: move;
            z-index: 1;
            pointer-events: auto;
        }
        .floating-img-wrapper.locked .resize-handle,
        .floating-img-wrapper.locked .drag-area,
        .floating-img-wrapper.locked .delete-btn {
            display: none;
        }
        .floating-img-wrapper.locked .floating-controls {
            opacity: 0.2;
            transition: opacity 0.2s;
        }
        .floating-img-wrapper.locked:hover .floating-controls,
        .floating-img-wrapper.locked .floating-controls:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="infobar">
        <div class="infobar-modules-left">
            <button id="theme-toggle" class="term-btn" title="Toggle Theme">INV</button>
            <button id="undo-btn" class="term-btn" title="Undo">UNDO</button>
            <button id="redo-btn" class="term-btn" title="Redo">REDO</button>
            <button id="clear-btn" class="term-btn" title="Clear Board">CLR</button>
            <button id="download-btn" class="term-btn" title="Save Image">SAVE</button>
        </div>
        <div class="infobar-modules-right">
            <span id="msg-text">SYSTEM.READY</span><span class="blink">_</span>
        </div>
    </div>

    <!-- Canvas Workspace -->
    <div id="workspace-container">
        <canvas id="board"></canvas>
    </div>

    <!-- Shape Context Menu -->
    <div id="shape-context-menu">
        <div class="ctx-item" data-tool="pen">PENCIL</div>
        <div class="ctx-item" data-tool="rect">RECTANGLE</div>
        <div class="ctx-item" data-tool="square">SQUARE</div>
        <div class="ctx-item" data-tool="circle">CIRCLE</div>
        <div class="ctx-item" data-tool="triangle">TRIANGLE</div>
        <div class="ctx-item" id="ctx-pictures">PICTURES</div>
    </div>

    <!-- Image Search Panel -->
    <div id="image-search-panel">
        <div class="search-header">
            <span>IMG_SEARCH:</span>
            <input type="text" id="image-search-input" placeholder="Enter query...">
            <button id="image-search-btn" class="term-btn">SEARCH</button>
            <button id="image-search-close" class="term-btn">CLOSE</button>
        </div>
        <div id="image-search-results"></div>
    </div>

    <!-- Bottom Toolbar -->
    <div id="tabs-bar">
        <button class="term-btn main-tool active" data-tool="pen">PEN</button>
        <button class="term-btn main-tool" data-tool="eraser">ERASE</button>
        
        <div class="toolbar-group" title="Stroke Width">
            <span>SZ:</span>
            <input type="range" id="size-slider" min="1" max="50" value="3">
            <span id="size-display" style="width: 2ch; text-align: right;">03</span>
        </div>
        
        <div class="toolbar-group" id="color-palette">
            <!-- ANSI Terminal Colors Palette -->
            <div class="color-btn active" style="background:#ffffff;" data-color="#ffffff" title="White"></div>
            <div class="color-btn" style="background:#ff0000;" data-color="#ff0000" title="Red"></div>
            <div class="color-btn" style="background:#00ff00;" data-color="#00ff00" title="Green"></div>
            <div class="color-btn" style="background:#0000ff;" data-color="#0000ff" title="Blue"></div>
            <div class="color-btn" style="background:#ffff00;" data-color="#ffff00" title="Yellow"></div>
            <div class="color-btn" style="background:#ff00ff;" data-color="#ff00ff" title="Magenta"></div>
            <div class="color-btn" style="background:#00ffff;" data-color="#00ffff" title="Cyan"></div>
            
            <!-- Custom Color Picker -->
            <div style="width: 1px; height: 12px; background: var(--text-color); margin: 0 5px;"></div>
            <input type="color" id="color-picker" title="Custom Color" value="#ff0000">
        </div>
    </div>

<script>
    (function() {
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('workspace-container');
        const msgText = document.getElementById('msg-text');

        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let startX = 0, startY = 0;
        let draftState = null;
        let currentTool = 'pen';
        let currentColor = '#ffffff'; // Default to white
        let currentSize = 3;

        let undoStack = [];
        let redoStack = [];
        
        let msgTimer = null;

        function updateClock() {
            if (msgTimer !== null) return; // Prevent overwriting temporary messages
            const now = new Date();
            msgText.textContent = now.toLocaleString('en-US', {
                weekday: 'short', year: 'numeric', month: 'short', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            }).toUpperCase();
        }

        function showMessage(msg) {
            msgText.textContent = msg.toUpperCase();
            clearTimeout(msgTimer);
            msgTimer = setTimeout(() => {
                msgTimer = null;
                updateClock();
            }, 2000);
        }
        
        setInterval(updateClock, 1000);
        updateClock(); // Initialize immediately on load

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            let tempCanvas = null;
            if (canvas.width > 0 && canvas.height > 0) {
                tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
            }

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            // Blocky joins for terminal feel instead of 'round'
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';

            if (tempCanvas) {
                ctx.save();
                // We do NOT scale ctx here when restoring, because tempCanvas 
                // is already at the correct multiplied resolution.
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            } else if (undoStack.length === 0) {
                saveState();
            }
            
            // Set scale for future drawing operations
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resizeCanvas();
        
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 150);
        });

        function saveState() {
            if (undoStack.length > 20) undoStack.shift();
            undoStack.push(canvas.toDataURL());
            redoStack = [];
        }

        function restoreState(dataUrl) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            };
        }

        function getCoords(e) {
            const rect = container.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function applyBrush() {
            ctx.lineWidth = currentSize;
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }
        }

        function startDrawing(e) {
            if (e.target !== canvas || e.button === 2) return;
            isDrawing = true;
            const c = getCoords(e);
            startX = c.x;
            startY = c.y;
            lastX = c.x; 
            lastY = c.y;
            
            // Snapshot canvas for live shape preview
            draftState = ctx.getImageData(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            if (['pen', 'eraser'].includes(currentTool)) {
                ctx.lineTo(lastX, lastY);
                applyBrush();
                ctx.stroke();
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const c = getCoords(e);

            if (['pen', 'eraser'].includes(currentTool)) {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(c.x, c.y);
                applyBrush();
                ctx.stroke();
                lastX = c.x; 
                lastY = c.y;
            } else {
                // Restore draft state for shape preview to avoid trails
                ctx.putImageData(draftState, 0, 0);
                
                ctx.beginPath();
                applyBrush();
                
                const dx = c.x - startX;
                const dy = c.y - startY;

                if (currentTool === 'rect') {
                    ctx.rect(startX, startY, dx, dy);
                } else if (currentTool === 'square') {
                    const side = Math.max(Math.abs(dx), Math.abs(dy));
                    const signX = dx < 0 ? -1 : 1;
                    const signY = dy < 0 ? -1 : 1;
                    ctx.rect(startX, startY, side * signX, side * signY);
                } else if (currentTool === 'circle') {
                    const radius = Math.hypot(dx, dy);
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                } else if (currentTool === 'triangle') {
                    ctx.moveTo(startX + dx / 2, startY); // Top vertex
                    ctx.lineTo(startX, startY + dy);     // Bottom left
                    ctx.lineTo(startX + dx, startY + dy); // Bottom right
                    ctx.closePath();
                }
                ctx.stroke();
            }
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                saveState();
            }
        }

        canvas.addEventListener('pointerdown', startDrawing);
        window.addEventListener('pointermove', draw); // bind to window to catch fast movements
        window.addEventListener('pointerup', stopDrawing);
        window.addEventListener('pointercancel', stopDrawing);

        // Scroll wheel to change line thickness while drawing shapes
        window.addEventListener('wheel', (e) => {
            if (!isDrawing) return;
            // Restrict this feature strictly to the shape tools
            if (['pen', 'eraser'].includes(currentTool)) return;

            e.preventDefault();
            
            // Scroll up (negative deltaY) = larger, Scroll down = smaller
            const delta = Math.sign(e.deltaY) * -1;
            currentSize = Math.max(1, Math.min(50, currentSize + delta));
            
            // Sync the UI slider and display
            document.getElementById('size-slider').value = currentSize;
            document.getElementById('size-display').textContent = Math.round(currentSize).toString().padStart(2, '0');
            
            // Instantly redraw the current shape with the new thickness
            draw(e);
        }, { passive: false });

        // Context Menu Logic
        const ctxMenu = document.getElementById('shape-context-menu');
        
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // Prevent default browser right-click menu
            ctxMenu.style.display = 'flex';
            
            // Adjust position so menu doesn't overflow screen
            let left = e.clientX;
            let top = e.clientY;
            if (left + ctxMenu.offsetWidth > window.innerWidth) left = window.innerWidth - ctxMenu.offsetWidth;
            if (top + ctxMenu.offsetHeight > window.innerHeight) top = window.innerHeight - ctxMenu.offsetHeight;
            
            ctxMenu.style.left = left + 'px';
            ctxMenu.style.top = top + 'px';
        });

        window.addEventListener('pointerdown', (e) => {
            if (e.button !== 2 && !ctxMenu.contains(e.target)) {
                ctxMenu.style.display = 'none';
            }
        });

        document.querySelectorAll('.ctx-item').forEach(item => {
            item.addEventListener('click', function() {
                if (this.id === 'ctx-pictures') {
                    document.getElementById('image-search-panel').style.display = 'flex';
                    ctxMenu.style.display = 'none';
                    document.getElementById('image-search-input').focus();
                    return;
                }

                document.querySelectorAll('.main-tool').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.ctx-item').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTool = this.dataset.tool;
                showMessage(`TOOL:${currentTool.toUpperCase()}`);
            });
        });

        // Colors
        const colorPicker = document.getElementById('color-picker');

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                colorPicker.classList.remove('active');
                this.classList.add('active');
                currentColor = this.dataset.color;
                if (currentTool === 'eraser') {
                    document.querySelector('[data-tool="pen"]')?.click();
                }
                showMessage(`COLOR:${currentColor}`);
            });
        });

        colorPicker.addEventListener('input', function(e) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentColor = e.target.value;
            if (currentTool === 'eraser') {
                document.querySelector('[data-tool="pen"]')?.click();
            }
            showMessage(`COLOR:${currentColor}`);
        });

        // Size Slider
        const sizeDisplay = document.getElementById('size-display');
        document.getElementById('size-slider').addEventListener('input', e => {
            currentSize = parseFloat(e.target.value);
            sizeDisplay.textContent = Math.round(currentSize).toString().padStart(2, '0');
        });

        // Undo / Redo Actions
        function undo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                restoreState(undoStack[undoStack.length-1]);
                showMessage('ACTION:UNDO');
            }
        }
        function redo() {
            if (redoStack.length > 0) {
                const state = redoStack.pop();
                undoStack.push(state);
                restoreState(state);
                showMessage('ACTION:REDO');
            }
        }
        
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('redo-btn').addEventListener('click', redo);

        document.addEventListener('keydown', e => {
            // Undo & Redo mappings
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') { e.preventDefault(); undo(); }
                if (e.key === 'y') { e.preventDefault(); redo(); }
            }
            
            // Close windows on Escape key
            if (e.key === 'Escape') {
                const searchPanel = document.getElementById('image-search-panel');
                if (searchPanel.style.display === 'flex') {
                    searchPanel.style.display = 'none';
                }
                
                if (ctxMenu.style.display === 'flex') {
                    ctxMenu.style.display = 'none';
                }
            }
        });

        // Clear
        document.getElementById('clear-btn').addEventListener('click', () => {
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
            saveState();
            
            // Remove any floating image overlays
            document.querySelectorAll('.floating-img-wrapper').forEach(el => el.remove());
            
            showMessage('MEM:FLUSHED');
        });

        // Download
        document.getElementById('download-btn').addEventListener('click', () => {
            const tmp = document.createElement('canvas');
            tmp.width = canvas.width;
            tmp.height = canvas.height;
            const tctx = tmp.getContext('2d');
            
            // Fetch dynamically computed background color based on theme
            const bg = window.getComputedStyle(document.body).getPropertyValue('--bg-color').trim();
            tctx.fillStyle = bg || '#000000';
            tctx.fillRect(0, 0, tmp.width, tmp.height);
            tctx.drawImage(canvas, 0, 0);
            
            // Draw floating images on top
            const dpr = window.devicePixelRatio || 1;
            const cRect = canvas.getBoundingClientRect();
            document.querySelectorAll('.floating-img-wrapper').forEach(f => {
                const img = f.querySelector('img');
                const rect = f.getBoundingClientRect();
                const x = (rect.left - cRect.left) * dpr;
                const y = (rect.top - cRect.top) * dpr;
                const w = rect.width * dpr;
                const h = rect.height * dpr;
                
                if (inverted) {
                    tctx.filter = 'invert(1)';
                } else {
                    tctx.filter = 'none';
                }
                tctx.drawImage(img, x, y, w, h);
            });
            
            const link = document.createElement('a');
            link.download = `sTERM_BOARD_${Math.floor(Date.now() / 1000)}.png`;
            link.href = tmp.toDataURL('image/png');
            link.click();
            showMessage('DATA:EXPORTED');
        });

        // Image Search / Open API Logic
        const searchInput = document.getElementById('image-search-input');
        const searchBtn = document.getElementById('image-search-btn');
        const searchClose = document.getElementById('image-search-close');
        const searchResults = document.getElementById('image-search-results');

        async function searchImages(query) {
            if (!query.trim()) return;
            searchResults.innerHTML = '<span style="padding:8px;">SEARCHING...</span>';
            try {
                // Using Wikimedia Commons as a free, open API for images
                const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=30&prop=imageinfo&iiprop=url&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                searchResults.innerHTML = '';
                
                if (data.query && data.query.pages) {
                    Object.values(data.query.pages).forEach(page => {
                        if (page.imageinfo && page.imageinfo[0]) {
                            const imgUrl = page.imageinfo[0].url;
                            const img = document.createElement('img');
                            img.crossOrigin = 'Anonymous'; // Required for canvas export
                            img.src = imgUrl;
                            img.className = 'search-result-img';
                            img.title = 'Click to insert';
                            img.addEventListener('click', () => {
                                const rect = container.getBoundingClientRect();
                                const maxDim = Math.min(rect.width, rect.height) / 2;
                                let w = img.naturalWidth;
                                let h = img.naturalHeight;
                                if (w > maxDim || h > maxDim) {
                                    const ratio = Math.min(maxDim/w, maxDim/h);
                                    w *= ratio;
                                    h *= ratio;
                                }
                                
                                const wrapper = document.createElement('div');
                                wrapper.className = 'floating-img-wrapper';
                                wrapper.style.width = w + 'px';
                                wrapper.style.height = h + 'px';
                                wrapper.style.left = (rect.width / 2 - w / 2) + 'px';
                                wrapper.style.top = (rect.height / 2 - h / 2) + 'px';

                                const innerImg = document.createElement('img');
                                innerImg.crossOrigin = 'Anonymous';
                                innerImg.src = img.src;

                                const dragArea = document.createElement('div');
                                dragArea.className = 'drag-area';

                                const resizeHandle = document.createElement('div');
                                resizeHandle.className = 'resize-handle';

                                const controls = document.createElement('div');
                                controls.className = 'floating-controls';

                                const lockBtn = document.createElement('button');
                                lockBtn.className = 'floating-btn lock-btn';
                                lockBtn.innerText = 'LOCK';

                                const delBtn = document.createElement('button');
                                delBtn.className = 'floating-btn delete-btn';
                                delBtn.innerText = 'DEL';

                                controls.appendChild(lockBtn);
                                controls.appendChild(delBtn);

                                wrapper.appendChild(innerImg);
                                wrapper.appendChild(dragArea);
                                wrapper.appendChild(resizeHandle);
                                wrapper.appendChild(controls);
                                container.appendChild(wrapper);

                                // Dragging Logic
                                let isDragging = false, startX, startY, initL, initT;
                                dragArea.addEventListener('pointerdown', e => {
                                    isDragging = true;
                                    startX = e.clientX; startY = e.clientY;
                                    initL = parseFloat(wrapper.style.left) || 0;
                                    initT = parseFloat(wrapper.style.top) || 0;
                                    dragArea.setPointerCapture(e.pointerId);
                                    e.stopPropagation();
                                });
                                dragArea.addEventListener('pointermove', e => {
                                    if(!isDragging) return;
                                    wrapper.style.left = (initL + (e.clientX - startX)) + 'px';
                                    wrapper.style.top = (initT + (e.clientY - startY)) + 'px';
                                    e.stopPropagation();
                                });
                                dragArea.addEventListener('pointerup', e => {
                                    isDragging = false;
                                    dragArea.releasePointerCapture(e.pointerId);
                                    e.stopPropagation();
                                });

                                // Resizing Logic
                                let isResizing = false, initW, initH;
                                resizeHandle.addEventListener('pointerdown', e => {
                                    isResizing = true;
                                    startX = e.clientX; startY = e.clientY;
                                    initW = parseFloat(wrapper.style.width) || 0;
                                    initH = parseFloat(wrapper.style.height) || 0;
                                    resizeHandle.setPointerCapture(e.pointerId);
                                    e.stopPropagation();
                                });
                                resizeHandle.addEventListener('pointermove', e => {
                                    if(!isResizing) return;
                                    wrapper.style.width = Math.max(30, initW + (e.clientX - startX)) + 'px';
                                    wrapper.style.height = Math.max(30, initH + (e.clientY - startY)) + 'px';
                                    e.stopPropagation();
                                });
                                resizeHandle.addEventListener('pointerup', e => {
                                    isResizing = false;
                                    resizeHandle.releasePointerCapture(e.pointerId);
                                    e.stopPropagation();
                                });

                                // Controls Logic
                                let isLocked = false;
                                lockBtn.addEventListener('click', e => {
                                    isLocked = !isLocked;
                                    wrapper.classList.toggle('locked', isLocked);
                                    lockBtn.innerText = isLocked ? 'UNLOCK' : 'LOCK';
                                    e.stopPropagation();
                                });
                                delBtn.addEventListener('click', e => {
                                    wrapper.remove();
                                    e.stopPropagation();
                                });

                                showMessage('PICTURE:ADDED');
                            });
                            searchResults.appendChild(img);
                        }
                    });
                } else {
                    searchResults.innerHTML = '<span style="padding:8px;">NO RESULTS FOUND.</span>';
                }
            } catch (e) {
                searchResults.innerHTML = '<span style="padding:8px;">ERROR FETCHING RESULTS.</span>';
            }
        }

        searchBtn.addEventListener('click', () => searchImages(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchImages(searchInput.value);
        });
        searchClose.addEventListener('click', () => {
            document.getElementById('image-search-panel').style.display = 'none';
        });

        // Theme Toggle (Invert)
        const themeToggle = document.getElementById('theme-toggle');
        let inverted = false;
        themeToggle.addEventListener('click', function() {
            inverted = !inverted;
            document.body.classList.toggle('inverted', inverted);
            
            // If we invert, we need to invert the drawing colors logically or rely on the visual CSS variables.
            // Since canvas pixels are hardcoded, switching backgrounds will make white ink invisible on a white background.
            // To fix this natively, we can composite an invert over the canvas.
            
            const tmp = document.createElement('canvas');
            tmp.width = canvas.width;
            tmp.height = canvas.height;
            const tctx = tmp.getContext('2d');
            tctx.drawImage(canvas, 0, 0);
            
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Re-draw inverted
            ctx.globalCompositeOperation = 'source-over';
            ctx.filter = 'invert(1)';
            ctx.drawImage(tmp, 0, 0);
            ctx.restore();
            
            // Flip our active drawing color palette internally
            function invertHex(hex) {
                if (!hex) return '#ffffff';
                let h = hex.replace('#', '');
                if (h.length === 3) h = h.split('').map(x => x + x).join('');
                const r = (255 - parseInt(h.slice(0, 2), 16)).toString(16).padStart(2, '0');
                const g = (255 - parseInt(h.slice(2, 4), 16)).toString(16).padStart(2, '0');
                const b = (255 - parseInt(h.slice(4, 6), 16)).toString(16).padStart(2, '0');
                return `#${r}${g}${b}`;
            }

            document.querySelectorAll('.color-btn').forEach(btn => {
                const baseColor = btn.dataset.color;
                btn.style.background = inverted ? invertHex(baseColor) : baseColor;
            });
            
            colorPicker.value = invertHex(colorPicker.value);
            currentColor = invertHex(currentColor);
            
            // Refresh Undo Stack with inverted pixels so restoring doesn't flip it back
            const states = [];
            while(undoStack.length > 0) {
                // In a real app we'd map and invert all states asynchronously, 
                // but resetting the stack is safer for a simple webboard invert.
                undoStack.pop();
            }
            saveState();
        });

    })();
</script>
