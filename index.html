<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sTerminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --prompt-user: #ffffff;
            --prompt-path: #bbbbbb;
            --font-family: Arial, sans-serif;
            --font-size: 15px;
            --infobar-size: 26px;
            --infobar-color: var(--bg-color);
            --hint-color: #555555;
            --modal-bg: #000000;
            --modal-border: #ffffff;
            --modal-border-start: #ffffff;
            --modal-border-end: #555555;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            font-size: var(--font-size);
            line-height: 1.4;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #infobar {
            height: var(--infobar-size, 26px);
            width: 100vw;
            background-color: var(--infobar-color, var(--bg-color));
            color: var(--text-color);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            font-family: var(--font-family);
            font-size: max(12px, calc(var(--font-size) - 3px));
            z-index: 1000;
            border: 1px solid transparent;
            border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            border-top: none;
            border-left: none;
            border-right: none;
        }

        #infobar.hidden-infobar { display: none !important; }
        #infobar-clock { font-weight: bold; cursor: pointer; user-select: none; transition: color 0.2s ease; }
        #infobar-clock:hover { color: #aaaaaa; }

        .infobar-btn {
            cursor: pointer; padding: 0 8px; user-select: none; transition: background-color 0.2s, color 0.2s;
            font-weight: bold; height: 100%; display: flex; align-items: center; position: relative;
        }
        .infobar-btn:hover { background-color: var(--text-color); color: var(--bg-color); }

        #tabs-bar {
            height: var(--infobar-size, 26px); width: 100vw; background-color: var(--infobar-color, var(--bg-color));
            color: var(--text-color); flex-shrink: 0; display: flex; align-items: center; box-sizing: border-box;
            font-family: var(--font-family); font-size: max(12px, calc(var(--font-size) - 3px));
            border: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            border-top: none; border-left: none; border-right: none; z-index: 1001; overflow-x: auto;
        }
        #tabs-bar.hidden-infobar { display: none !important; }
        #tabs-container { display: flex; align-items: center; height: 100%; }

        .tab-item {
            padding: 0 6px 0 10px; height: 100%; display: flex; align-items: center; cursor: pointer;
            user-select: none; border-right: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1; font-weight: bold;
            white-space: nowrap; gap: 6px;
        }
        .tab-item:hover { background-color: var(--text-color); color: var(--bg-color); }
        .tab-item.active-tab { background-color: var(--text-color); color: var(--bg-color); }

        .tab-close-btn { font-size: 1.1em; padding: 0 3px; border-radius: 2px; display: flex; align-items: center; justify-content: center; }
        .tab-close-btn:hover { background-color: rgba(255,255,255,0.3); }
        .tab-item.active-tab .tab-close-btn:hover { background-color: rgba(0,0,0,0.2); }

        .tab-add-btn {
            padding: 0 10px; height: 100%; display: flex; align-items: center; cursor: pointer;
            user-select: none; font-weight: bold; border-right: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
        }
        .tab-add-btn:hover { background-color: var(--text-color); color: var(--bg-color); }

        .infobar-modules-left, .infobar-modules-right { display: flex; align-items: center; height: 100%; }

        #workspace-container { flex-grow: 1; height: 0; display: flex; flex-direction: column; position: relative; }
        .tab-content { display: none; flex-grow: 1; height: 100%; flex-direction: column; }
        .tab-content.active-content { display: flex; }

        #grid-container {
            display: grid; width: 100vw; flex-grow: 1; height: 0;
            grid-template-columns: 1fr; grid-template-rows: 1fr; gap: 1px; background: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end));
        }
        #grid-container.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        #grid-container.count-3, #grid-container.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        #grid-container.count-3 .terminal-instance:nth-child(3) { grid-column: span 2; }

        .terminal-instance {
            background-color: var(--bg-color); display: flex; flex-direction: column;
            overflow-y: auto; padding: 10px 20px; box-sizing: border-box; position: relative; min-height: 0;
        }
        .terminal-instance.active-term { box-shadow: inset 0 0 0 1px var(--text-color); }

        .output { white-space: pre-wrap; word-wrap: break-word; }
        .input-line, .history-line { display: flex; align-items: center; flex-wrap: wrap; }
        .prompt { margin-right: 8px; white-space: nowrap; }
        .prompt .user { color: var(--prompt-user); font-weight: bold; }
        .prompt .path { color: var(--prompt-path); font-weight: bold; }
        .prompt .symbol { color: var(--text-color); }

        .input-wrapper { position: relative; flex-grow: 1; display: flex; align-items: center; }
        .cmd-suggestion {
            position: absolute; left: 0; color: var(--hint-color); font-family: var(--font-family);
            font-size: var(--font-size); pointer-events: none; white-space: pre; z-index: 1;
        }
        .cmd-input {
            position: relative; z-index: 2; background: transparent; border: none;
            color: var(--text-color); font-family: var(--font-family); font-size: var(--font-size);
            outline: none; flex-grow: 1; min-width: 200px; padding: 0; margin: 0;
        }

        .banner { color: #888888; margin-bottom: 15px; }
        .error { color: #aaaaaa; text-decoration: none; }
        .dir-color { color: var(--text-color); font-weight: bold; text-decoration: underline; cursor: pointer; }
        .exec-color { color: var(--text-color); font-weight: bold; text-decoration: underline; cursor: pointer; }
        .highlight-blue { color: var(--text-color); text-decoration: underline; cursor: pointer; }
        .os-item { cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }

        #os-tooltip {
            position: fixed; display: none; background-color: var(--modal-bg); color: var(--text-color);
            border: 1px solid var(--modal-border); padding: 8px 12px; font-size: 13px;
            z-index: 99999; pointer-events: none; white-space: pre-wrap; max-width: 340px; line-height: 1.3;
        }

        #os-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 99999;
        }
        #os-modal {
            background-color: var(--modal-bg); color: var(--text-color); border: 1px solid transparent;
            border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            padding: 20px; min-width: 300px; font-family: var(--font-family); font-size: var(--font-size);
            display: flex; flex-direction: column; gap: 15px;
        }
        .os-modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .os-btn {
            background: transparent; color: var(--text-color); border: 1px solid transparent;
            border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            padding: 4px 12px; font-family: inherit; font-size: inherit; cursor: pointer; font-weight: bold;
        }
        .os-btn:hover { background-color: var(--text-color); color: var(--bg-color); }

        #options-menu {
            position: absolute; left: 15px; background-color: var(--modal-bg); color: var(--text-color);
            border: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            display: none; flex-direction: column; z-index: 2000; font-family: var(--font-family);
            font-size: max(11px, calc(var(--font-size) - 3px)); min-width: 130px;
        }

        #theme-dropdown, #language-dropdown, #font-dropdown {
            position: absolute; background-color: var(--modal-bg); color: var(--text-color);
            border: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            display: none; flex-direction: column; z-index: 2001; font-family: var(--font-family);
            font-size: max(11px, calc(var(--font-size) - 3px)); min-width: 150px;
            max-height: 50vh; overflow-y: auto;
        }
        #theme-dropdown::-webkit-scrollbar, #language-dropdown::-webkit-scrollbar, #font-dropdown::-webkit-scrollbar { width: 8px; }
        #theme-dropdown::-webkit-scrollbar-thumb, #language-dropdown::-webkit-scrollbar-thumb, #font-dropdown::-webkit-scrollbar-thumb { background-color: var(--modal-border-end); }

        .mc-menu-item {
            padding: 2px 5px; cursor: pointer; user-select: none; display: flex;
            justify-content: space-between; align-items: center; position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.2); white-space: nowrap;
        }
        .mc-menu-item:last-child { border-bottom: none; }
        .mc-menu-item:hover { background-color: var(--text-color); color: var(--bg-color); }
        .mc-menu-item .arrow { margin-left: 8px; font-size: 0.7em; }

        .mc-submenu {
            position: absolute; left: 100%; top: -1px; background-color: var(--modal-bg);
            color: var(--text-color); border: 1px solid var(--modal-border); flex-direction: column;
            min-width: 90px; z-index: 2001; display: none;
        }
        .mc-menu-item:hover > .mc-submenu, .mc-submenu:hover, .mc-submenu.force-open { display: flex; }

        .mc-submenu-item {
            padding: 2px 5px; cursor: pointer; user-select: none; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
        }
        .mc-submenu-item:last-child { border-bottom: none; }
        .mc-submenu-item:hover { background-color: var(--text-color); color: var(--bg-color); }
        .mc-submenu-item.active-setting::after { content: '✓'; margin-left: 6px; font-weight: bold; }

        .mc-submenu-item input[type="number"] {
            background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--modal-border);
            font-family: inherit; font-size: inherit; padding: 1px 3px; outline: none;
            width: 40px; height: 18px; box-sizing: border-box; cursor: pointer; margin-left: 6px;
        }
        .mc-submenu-item input[type="number"]:focus { background-color: var(--text-color); color: var(--bg-color); }

        #settings-window-overlay {
            position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.68);
            display:none; justify-content:center; align-items:center; z-index:999999;
        }
        #settings-window {
            background: var(--modal-bg);
            color: var(--text-color); border: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            box-shadow: 0 12px 28px rgba(0,0,0,0.7);
            padding: 10px 12px 12px; width: 420px; max-height: 82vh; overflow-y: auto;
            font-family: var(--font-family); font-size: 12px; display:flex; flex-direction:column; gap:8px;
        }
        #settings-window > div:first-child {
            border-bottom: 1px solid var(--modal-border) !important; padding-bottom: 6px; margin-bottom: 2px;
        }
        #settings-window label {
            display:flex; flex-direction:column; gap:3px; padding: 2px 0; border-bottom: 1px solid var(--modal-border);
        }
        #settings-window label:last-of-type { border-bottom: none; }
        
        #settings-window input, #settings-window select {
            background: var(--bg-color); color: var(--text-color); border: 1px solid var(--modal-border);
            padding: 3px 5px; font-family:inherit; font-size:inherit; min-height: 22px; box-sizing:border-box;
            outline: none; accent-color: var(--modal-border);
        }
        #settings-window option { background: var(--bg-color); color: var(--text-color); }
        #settings-window ::selection { background: var(--text-color); color: var(--bg-color); }
        #settings-window input:focus, #settings-window select:focus, #settings-window button:focus {
            background: var(--text-color); color: var(--bg-color); box-shadow: inset 0 0 0 1px var(--modal-border);
        }
        #settings-window select { background: var(--bg-color); }
        #settings-window input[type="color"] {
            min-height: 28px; padding: 2px; width: 100%; box-sizing: border-box; background: var(--bg-color);
        }
        #settings-window .os-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--modal-border);
            padding: 4px 10px; min-height: 24px; line-height: 1.2;
        }

        #wrapper-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.72); z-index: 999999; padding: 2vh 2vw;
        }
        #wrapper-window {
            position: relative; width: min(96vw, 1600px); height: min(92vh, 980px);
            max-width: 100%; max-height: 100%; background: var(--bg-color); border: 1px solid transparent; border-image: linear-gradient(90deg, var(--modal-border-start), var(--modal-border-end)) 1;
            box-shadow: 0 16px 40px rgba(0,0,0,0.45); display: flex; flex-direction: column; overflow: hidden;
        }
        #wrapper-frame {
            width: 100%; flex: 1; background: #000; border: 0;
        }

        .theme-toggle-btn {
            cursor: pointer; font-weight: normal; margin-right: 4px;
            padding: 0 4px; user-select: none; transition: background-color 0.2s; border-radius: 2px;
        }
        .theme-toggle-btn:hover { background-color: var(--text-color); color: var(--bg-color); }
        .infobar-theme-label { display: flex; align-items: center; gap: 2px; }
        .theme-name-click { cursor: pointer; padding: 0 2px; border-radius: 2px; transition: background-color 0.2s; }
        .theme-name-click:hover { background-color: var(--text-color); color: var(--bg-color); }

        .infobar-language-label { display: flex; align-items: center; gap: 2px; margin-left: 8px; }
        .language-name-click { cursor: pointer; padding: 0 2px; border-radius: 2px; transition: background-color 0.2s; }
        .language-name-click:hover { background-color: var(--text-color); color: var(--bg-color); }
    </style>
</head>
<body>
    <div id="os-tooltip"></div>
    <div id="os-modal-overlay"><div id="os-modal"><div id="os-modal-text"></div><div class="os-modal-buttons"><button id="os-modal-cancel" class="os-btn" data-en="cancel">Cancel</button><button id="os-modal-confirm" class="os-btn" data-en="confirm">Confirm</button></div></div></div>
    
    <div id="settings-window-overlay"><div id="settings-window" tabindex="-1"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--text-color);padding-bottom:6px;"><span style="font-weight:bold;font-size:1.1em;" data-en="terminalSettings">sTerminal Settings</span><span id="settings-close-btn" class="os-btn" style="padding:2px 8px;cursor:pointer;">&times;</span></div><div style="display:flex;flex-direction:column;gap:8px;"><label><span data-en="fontSize">Font Size (px):</span><input type="number" id="sett-fontsize" min="10" max="36"></label><label><span data-en="fontFamily">Font Family:</span><select id="sett-font"></select></label><label><span data-en="language">Language:</span><select id="sett-language"><option value="en">English</option></select></label><label><span data-en="colorScheme">Color Scheme:</span><select id="sett-colorscheme"></select></label><label><span>Border Gradient Start:</span><input type="color" id="sett-border-start"></label><label><span>Border Gradient End:</span><input type="color" id="sett-border-end"></label><label><span data-en="systemProfile">System Profile:</span><select id="sett-system"></select></label><label><span data-en="infobarPosition">Infobar Position:</span><select id="sett-infobarpos"><option value="top">Top</option><option value="bottom">Bottom</option></select></label><label><span data-en="infobarSize">Infobar Size (px):</span><input type="number" id="sett-infobarsize" min="16" max="60"></label><label><span data-en="infobarVisibility">Infobar Visibility:</span><select id="sett-infobarshow"><option value="show">Show</option><option value="hide">Hide</option></select></label></div><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;"><button id="settings-save-btn" class="os-btn" data-en="saveApply">Save & Apply</button></div></div></div>
    
    <div id="wrapper-overlay"><div id="wrapper-window"><iframe id="wrapper-frame" title="Wrapper app"></iframe></div></div>

    <div id="infobar">
        <div class="infobar-modules-left">
            <div id="infobar-reset" class="infobar-btn theme-toggle-btn" title="Reset settings to defaults">↻</div>
            <div id="theme-toggle-btn" class="infobar-btn theme-toggle-btn" title="Toggle Dark/Light Mode">☀</div>
            <div id="infobar-theme" class="infobar-btn infobar-theme-label">
                <span data-en="themeLabel">Theme:</span>&nbsp;<span id="infobar-theme-name" class="theme-name-click"></span>
            </div>
            <div id="infobar-language" class="infobar-btn infobar-language-label">
                <span data-en="languageLabel">Language:</span>&nbsp;<span id="infobar-language-name" class="language-name-click"></span>
            </div>
            <div id="infobar-font" class="infobar-btn infobar-language-label">
                <span data-en="fontLabel">Font:</span>&nbsp;<span id="infobar-font-name" class="language-name-click"></span>
            </div>
        </div>
        <div class="infobar-modules-right"><span id="infobar-clock"></span></div>
    </div>
    
    <div id="tabs-bar"><div id="tabs-container"></div><div id="tab-add-btn" class="tab-add-btn" title="New stty tab">+</div></div>
    <div id="workspace-container"></div>
    
    <div id="theme-dropdown"></div>
    <div id="language-dropdown"></div>
    <div id="font-dropdown"></div>

    <div id="options-menu">
        <div class="mc-menu-item"><span data-en="terminal">Terminal</span><span class="arrow">▶</span>
            <div class="mc-submenu">
                <div class="mc-submenu-item"><span data-en="fontSize">Font Size</span><input type="number" id="menu-fontsize" min="10" max="36" onclick="event.stopPropagation()"></div>
                <div class="mc-submenu-item"><span data-en="font">Font</span><span class="arrow">▶</span><div class="mc-submenu" id="menu-font-submenu"></div></div>
                <div class="mc-menu-item" id="menu-colorscheme-parent" style="display:none;"><span data-en="colorScheme">Color Scheme</span><span class="arrow">▶</span><div class="mc-submenu" id="menu-colorscheme-submenu"></div></div>
                <div class="mc-menu-item" id="menu-system-parent" style="display:none;"><span data-en="systems">Systems</span><span class="arrow">▶</span><div class="mc-submenu" id="menu-system-submenu"></div></div>
            </div>
        </div>
        <div class="mc-menu-item"><span data-en="language">Language</span><span class="arrow">▶</span><div class="mc-submenu" id="menu-language-submenu"></div></div>
        <div class="mc-menu-item"><span data-en="infobar">Infobar</span><span class="arrow">▶</span>
            <div class="mc-submenu">
                <div class="mc-menu-item"><span data-en="position">Position</span><span class="arrow">▶</span><div class="mc-submenu"><div class="mc-submenu-item" data-action="infobarposition" data-value="top" data-en="top">Top</div><div class="mc-submenu-item" data-action="infobarposition" data-value="bottom" data-en="bottom">Bottom</div></div></div>
                <div class="mc-menu-item"><span data-en="size">Size</span><input type="number" id="menu-infobarsize" min="16" max="60" onclick="event.stopPropagation()"></div>
                <div class="mc-menu-item"><span data-en="infobar">Infobar</span><span class="arrow">▶</span><div class="mc-submenu"><div class="mc-submenu-item" data-action="infobarshow" data-value="show" data-en="show">Show</div><div class="mc-submenu-item" data-action="infobarshow" data-value="hide" data-en="hide">Hide</div></div></div>
            </div>
        </div>
    </div>

    <script src="languages/langTerminal.js"></script>
    <script>
        window.Translations = {};

        function t(path, ...args) {
            const lang = (termSettings?.language ?? window.termSettings?.language ?? 'en');
            const dict = window.Translations[lang] || window.Translations['en'] || {};

            const parts = path.split('.');
            let curr = dict;
            for (let p of parts) {
                if (curr && curr[p] !== undefined) {
                    curr = curr[p];
                } else {
                    curr = null;
                    break;
                }
            }

            if (curr === null && lang !== 'en') {
                let currEn = window.Translations['en'];
                if (currEn) {
                    for (let p of parts) {
                        if (currEn && currEn[p] !== undefined) currEn = currEn[p];
                        else { currEn = null; break; }
                    }
                    if (currEn !== null) curr = currEn;
                }
            }

            let text = curr !== null ? String(curr) : path;
            if (args.length > 0) {
                args.forEach((arg, i) => {
                    text = text.replace(new RegExp('\\{' + i + '\\}', 'g'), String(arg));
                });
            }
            return text;
        }

        function normalizeLanguageInput(raw) {
            const value = String(raw || '').trim().toLowerCase().replace(/['"]/g, '');
            const langMap = {
                'german': 'de', 'deutsch': 'de', 'de': 'de',
                'english': 'en', 'en': 'en',
                'french': 'fr', 'francais': 'fr', 'français': 'fr', 'fr': 'fr',
                'italian': 'it', 'italiano': 'it', 'it': 'it',
                'turkish': 'tr', 'turkce': 'tr', 'türkçe': 'tr', 'tr': 'tr'
            };
            return langMap[value] || value || null;
        }

        function getUserDeviceString() {
            const lang = (termSettings?.language ?? window.termSettings?.language ?? 'en');
            const dict = window.Translations[lang] || window.Translations['en'] || {};
            const userObj = dict.user || window.Translations['en']?.user || { user: "user", device: "device" };
            const u = userObj.user || "user";
            const d = userObj.device || "device";
            return `${u}@${d}`;
        }

        window.ColorAPI = {
            themes: {
                monochrome: { bg: '#000000', text: '#ffffff', user: '#ffffff', path: '#bbbbbb', hint: '#555555', modalBg: '#000000', modalBorder: '#ffffff', name: 'Monochrome' }
            },
            fonts: ["Arial, sans-serif", "'Orbitron', sans-serif", "monospace", "'Courier New', Courier, monospace"],
            registerTheme(name, themeObj) {
                this.themes[name] = themeObj;
                window.colorSchemes = this.themes;
                if (typeof updateColorSchemeMenuUI === 'function') updateColorSchemeMenuUI();
            },
            registerFont(fontValue) {
                if (!this.fonts.includes(fontValue)) this.fonts.push(fontValue);
                window.fontsList = this.fonts;

                    });

                    const sections = ['user', 'uiLabels', 'messages', 'errors', 'successMessages', 'dialogs', 'helpSections', 'fileDescriptions'];
                    sections.forEach(section => {
                        const sectionData = termJson[section];
                        if (sectionData && typeof sectionData === 'object') {
                            const hasLangKeys = Object.keys(sectionData).some(key => langCodes.includes(key));

            updateLanguageMenuUI();

            let registry = {
                colors: [],
                systems: [],
                gui: [],
                core: [],
                official: [],
                custom: [],
                wrapper: [],
                autorun: []
            };

            try {
                const response = await fetch('registry.json');
                if (response.ok) {
                    const regData = await response.json();
                    registry = { ...registry, ...regData };
                }
            } catch (e) {
                console.warn('Could not fetch registry.json:', e);
            }

            window.systemRegistryConfig = registry;
            window.guiRegistry = registry.gui || [];

            const loadScript = async (src) => {
                try {
                    const script = document.createElement('script');
                    script.src = src;
                    await new Promise((resolve, reject) => {
                        script.onload = resolve;
                        script.onerror = reject;
                        document.head.appendChild(script);
                    });
                    return true;
                } catch (e) {
                    return false;
                }
            };

            const tryLoadPackage = async (pkg, candidates) => {
                for (const src of candidates) {
                    if (await loadScript(src)) return true;
                }
                return false;
            };

            await loadScript('colors/colorsTerminal.js');

            for (const name of (registry.colors || [])) {
                if (name.includes('colorsTerminal')) continue;
                await tryLoadPackage(name, [
                    `colors/dark/${name}.js`,
                    `colors/light/${name}.js`,
                    `colors/${name}.js`,
                    `${name}.js`
                ]);
            }
            updateColorSchemeMenuUI();
            updateFontMenuUI();

            for (const sys of (registry.systems || [])) {
                await tryLoadPackage(sys, [
                    `packages/systems/system${sys}.js`,
                    `systems/system${sys}.js`,
                    `packages/systems/${sys}.js`
                ]);
            }
            updateSystemMenuUI();

            for (const pkg of (registry.core || registry.corePackages || [])) {
                await tryLoadPackage(pkg, [
                    `packages/core/${pkg}.js`,
                    `packages/core/${pkg}.mjs`,
                    `packages/core/${pkg}.cjs`
                ]);
            }

            for (const pkg of (registry.official || registry.packages || [])) {
                await tryLoadPackage(pkg, [
                    `packages/official/${pkg}.js`,
                    `packages/official/${pkg}.mjs`,
                    `packages/official/${pkg}.cjs`
                ]);
            }

            for (const pkg of (registry.custom || [])) {
                const loaded = await tryLoadPackage(pkg, [
                    `packages/custom/${pkg}.js`,
                    `packages/custom/${pkg}.mjs`,
                    `packages/custom/${pkg}.cjs`,
                    `packages/${pkg}.js`
                ]);
                if (!loaded) console.warn(`Custom package not found: ${pkg}`);
            }

            for (const pkg of (registry.wrapper || [])) {
                let foundType = null;
                let foundSrc = null;
                const wrapperCandidates = [
                    { src: `packages/wrapped/${pkg}.html`, type: 'html' },
                    { src: `packages/wrapped/${pkg}.js`, type: 'js' },
                    { src: `packages/wrapped/${pkg}.mjs`, type: 'js' },
                    { src: `packages/wrapper/${pkg}.html`, type: 'html' },
                    { src: `packages/wrapper/${pkg}.js`, type: 'js' }
                ];

                for (const candidate of wrapperCandidates) {
                    if (candidate.type === 'js') {
                        if (await loadScript(candidate.src)) {
                            foundSrc = candidate.src;
                            foundType = 'js';
                            break;
                        }
                    } else {
                        try {
                            const res = await fetch(candidate.src, { method: 'HEAD' });
                            if (res.ok) {
                                foundSrc = candidate.src;
                                foundType = 'html';
                                break;
                            }
                        } catch(e) {}
                    }
                }

                if (!foundSrc) {
                    console.warn(`Wrapper package not found: ${pkg}`);
                    continue;
                }
                window.wrapperRegistry[pkg] = { type: foundType, src: foundSrc };
            }

            for (const [pkgKey, pkgObj] of Object.entries(window.packagesRegistry || {})) {
                if (pkgObj.translations) {
                    for (const [langCode, transObj] of Object.entries(pkgObj.translations)) {
                        window.Translations[langCode] = window.Translations[langCode] || {};
                        for (const [tKey, tVal] of Object.entries(transObj)) {
                            window.Translations[langCode][tKey] = tVal;
                        }
                    }
                }
            }

            refreshTerminalCommands();
            applySettings();
            refreshAllLanguageElements();

            await loadAutorunScripts(registry.autorun || []);
        }

        async function loadAutorunScripts(autorunList) {
            if (!autorunList || autorunList.length === 0) {
                console.log('No autorun scripts specified in registry');
                return;
            }

            console.log(`Loading and executing ${autorunList.length} autorun script(s)...`);

            for (const scriptName of autorunList) {
                const scriptSrc = `packages/autorun/${scriptName}.js`;
                try {
                    console.log(`Loading autorun script: ${scriptSrc}`);
                    const script = document.createElement('script');
                    script.src = scriptSrc;
                    
                    const success = await new Promise((resolve) => {
                        script.onload = () => {
                            console.log(`Autorun script loaded successfully: ${scriptName}`);
                            resolve(true);
                        };
                        script.onerror = () => {
                            console.warn(`Failed to load autorun script: ${scriptName} (${scriptSrc})`);
                            resolve(false);
                        };
                        document.head.appendChild(script);
                    });

                    if (success && typeof activeTab !== 'undefined' && activeTab?.activeTerminal) {
                        const term = activeTab.activeTerminal;
                        const isExecutable = window.wrapperRegistry[scriptName] || window.packagesRegistry[scriptName] || term.commands[scriptName];
                        
                        if (isExecutable) {
                            if (window.packagesRegistry[scriptName]) {
                                term.installedPackages.add(scriptName);
                                refreshTerminalCommands();
                            }
                            
                            const promptHTML = term.getPromptHTML();
                            term.printHTML(`<div class="history-line"><span class="prompt">${promptHTML}</span> <span style="color:var(--hint-color); font-style:italic;">[autorun]</span> <span class="os-item" data-command="${scriptName}">${scriptName}</span></div>`);
                            
                            await term.executeCommand(scriptName);
                            term.scrollToBottom();
                        }
                    }
                } catch (e) {
                    console.warn(`Error loading/executing autorun script ${scriptName}:`, e);
                }
            }

            console.log('All autorun scripts processed');
        }

        function refreshTerminalCommands() {
            if (typeof tabs !== 'undefined') {
                tabs.forEach(tab => {
                    tab.terminals.forEach(term => {
                        term.invalidateCommandCache();
                        for (const [pkgName, pkgObj] of Object.entries(window.packagesRegistry)) {
                            const isPreInstalled = pkgObj.preInstalledOn?.includes(termSettings.system);
                            const isInstalled = term.installedPackages.has(pkgName);
                            if (isPreInstalled || isInstalled) {
                                if (pkgObj.commands) {
                                    for (const [cmdName, cmdFunc] of Object.entries(pkgObj.commands)) {
                                        if (!term.commands[cmdName]) {
                                            term.commands[cmdName] = cmdFunc.bind(term);
                                        }
                                    }
                                }
                            }
                        }
                    });
                });
            }
        }

        function isDebianFamilySystem() {
            if (termSettings.system === 'default') return true;
            const sysObj = window.systemsRegistry[termSettings.system];
            if (!sysObj) return false;
            if (sysObj.isDebianFamily !== undefined) return sysObj.isDebianFamily;
            const sysName = (sysObj.name || termSettings.system).toLowerCase();
            return sysName.includes('debian') || sysName.includes('ubuntu') || sysName.includes('debug');

        function isDarkTheme(themeName) {
            const t = window.ColorAPI.getTheme(themeName);
            if (!t) return true;
            const bg = t.bg || '#000000';
            const r = parseInt(bg.slice(1,3), 16);
            const g = parseInt(bg.slice(3,5), 16);
            const b = parseInt(bg.slice(5,7), 16);
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return lum < 0.5;
        }

        function getThemesByMode(mode) {
            const all = Object.keys(window.ColorAPI.themes);
            return all.filter(key => {
                const isDark = isDarkTheme(key);
                return mode === 'dark' ? isDark : !isDark;
            });
        }

        function toggleDarkLight() {
            const currentIsDark = isDarkTheme(termSettings.colorscheme);
            const targetMode = currentIsDark ? 'light' : 'dark';
            const themes = getThemesByMode(targetMode);
            if (themes.length === 0) return;
            termSettings.colorscheme = themes[0];
            applySettings();
        }

        function cycleThemeInCurrentMode() {
            const currentIsDark = isDarkTheme(termSettings.colorscheme);
            const mode = currentIsDark ? 'dark' : 'light';
            const themes = getThemesByMode(mode);
            if (themes.length === 0) return;
            let idx = themes.indexOf(termSettings.colorscheme);
            if (idx === -1) idx = 0;
            else idx = (idx + 1) % themes.length;
            termSettings.colorscheme = themes[idx];
            applySettings();
        }

            else if (commandInfo[possibleCmd]) { text = t(commandInfo[possibleCmd]); }

        function getLongestCommonPrefix(strs) {
            if (!strs.length) return '';
            let prefix = strs[0];
            for (let i = 1; i < strs.length; i++) {
                while (strs[i].indexOf(prefix) !== 0) {
                    prefix = prefix.substring(0, prefix.length - 1);
                    if (!prefix) return '';
                }
            }
            return prefix;

        class TabSession {
            constructor(tabNumber, wrapperName = null, wrapperSrc = null) {
                this.tabNumber = tabNumber;
                this.isWrapper = !!wrapperName;
                this.wrapperName = wrapperName;
                this.name = wrapperName ? wrapperName : 'stty' + tabNumber;
                this.terminals = [];
                this.activeTerminal = null;
                this.tabEl = document.createElement('div');
                this.tabEl.className = 'tab-item';
                const titleSpan = document.createElement('span');
                titleSpan.innerText = this.name;
                titleSpan.addEventListener('click', () => switchTab(this));
                const closeBtn = document.createElement('span');
                closeBtn.className = 'tab-close-btn';
                closeBtn.innerHTML = '&times;';
                closeBtn.title = 'Close tab';
                closeBtn.addEventListener('click', (e) => { e.stopPropagation(); confirmCloseTab(this); });
                this.tabEl.appendChild(titleSpan);
                this.tabEl.appendChild(closeBtn);
                this.contentEl = document.createElement('div');
                this.contentEl.className = 'tab-content';
                
                if (this.isWrapper) {
                    this.iframeEl = document.createElement('iframe');
                    this.iframeEl.src = wrapperSrc;
                    this.iframeEl.style.width = '100%';
                    this.iframeEl.style.height = '100%';
                    this.iframeEl.style.border = 'none';
                    this.iframeEl.style.background = 'var(--bg-color)';
                    this.contentEl.appendChild(this.iframeEl);
                    workspaceContainer.appendChild(this.contentEl);
                } else {
                    this.gridEl = document.createElement('div');
                    this.gridEl.id = 'grid-container';
                    this.contentEl.appendChild(this.gridEl);
                    workspaceContainer.appendChild(this.contentEl);
                    this.createTerminal();
                }
            }
            renderTabElement() {
                let inserted = false;
                for (let child of tabsContainer.children) {
                    let childNum = parseInt(child.dataset.tabNum);
                    if (childNum > this.tabNumber) { tabsContainer.insertBefore(this.tabEl, child); inserted = true; break; }
                }
                if (!inserted) tabsContainer.appendChild(this.tabEl);
                this.tabEl.dataset.tabNum = this.tabNumber;
            }
            updateGridLayout() { this.gridEl.className = 'count-' + this.terminals.length; }
            createTerminal() {
                if (this.terminals.length >= 4 || this.isWrapper) return;
                const term = new Terminal();
                this.terminals.push(term);
                this.gridEl.appendChild(term.el);
                this.updateGridLayout();
                this.makeActive(term);
                applySettings();
                refreshAllLanguageElements();
            }
            closeTerminal(term) {
                if (this.terminals.length <= 1) { confirmCloseTab(this); return; }
                const index = this.terminals.indexOf(term);
                term.el.remove();
                this.terminals.splice(index, 1);
                this.updateGridLayout();
                this.makeActive(this.terminals[index - 1] || this.terminals[0]);
            }
            makeActive(term) {
                this.terminals.forEach(t => t.el.classList.remove('active-term'));
                term.el.classList.add('active-term');
                this.activeTerminal = term;
                term.cmdInput.focus();
            }
            navigateTerminal(direction) {
                if (this.terminals.length <= 1) return;
                const index = this.terminals.indexOf(this.activeTerminal);
                let nextIndex = index;
                if (direction === 'ArrowRight') nextIndex = (index + 1) % this.terminals.length;
                else if (direction === 'ArrowLeft') nextIndex = (index - 1 + this.terminals.length) % this.terminals.length;
                else if (direction === 'ArrowDown') nextIndex = (index + 2 < this.terminals.length) ? index + 2 : index;
                else if (direction === 'ArrowUp') nextIndex = (index - 2 >= 0) ? index - 2 : index;
                if (this.terminals[nextIndex]) this.makeActive(this.terminals[nextIndex]);
            }
        }

        function createTab() {
            let usedNumbers = tabs.map(t => t.tabNumber);
            let newNum = 1;
            while (usedNumbers.includes(newNum)) newNum++;
            const tab = new TabSession(newNum);
            tabs.push(tab);
            tab.renderTabElement();
            tabsContainer.appendChild(tabAddBtn);
            switchTab(tab);
        }

        function createWrapperTab(wrapperName, src) {
            let usedNumbers = tabs.map(t => t.tabNumber);
            let newNum = 1;
            while (usedNumbers.includes(newNum)) newNum++;
            const tab = new TabSession(newNum, wrapperName, src);
            tabs.push(tab);
            tab.renderTabElement();
            tabsContainer.appendChild(tabAddBtn);
            switchTab(tab);
        }

        function confirmCloseTab(tab) {
            modalText.innerText = t("dialogs.closeTabConfirmation", tab.name);
            modalOverlay.style.display = 'flex';
            const handleConfirm = () => { cleanupModal(); executeCloseTab(tab); };
            const handleCancel = () => { cleanupModal(); };
            const cleanupModal = () => { modalOverlay.style.display = 'none'; modalConfirm.removeEventListener('click', handleConfirm); modalCancel.removeEventListener('click', handleCancel); };
            modalConfirm.addEventListener('click', handleConfirm);
            modalCancel.addEventListener('click', handleCancel);
        }

        function executeCloseTab(tab) {
            if (tabs.length <= 1 && !tab.isWrapper) { tab.terminals.forEach(t => t.outputDiv.innerHTML = ''); return; }
            const index = tabs.indexOf(tab);
            tab.tabEl.remove();
            tab.contentEl.remove();
            tabs.splice(index, 1);
            if (tabs.length === 0) {
                createTab();
            } else {
                switchTab(tabs[index - 1] || tabs[0]);
            }
        }

        function switchTab(tab) {
            tabs.forEach(t => { t.tabEl.classList.remove('active-tab'); t.contentEl.classList.remove('active-content'); });
            tab.tabEl.classList.add('active-tab');
            tab.contentEl.classList.add('active-content');
            activeTab = tab;
            if (tab.activeTerminal) tab.activeTerminal.cmdInput.focus();
        }

        tabAddBtn.addEventListener('click', createTab);

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        function triggerSystemLoad(sysKey) {
            if (sysKey === 'default') {
                termSettings.system = 'default';
                vfs = JSON.parse(JSON.stringify(defaultVFS));
                applySettings();
                tabs.forEach(tab => { tab.terminals.forEach(term => { term.currentPath = ['home', 'user']; term.formatPromptPath(); term.printTranslatable("messages.systemReset"); }); });
                return;
            }
            const sysObj = window.systemsRegistry[sysKey];
            if (!sysObj) {
                const activeTerm = activeTab?.activeTerminal || null;
                if (activeTerm) activeTerm.printTranslatable("errors.unknownSystem", 'error', false, [sysKey, Object.keys(window.systemsRegistry).join(', ')]);
                return;
            }
            const activeTerm = activeTab?.activeTerminal || null;
            if (!activeTerm) return;
            const qText = t("dialogs.loadSystemConfirmation", sysObj.name || sysKey);
            activeTerm.promptSpan.style.display = 'none';
            activeTerm.cmdInput.style.display = 'none';
            activeTerm.cmdSuggestion.style.display = 'none';
            const confirmLine = document.createElement('div');
            confirmLine.className = 'history-line';
            confirmLine.innerHTML = `<span id="confirm-q" style="font-weight: bold;">${qText}</span><span id="confirm-char" style="font-weight: bold;"></span>`;
            activeTerm.outputDiv.appendChild(confirmLine);
            activeTerm.scrollToBottom();
            const charSpan = confirmLine.querySelector('#confirm-char');
            const handleKeydown = (e) => {
                const key = e.key.toLowerCase();
                const isLoadKey = ['j', 'y', 'enter', 'o', 'e', 'evet'].includes(key);
                const isCancelKey = ['n', 'escape', 'h', 'hayir'].includes(key);
                if (isLoadKey || isCancelKey) {
                    window.removeEventListener('keydown', handleKeydown, true);
                    e.preventDefault();
                    e.stopPropagation();
                    let ans = isLoadKey ? 'y' : 'n';
                    charSpan.innerText = ans.toUpperCase();
                    activeTerm.print('');
                    activeTerm.promptSpan.style.display = '';
                    activeTerm.cmdInput.style.display = '';
                    activeTerm.cmdSuggestion.style.display = '';
                    activeTerm.cmdInput.focus();
                    if (ans === 'y') {
                        termSettings.system = sysKey;
                        if (sysObj.vfs) vfs = JSON.parse(JSON.stringify(sysObj.vfs));
                        applySettings();
                        tabs.forEach(tab => { tab.terminals.forEach(term => { term.currentPath = ['home', 'user']; term.formatPromptPath(); term.printTranslatable("successMessages.systemLoaded", "", false, [sysKey]); }); });
                    } else activeTerm.printTranslatable("messages.systemLoadCancelled");
                    activeTerm.scrollToBottom();
                }
            };
            window.addEventListener('keydown', handleKeydown, { capture: true });
        }

        class Terminal {
            constructor() {
                this.currentPath = ['home', 'user'];

                this.currentInputBuffer = '';

                this.isInstalling = false;
                this._runningProcesses = new Map();
                this._processCounter = 0;
                this._commandCache = null;
                this._cacheTimestamp = 0;
                this._cacheTTL = 3000;

                this.el = document.createElement('div');
                this.el.className = 'terminal-instance';
                this.outputDiv = document.createElement('div');
                this.outputDiv.className = 'output';
                this.inputLine = document.createElement('div');
                this.inputLine.className = 'input-line';
                const defaultUserAtDevice = getUserDeviceString();
                this.inputLine.innerHTML = `<span class="prompt"><span class="user">${defaultUserAtDevice}</span>:<span class="path">~</span><span class="symbol">$</span></span><div class="input-wrapper"><div class="cmd-suggestion"></div><input type="text" class="cmd-input" autocomplete="off" spellcheck="false"></div>`;
                this.el.appendChild(this.outputDiv);
                this.el.appendChild(this.inputLine);
                this.cmdInput = this.el.querySelector('.cmd-input');
                this.cmdSuggestion = this.el.querySelector('.cmd-suggestion');
                this.promptPathSpan = this.el.querySelector('.path');
                this.promptSpan = this.el.querySelector('.prompt');
                this.promptUserSpan = this.el.querySelector('.user');
                this.setupCommands();
                this.setupListeners();
                this.formatPromptPath();
                this.updatePromptUser();
                this.displayBanner();
            }

            getAvailableCommands() {
                const now = Date.now();
                if (this._commandCache && (now - this._cacheTimestamp) < this._cacheTTL) return this._commandCache;
                const allCommands = new Set();
                if (this.commands) Object.keys(this.commands).forEach(cmd => allCommands.add(cmd));
                if (this.installedPackages) {
                    for (const pkgName of this.installedPackages) {
                        const pkgObj = window.packagesRegistry[pkgName];
                        if (pkgObj?.commands) Object.keys(pkgObj.commands).forEach(cmd => allCommands.add(cmd));
                    }
                }
                for (const [pkgName, pkgObj] of Object.entries(window.packagesRegistry || {})) {
                    if (pkgObj.preInstalledOn?.includes(termSettings.system) && pkgObj.commands) {
                        Object.keys(pkgObj.commands).forEach(cmd => allCommands.add(cmd));
                    }
                }
                const result = Array.from(allCommands).sort();
                this._commandCache = result;
                this._cacheTimestamp = now;
                return result;
            }

            getCommandsStartingWith(prefix) {
                if (!prefix) return this.getAvailableCommands();
                return this.getAvailableCommands().filter(cmd => cmd.startsWith(prefix));
            }

            getAvailablePackages(prefix) {
                const pkgs = Object.keys(window.packagesRegistry || {});
                if (!prefix) return pkgs;
                return pkgs.filter(p => p.startsWith(prefix));
            }

            getPackageForCommand(cmd) {
                if (this.installedPackages) {
                    for (const pkgName of this.installedPackages) {
                        const pkgObj = window.packagesRegistry[pkgName];
                        if (pkgObj?.commands?.[cmd]) return pkgName;
                    }
                }
                for (const [pkgName, pkgObj] of Object.entries(window.packagesRegistry || {})) {
                    if (pkgObj.commands?.[cmd]) return pkgName;
                }
                return null;
            }

            invalidateCommandCache() { this._commandCache = null; this._cacheTimestamp = 0; }

            registerProcess(name, cleanupFn) {
                const pid = ++this._processCounter;
                this._runningProcesses.set(pid, { name, cleanup: cleanupFn });
                return pid;
            }

            killProcess(pid) {
                const process = this._runningProcesses.get(pid);
                if (process) { process.cleanup(); this._runningProcesses.delete(pid); return true; }
                return false;
            }

            killAllProcesses() {
                for (const [pid, process] of this._runningProcesses) process.cleanup();
                this._runningProcesses.clear();
            }

            updatePromptUser() {
                if (this.promptUserSpan) this.promptUserSpan.innerText = getUserDeviceString();
            }

            getAbsolutePathArray(pathStr) {
                if (!pathStr) return [...this.currentPath];
                if (pathStr === '~' || pathStr.startsWith('~/')) pathStr = pathStr.replace(/^~/, '/home/user');
                let base = pathStr.startsWith('/') ? [] : [...this.currentPath];
                let parts = pathStr.split('/');
                for (let p of parts) {
                    if (p === '' || p === '.') continue;
                    if (p === '..') { if (base.length > 0) base.pop(); } else base.push(p);
                }
                return base;
            }

            getNodeByPathArray(pathArray) {
                let node = vfs;
                for (let p of pathArray) {
                    if (node.type !== 'dir' || !node.children[p]) return null;
                    node = node.children[p];
                }
                return node;
            }

            getParentNodeAndTargetName(pathStr) {
                let arr = this.getAbsolutePathArray(pathStr);
                if (arr.length === 0) return { parent: null, name: null };
                let name = arr.pop();
                return { parent: this.getNodeByPathArray(arr), name: name };
            }

            getPromptHTML() {
                let pathStr = '/' + this.currentPath.join('/');
                if (pathStr.startsWith('/home/user')) pathStr = '~' + pathStr.substring(10);
                if (pathStr === '') pathStr = '/';
                const uStr = getUserDeviceString();
                return `<span class="user">${uStr}</span>:<span class="path">${pathStr}</span><span class="symbol">$</span>`;
            }

            formatPromptPath() {
                let pathStr = '/' + this.currentPath.join('/');
                if (pathStr.startsWith('/home/user')) pathStr = '~' + pathStr.substring(10);
                if (pathStr === '') pathStr = '/';
                this.promptPathSpan.innerText = pathStr;
            }

            print(text, cssClass = '') {
                const span = document.createElement('span');
                if (cssClass) span.className = cssClass;
                span.innerText = text + '\n';
                this.outputDiv.appendChild(span);
            }

            printHTML(html) {
                const div = document.createElement('div');
                div.innerHTML = html;
                this.outputDiv.appendChild(div);
                div.querySelectorAll('span').forEach(span => {
                    const txt = span.textContent.trim().split(/\s+/)[0].replace(/\/$/, '');
                    if (commandInfo[txt] && !span.classList.contains('os-item')) { span.classList.add('os-item'); span.dataset.command = txt; }
                });
            }

            printTranslatable(enText, cssClass = '', isHTML = false, args = []) {
                const el = document.createElement(isHTML ? 'div' : 'span');
                if (cssClass) el.className = cssClass;

                const templateMatch = typeof enText === 'string' ? enText.match(/data-en="([^"]+)"[^>]*>([^<]*)<\/[^>]+>/) : null;
                if (templateMatch) {
                    const key = templateMatch[1];
                    const translated = t(key, ...args);
                    el.innerHTML = enText.replace(templateMatch[2], translated);
                    this.outputDiv.appendChild(el);
                    el.querySelectorAll('span').forEach(span => {
                        const txt = span.textContent.trim().split(/\s+/)[0].replace(/\/$/, '');
                        if (commandInfo[txt] && !span.classList.contains('os-item')) { span.classList.add('os-item'); span.dataset.command = txt; }
                    });
                    return;
                }

                const text = typeof enText === 'string' ? t(enText, ...args) : enText;
                if (isHTML) el.innerHTML = text;
                else el.innerText = text + '\n';

                this.outputDiv.appendChild(el);
                if (isHTML) {
                    el.querySelectorAll('span').forEach(span => {
                        const txt = span.textContent.trim().split(/\s+/)[0].replace(/\/$/, '');
                        if (commandInfo[txt] && !span.classList.contains('os-item')) { span.classList.add('os-item'); span.dataset.command = txt; }
                    });
                }
            }

            scrollToBottom() { this.el.scrollTop = this.el.scrollHeight; }

            displayBanner() {
                this.printTranslatable("messages.helpPrompt", 'banner');
            }

            promptUserInput(promptText) {
                return new Promise(resolve => {
                    this.promptSpan.style.display = 'none';
                    this.cmdSuggestion.style.display = 'none';
                    const tempPrompt = document.createElement('span');
                    tempPrompt.className = 'prompt';
                    tempPrompt.innerText = promptText;
                    this.inputLine.insertBefore(tempPrompt, this.el.querySelector('.input-wrapper'));
                    
                    const handleKeydown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            e.stopPropagation();
                            cleanup(this.cmdInput.value.trim());
                        } else if (e.key === 'Escape' || (e.ctrlKey && e.key.toLowerCase() === 'c')) {
                            e.preventDefault();
                            e.stopPropagation();
                            cleanup(null);
                        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Tab') {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    };
                    
                    const cleanup = (val) => {
                        this.cmdInput.removeEventListener('keydown', handleKeydown, true);
                        this.cmdInput.value = '';
                        tempPrompt.remove();
                        this.promptSpan.style.display = '';
                        this.cmdSuggestion.style.display = '';
                        if (val !== null) {
                            this.printHTML(`<div class="history-line"><span class="prompt">${promptText}</span> ${val}</div>`);
                        } else {
                            this.printHTML(`<div class="history-line"><span class="prompt">${promptText}</span> ^C</div>`);
                        }
                        this.scrollToBottom();
                        resolve(val);
                    };

                    this.cmdInput.addEventListener('keydown', handleKeydown, true);
                    this.cmdInput.focus();
                });
            }

            async installPackage(pkgKey) {
                const pkgObj = window.packagesRegistry[pkgKey];
                if (!pkgObj) { this.printTranslatable("errors.packageNotFound", 'error', false, [pkgKey]); return; }
                if (this.installedPackages.has(pkgKey)) { this.printTranslatable("errors.packageAlreadyInstalled", '', false, [pkgKey]); return; }
                if (this.isInstalling) { this.printTranslatable("messages.installationInProgress", "error"); return; }
                this.isInstalling = true;
                this.printTranslatable("messages.readingPackageLists");
                this.printTranslatable("messages.buildingDependencyTree");
                this.printTranslatable("messages.unpacking", "", false, [pkgKey]);
                await new Promise(r => setTimeout(r, 600));
                this.printTranslatable("messages.settingUp", "", false, [pkgKey]);
                this.installedPackages.add(pkgKey);
                this.isInstalling = false;
                this.invalidateCommandCache();
                if (pkgObj.commands) {
                    for (const [cmdName, cmdFunc] of Object.entries(pkgObj.commands)) {
                        if (!this.commands[cmdName]) this.commands[cmdName] = cmdFunc.bind(this);
                        if (pkgObj.commandInfo?.[cmdName]) commandInfo[cmdName] = pkgObj.commandInfo[cmdName];
                    }
                }
                if (pkgObj.files) {
                    for (const [filePath, fileData] of Object.entries(pkgObj.files)) {
                        const { parent, name } = this.getParentNodeAndTargetName(filePath);
                        if (parent?.type === 'dir') { parent.children[name] = fileData; }
                    }
                    saveVFS();
                }
                this.printTranslatable("successMessages.packageInstalled", "", false, [pkgKey]);
                this.scrollToBottom();
            }

                    },
