                        if (!choice) return;

                        const idx = parseInt(choice) - 1;
                        if (isNaN(idx) || idx < 0 || idx >= guis.length) {
                            this.print("Invalid selection.", "error");
                            return;
                        }

                        const selectedGui = guis[idx];
                        const confirm = await this.promptUserInput("Starting graphical session will open a new tab, r u sure [Y/n]: ");
                        if (!confirm) return;

                        if (confirm.toLowerCase() === 'y' || confirm.toLowerCase() === 'yes' || confirm === '') {
                            this.print(`Starting ${selectedGui}...`);
                            setTimeout(() => {
                                // Launch GUI inside a new tab instead of completely navigating away
                                const targetUrl = selectedGui.toLowerCase() === 'kde' ? 'gui.htmls' : `packages/gui/${selectedGui.toLowerCase()}.html`;
                                createWrapperTab(`stty${tabs.length + 1} (${selectedGui})`, targetUrl);
                            }, 400);
                        } else {
                            this.print("Cancelled.");
                        }
                    },
                    clear: () => { this.killAllProcesses(); this.outputDiv.innerHTML = ''; }
                };
            }

            handleTabCompletion() {
                const input = this.cmdInput.value;
                const parts = input.split(' ');
                const currentWord = parts[parts.length - 1];
                const isCommandPosition = parts.length === 1;
                let matches = [];
                let prefixPath = '';
                let isFileSystemMatch = false;
                let dirNode = null;
                let partialName = '';

                if (isCommandPosition) {
                    if (!currentWord) return;
                    matches = this.getCommandsStartingWith(currentWord);
                } else if (parts[0] === 'help' && parts[1] === 'set') {
                    if (parts.length === 3) matches = ['font', 'colorscheme'].filter(s => s.startsWith(currentWord));
                } else if (parts[0] === 'set') {
                    if (parts.length === 2) matches = ['fontsize', 'font', 'language', 'colorscheme', 'system', 'infobar'].filter(s => s.startsWith(currentWord));
                    else if (parts.length === 3) {
                        if (parts[1] === 'language') matches = ['german', 'english', 'french', 'italian', 'turkish', 'de', 'en', 'fr', 'it', 'tr'].filter(l => l.startsWith(currentWord));
                        else if (parts[1] === 'colorscheme') matches = Object.keys(window.ColorAPI.themes).filter(c => c.startsWith(currentWord));
                        else if (parts[1] === 'system') matches = ['default', ...Object.keys(window.systemsRegistry)].filter(s => s.startsWith(currentWord));
                        else if (parts[1] === 'infobar') matches = ['size', 'position', 'show', 'hide'].filter(b => b.startsWith(currentWord));
                    }
                } else if (parts[0] === 'apt') {
                    if (parts.length === 2) matches = ['install', 'remove', 'list', 'search'].filter(a => a.startsWith(currentWord));
                    else if (parts.length === 3 && parts[1] === 'install') matches = this.getAvailablePackages(currentWord);
                } else {
                    isFileSystemMatch = true;
                    let lastSlashIndex = currentWord.lastIndexOf('/');
                    let dirPathStr = '';
                    partialName = currentWord;
                    if (lastSlashIndex !== -1) {
                        dirPathStr = currentWord.substring(0, lastSlashIndex);
                        if (dirPathStr === '') dirPathStr = '/';
                        partialName = currentWord.substring(lastSlashIndex + 1);
                        prefixPath = currentWord.substring(0, lastSlashIndex + 1);
                    }
                    let dirArr = this.getAbsolutePathArray(dirPathStr);
                    dirNode = this.getNodeByPathArray(dirArr);
                    if (dirNode?.type === 'dir') matches = Object.keys(dirNode.children).sort().filter(name => name.startsWith(partialName));
                }

                if (matches.length === 1) {
                    const matchName = matches[0];
                    if (isFileSystemMatch && dirNode) {
                        const isDir = dirNode.children[matchName].type === 'dir';
                        parts[parts.length - 1] = prefixPath + matchName + (isDir ? '/' : ' ');
                    } else parts[parts.length - 1] = matchName + ' ';
                    this.cmdInput.value = parts.join(' ');
                } else if (matches.length > 1) {
                    const lcp = getLongestCommonPrefix(matches);
                    const targetLength = isFileSystemMatch ? partialName.length : currentWord.length;
                    if (lcp.length > targetLength) {
                        parts[parts.length - 1] = isFileSystemMatch ? prefixPath + lcp : lcp;
                        this.cmdInput.value = parts.join(' ');
                    } else {
                        const promptHTML = this.getPromptHTML();
                        this.printHTML(`<div class="history-line"><span class="prompt">${promptHTML}</span> ${input}</div>`);
                        let suggestionsStr = matches.map(m => {
                            if (isFileSystemMatch && dirNode) {
                                let child = dirNode.children[m];
                                let isDir = child.type === 'dir';
                                let desc = child.description || '';
                                return isDir ? `<span class="dir-color os-item" data-type="dir" data-name="${m}" data-desc="${desc}">${m}/</span>` : `<span class="os-item" data-type="file" data-name="${m}" data-desc="${desc}">${m}</span>`;
                            } else {
                                const pkgName = this.getPackageForCommand(m);
                                return `<span class="os-item" data-command="${m}">${m}${pkgName ? ` (${pkgName})` : ''}</span>`;
                            }
                        }).join('  ');
                        this.printHTML(suggestionsStr + '<br>');
                        this.scrollToBottom();
                    }
                }
            }

            updateSuggestion() {
                const input = this.cmdInput.value;
                this.currentSuggestionSuffix = '';
                if (!input) { this.cmdSuggestion.innerHTML = ''; return; }
                const parts = input.split(' ');
                const currentWord = parts[parts.length - 1];
                const isCommandPosition = parts.length === 1;
                let matches = [];

                if (isCommandPosition) {
                    matches = this.getCommandsStartingWith(currentWord);
                } else {
                    let lastSlashIndex = currentWord.lastIndexOf('/');
                    let dirPathStr = '';
                    let partialName = currentWord;
                    if (lastSlashIndex !== -1) {
                        dirPathStr = currentWord.substring(0, lastSlashIndex);
                        if (dirPathStr === '') dirPathStr = '/';
                        partialName = currentWord.substring(lastSlashIndex + 1);
                    }
                    let dirArr = this.getAbsolutePathArray(dirPathStr);
                    let dirNode = this.getNodeByPathArray(dirArr);
                    if (dirNode?.type === 'dir') {
                        const childNames = Object.keys(dirNode.children).sort();
                        matches = childNames.filter(name => name.startsWith(partialName));
                        if (matches.length > 0) {
                            const matchName = matches[0];
                            const isDir = dirNode.children[matchName].type === 'dir';
                            this.currentSuggestionSuffix = matchName.substring(partialName.length) + (matches.length === 1 ? (isDir ? '/' : ' ') : '');
                        }
                    }
                }

                if (matches.length > 0 && !this.currentSuggestionSuffix) {
                    this.currentSuggestionSuffix = matches[0].substring(currentWord.length) + (matches.length === 1 ? ' ' : '');
                }

                const hiddenInputSpan = document.createElement('span');
                hiddenInputSpan.style.visibility = 'hidden';
                hiddenInputSpan.innerText = input;
                this.cmdSuggestion.innerHTML = '';
                this.cmdSuggestion.appendChild(hiddenInputSpan);
                this.cmdSuggestion.appendChild(document.createTextNode(this.currentSuggestionSuffix));
            }

            setupListeners() {
                this.cmdInput.addEventListener('input', () => this.updateSuggestion());

                this.cmdInput.addEventListener('keydown', async (e) => {
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        e.stopPropagation();
                        if (this._runningProcesses.size > 0) {
                            this.killAllProcesses();
                            this.printTranslatable("helpSections.esc");
                            this.printTranslatable("messages.processInterrupted");
                        } else {
                            const promptHTML = this.getPromptHTML();
                            this.printHTML(`<div class="history-line"><span class="prompt">${promptHTML}</span> ${this.cmdInput.value}^[ESC]</div>`);
                            this.cmdInput.value = '';
                            this.updateSuggestion();
                        }
                        if (this.promptSpan) this.promptSpan.style.display = '';
                        if (this.cmdInput) {
                            this.cmdInput.style.display = '';
                            this.cmdInput.disabled = false;
                            setTimeout(() => {
                                this.cmdInput.focus();
                                this.scrollToBottom();
                            }, 10);
                        }
                        if (this.cmdSuggestion) this.cmdSuggestion.style.display = '';
                        this.scrollToBottom();
                        return;
                    }

                    if (e.key === 'Enter') {
                        const input = this.cmdInput.value.trim();
                        this.cmdInput.value = '';
                        if (input) this.commandHistory.push(input);
                        this.historyIndex = this.commandHistory.length;
                        this.currentInputBuffer = '';
                        const promptHTML = this.getPromptHTML();

                        const parts = input.split(/\s+/);
                        const firstCmd = parts[0]?.toLowerCase() || '';
                        let displayInput = input;

                        if (commandInfo[firstCmd]) {
                            const cmdKey = firstCmd;
                            const argsPart = input.substring(cmdKey.length);
                            displayInput = `<span class="os-item" data-command="${cmdKey}">${cmdKey}</span>${argsPart}`;
                        }

                        this.printHTML(`<div class="history-line"><span class="prompt">${promptHTML}</span> ${displayInput}</div>`);
                        if (input) await this.executeCommand(input);
                        this.cmdSuggestion.innerHTML = '';
                        this.currentSuggestionSuffix = '';
                        this.scrollToBottom();
                    } else if (e.key === 'Tab') { e.preventDefault(); this.handleTabCompletion(); this.updateSuggestion(); }
                    else if (e.key === 'ArrowRight') {
                        if (this.cmdInput.selectionStart === this.cmdInput.value.length && this.currentSuggestionSuffix) {
                            e.preventDefault();
                            this.cmdInput.value += this.currentSuggestionSuffix;
                            this.updateSuggestion();
                        }
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (this.commandHistory.length > 0) {
                            if (this.historyIndex === this.commandHistory.length) this.currentInputBuffer = this.cmdInput.value;
                            if (this.historyIndex > 0) { this.historyIndex--; this.cmdInput.value = this.commandHistory[this.historyIndex]; this.updateSuggestion(); }
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (this.historyIndex < this.commandHistory.length) {
                            this.historyIndex++;
                            this.cmdInput.value = this.historyIndex === this.commandHistory.length ? this.currentInputBuffer : this.commandHistory[this.historyIndex];
                            this.updateSuggestion();
                        }
                    }
                });

                this.el.style.cursor = 'text';
                this.el.addEventListener('click', () => {
                    if (activeTab) activeTab.makeActive(this);
                    if (window.getSelection().toString() === '') this.cmdInput.focus();
                });
            }

            parseCommandInput(input) {
                const regex = /[^\s"']+|"([^"]*)"|'([^']*)'/g;
                const args = [];
                let match;
                while ((match = regex.exec(input)) !== null) args.push(match[1] || match[2] || match[0]);
                return args;
            }

            async executeCommand(input) {
                const args = this.parseCommandInput(input);
                if (!args.length) return;
                const cmd = args.shift().toLowerCase();

                if (cmd === 'settings') {
                    try { this.commands.settings(args); } catch(err) { this.print(`Error: ${err.message}`, 'error'); }
                    return;
                }

                if (cmd === 'set' && args[0]?.toLowerCase() === 'language') {
                    const mappedCode = normalizeLanguageInput(args.slice(1).join(' '));
                    if (mappedCode && (window.Translations[mappedCode] || ['en', 'de', 'fr', 'it', 'tr'].includes(mappedCode))) {
                        termSettings.language = mappedCode;
                        applySettings();
                        refreshAllLanguageElements();
                    } else {
                        this.printTranslatable("errors.setInvalidLanguage", "error");
                    }
                    return;
                }

                if (cmd === 'apt') {
                    if (!isDebianFamilySystem()) { this.printTranslatable("errors.aptNotFound", 'error'); return; }
                    if (args.length < 2 || args[0].toLowerCase() !== 'install') { this.printTranslatable("errors.aptUsage", "error"); return; }
                    await this.installPackage(args[1].toLowerCase());
                    return;
                }

                if (window.wrapperRegistry[cmd]) {
                    const wrapInfo = window.wrapperRegistry[cmd];
                    createWrapperTab(cmd, wrapInfo.src);
                    this.print(`Opened wrapper tab: ${cmd}`);
                    return;
                }

                const pkgForCmd = this.getPackageForCommand(cmd);
                if (pkgForCmd) {
                    const pkgObj = window.packagesRegistry[pkgForCmd];
                    if (pkgObj && pkgObj.commands && pkgObj.commands[cmd]) {
                        try {
                            await pkgObj.commands[cmd].call(this, args);
                        } catch(err) {
                            this.print(`Error: ${err.message}`, 'error');
                        }
                        return;
                    }
                }

                if (window.packagesRegistry[cmd]) {
                    const pkgObj = window.packagesRegistry[cmd];
                    if (pkgObj.commands && pkgObj.commands.run) {
                        try {
                            await pkgObj.commands.run.call(this, args);
                        } catch(err) {
                            this.print(`Error: ${err.message}`, 'error');
                        }
                        return;
                    }
                    if (pkgObj.start) {
                        try {
                            await pkgObj.start.call(this, args);
                        } catch(err) {
                            this.print(`Error: ${err.message}`, 'error');
                        }
                        return;
                    }
                }

                if (this.commands[cmd]) {
                    try { this.commands[cmd](args); } catch(err) { this.print(`Error: ${err.message}`, 'error'); }
                    return;
                }

                this.printTranslatable("errors.commandNotFound", 'error', false, [cmd]);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['Enter', 'Backspace', 'ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
                e.preventDefault();
                e.stopPropagation();
                if (e.key === 'Enter' && activeTab && !activeTab.isWrapper) activeTab.createTerminal();
                else if (e.key === 'Backspace' && activeTab?.activeTerminal && !activeTab.isWrapper) activeTab.closeTerminal(activeTab.activeTerminal);
                else if (activeTab && !activeTab.isWrapper) activeTab.navigateTerminal(e.key);
            }
        }, { capture: true });

        document.addEventListener('wheel', (e) => {
            const terminalPane = e.target.closest('.terminal-instance');
            if (!terminalPane || !e.altKey) return;
            e.preventDefault();
            const deltaDirection = e.deltaY < 0 ? 1 : -1;
            const nextSize = Math.min(36, Math.max(10, termSettings.fontsize + deltaDirection));
            if (nextSize !== termSettings.fontsize) {
                termSettings.fontsize = nextSize;
                applySettings();
            }
        }, { passive: false, capture: true });

        window.onload = async () => {
            setupMenu();
            createTab();
            await loadDynamicModules();
        };
    </script>
</body>
</html>
