<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-zinc-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Index</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for premium Monospace/Sans look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;700&family=Geist+Mono:wght@100;300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Geist Mono', 'JetBrains Mono', monospace;
      background-color: #000000;
    }

    /* Overlay wrapper - hidden by default */
    #overlay-wrapper {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      /* 5px padding on all sides */
      padding: 5px;
      animation: fadeIn 0.3s ease;
      box-sizing: border-box;
    }

    #overlay-wrapper.active {
      display: flex;
    }

    #overlay-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      background: #111;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    #overlay-close {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 1001;
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid #3a3a3a;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #overlay-close:hover {
      background: #e74c3c;
      border-color: #e74c3c;
      transform: scale(1.05);
    }

    #overlay-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }

    /* Grid items styling */
    .grid-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 18px 24px;
      transition: all 0.2s ease;
      cursor: pointer;
      text-align: center;
      min-width: 180px;
      flex: 0 1 auto;
    }

    .grid-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .grid-item .item-name {
      font-size: 14px;
      font-weight: 400;
      color: #e0e0e0;
      letter-spacing: 0.3px;
    }

    .grid-item .item-path {
      font-size: 10px;
      color: #555;
      margin-top: 4px;
      font-weight: 300;
      letter-spacing: 0.2px;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Scrollable grid */
    .grid-scroll {
      max-height: 70vh;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .grid-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .grid-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .grid-scroll::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .grid-scroll::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Loading state */
    .loading-text {
      color: #444;
      font-size: 14px;
      letter-spacing: 1px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      color: #333;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    /* Error state */
    .error-state {
      color: #c0392b;
      font-size: 13px;
      letter-spacing: 0.3px;
      border: 1px solid #c0392b33;
      padding: 12px 20px;
      border-radius: 8px;
      background: #c0392b11;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-zinc-100 p-8 md:p-12">

  <!-- Main Grid/Flex layout matching Top Left & Top Right requirement -->
  <div class="w-full flex flex-col sm:flex-row justify-between items-start gap-6">

    <!-- TOP LEFT: Dynamic Title & Combined Subtitle -->
    <div class="flex flex-col space-y-2">
      <h1 id="main-title" class="text-2xl md:text-3xl font-light tracking-tight text-white select-none">
        Loading...
      </h1>
      <p id="combined-subtitle" class="text-xs md:text-sm text-zinc-400 font-light tracking-wide pl-4 border-l border-zinc-800">
        Loading...
      </p>
    </div>

    <!-- TOP RIGHT: User Local Date & Time with Seconds -->
    <div class="flex flex-col items-start sm:items-end text-left sm:text-right font-normal space-y-1">
      <div id="live-time" class="text-xl md:text-2xl font-light tracking-wider text-zinc-100 tabular-nums">
        00:00:00
      </div>
      <div id="live-date" class="text-xs tracking-widest text-zinc-500 uppercase font-medium">
        Loading date...
      </div>
    </div>

  </div>

  <!-- GRID: List of HTML files dynamically loaded -->
  <div class="mt-12 w-full">
    <div id="grid-container" class="flex flex-wrap gap-4 items-center">
      <!-- Items will be injected here -->
      <div class="loading-text">Loading resources...</div>
    </div>
  </div>

  <!-- OVERLAY WRAPPER -->

    <div id="overlay-container">
      <button id="overlay-close" title="Close">✕</button>
      <iframe id="overlay-iframe" src="about:blank"></iframe>

        "Memory Aids", "Error Prevention", "Confirmation Prompts", "Custom Accessibility Profiles",
        "Personalized Accessibility", "Accessible Productivity", "Accessible Navigation",
        "Accessible Communication", "Accessible Workflows", "Universal Usability", "Inclusive Computing"
      ]
    };

    // --- DOM REFS ---
    const gridContainer = document.getElementById('grid-container');
    const overlayWrapper = document.getElementById('overlay-wrapper');
    const overlayIframe = document.getElementById('overlay-iframe');
    const overlayClose = document.getElementById('overlay-close');

    // --- STATE ---
    let currentItemPath = '';

    // --- UTILITY FUNCTIONS ---
    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function generateIndices() {
      const selectedTitle = getRandomItem(RND_INDEX_TITLES);
      const selectedNiche = getRandomItem(RND_INDEX_SUBTITLES["Niche Tools"]);
      const selectedAccess = getRandomItem(RND_INDEX_SUBTITLES["Accessibility Features"]);

      document.getElementById('main-title').innerText = selectedTitle;
      document.getElementById('combined-subtitle').innerText = `${selectedNiche} • ${selectedAccess}`;
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('live-time').innerText = `${hours}:${minutes}:${seconds}`;

      const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
      document.getElementById('live-date').innerText = now.toLocaleDateString(undefined, options);
    }

    // --- LOAD HTML LIST FROM JSON ---
    async function loadHtmlList() {
      try {
        // Using lowercase "resources" as specified
        const response = await fetch('resources/htmlList.json');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        // Validate that we got an array
        if (!Array.isArray(data)) {
          throw new Error('JSON data is not an array');
        }
        
        return data;
      } catch (error) {
        console.error('Failed to load resources/htmlList.json:', error);
        return null;
      }
    }

    // --- RENDER GRID ---
    function renderGrid(items) {
      gridContainer.innerHTML = '';

      if (!items) {
        gridContainer.innerHTML = `
          <div class="error-state">
            ⚠️ Failed to load resources/htmlList.json<br>
            <span style="font-size:11px;color:#666;">Make sure the file exists at: resources/htmlList.json</span>
          </div>
        `;
        return;
      }

      if (items.length === 0) {
        gridContainer.innerHTML = `<div class="empty-state">📭 No resources found in htmlList.json</div>`;
        return;
      }

      // Sort alphabetically for consistency
      const sorted = [...items].sort((a, b) => a.localeCompare(b));

      sorted.forEach((path) => {
        const div = document.createElement('div');
        div.className = 'grid-item';

        // Extract filename from path for display
        const fileName = path.split('/').pop() || path;
        const displayName = fileName.replace(/\.html$/i, '');

        div.innerHTML = `
          <div class="item-name">${displayName}</div>
          <div class="item-path">${path}</div>
        `;

        div.addEventListener('click', () => {
          openOverlay(path);
        });

        gridContainer.appendChild(div);
      });
    }

    // --- OVERLAY FUNCTIONS ---
    function openOverlay(path) {
      currentItemPath = path;
      overlayIframe.src = path;
      overlayWrapper.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeOverlay() {
      if (overlayIframe.src !== 'about:blank') {
        // Ask for confirmation before closing
        if (confirm('Are you sure you want to close this page?')) {
          overlayIframe.src = 'about:blank';
          overlayWrapper.classList.remove('active');
          document.body.style.overflow = '';
          currentItemPath = '';
        }
      } else {
        overlayWrapper.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    // --- EVENT LISTENERS ---
    overlayClose.addEventListener('click', closeOverlay);

    // Close on backdrop click (click on the wrapper background)
    overlayWrapper.addEventListener('click', (e) => {
      if (e.target === overlayWrapper) {
        closeOverlay();
      }
    });

    // Keyboard shortcut: Escape to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlayWrapper.classList.contains('active')) {
        closeOverlay();
      }
    });

    // --- INITIALIZATION ---
    window.onload = async function() {
      // Set random title/subtitle
      generateIndices();

      // Start clock
      updateClock();
      setInterval(updateClock, 1000);

      // Load HTML list from JSON (lowercase "resources")
      const htmlItems = await loadHtmlList();
      renderGrid(htmlItems);
    }
  </script>
