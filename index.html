<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>sHyprland Experience</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const defaultTheme = {
            'hypr-bg': '#000000', 
            'hypr-base': '#0a0a0a', 
            'hypr-surface0': '#1a1a1a', 
            'hypr-surface1': '#2a2a2a', 
            'hypr-text': '#f5f5f5',
            'hypr-subtext': '#a3a3a3',
            'hypr-accent': '#ffffff',
        };

        tailwind.config = {
            theme: {
                extend: {
                    colors: defaultTheme,
                    fontFamily: {
                        sans: ['Verdana', 'sans-serif'],
                    },
                    animation: {
                        'menu-pop': 'menuPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        menuPop: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap");
        :root {
            --hypr-border-width: 2px;
            --hypr-border-radius: 12px;
            --wallpaper-color: #000000;
        }
        body {
            overflow: hidden;
            background-color: var(--wallpaper-color);
            font-family: 'Verdana', sans-serif;
        }

        #hypr-root {
            width: 100vw;
            height: 100vh;
            transform-origin: top left;
        }

        .glass-effect {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        #waybar {
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .window {
            background-color: var(--tw-colors-hypr-base);
            border: var(--hypr-border-width) solid var(--tw-colors-hypr-surface1);
            border-radius: var(--hypr-border-radius);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, top 0.25s cubic-bezier(0.16, 1, 0.3, 1), left 0.25s cubic-bezier(0.16, 1, 0.3, 1), width 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .window.dragging {
            transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
            opacity: 0.95;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px var(--tw-colors-hypr-accent);
        }

        .window.active-window {
            border-color: var(--tw-colors-hypr-accent);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1), 0 0 0 1px var(--tw-colors-hypr-accent);
            z-index: 50;
        }
        .window.minimized {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }
        .window-header {
            cursor: move;
            border-top-left-radius: calc(var(--hypr-border-radius) - 2px);
            border-top-right-radius: calc(var(--hypr-border-radius) - 2px);
        }

        .win11-btn {
            width: 28px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tw-colors-hypr-subtext);
            font-size: 10px;
            border-radius: 4px;
            transition: background 0.1s, color 0.1s;
        }
        
        .ws-move-btn {
            width: 22px;
            font-weight: 600;
        }

        .win11-btn:hover {
            background: var(--tw-colors-hypr-surface1);
            color: var(--tw-colors-hypr-text);
        }
        .win11-close:hover {
            background: #e81123 !important;
            color: #ffffff !important;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--tw-colors-hypr-surface1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--tw-colors-hypr-accent); }
    </style>
</head>

<body class="text-hypr-text h-screen w-screen overflow-hidden bg-black select-none">
    <div id="hypr-root" class="relative w-full h-full">
        <!-- Desktop Background -->
        <div id="desktop-area" class="w-full h-full absolute top-0 left-0 z-0">
        </div>

        <!-- Windows Container -->
        <div id="windows-container" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 overflow-hidden">
        </div>

        <!-- Waybar (Top/Bottom Bar) -->
        <div id="waybar" class="absolute top-2 left-2 right-2 h-9 glass-effect rounded-full border border-hypr-surface1 flex items-center justify-between px-4 z-50 transition-all duration-300">
            <div class="flex items-center gap-2 h-full">
                <button id="launcher-btn" class="text-hypr-accent hover:text-white mr-2 transition-transform hover:scale-110" onclick="toggleLauncher(event)" title="Start Menu">
                    <i class="fa-brands fa-linux text-lg"></i>
                </button>
                <div class="flex gap-1 items-center" id="workspace-container">
                    <div class="ws-btn w-6 h-6 rounded-full bg-hypr-accent text-black flex items-center justify-center text-xs font-bold cursor-pointer transition-colors" data-ws="1" onclick="switchWorkspace(1)">1</div>
                    <div class="ws-btn w-6 h-6 rounded-full hover:bg-hypr-surface1 text-hypr-subtext flex items-center justify-center text-xs font-bold cursor-pointer transition-colors" data-ws="2" onclick="switchWorkspace(2)">2</div>
                    <div class="ws-btn w-6 h-6 rounded-full hover:bg-hypr-surface1 text-hypr-subtext flex items-center justify-center text-xs font-bold cursor-pointer transition-colors" data-ws="3" onclick="switchWorkspace(3)">3</div>
                    <div class="ws-btn w-6 h-6 rounded-full hover:bg-hypr-surface1 text-hypr-subtext flex items-center justify-center text-xs font-bold cursor-pointer transition-colors" data-ws="4" onclick="switchWorkspace(4)">4</div>
                </div>
            </div>

            <div id="active-window-title" class="text-sm font-medium text-hypr-text truncate max-w-[30%] opacity-80">
                ~
            </div>

            <div class="flex items-center h-full gap-2 text-sm text-hypr-subtext">
                <div id="date-display" class="font-medium text-hypr-text bg-hypr-surface0 px-3 py-0.5 rounded-full border border-hypr-surface1 cursor-pointer hover:border-hypr-accent transition-colors" onclick="toggleDateFormat()">
                    <span id="date"></span>
                </div>
                <div id="clock" class="font-medium text-hypr-text bg-hypr-surface0 px-3 py-0.5 rounded-full border border-hypr-surface1 cursor-pointer hover:border-hypr-accent transition-colors" onclick="toggleTimeFormat()">
                    <span id="time">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- Start Menu Overlay -->
        <div id="start-menu-overlay" class="hidden absolute inset-0 w-full h-full z-[999998]" onclick="if(!document.getElementById('start-menu').classList.contains('hidden')) toggleLauncher()"></div>

        <!-- Start Menu Launcher -->
        <div id="start-menu" class="hidden absolute w-[360px] bg-hypr-base glass-effect border-2 border-hypr-surface1 rounded-xl shadow-[0_10px_50px_rgba(0,0,0,0.9)] z-[999999] flex-row overflow-hidden animate-menu-pop">
            <div class="w-12 shrink-0 bg-hypr-surface0/60 border-r border-hypr-surface1 flex flex-col items-center py-3 justify-between z-10">
                <div id="favorites-container" class="flex flex-col gap-3 w-full items-center pt-1">
                    <!-- Favorites will be injected here -->
                </div>
                <div class="flex flex-col gap-3 w-full items-center pb-1">
                    <button onclick="openSettings(); toggleLauncher();" class="w-8 h-8 rounded-lg hover:bg-hypr-surface1 text-hypr-subtext hover:text-hypr-text flex items-center justify-center transition-colors group relative" title="Settings">
                        <i class="fa-solid fa-gear group-hover:rotate-90 transition-transform duration-300"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 min-w-0 flex flex-col bg-hypr-base/40 relative">
                <div class="p-4 pb-2">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-hypr-subtext text-sm"></i>
                        <input type="text" id="start-search" placeholder="Type to search..." class="w-full bg-hypr-surface0 text-hypr-text text-sm rounded-lg py-2 pl-9 pr-3 outline-none border border-transparent focus:border-hypr-surface1 focus:bg-hypr-surface0/80 transition-all shadow-inner" style="font-family: inherit;">
                    </div>
                </div>

                <div class="flex flex-col px-4 pb-4">
                    <div class="flex flex-col gap-1" id="apps-container">
                        <div class="p-4 text-center text-hypr-subtext italic text-sm" id="no-apps-message">
                            Loading applications...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let GAP = 12;
        const WAYBAR_HEIGHT = 44; 
        let activeWindowId = null;
        let currentWorkspace = 1;

        window.hyprConfig = {
            borderWidth: 2,
            borderRadius: 12,
            gap: 12,
            autoTiling: true,
            waybarPosition: "top",
            wallpaper: "#000000",
            accentColor: "#ffffff",
            baseColor: "#0a0a0a",
            surfaceColor: "#1a1a1a",
            textColor: "#f5f5f5",
            launcherHotkey: { key: " ", ctrl: true, alt: false, meta: false },
            scale: parseFloat((window.innerHeight / 1080).toFixed(2)) || 1.0,
            font: "Verdana, sans-serif"
        };

        window.getTopOffset = function() {
            return window.hyprConfig.waybarPosition === 'top' ? WAYBAR_HEIGHT + GAP : GAP;
        };

        const windows = {};
        let windowOrder = []; 
        let currentZIndex = 100;

        function getScrW() { return window.innerWidth / window.hyprConfig.scale; }
        function getScrH() { return window.innerHeight / window.hyprConfig.scale; }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('start-menu');
            const btn = document.getElementById('launcher-btn');
            const overlay = document.getElementById('start-menu-overlay');
            const path = e.composedPath();
            if (!menu.classList.contains('hidden') && !path.includes(menu) && !path.includes(btn)) {
                menu.classList.remove('flex');
                menu.classList.add('hidden');
                if (overlay) overlay.classList.add('hidden');
            }

            const settingsWin = document.getElementById('window-settings');
            if (settingsWin && !path.includes(settingsWin)) {
                closeApp('window-settings');
            }
        });

        window.moveToWorkspace = function(winId, ws) {
            if (windows[winId]) {
                windows[winId].workspace = ws;
                window.switchWorkspace(ws);
            }
        };

        window.tileWindows = function() {
            if (!window.hyprConfig.autoTiling) return;
            
            const openWins = windowOrder
                .filter(id => windows[id] && windows[id].isOpen && !windows[id].isMinimized && !windows[id].isFloating && windows[id].workspace === currentWorkspace)
                .map(id => windows[id]);

            if (openWins.length === 0) return;
            
            const maxW = getScrW() - (GAP * 2);
            const maxH = getScrH() - WAYBAR_HEIGHT - (GAP * 2);
            
            if (openWins.length === 1) {
                const el = openWins[0].element;
                el.style.top = window.getTopOffset() + "px";
                el.style.left = GAP + "px";
                el.style.width = maxW + "px";
                el.style.height = maxH + "px";
                return;
            }
            
            const master = openWins[0].element;
            const masterW = (maxW - GAP) / 2;
            master.style.top = window.getTopOffset() + "px";
            master.style.left = GAP + "px";
            master.style.width = masterW + "px";
            master.style.height = maxH + "px";
            
            const stackCount = openWins.length - 1;
            const stackW = (maxW - GAP) / 2;
            const stackH = (maxH - (GAP * (stackCount - 1))) / stackCount;
            
            for (let i = 1; i < openWins.length; i++) {
                const el = openWins[i].element;
                el.style.left = (GAP + masterW + GAP) + "px";
                el.style.top = (window.getTopOffset() + (i - 1) * (stackH + GAP)) + "px";
                el.style.width = stackW + "px";
                el.style.height = stackH + "px";
            }
        };

        window.addEventListener("resize", () => { if(window.hyprConfig.autoTiling) window.tileWindows(); });
        
        const applyInitialScale = () => {
            const root = document.getElementById("hypr-root");
            root.style.transform = `scale(${window.hyprConfig.scale})`;
            root.style.width = `${100 / window.hyprConfig.scale}%`;
            root.style.height = `${100 / window.hyprConfig.scale}%`;
        };
        applyInitialScale();

        window.switchWorkspace = function(ws) {
            currentWorkspace = ws;
            document.querySelectorAll('.ws-btn').forEach(btn => {
                if (parseInt(btn.getAttribute('data-ws')) === ws) {
                    btn.className = 'ws-btn w-6 h-6 rounded-full bg-hypr-accent text-black flex items-center justify-center text-xs font-bold cursor-pointer transition-colors';
                } else {
                    btn.className = 'ws-btn w-6 h-6 rounded-full hover:bg-hypr-surface1 text-hypr-subtext flex items-center justify-center text-xs font-bold cursor-pointer transition-colors';
                }
            });
            Object.values(windows).forEach(w => {
                if(w.workspace === ws && !w.isMinimized) {
                    w.element.style.display = 'flex';
                } else {
                    w.element.style.display = 'none';
                }
            });
            window.tileWindows();
        }

        window.updateHyprConfig = function(key, value) {
            if (key === "autoTiling") {
                window.hyprConfig.autoTiling = value;
                if (value) window.tileWindows();
            } else if (key === "scale") {
                window.hyprConfig.scale = parseFloat(value);
                const root = document.getElementById("hypr-root");
                root.style.transform = `scale(${window.hyprConfig.scale})`;
                root.style.width = `${100 / window.hyprConfig.scale}%`;
                root.style.height = `${100 / window.hyprConfig.scale}%`;
                window.tileWindows();
            } else if (key === "font") {
                window.hyprConfig.font = value;
                document.body.style.fontFamily = value;
            } else if (key === "waybarPosition") {
                window.hyprConfig.waybarPosition = value;
                const wb = document.getElementById('waybar');
                if (value === 'top') {
                    wb.classList.remove('bottom-2');
                    wb.classList.add('top-2');
                } else {
                    wb.classList.remove('top-2');
                    wb.classList.add('bottom-2');
                }
                const launcher = document.getElementById('start-menu');
                if (!launcher.classList.contains('hidden')) toggleLauncher();
                if (window.hyprConfig.autoTiling) window.tileWindows();
            } else if (key === "wallpaper") {
                window.hyprConfig.wallpaper = value;
                document.documentElement.style.setProperty("--wallpaper-color", value);
            } else if (key === "accentColor") {
                window.hyprConfig.accentColor = value;
                document.documentElement.style.setProperty("--tw-colors-hypr-accent", value);
            } else if (key === "baseColor") {
                window.hyprConfig.baseColor = value;
                document.documentElement.style.setProperty("--tw-colors-hypr-base", value);
            } else if (key === "surfaceColor") {
                window.hyprConfig.surfaceColor = value;
                document.documentElement.style.setProperty("--tw-colors-hypr-surface0", value);
            } else if (key === "textColor") {
                window.hyprConfig.textColor = value;
                document.documentElement.style.setProperty("--tw-colors-hypr-text", value);
            } else {
                window.hyprConfig[key] = parseInt(value);
                if (key === "borderWidth") {
                    document.documentElement.style.setProperty("--hypr-border-width", value + "px");
                } else if (key === "borderRadius") {
                    document.documentElement.style.setProperty("--hypr-border-radius", value + "px");
                } else if (key === "gap") {
                    GAP = parseInt(value);
                    if (window.hyprConfig.autoTiling) window.tileWindows();
                }
            }
        };

        let is24Hour = false;
        let isFullDate = false;
        function toggleTimeFormat() { is24Hour = !is24Hour; updateClock(); }
        function toggleDateFormat() { isFullDate = !isFullDate; updateClock(); }

        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: !is24Hour };
            document.getElementById('time').textContent = now.toLocaleTimeString([], timeOptions);

            const lang = navigator.language || 'en-US';
            let dateString;
            if (isFullDate) {
                dateString = now.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            } else {
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                dateString = lang.toLowerCase().startsWith('en') ? `${m}/${d}/${y}` : `${d}/${m}/${y}`;
            }
            const dateEl = document.getElementById('date');
            if(dateEl) dateEl.textContent = dateString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const launcher = document.getElementById('start-menu');
        const searchInput = document.getElementById('start-search');
        window.allApps = [];
        window.currentCategory = null;

        window.toggleLauncher = function(e) {
            if(e) e.stopPropagation();
            const overlay = document.getElementById('start-menu-overlay');
            if (launcher.classList.contains('hidden')) {
                const isTop = window.hyprConfig.waybarPosition === 'top';
                if (isTop) {
                    launcher.style.top = (WAYBAR_HEIGHT + GAP) + 'px';
                    launcher.style.bottom = 'auto';
                    launcher.style.transformOrigin = 'top left';
                } else {
                    launcher.style.bottom = (WAYBAR_HEIGHT + GAP) + 'px';
                    launcher.style.top = 'auto';
                    launcher.style.transformOrigin = 'bottom left';
                }
                launcher.style.left = GAP + 'px';

                launcher.classList.remove('hidden');
                launcher.classList.add('flex');
                if (overlay) overlay.classList.remove('hidden');
                
                setTimeout(() => {
                    searchInput.focus();
                    searchInput.value = '';
                    window.currentCategory = null;
                    renderStartMenuView();
                }, 10);
            } else {
                launcher.classList.remove('flex');
                launcher.classList.add('hidden');
                if (overlay) overlay.classList.add('hidden');
            }
        };

        searchInput.addEventListener('input', () => renderStartMenuView());

        function formatAppName(name) {
            if (!name) return '';
            let cleanName = name.replace(/\.(html|js)$/i, '');
            return cleanName.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[-_]/g, ' ').replace(/^./, str => str.toUpperCase());
        }

        document.addEventListener('keydown', (e) => {
            const hk = window.hyprConfig.launcherHotkey;
            if (e.key.toLowerCase() === hk.key.toLowerCase() && 
                e.ctrlKey === hk.ctrl && 
                e.altKey === hk.alt && 
                e.metaKey === hk.meta) {
                e.preventDefault();
                toggleLauncher();
            }
        });

        async function scanDirectory(basePath, defaultGroup = "", maxDepth = 4) {
            let apps = [];
            if (maxDepth === 0) return apps;
            try {
                if (!basePath.endsWith('/')) basePath += '/';
                const res = await fetch(basePath);
                if (!res.ok) return apps;
                const text = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'));
                for (const link of links) {
                    let href = link.getAttribute('href');
                    if (!href || href === '../' || href.includes('..') || href.startsWith('?') || href.startsWith('#')) continue;
                    let relativePath = href;
                    if (relativePath.startsWith('/')) { relativePath = relativePath.substring(1); }
                    else if (relativePath.startsWith('http')) {
                        try { const urlObj = new URL(relativePath); relativePath = urlObj.pathname.substring(1); } catch(e) {}
                    } else { relativePath = basePath + relativePath; }
                    relativePath = relativePath.replace(/\/+/g, '/');
                    if (relativePath === basePath) continue;
                    let fileName = relativePath.split('/').filter(Boolean).pop();
                    if (!fileName) continue;
                    let isDir = href.endsWith('/') || link.innerText.trim().endsWith('/');
                    let isHtmlOrJs = relativePath.toLowerCase().endsWith('.html') || relativePath.toLowerCase().endsWith('.js');
                    if (isHtmlOrJs) {
                        apps.push({ 
                            path: relativePath, 
                            name: formatAppName(fileName), 
                            type: fileName.split('.').pop().toLowerCase(), 
                            group: defaultGroup,
                            info: '',
                            favorite: false
                        });
                    } else if (isDir || (!fileName.includes('.') && maxDepth > 1)) {
                        const groupName = fileName.charAt(0).toUpperCase() + fileName.slice(1);
                        const subGroup = defaultGroup ? `${defaultGroup}/${groupName}` : groupName;
                        const subApps = await scanDirectory(relativePath, subGroup, maxDepth - 1);
                        apps.push(...subApps);
                    }
                }
            } catch (err) {}
            return apps;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            let items = await scanDirectory('applications/', '');
            if (items.length === 0) {
                try {
                    const fallbackRes = await fetch('registry.json');
                    if(fallbackRes.ok) {
                        const regData = await fallbackRes.json();
                        items = regData.map(app => {
                            let cleanPath = (app.file || app.path || '').replace(/\\/g, '/');
                            if (cleanPath.startsWith('/')) cleanPath = cleanPath.substring(1);
                            
                            // Treat 'Applications' as the root namespace for backwards compatibility
                            let group = app.category || app.group || '';
                            if (group === 'Applications') group = '';

                            return {
                                path: cleanPath, 
                                name: app.name || formatAppName(cleanPath.split('/').pop()),
                                type: cleanPath ? cleanPath.split('.').pop().toLowerCase() : 'html',
                                group: group,
                                info: app.info || '',
                                favorite: app.favorite === 'yes' || app.favorite === true
                            };
                        });
                    }
                } catch(e) { }
            }
            window.allApps = items;
            window.currentCategory = null;
            renderStartMenuView();
            renderFavorites();
        });

        function renderFavorites() {
            const container = document.getElementById('favorites-container');
            if (!container) return;
            container.innerHTML = '';
            
            const favorites = window.allApps.filter(app => app.favorite);
            
            favorites.forEach(app => {
                const btn = document.createElement('button');
                btn.className = 'w-8 h-8 rounded-lg hover:bg-hypr-surface1 text-hypr-subtext hover:text-hypr-text flex items-center justify-center transition-colors group relative';
                btn.title = app.name;
                
                let iconClass = app.type === 'js' ? 'fa-brands fa-js text-yellow-400' : 'fa-brands fa-html5 text-orange-500';
                
                btn.innerHTML = `<i class="${iconClass} text-lg group-hover:scale-110 transition-transform duration-300"></i>`;
                btn.onclick = () => { launchApp(app); toggleLauncher(); };
                
                container.appendChild(btn);
            });
        }

        function renderStartMenuView() {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';
            
            // Filter out favorites from the main application view
            const displayApps = window.allApps.filter(app => !app.favorite);
            
            if (!displayApps || displayApps.length === 0) {
                container.innerHTML = `<div class="p-6 text-center flex flex-col items-center justify-center text-hypr-subtext gap-3"><span class="text-sm">No apps found</span></div>`;
                return;
            }
            
            const query = document.getElementById('start-search').value.toLowerCase().trim();
            if (query) {
                const results = displayApps.filter(app => 
                    app.name.toLowerCase().includes(query) || 
                    app.path.toLowerCase().includes(query) || 
                    (app.group && app.group.toLowerCase().includes(query)) ||
                    (app.info && app.info.toLowerCase().includes(query))
                );
                
                if (results.length === 0) container.innerHTML = '<div class="p-4 text-center text-hypr-subtext italic text-sm mt-4">No matches found</div>';
                else {
                    const unique = []; results.forEach(app => { if (!unique.find(r => r.path === app.path)) unique.push(app); });
                    unique.forEach(app => container.appendChild(createAppButton(app)));
                }
                return;
            }
            
            const currentPath = window.currentCategory || "";

            // Render Back Button if inside a subcategory
            if (currentPath !== "") {
                const backBtn = document.createElement('button');
                backBtn.className = 'flex items-center gap-2 p-2 mb-2 rounded-lg hover:bg-hypr-surface1 text-left text-hypr-subtext hover:text-hypr-text transition-colors w-full text-sm font-medium border border-hypr-surface1 bg-hypr-surface0/30';
                
                const parentPath = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/')) : "";
                const displayCategory = currentPath.split('/').pop();
                
                backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> ' + displayCategory;
                backBtn.onclick = () => { window.currentCategory = parentPath; renderStartMenuView(); };
                container.appendChild(backBtn);
            }

            const folders = new Set();
            const directApps = [];

            // Classify apps into the current level
            displayApps.forEach(app => {
                // Ensure legacy standard "Applications" points to root to avoid redundancy
                let appGroup = app.group === 'Applications' ? '' : (app.group || '');

                if (appGroup === currentPath) {
                    directApps.push(app);
                } else if (appGroup.startsWith(currentPath ? currentPath + "/" : "")) {
                    const prefix = currentPath ? currentPath + "/" : "";
                    const remaining = appGroup.substring(prefix.length);
                    const nextLevel = remaining.split('/')[0];
                    if (nextLevel) {
                        folders.add(prefix + nextLevel);
                    }
                }
            });

            // Render Sub-Folders
            Array.from(folders).sort().forEach(folderPath => {
                const folderName = folderPath.split('/').pop();
                const btn = document.createElement('button');
                btn.className = 'flex items-center gap-3 p-2 rounded-lg hover:bg-hypr-surface1 text-left border border-transparent outline-none focus:border-hypr-accent focus:bg-hypr-surface1 transition-colors group w-full mb-1';
                btn.innerHTML = `<div class="w-8 h-8 rounded-md bg-hypr-surface0 border border-hypr-surface1 flex items-center justify-center text-sm shadow-sm group-hover:scale-105 transition-transform"><i class="fa-solid fa-folder text-yellow-500"></i></div><div class="flex flex-col overflow-hidden"><span class="font-medium text-sm text-hypr-text truncate w-full">${folderName}</span></div>`;
                btn.onclick = () => { window.currentCategory = folderPath; renderStartMenuView(); };
                container.appendChild(btn);
            });

            // Render Apps within current folder
            const uniqueApps = [];
            directApps.forEach(app => { if (!uniqueApps.find(u => u.path === app.path)) uniqueApps.push(app); });
            
            uniqueApps.sort((a, b) => a.name.localeCompare(b.name)).forEach(app => {
                container.appendChild(createAppButton(app));
            });
        }

        function createAppButton(app) {
            const btn = document.createElement('button');
            btn.className = 'app-btn flex items-center gap-3 p-2 rounded-lg hover:bg-hypr-surface1 text-left border border-transparent outline-none focus:border-hypr-accent focus:bg-hypr-surface1 transition-colors group w-full mb-1';
            
            let iconClass = app.type === 'js' ? 'fa-brands fa-js text-yellow-400' : 'fa-brands fa-html5 text-orange-500';
            const secondaryText = app.info ? app.info : app.path;
            
            btn.innerHTML = `
                <div class="w-8 h-8 rounded-md bg-hypr-surface0 border border-hypr-surface1 flex items-center justify-center text-sm shadow-sm group-hover:scale-105 transition-transform">
                    <i class="${iconClass}"></i>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <span class="font-medium text-sm text-hypr-text truncate w-full">${app.name}</span>
                    <span class="text-[10px] text-hypr-subtext opacity-80 truncate w-full" title="${secondaryText}">${secondaryText}</span>
                </div>`;
                
            btn.onclick = () => { launchApp(app); toggleLauncher(); };
            return btn;
        }

        function launchApp(app) {
            try {
                const safeId = app.path.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
                const winId = `window-${safeId}`;
                
                if (windows[winId]) {
                    if(windows[winId].workspace !== currentWorkspace) window.switchWorkspace(windows[winId].workspace);
                    if (windows[winId].isMinimized) openWindow(winId);
                    bringToFront(winId);
                    return;
                }

                let config = { width: 800, height: 600, maxizable: true };
                
                const winDiv = document.createElement('div');
                winDiv.id = winId;
                winDiv.className = 'window absolute flex flex-col overflow-hidden pointer-events-auto';
                
                const maxW = getScrW() - (GAP * 2);
                const maxH = getScrH() - WAYBAR_HEIGHT - (GAP * 2);
                const w = Math.min(config.width, maxW);
                const h = Math.min(config.height, maxH);
                
                winDiv.style.width = `${w}px`;
                winDiv.style.height = `${h}px`;
                winDiv.style.top = `${window.getTopOffset() + (Math.random() * 40)}px`;
                winDiv.style.left = `${(getScrW() - w)/2 + (Math.random() * 40 - 20)}px`;
                
                winDiv.innerHTML = `
                    <div class="window-header h-8 bg-hypr-surface0 flex justify-between items-center px-3 border-b border-hypr-surface1 select-none">
                        <span class="text-xs font-semibold tracking-wider text-hypr-subtext truncate flex items-center gap-2">
                            <i class="${app.type === 'js' ? 'fa-brands fa-js' : 'fa-brands fa-html5'} opacity-70"></i>
                            ${app.name}
                        </span>
                        <div class="flex items-center gap-1">
                            <div class="flex items-center gap-0">
                                <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 1)" title="Move to WS 1">1</button>
                                <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 2)" title="Move to WS 2">2</button>
                                <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 3)" title="Move to WS 3">3</button>
                                <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 4)" title="Move to WS 4">4</button>
                            </div>
                            <div class="w-[1px] h-3 bg-hypr-surface1 mx-0.5"></div>
                            <button class="win11-btn" onclick="toggleFloating('${winId}')" title="Toggle Floating"><i class="fa-solid fa-clone text-[9px]"></i></button>
                            <button class="win11-btn" onclick="maximizeWindow('${winId}')" title="Maximize"><i class="fa-regular fa-square text-[9px]"></i></button>
                            <button class="win11-btn win11-close" onclick="closeApp('${winId}')" title="Close"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div class="flex-1 relative bg-hypr-base">
                        <div class="iframe-glass absolute inset-0 z-10 hidden"></div>
                        <iframe id="iframe-${winId}" class="w-full h-full border-none block bg-hypr-base"></iframe>
                    </div>
                `;
                document.getElementById('windows-container').appendChild(winDiv);
                
                const iframe = winDiv.querySelector('iframe');
                
                if (app.type === 'html') {
                    iframe.src = app.path;
                    iframe.onerror = function() {
                        iframe.srcdoc = `<body style="background:#0a0a0a;color:#f5f5f5;font-family:monospace;padding:2rem;"><h2>404 - App not found</h2></body>`;
                    };
                } else if (app.type === 'js') {
                    const scriptUrl = new URL(app.path, window.location.origin).href;
                    iframe.srcdoc = `<!DOCTYPE html><html lang="en" class="h-full"><head><meta charset="UTF-8"><style>html,body{height:100%;margin:0;background:#0a0a0a;color:#f5f5f5;font-family:sans-serif;overflow:hidden;}</style></head><body><script>const s = document.createElement('script'); s.src = "${scriptUrl}"; document.body.appendChild(s);<\/script></body></html>`;
                }

                windows[winId] = {
                    element: winDiv, isOpen: true, isMaximized: false, isSnapped: false, isFloating: false,
                    appName: app.name, title: app.name, config: config, workspace: currentWorkspace
                };
                
                windowOrder.push(winId);
                
                makeDraggable(winDiv);
                winDiv.addEventListener('mousedown', () => bringToFront(winId));
                bringToFront(winId);
                window.tileWindows();
            } catch (err) {
                console.error(err);
            }
        }

        window.openSettings = function() {

            if (windows[winId]) {

            winDiv.innerHTML = `

                    <span class="text-xs font-semibold tracking-wider text-hypr-subtext truncate flex items-center gap-2"><i class="fa-solid fa-gear"></i> sHyprland Settings</span>
                    <div class="flex items-center gap-1">
                        <div class="flex items-center gap-0">
                            <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 1)" title="Move to WS 1">1</button>
                            <button class="win11-btn ws-move-btn" onclick="moveToWorkspace('${winId}', 2)" title="Move to WS 2">2</button>

                    </div>
                </div>
                <div class="flex-1 bg-hypr-base p-5 overflow-y-auto custom-scrollbar flex flex-col gap-6 text-sm">
                    <div class="flex flex-col gap-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-hypr-subtext opacity-70">Window Management</span>

                            <input type="checkbox" class="accent-white w-4 h-4" ${window.hyprConfig.autoTiling ? 'checked' : ''} onchange="updateHyprConfig('autoTiling', this.checked)">

                                Top Bar
                            </button>
                            <button onclick="updateHyprConfig('waybarPosition', 'bottom')" class="p-2.5 rounded-lg border text-center font-medium transition-all ${window.hyprConfig.waybarPosition === 'bottom' ? 'bg-white text-black border-white' : 'bg-hypr-surface0 text-hypr-subtext border-hypr-surface1 hover:border-hypr-text'}">

                            </button>

                    <div class="flex flex-col gap-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-hypr-subtext opacity-70">General Appearance</span>
                        <div class="flex flex-col gap-1.5">
                            <div class="flex justify-between text-xs text-hypr-subtext">
                                <span>Border Thickness</span>
                                <span id="val-border">${window.hyprConfig.borderWidth}px</span>

                            <input type="range" min="0" max="8" value="${window.hyprConfig.borderWidth}" class="accent-white cursor-pointer" oninput="updateHyprConfig('borderWidth', this.value); document.getElementById('val-border').textContent=this.value+'px';">
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <div class="flex justify-between text-xs text-hypr-subtext">
                                <span>Window Corner Radius</span>
                                <span id="val-radius">${window.hyprConfig.borderRadius}px</span>
                            </div>
                            <input type="range" min="0" max="24" value="${window.hyprConfig.borderRadius}" class="accent-white cursor-pointer" oninput="updateHyprConfig('borderRadius', this.value); document.getElementById('val-radius').textContent=this.value+'px';">
                        </div>
                    </div>

                    <div class="flex flex-col gap-3">
                        <span class="text-xs font-bold uppercase tracking-wider text-hypr-subtext opacity-70">Color Palette & Wallpaper</span>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex items-center justify-between p-2 rounded-lg bg-hypr-surface0 border border-hypr-surface1">
                                <span class="text-xs text-hypr-subtext">Wallpaper</span>
                                <input type="color" value="${window.hyprConfig.wallpaper}" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent" onchange="updateHyprConfig('wallpaper', this.value)">
                            </div>
                            <div class="flex items-center justify-between p-2 rounded-lg bg-hypr-surface0 border border-hypr-surface1">
                                <span class="text-xs text-hypr-subtext">Accent Border</span>
                                <input type="color" value="${window.hyprConfig.accentColor}" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent" onchange="updateHyprConfig('accentColor', this.value)">
                            </div>
                            <div class="flex items-center justify-between p-2 rounded-lg bg-hypr-surface0 border border-hypr-surface1">
                                <span class="text-xs text-hypr-subtext">Window Base</span>
                                <input type="color" value="${window.hyprConfig.baseColor}" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent" onchange="updateHyprConfig('baseColor', this.value)">
                            </div>
                            <div class="flex items-center justify-between p-2 rounded-lg bg-hypr-surface0 border border-hypr-surface1">
                                <span class="text-xs text-hypr-subtext">Surface Panels</span>
                                <input type="color" value="${window.hyprConfig.surfaceColor}" class="w-7 h-7 rounded border-0 cursor-pointer bg-transparent" onchange="updateHyprConfig('surfaceColor', this.value)">

            windows[winId] = { element: winDiv, isOpen: true, isMaximized: false, isSnapped: false, isFloating: true, config: {maxizable: false}, workspace: currentWorkspace };
            windowOrder.push(winId);
            makeDraggable(winDiv);
            winDiv.addEventListener("mousedown", () => bringToFront(winId));
            bringToFront(winId);
        };

        window.toggleFloating = function(winId) {
            const w = windows[winId];
            if (!w) return;
            w.isFloating = !w.isFloating;
            window.tileWindows();
        }

        window.openWindow = function(winId) {
            const w = windows[winId];
            if (!w) return;
            w.isMinimized = false;
            w.element.classList.remove('minimized');
            bringToFront(winId);
            window.tileWindows();
        }

        function closeApp(winId) {
            if (windows[winId]) { 
                windows[winId].element.remove(); 
                delete windows[winId]; 
                windowOrder = windowOrder.filter(id => id !== winId); 
            }
            const remaining = Object.keys(windows).filter(id => windows[id].workspace === currentWorkspace);
            if(remaining.length > 0) bringToFront(remaining[remaining.length - 1]);
            else document.getElementById('active-window-title').textContent = '~';
            window.tileWindows();
        }

        function bringToFront(winId) {
            if (windows[winId]) {
                currentZIndex++;
                windows[winId].element.style.zIndex = currentZIndex;
                Object.values(windows).forEach(w => w.element.classList.remove('active-window'));
                windows[winId].element.classList.add('active-window');
                document.getElementById('active-window-title').textContent = windows[winId].title;
                activeWindowId = winId;
            }
        }

        function maximizeWindow(winId, forceMaximize = false) {
            const w = windows[winId];
            if (!w) return;
            const el = w.element;
            
            if(w.isMaximized && !forceMaximize) {
                w.isMaximized = false;
                el.style.width = w.preSnapWidth + 'px';
                el.style.height = w.preSnapHeight + 'px';
                el.style.top = w.preSnapTop + 'px';
                el.style.left = w.preSnapLeft + 'px';
            } else {
                if(!w.isSnapped && !w.isMaximized) {
                    w.preSnapWidth = el.offsetWidth; w.preSnapHeight = el.offsetHeight;
                    w.preSnapTop = el.offsetTop; w.preSnapLeft = el.offsetLeft;
                }
                w.isMaximized = true; w.isSnapped = false; w.isFloating = true;
                el.style.top = window.getTopOffset() + 'px';
                el.style.left = GAP + 'px';
                el.style.width = (getScrW() - GAP * 2) + 'px';
                el.style.height = (getScrH() - WAYBAR_HEIGHT - GAP * 2) + 'px';
            }
            bringToFront(winId);
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = element.querySelector('.window-header');
            const winId = element.id;
            
            let snapPreview = document.getElementById('snap-preview');
            if (!snapPreview) {
                snapPreview = document.createElement('div');
                snapPreview.id = 'snap-preview';
                snapPreview.className = 'absolute bg-hypr-accent/20 border-2 border-hypr-accent hidden z-40 pointer-events-none rounded-xl transition-all duration-200';
                document.getElementById('windows-container').appendChild(snapPreview);
            }
            
            header.onmousedown = dragMouseDown;
            
            let targetSwapId = null;
            let currentSnap = '';
            let originalIsFloating = false;

            function dragMouseDown(e) {
                if(e.target.closest('button')) return;
                const scale = window.hyprConfig.scale;
                const w = windows[winId];
                
                if(w && (w.isMaximized || w.isSnapped)) {
                    const rect = element.getBoundingClientRect();
                    const ratio = (e.clientX - rect.left) / rect.width;
                    w.isMaximized = false; w.isSnapped = false;
                    element.style.width = w.preSnapWidth + 'px';
                    element.style.height = w.preSnapHeight + 'px';
                    element.style.left = ((e.clientX / scale) - (w.preSnapWidth * ratio)) + 'px';
                    element.style.top = ((e.clientY / scale) - 15) + 'px';
                }
                
                originalIsFloating = w ? w.isFloating : false;
                if (w) w.isFloating = true; 

                element.classList.add('dragging');
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                const glass = element.querySelector('.iframe-glass');
                if(glass) glass.classList.remove('hidden');
                bringToFront(winId);
            }

            function elementDrag(e) {
                e.preventDefault();
                const scale = window.hyprConfig.scale;
                pos1 = (pos3 - e.clientX) / scale; 
                pos2 = (pos4 - e.clientY) / scale;
                pos3 = e.clientX; 
                pos4 = e.clientY;
                
                let newTop = element.offsetTop - pos2;
                let minTop = window.hyprConfig.waybarPosition === 'top' ? WAYBAR_HEIGHT : 0;
                if(newTop < minTop) newTop = minTop;
                
                element.style.top = newTop + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";

                targetSwapId = null;
                currentSnap = '';
                snapPreview.classList.add('hidden');
                
                if (window.hyprConfig.autoTiling && !originalIsFloating) {
                    const mouseX = e.clientX;
                    const mouseY = e.clientY;
                    const tiledIds = windowOrder.filter(id => id !== winId && windows[id] && !windows[id].isFloating && !windows[id].isMinimized && windows[id].workspace === currentWorkspace);
                    
                    for (let id of tiledIds) {
                        const targetEl = windows[id].element;
                        const rect = targetEl.getBoundingClientRect();
                        if (mouseX > rect.left && mouseX < rect.right && mouseY > rect.top && mouseY < rect.bottom) {
                            targetSwapId = id;
                            snapPreview.classList.remove('hidden');
                            snapPreview.style.top = targetEl.offsetTop + 'px';
                            snapPreview.style.left = targetEl.offsetLeft + 'px';
                            snapPreview.style.width = targetEl.offsetWidth + 'px';
                            snapPreview.style.height = targetEl.offsetHeight + 'px';
                            break;
                        }
                    }
                } else if (!window.hyprConfig.autoTiling) {
                    const snapZone = 20;
                    let sLeft = e.clientX < snapZone;
                    let sRight = e.clientX > window.innerWidth - snapZone;
                    let sTop = e.clientY < snapZone;

                    if (sTop) currentSnap = 'top';
                    else if (sLeft) currentSnap = 'left';
                    else if (sRight) currentSnap = 'right';
                    
                    if (currentSnap) {
                        snapPreview.classList.remove('hidden');
                        const maxH = getScrH() - WAYBAR_HEIGHT - (GAP * 2);
                        snapPreview.style.top = window.getTopOffset() + 'px';
                        
                        if (currentSnap === 'top') {
                            snapPreview.style.width = (getScrW() - GAP * 2) + 'px';
                            snapPreview.style.height = maxH + 'px';
                            snapPreview.style.left = GAP + 'px';
                        } else {
                            const halfW = (getScrW() / 2) - (GAP * 1.5);
                            snapPreview.style.width = halfW + 'px';
                            snapPreview.style.height = maxH + 'px';
                            snapPreview.style.left = currentSnap === 'left' ? GAP + 'px' : (getScrW()/2 + GAP/2) + 'px';
                        }
                    }
                }
            }

            function closeDragElement() {
                document.onmouseup = null; document.onmousemove = null;
                element.classList.remove('dragging');
                snapPreview.classList.add('hidden');
                
                const glass = element.querySelector('.iframe-glass');
                if(glass) glass.classList.add('hidden');
                
                const w = windows[winId];
                if (!w) return;

                if (window.hyprConfig.autoTiling && !originalIsFloating) {
                    w.isFloating = false;
                    if (targetSwapId) {
                        const idx1 = windowOrder.indexOf(winId);
                        const idx2 = windowOrder.indexOf(targetSwapId);
                        if (idx1 !== -1 && idx2 !== -1) {
                            windowOrder[idx1] = targetSwapId;
                            windowOrder[idx2] = winId;
                        }
                    }
                    window.tileWindows();
                } else if (!window.hyprConfig.autoTiling && currentSnap) {
                    w.isFloating = true; 
                    if (!w.isMaximized && !w.isSnapped) {
                        w.preSnapWidth = element.offsetWidth; w.preSnapHeight = element.offsetHeight;
                        w.preSnapTop = element.offsetTop; w.preSnapLeft = element.offsetLeft;
                    }
                    
                    if (currentSnap === 'top') {
                        maximizeWindow(winId, true);
                    } else {
                        w.isSnapped = true; w.isMaximized = false;
                        const h = getScrH() - WAYBAR_HEIGHT - (GAP * 2);
                        const halfW = (getScrW() / 2) - (GAP * 1.5);
                        element.style.top = window.getTopOffset() + 'px';
                        element.style.height = h + 'px';
                        element.style.width = halfW + 'px';
                        element.style.left = currentSnap === 'left' ? GAP + 'px' : (getScrW()/2 + GAP/2) + 'px';
                    }
                } else {
                    w.isFloating = originalIsFloating;
                    if (!w.isFloating && window.hyprConfig.autoTiling) {
                        window.tileWindows();
                    }
                }
            }
        }
    </script>
</body>
