<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schriftliches Addieren — interaktiv</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'hand': ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Clean Dark Card */
        .clean-bg {
            background-color: #18181b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #27272a;
        }

        /* Custom Scrollbar for Erklärungen */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #52525b;
        }

        /* Text animation base classes */
        .anim-element {
            clip-path: inset(0 100% 0 0);
            display: inline-block;
            white-space: nowrap;
            opacity: 0;
        }

        .anim-element.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
            transition: clip-path 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anim-element.fast.revealed {
            transition: clip-path 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .anim-wrap {
            display: block;
        }

        /* Sync Highlight applied dynamically during animation step */
        .hl-text-active {
            background-color: rgba(59, 130, 246, 0.25); /* blue-500 tint */
            border-radius: 0.25rem;
        }

        /* Auto-Animation Highlights (Solid Backgrounds in Grid) */
        .highlight-col {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 0.5rem;
        }
        .highlight-carry {
            background-color: rgba(248, 113, 113, 0.15);
            border-radius: 0.5rem;
        }
        .highlight-cell-active {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem;
            transition: background-color 0.15s ease;
        }

        /* Operator Highlight (Summenstrich leuchtet bei = auf) */
        .highlight-border-active {
            border-bottom-color: rgba(96, 165, 250, 0.8) !important;
            transition: border-bottom-color 0.15s ease;
        }

        /* Mouse-Hover Highlights (Yellow Borders via inset box-shadow) */
        .hover-highlight-col {
            box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.4) !important; /* Tailwind yellow-500 (light) */
            border-radius: 0.5rem;
            transition: box-shadow 0.15s ease;
        }
        .hover-highlight-carry {
            box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.8) !important; /* Tailwind yellow-500 (strong) */
            border-radius: 0.5rem;
            transition: box-shadow 0.15s ease;
        }
        .hover-highlight-cell {
            box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.9) !important; /* Tailwind yellow-500 (strong) */
            border-radius: 0.5rem;
            transition: box-shadow 0.15s ease;
        }
    </style>
</head>
<body class="font-sans antialiased bg-zinc-950 text-zinc-200 min-h-screen flex justify-center items-center p-2 sm:p-4 selection:bg-blue-500/30">

    <div class="max-w-6xl w-full flex flex-col gap-4">

        <!-- Controls Header -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-wrap justify-between items-center z-50 sticky top-2 gap-2">
            <h1 class="font-bold text-base sm:text-lg text-white hidden md:block tracking-wide">Schriftliches Addieren</h1>
            <div class="flex gap-2 w-full md:w-auto justify-end items-center flex-grow">
                <button onclick="initProblem()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300">
                    Neue Zahlen
                </button>

                <div class="h-6 border-l border-zinc-700 mx-1"></div>

                <!-- AUTOSTART BUTTON -->
                <button id="btn-auto" onclick="toggleAutoplay()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 w-20 justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Auto-Play</span>
                </button>

                <div class="h-6 border-l border-zinc-700 mx-1"></div>

                <!-- ZURÜCK BUTTON -->
                <button id="btn-prev" onclick="prevStep()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 opacity-50 cursor-not-allowed" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span>Zurück</span>
                </button>

                <!-- WEITER/START BUTTON -->
                <button id="btn-next" onclick="nextStep()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition shadow-sm font-semibold text-sm flex items-center gap-2 w-28 justify-center">
                    <span>Start</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Two Panels Layout -->
        <div class="flex flex-col lg:flex-row gap-4 w-full h-[520px]">

            <!-- LEFT PANEL: Explanations -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-6 pt-4 overflow-y-auto custom-scrollbar font-hand text-xl leading-[40px] text-zinc-100 relative">
                <div class="sticky top-0 -ml-2 mb-2 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest bg-[#18181b]/95 w-fit px-2 py-1 rounded z-10 backdrop-blur-sm">
                    Erklärungen
                </div>
                <div id="explanations-container" class="pb-10"></div>
            </div>

            <!-- RIGHT PANEL: Calculations -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-6 pt-6 font-hand text-xl leading-[40px] text-zinc-100 relative overflow-hidden flex flex-col">
                <div class="absolute top-3 left-4 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest mt-1">
                    Rechnung
                </div>

                <div class="flex-grow flex items-center justify-center mt-2">
                    <div id="math-grid" class="font-hand text-4xl sm:text-5xl grid gap-x-1 sm:gap-x-2 relative font-semibold tracking-wider p-2">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentStep = -1;
        let steps = [];
        let isAnimating = false;
        let isAutoPlaying = false;
        let autoPlayTimeout = null;
        let num1, num2;
        let cols;

        const placeNames = ["Einer", "Zehner", "Hunderter", "Tausender", "Zehntausender", "Hunderttausender"];
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        window.onload = initProblem;

        // --- Mouse Hover Highlight Logic ---
        function enterCol(col) {
            document.getElementById(`col-${col}-r0`)?.classList.add('hover-highlight-col');
            document.getElementById(`col-${col}-r1`)?.classList.add('hover-highlight-col');

            // Nur highlighten, wenn tatsächlich eine Übertrags-Zahl drin steht
            let carrySpan = document.getElementById(`col-${col}-carry`);
            if (carrySpan && carrySpan.innerText.trim() !== '') {
                document.getElementById(`col-${col}-carry-wrap`)?.classList.add('hover-highlight-col');
            }

            document.getElementById(`col-${col}-res`)?.classList.add('hover-highlight-col');
        }
        function leaveCol(col) {
            document.getElementById(`col-${col}-r0`)?.classList.remove('hover-highlight-col');
            document.getElementById(`col-${col}-r1`)?.classList.remove('hover-highlight-col');
            document.getElementById(`col-${col}-carry-wrap`)?.classList.remove('hover-highlight-col');
            document.getElementById(`col-${col}-res`)?.classList.remove('hover-highlight-col');
        }
        function enterCarryWrap(col) {
            document.getElementById(`col-${col}-carry-wrap`)?.classList.add('hover-highlight-carry');
        }
        function leaveCarryWrap(col) {
            document.getElementById(`col-${col}-carry-wrap`)?.classList.remove('hover-highlight-carry');
        }
        function enterCell(col, rowStr) {
            document.getElementById(`col-${col}-${rowStr}`)?.classList.add('hover-highlight-cell');
        }
        function leaveCell(col, rowStr) {
            document.getElementById(`col-${col}-${rowStr}`)?.classList.remove('hover-highlight-cell');
        }
        function enterRow(rowIndex, length) {
            let rowStr = rowIndex === 0 ? 'r0' : 'r1';
            for(let i = cols - length; i < cols; i++) {
                document.getElementById(`col-${i}-${rowStr}`)?.classList.add('hover-highlight-cell');
            }
        }
        function leaveRow(rowIndex, length) {
            let rowStr = rowIndex === 0 ? 'r0' : 'r1';
            for(let i = cols - length; i < cols; i++) {
                document.getElementById(`col-${i}-${rowStr}`)?.classList.remove('hover-highlight-cell');
            }
        }

        // --- Autoplay Logic ---
        function toggleAutoplay() {
            isAutoPlaying = !isAutoPlaying;
            updateAutoButton();

            if (isAutoPlaying) {
                if (!isAnimating) {
                    if (currentStep >= steps.length) {
                        initProblem();
                        // Startet im initProblem() automatisch, wenn isAutoPlaying true bleibt
                        setTimeout(() => { if(isAutoPlaying) nextStep(true); }, 800);
                    } else {
                        nextStep(true);
                    }
                }
            } else {
                clearTimeout(autoPlayTimeout);
            }
        }

        function stopAutoplay() {
            isAutoPlaying = false;
            clearTimeout(autoPlayTimeout);
            updateAutoButton();
        }

        function updateAutoButton() {
            const btn = document.getElementById('btn-auto');
            if (isAutoPlaying) {
                btn.classList.add('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.remove('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Auto</span>
                `;
            } else {
                btn.classList.remove('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.add('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
                btn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Auto</span>
                `;
            }
        }


        // --- Initialization & Setup ---
        function initProblem() {
            if(isAnimating && !isAutoPlaying) return;

            // Wenn der Nutzer manuell neue Zahlen fordert, Auto ausmachen.
            // Nur nicht ausmachen, wenn Autoplay den Neustart fordert.
            if (!isAutoPlaying) stopAutoplay();

            num1 = Math.floor(Math.random() * 8999) + 100;
            num2 = Math.floor(Math.random() * 8999) + 100;

            const aStr = num1.toString();
            const bStr = num2.toString();
            cols = Math.max(aStr.length, bStr.length) + 1;

            let aArr = aStr.padStart(cols, ' ').split('');
            let bArr = bStr.padStart(cols - 1, ' ').split('');
            bArr.unshift('+');

            steps = [];
            let carry = 0;
            let stepIdx = 1;

            const wrapCellHTML = (text, col, rowStr, colorClass) =>
                `<span class="cursor-help border-b border-dashed border-zinc-600 hover:border-yellow-400 ${colorClass} transition-colors" onmouseenter="enterCell(${col}, '${rowStr}')" onmouseleave="leaveCell(${col}, '${rowStr}')">${text}</span>`;
            const wrapColHTML = (text, col, colorClass) =>
                `<span class="cursor-pointer border-b-2 border-dashed border-zinc-500 hover:border-yellow-400 ${colorClass} transition-colors" onmouseenter="enterCol(${col})" onmouseleave="leaveCol(${col})">${text}</span>`;
            const wrapCarryColHTML = (text, col, colorClass) =>
                `<span class="cursor-pointer border-b-2 border-dashed border-zinc-500 hover:border-yellow-400 ${colorClass} transition-colors" onmouseenter="enterCarryWrap(${col})" onmouseleave="leaveCarryWrap(${col})">${text}</span>`;

            // Build logical steps and texts
            for(let c = cols - 1; c > 0; c--) {
                let digitA = parseInt(aArr[c]) || 0;
                let digitB = parseInt(bArr[c] === ' ' || bArr[c] === '+' ? 0 : bArr[c]);
                let sum = digitA + digitB + carry;
                let resDigit = sum % 10;
                let nextCarry = Math.floor(sum / 10);

                let placeName = placeNames[(cols - 1) - c] || "nächste Stelle";

                let placeTitle = wrapColHTML(placeName, c, 'text-blue-300 hover:text-blue-200');
                let spanA = wrapCellHTML(digitA, c, 'r0', 'hover:text-white');
                let spanB = wrapCellHTML(digitB, c, 'r1', 'hover:text-white');
                let spanC = carry > 0 ? wrapCellHTML(carry, c, 'carry-wrap', 'text-red-400 hover:text-red-300') : '';
                let spanSum = wrapCellHTML(sum, c, 'res', 'font-bold text-blue-400 hover:text-blue-300');
                let spanRes = wrapCellHTML(resDigit, c, 'res', 'text-green-400 hover:text-green-300');

                // Segmented Equation for sequenced highlighting including Operators
                let expText = `<div class="mt-1 leading-relaxed text-zinc-300 whitespace-nowrap flex items-center">`;
                expText += `<span class="anim-element fast px-1.5 transition-colors duration-300" data-hl-clear="true" data-hl-col="${c}" data-hl-row="r0">${spanA}</span>`;
                expText += `<span class="anim-element fast px-1 text-zinc-500" data-hl-clear="true" data-hl-op="plus">+</span>`;
                expText += `<span class="anim-element fast px-1.5 transition-colors duration-300" data-hl-clear="true" data-hl-col="${c}" data-hl-row="r1">${spanB}</span>`;

                if(carry > 0) {
                    expText += `<span class="anim-element fast px-1 text-zinc-500" data-hl-clear="true" data-hl-op="plus">+</span>`;
                    expText += `<span class="anim-element fast px-1.5 transition-colors duration-300" data-hl-clear="true" data-hl-col="${c}" data-hl-row="carry-wrap">${spanC} <span class="text-sm text-zinc-500">(Ü)</span></span>`;
                }

                expText += `<span class="anim-element fast px-1 text-zinc-500" data-hl-clear="true" data-hl-op="eq" data-hl-col="${c}">=</span>`;
                expText += `<span class="anim-element fast px-1.5 transition-colors duration-300" data-hl-clear="true" data-hl-col="${c}" data-hl-row="col">${spanSum}</span>`;
                expText += `</div>`;

                // STEP A: Calculate
                steps.push({
                    type: 'calc_res',
                    col: c,
                    resDigit: resDigit,
                    expTitle: `<div class="anim-element anim-wrap font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Schritt ${stepIdx}: ${placeTitle}</div>`,
                    expText: expText,
                    expAction: `<div class="anim-element anim-wrap text-blue-300 mt-2">Schreibe ${spanRes} unten hin.</div>`
                });
                stepIdx++;

                // STEP B: The Carry (if necessary)
                if(nextCarry > 0) {
                    let spanNextC = wrapCellHTML(nextCarry, c - 1, 'carry-wrap', 'text-red-400 hover:text-red-300');
                    let carryTitle = wrapCarryColHTML("Übertrag", c - 1, 'text-red-400 hover:text-red-300');

                    steps.push({
                        type: 'calc_carry',
                        targetCarryCol: c - 1,
                        carryDigit: nextCarry,
                        expTitle: `<div class="anim-element anim-wrap font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Schritt ${stepIdx}: ${carryTitle}</div>`,
                        expText: `<div class="anim-element anim-wrap text-zinc-300 mt-1">Die ${spanSum} hat eine Zehnerstelle.</div>`,
                        expAction: `<div class="anim-element anim-wrap text-blue-300 mt-2">Schreibe ${spanNextC} als Übertrag (Ü)!</div>`
                    });
                    stepIdx++;
                }

                carry = nextCarry;
            }

            // Final Carry
            if(carry > 0) {
                let spanCarry = wrapCellHTML(carry, 0, 'carry-wrap', 'text-red-400');
                let spanRes = wrapCellHTML(carry, 0, 'res', 'text-green-400');
                let finalTitle = wrapCarryColHTML("Letzter Übertrag", 0, 'text-red-400');

                steps.push({
                    type: 'calc_final',
                    col: 0,
                    resDigit: carry,
                    expTitle: `<div class="anim-element anim-wrap font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Schritt ${stepIdx}: ${finalTitle}</div>`,
                    expText: `<div class="anim-element anim-wrap text-zinc-300 mt-1" data-hl-clear="true" data-hl-col="0" data-hl-row="carry-wrap">Wir haben noch einen Übertrag von ${spanCarry}.</div>`,
                    expAction: `<div class="anim-element anim-wrap text-blue-300 mt-2">Schreibe ${spanRes} direkt ins Ergebnis.</div>`
                });
                stepIdx++;
            }

            steps.push({
                type: 'done',
                expTitle: `<div class="anim-element anim-wrap font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Fertig! 🎉</div>`,
                expText: `<div class="anim-element anim-wrap text-zinc-300 mt-1">Das Ergebnis ist <span class="font-bold text-green-400">${num1 + num2}</span>.</div>`,
                expAction: `<div class="anim-element anim-wrap text-blue-300 mt-2">Sehr gut gemacht!</div>`
            });

            renderGrid(aArr, bArr);
            renderExplanations();

            currentStep = -1;
            updateButtons();
        }

        // --- Core UI Updates ---
        function updateButtons() {
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');
            const btnAuto = document.getElementById('btn-auto');

            if (currentStep <= 0) {
                btnPrev.disabled = true;
                btnPrev.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnPrev.disabled = false;
                btnPrev.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            if (currentStep >= steps.length) {
                btnNext.innerHTML = `<span>Neustart</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>`;
            } else if (currentStep === -1) {
                btnNext.innerHTML = `<span>Start</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            } else {
                btnNext.innerHTML = `<span>Weiter</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            }
        }

        function clearAllHighlights() {
            document.querySelectorAll('.highlight-col, .highlight-carry, .highlight-cell-active, .highlight-border-active').forEach(e => {
                e.classList.remove('highlight-col', 'highlight-carry', 'highlight-cell-active', 'highlight-border-active');
            });
            document.querySelectorAll('.hl-text-active').forEach(e => {
                e.classList.remove('hl-text-active');
            });
        }

        function fastForwardGrid(targetStep) {
            if (targetStep === 0) return;

            for (let i = 0; i < targetStep; i++) {
                let logicalStep = steps[i];
                if(logicalStep.type === 'calc_res' || logicalStep.type === 'calc_final') {
                    let resCell = document.getElementById(`col-${logicalStep.col}-res`);
                    resCell.innerText = logicalStep.resDigit;
                    resCell.classList.remove('opacity-0', 'translate-y-2');
                    resCell.classList.add('opacity-100', 'translate-y-0');
                } else if(logicalStep.type === 'calc_carry') {
                    let carryCell = document.getElementById(`col-${logicalStep.targetCarryCol}-carry`);
                    carryCell.innerText = logicalStep.carryDigit;
                    carryCell.classList.remove('opacity-0', 'translate-y-2');
                    carryCell.classList.add('opacity-100', 'translate-y-0');
                }
            }

            // Highlight the currently active column upon return
            let activeLogicalStep = steps[targetStep - 1];
            if(activeLogicalStep.type === 'calc_res' || activeLogicalStep.type === 'calc_final') {
                let c = activeLogicalStep.col;
                document.getElementById(`col-${c}-r0`)?.classList.add('highlight-col');
                document.getElementById(`col-${c}-r1`)?.classList.add('highlight-col');

                // Nur leere Felder ignorieren
                let carrySpan = document.getElementById(`col-${c}-carry`);
                if (carrySpan && carrySpan.innerText.trim() !== '') {
                    document.getElementById(`col-${c}-carry-wrap`)?.classList.add('highlight-col');
                }

                document.getElementById(`col-${c}-res`)?.classList.add('highlight-col');
            } else if(activeLogicalStep.type === 'calc_carry') {
                document.getElementById(`col-${activeLogicalStep.targetCarryCol}-carry-wrap`)?.classList.add('highlight-carry');
            }
        }

        // --- Step Navigation ---
        function prevStep() {
            if (isAutoPlaying) stopAutoplay();
            if (isAnimating || currentStep <= 0) return;

            let container = document.getElementById(`step-desc-${currentStep}`);
            container.classList.add('hidden');
            let elements = container.querySelectorAll('.anim-element');
            elements.forEach(el => el.classList.remove('revealed'));

            currentStep--;

            clearAllHighlights();
            for(let i=0; i<cols; i++) {
                let res = document.getElementById(`col-${i}-res`);
                if(res) { res.innerText = ''; res.classList.add('opacity-0', 'translate-y-2'); res.classList.remove('opacity-100', 'translate-y-0'); }
                let carry = document.getElementById(`col-${i}-carry`);
                if(carry) { carry.innerText = ''; carry.classList.add('opacity-0', 'translate-y-2'); carry.classList.remove('opacity-100', 'translate-y-0'); }
            }

            fastForwardGrid(currentStep);

            if (currentStep > 0) {
                document.getElementById(`step-desc-${currentStep}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                document.getElementById(`explanations-container`).scrollTo({top: 0, behavior: 'smooth'});
            }

            updateButtons();
        }

        function nextStep(fromAuto = false) {
            if (!fromAuto && isAutoPlaying) stopAutoplay();
            if (isAnimating) return;
            if (currentStep >= steps.length) {
                initProblem();
                return;
            }
            currentStep++;
            animateStep(currentStep);
        }

        async function animateStep(stepIndex) {
            isAnimating = true;
            document.getElementById('btn-next').disabled = true;
            document.getElementById('btn-prev').disabled = true;

            clearAllHighlights();

            const container = document.getElementById(`step-desc-${stepIndex}`);
            container.classList.remove('hidden');

            const elements = Array.from(container.querySelectorAll('.anim-element'));

            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                el.classList.add('revealed');

                // Clear specific highlights dynamically when drawing the next part
                if (el.dataset.hlClear === "true") {
                    document.querySelectorAll('.highlight-cell-active').forEach(e => e.classList.remove('highlight-cell-active'));
                    document.querySelectorAll('.highlight-border-active').forEach(e => e.classList.remove('highlight-border-active'));
                    document.querySelectorAll('.hl-text-active').forEach(e => e.classList.remove('hl-text-active'));
                }

                // Emphasize the current Operator
                if (el.dataset.hlOp === "plus") {
                    document.getElementById(`col-0-r1`)?.classList.add('highlight-cell-active');
                    el.classList.add('hl-text-active');
                } else if (el.dataset.hlOp === "eq") {
                    let colIdx = el.dataset.hlCol;
                    document.getElementById(`col-${colIdx}-carry-wrap`)?.classList.add('highlight-border-active');
                    el.classList.add('hl-text-active');
                }

                // Emphasize the current Number
                if (el.dataset.hlCol) {
                    if (!el.dataset.hlOp) el.classList.add('hl-text-active');

                    let colIdx = el.dataset.hlCol;
                    let rowId = el.dataset.hlRow;

                    if (rowId === 'col') {
                        document.getElementById(`col-${colIdx}-r0`)?.classList.add('highlight-col');
                        document.getElementById(`col-${colIdx}-r1`)?.classList.add('highlight-col');

                        let carrySpan = document.getElementById(`col-${colIdx}-carry`);
                        if (carrySpan && carrySpan.innerText.trim() !== '') {
                            document.getElementById(`col-${colIdx}-carry-wrap`)?.classList.add('highlight-col');
                        }

                        document.getElementById(`col-${colIdx}-res`)?.classList.add('highlight-col');
                    } else if (rowId) {
                        document.getElementById(`col-${colIdx}-${rowId}`)?.classList.add('highlight-cell-active');
                    }
                }

                // SPEED-DROSSELUNG FÜR AUTO-MODUS (1000ms = 1 Sekunde pro Highlight)
                let delay = isAutoPlaying ? 1000 : (el.classList.contains('fast') ? 300 : 400);
                await sleep(delay);
            }

            // Perform Math Grid final drops
            if(stepIndex > 0) {
                let logicalStep = steps[stepIndex - 1];

                if(logicalStep.type === 'calc_res' || logicalStep.type === 'calc_final') {
                    let c = logicalStep.col;
                    document.getElementById(`col-${c}-r0`)?.classList.add('highlight-col');
                    document.getElementById(`col-${c}-r1`)?.classList.add('highlight-col');

                    let carrySpan = document.getElementById(`col-${c}-carry`);
                    if (carrySpan && carrySpan.innerText.trim() !== '') {
                        document.getElementById(`col-${c}-carry-wrap`)?.classList.add('highlight-col');
                    }

                    document.getElementById(`col-${c}-res`)?.classList.add('highlight-col');

                    await sleep(isAutoPlaying ? 500 : 200);
                    let resCell = document.getElementById(`col-${c}-res`);
                    resCell.innerText = logicalStep.resDigit;
                    resCell.classList.remove('opacity-0', 'translate-y-2');
                    resCell.classList.add('opacity-100', 'translate-y-0');

                } else if(logicalStep.type === 'calc_carry') {
                    let tc = logicalStep.targetCarryCol;
                    document.getElementById(`col-${tc}-carry-wrap`)?.classList.add('highlight-carry');

                    await sleep(isAutoPlaying ? 500 : 200);
                    let carryCell = document.getElementById(`col-${tc}-carry`);
                    carryCell.innerText = logicalStep.carryDigit;
                    carryCell.classList.remove('opacity-0', 'translate-y-2');
                    carryCell.classList.add('opacity-100', 'translate-y-0');
                }
            }

            isAnimating = false;
            document.getElementById('btn-next').disabled = false;
            updateButtons();

            // AUTOMATISCH WEITERMACHEN WENN AUTOPLAY AKTIV IST
            if (isAutoPlaying) {
                if (currentStep < steps.length) {
                    autoPlayTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStep(true);
                    }, 1000); // 1 Sekunde Pause am Ende eines jeden kompletten Schrittes
                } else {
                    stopAutoplay();
                }
            }
        }

        // --- Render Helpers ---
        function renderGrid(aArr, bArr) {
            let grid = document.getElementById('math-grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${cols}, minmax(2.5rem, 3.5rem))`;

            for(let i = 0; i < cols; i++) {
                grid.innerHTML += `<div class="h-[40px] flex items-center justify-center transition-all duration-300" id="col-${i}-r0">${aArr[i] === ' ' ? '&nbsp;' : aArr[i]}</div>`;
            }
            for(let i = 0; i < cols; i++) {
                let content = bArr[i] === ' ' ? '&nbsp;' : bArr[i];
                let color = content === '+' ? 'text-blue-400' : 'text-zinc-100';
                grid.innerHTML += `<div class="h-[40px] flex items-center justify-center transition-all duration-300 ${color}" id="col-${i}-r1">${content}</div>`;
            }
            for(let i = 0; i < cols; i++) {
                grid.innerHTML += `
                    <div class="h-[40px] flex items-end justify-center pb-1 border-b-[3px] border-zinc-200/50 transition-all duration-300" id="col-${i}-carry-wrap">
                        <span class="text-xl sm:text-2xl text-red-400 font-bold opacity-0 transition-all duration-500 transform translate-y-2" id="col-${i}-carry"></span>
                    </div>`;
            }
            for(let i = 0; i < cols; i++) {
                grid.innerHTML += `<div class="h-[40px] flex items-center justify-center text-green-400 opacity-0 transition-all duration-500 transform translate-y-2 font-bold" id="col-${i}-res"></div>`;
            }
        }

        function renderExplanations() {
            const container = document.getElementById('explanations-container');
            container.innerHTML = '';

            let len1 = num1.toString().length;
            let len2 = num2.toString().length;

            let spanNum1Row = `<span class="cursor-help border-b border-dashed border-zinc-600 font-bold hover:text-white transition-colors" onmouseenter="enterRow(0, ${len1})" onmouseleave="leaveRow(0, ${len1})">${num1}</span>`;
            let spanNum2Row = `<span class="cursor-help border-b border-dashed border-zinc-600 font-bold hover:text-white transition-colors" onmouseenter="enterRow(1, ${len2})" onmouseleave="leaveRow(1, ${len2})">${num2}</span>`;

            container.innerHTML += `
                <div class="step-container hidden mb-6" id="step-desc-0">
                    <div class="anim-element anim-wrap font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Aufgabe</div>
                    <div class="anim-element anim-wrap text-blue-300 mt-1">Addiere ${spanNum1Row} und ${spanNum2Row}.</div>
                    <div class="anim-element anim-wrap text-zinc-400 mt-2">Wir beginnen immer ganz rechts! 👉</div>
                </div>
            `;

            steps.forEach((step, index) => {
                let stepId = index + 1;
                container.innerHTML += `
                    <div class="step-container hidden mb-6" id="step-desc-${stepId}">
                        ${step.expTitle}
                        ${step.expText}
                        ${step.expAction}
                    </div>
                `;
            });
        }
    </script>
