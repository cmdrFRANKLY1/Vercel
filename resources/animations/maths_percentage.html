<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prozentrechnung — interaktiv</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'hand': ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        .clean-bg {
            background-color: #18181b; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #27272a;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #3f3f46; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #52525b; 
        }

        .anim-element {
            clip-path: inset(0 100% 0 0);
            display: inline-block;
            white-space: nowrap;
            opacity: 0;
        }
        .anim-element.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
            transition: clip-path 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anim-element.fast.revealed {
            transition: clip-path 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anim-wrap {
            display: block;
        }
        
        .hl-text-active {
            background-color: rgba(59, 130, 246, 0.25); 
            border-radius: 0.25rem;
        }

        .highlight-cell-active {
            background-color: rgba(255, 255, 255, 0.15); 
            border-radius: 0.5rem;
            transition: background-color 0.15s ease;
        }

        .hover-highlight-cell {
            box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.9) !important; 
            border-radius: 0.5rem;
            transition: box-shadow 0.15s ease;
        }
    </style>
</head>
<body class="font-sans antialiased bg-zinc-950 text-zinc-200 min-h-screen flex justify-center items-center p-2 sm:p-4 selection:bg-blue-500/30">

    <div class="max-w-6xl w-full flex flex-col gap-4"> 

        <!-- Controls Header -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-wrap justify-between items-center z-50 sticky top-2 gap-2">
            <h1 class="font-bold text-base sm:text-lg text-white hidden md:block tracking-wide">Prozentrechnung — interaktiv</h1>
            <div class="flex gap-2 w-full md:w-auto justify-end items-center flex-grow">
                <button id="btn-new" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300">
                    Neue Aufgabe
                </button>
                
                <div class="h-6 border-l border-zinc-700 mx-1"></div>
                
                <button id="btn-auto" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 w-20 justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Auto</span>
                </button>

                <div class="h-6 border-l border-zinc-700 mx-1"></div>
                
                <button id="btn-prev" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 opacity-50 cursor-not-allowed" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span>Zurück</span>
                </button>
                
                <button id="btn-next" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition shadow-sm font-semibold text-sm flex items-center gap-2 w-28 justify-center">
                    <span>Start</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Two Panels Layout -->
        <div class="flex flex-col lg:flex-row gap-4 w-full h-[520px]">

            <!-- LEFT PANEL: Explanations -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-6 pt-4 overflow-y-auto custom-scrollbar font-hand text-xl leading-[40px] text-zinc-100 relative">
                <div class="sticky top-0 -ml-2 mb-2 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest bg-[#18181b]/95 w-fit px-2 py-1 rounded z-10 backdrop-blur-sm">
                    Schritt-für-Schritt Erklärung
                </div>
                <div id="explanations-container" class="pb-10"></div>
            </div>

            <!-- RIGHT PANEL: Visual Card / Cheat Sheet -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-4 sm:p-6 pt-6 font-sans text-base text-zinc-100 relative overflow-y-auto custom-scrollbar flex flex-col">
                <div class="absolute top-3 left-4 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest mt-1">
                    Formel-Übersicht & Werte
                </div>
                
                <div class="flex-grow flex items-center justify-center mt-6 w-full">
                    <div class="relative w-full max-w-md p-4 bg-zinc-900/80 border border-zinc-800 rounded-xl shadow-inner flex flex-col gap-3 font-mono text-sm">
                        
                        <div id="row-gw" class="flex justify-between items-center border-b border-zinc-800 pb-2 transition-colors duration-300 p-1.5 rounded-lg">
                            <span class="text-zinc-400">Grundwert (G):</span>
                            <span id="card-gw" class="font-bold text-white transition-all duration-300 opacity-0 transform translate-y-2">--</span>
                        </div>
                        <div id="row-ps" class="flex justify-between items-center border-b border-zinc-800 pb-2 transition-colors duration-300 p-1.5 rounded-lg">
                            <span class="text-zinc-400">Prozentsatz (p%):</span>
                            <span id="card-ps" class="font-bold text-blue-400 transition-all duration-300 opacity-0 transform translate-y-2">--</span>
                        </div>
                        <div id="row-pw" class="flex justify-between items-center pb-1 transition-colors duration-300 p-1.5 rounded-lg">
                            <span class="text-zinc-400">Prozentwert (W):</span>
                            <span id="card-pw" class="font-bold text-green-400 transition-all duration-300 opacity-0 transform translate-y-2">--</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentStep = -1;
        let steps = [];
        let isAnimating = false;
        let isAutoPlaying = false;
        let autoPlayTimeout = null;
        
        let grundwert, prozentsatz, prozentwert, itemName;
        
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        document.addEventListener('DOMContentLoaded', () => {
            const btnNew = document.getElementById('btn-new');
            const btnAuto = document.getElementById('btn-auto');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (btnNew) btnNew.addEventListener('click', initProblem);
            if (btnAuto) btnAuto.addEventListener('click', toggleAutoplay);
            if (btnPrev) btnPrev.addEventListener('click', prevStep);
            if (btnNext) btnNext.addEventListener('click', nextStep);

            initProblem();
        });

        function enter(ids, isAnim = false) {
            let cls = isAnim ? 'highlight-cell-active' : 'hover-highlight-cell';
            if (ids) {
                ids.split(',').forEach(id => {
                    let el = document.getElementById(id);
                    if (el) {
                        el.classList.add(cls);
                        let inner = el.querySelector('span[id^="card-"]');
                        if (inner) inner.classList.add(cls);
                    }
                });
            }
        }

        function leave(ids, isAnim = false) {
            let cls = isAnim ? 'highlight-cell-active' : 'hover-highlight-cell';
            if (ids) {
                ids.split(',').forEach(id => {
                    let el = document.getElementById(id);
                    if (el) {
                        el.classList.remove(cls);
                        let inner = el.querySelector('span[id^="card-"]');
                        if (inner) inner.classList.remove(cls);
                    }
                });
            }
        }

        function toggleAutoplay() {
            isAutoPlaying = !isAutoPlaying;
            updateAutoButton();
            
            if (isAutoPlaying) {
                if (!isAnimating) {
                    if (currentStep >= steps.length - 1) {
                        initProblem(); 
                        setTimeout(() => { if(isAutoPlaying) nextStep(true); }, 800);
                    } else {
                        nextStep(true);
                    }
                }
            } else {
                clearTimeout(autoPlayTimeout);
            }
        }

        function stopAutoplay() {
            isAutoPlaying = false;
            clearTimeout(autoPlayTimeout);
            updateAutoButton();
        }

        function updateAutoButton() {
            const btn = document.getElementById('btn-auto');
            if (!btn) return;
            if (isAutoPlaying) {
                btn.classList.add('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.remove('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
            } else {
                btn.classList.remove('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.add('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
            }
        }

        function initProblem() {
            if (isAnimating && !isAutoPlaying) return;
            if (!isAutoPlaying) stopAutoplay(); 

            const items = [
                { name: "Sneakers", price: 120 },
                { name: "Fahrrad", price: 400 },
                { name: "Videospiel", price: 60 },
                { name: "Pullover", price: 80 }
            ];
            let selected = items[Math.floor(Math.random() * items.length)];
            grundwert = selected.price;
            
            const percents = [10, 15, 20, 25, 50];
            prozentsatz = percents[Math.floor(Math.random() * percents.length)];
            
            prozentwert = (grundwert * prozentsatz) / 100;
            itemName = selected.name;

            steps = [];
            let stepId = 1;

            const TEXT = (text, ids, colorClass, animClass = "fast", clear = true) =>
                `<span class="anim-element ${animClass} px-1 my-0.5 transition-colors duration-300 inline-block" data-hl-clear="${clear}" data-hl-ids="${ids}">
                    <span class="cursor-help border-b border-dashed border-zinc-600 hover:border-yellow-400 ${colorClass} transition-colors" onmouseenter="enter('${ids}')" onmouseleave="leave('${ids}')">${text}</span>
                </span>`;
            const PLAIN = (text, animClass = "fast", clear = true) =>
                `<span class="anim-element ${animClass} px-1 my-0.5 text-zinc-400 inline-block" data-hl-clear="${clear}">${text}</span>`;

            steps.push({
                id: 0,
                html: `<div class="step-container hidden mb-6" id="step-desc-0">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Aufgabe</div>
                          <div class="mt-1 leading-relaxed whitespace-nowrap flex flex-wrap items-center">
                              ${PLAIN("Ein", "slow")} ${TEXT(itemName, "row-gw", 'text-white font-bold', 'slow')}
                              ${PLAIN("kostet regulär", "slow")} ${TEXT(grundwert + " €", "row-gw", 'text-white font-bold', 'slow')}.
                          </div>
                          <div class="mt-1 leading-relaxed whitespace-nowrap flex flex-wrap items-center">
                              ${PLAIN("Es gibt", "slow")} ${TEXT(prozentsatz + "%", "row-ps", 'text-blue-400 font-bold', 'slow')}
                              ${PLAIN("Rabatt. Wie viel Euro sparst du?", "slow")}
                          </div>
                      </div>`
            });

            steps.push({
                id: stepId,
                targetCardId: "row-gw",
                cardVal: grundwert + " €",
                html: `<div class="step-container hidden mb-6" id="step-desc-${stepId}">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">1. Der Grundwert (G)</div>
                          <div class="mt-1 leading-relaxed flex flex-wrap items-center">
                              ${PLAIN("Das Ganze (100%) ist der originale Preis des Artikels (")} ${TEXT("Grundwert G", "row-gw", 'text-white font-bold')} ${PLAIN(").")}
                          </div>
                          <div class="mt-2 text-blue-300 flex items-center">
                              ${PLAIN("Grundwert G =")} ${TEXT(grundwert + " €", "row-gw", 'text-white font-bold')}
                          </div>
                      </div>`
            });
            stepId++;

            steps.push({
                id: stepId,
                targetCardId: "row-ps",
                cardVal: prozentsatz + "%",
                html: `<div class="step-container hidden mb-6" id="step-desc-${stepId}">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">2. Der Prozentsatz (p%)</div>
                          <div class="mt-1 leading-relaxed flex flex-wrap items-center">
                              ${PLAIN("Der Prozentsatz (")} ${TEXT("p%", "row-ps", 'text-blue-400 font-bold')} ${PLAIN(") zeigt dir den Rabatt-Anteil.")}
                          </div>
                          <div class="mt-2 text-blue-300 flex items-center">
                              ${PLAIN("Prozentsatz p% =")} ${TEXT(prozentsatz + "%", "row-ps", 'text-blue-400 font-bold')}
                          </div>
                      </div>`
            });
            stepId++;

            steps.push({
                id: stepId,
                targetCardId: "row-pw",
                cardVal: prozentwert + " €",
                html: `<div class="step-container hidden mb-6" id="step-desc-${stepId}">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">3. Berechnen (Prozentwert W)</div>
                          <div class="mt-1 leading-relaxed flex flex-wrap items-center">
                              ${PLAIN("Nimm den")} ${TEXT("Grundwert (G)", "row-gw", 'text-white')} 
                              ${PLAIN(", teile ihn durch 100 und mal den")} ${TEXT("Prozentsatz (p%)", "row-ps", 'text-blue-400')} ${PLAIN(":")}
                          </div>
                          <div class="mt-1 text-zinc-300">
                              (${TEXT(grundwert, "row-gw", 'text-white')} ÷ 100) × ${TEXT(prozentsatz, "row-ps", 'text-blue-400')}
                          </div>
                          <div class="mt-2 text-blue-300 flex items-center">
                              ${PLAIN("Prozentwert W =")} ${TEXT(prozentwert + " €", "row-pw", 'text-green-400 font-bold')}
                          </div>
                      </div>`
            });
            stepId++;

            steps.push({
                id: stepId,
                html: `<div class="step-container hidden mb-6" id="step-desc-${stepId}">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Fertig! 🎉</div>
                          <div class="mt-1 leading-relaxed flex flex-wrap items-center">
                              ${PLAIN("Du sparst genau")} 
                              ${TEXT(prozentwert + " €", "row-pw", 'text-green-400 font-bold px-1')} 
                              ${PLAIN("beim Kauf!")}
                          </div>
                      </div>`
            });

            renderCard();
            renderExplanations();
            
            currentStep = 0; 
            resetCardState(0); 
            
            const firstStepContainer = document.getElementById('step-desc-0');
            if (firstStepContainer) {
                firstStepContainer.classList.remove('hidden');
                firstStepContainer.querySelectorAll('.anim-element').forEach(el => el.classList.add('revealed'));
            }
            
            updateButtons();
        }

        function renderCard() {
            const cardGw = document.getElementById('card-gw');
            const cardPs = document.getElementById('card-ps');
            const cardPw = document.getElementById('card-pw');
            if (cardGw) cardGw.innerText = grundwert + " €";
            if (cardPs) cardPs.innerText = prozentsatz + "%";
            if (cardPw) cardPw.innerText = prozentwert + " €";
        }

        function renderExplanations() {
            const container = document.getElementById('explanations-container');
            if (!container) return;
            container.innerHTML = '';
            steps.forEach(step => {
                container.innerHTML += step.html;
            });
        }

        function updateButtons() {
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');
            if (!btnNext || !btnPrev) return;
            
            if (currentStep <= 0) {
                btnPrev.disabled = true;
                btnPrev.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnPrev.disabled = false;
                btnPrev.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            if (currentStep >= steps.length - 1) {
                btnNext.innerHTML = '<span>Neustart</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>';
            } else {
                btnNext.innerHTML = '<span>Weiter</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>';
            }
        }

        function resetCardState(targetStepIndex) {
            const cardIds = ["row-gw", "row-ps", "row-pw"];
            
            let visibleCount = 0;
            if (targetStepIndex >= 1) visibleCount = 1; 
            if (targetStepIndex >= 2) visibleCount = 2; 
            if (targetStepIndex >= 3) visibleCount = 3; 

            cardIds.forEach((id, idx) => {
                let el = document.getElementById(id);
                if (el) {
                    let valEl = el.querySelector('span[id^="card-"]');
                    if (valEl) {
                        if (idx < visibleCount) {
                            valEl.classList.remove('opacity-0', 'translate-y-2');
                        } else {
                            valEl.classList.add('opacity-0', 'translate-y-2');
                        }
                    }
                }
            });
        }

        function prevStep() {
            if (isAutoPlaying) stopAutoplay();
            if (isAnimating || currentStep <= 0) return;

            let prevStepObj = steps[currentStep];
            if (prevStepObj) {
                let container = document.getElementById(`step-desc-${prevStepObj.id}`);
                if (container) {
                    container.classList.add('hidden');
                    container.querySelectorAll('.anim-element').forEach(el => el.classList.remove('revealed'));
                }
            }
            
            currentStep--;
            
            document.querySelectorAll('.highlight-cell-active, .hl-text-active').forEach(e => {
                e.classList.remove('highlight-cell-active', 'hl-text-active');
            });
            
            resetCardState(currentStep);
            
            if (currentStep > 0) {
                let currStepObj = steps[currentStep];
                if (currStepObj) {
                    document.getElementById(`step-desc-${currStepObj.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            } else {
                document.getElementById(`explanations-container`)?.scrollTo({top: 0, behavior: 'smooth'});
            }

            updateButtons();
        }

        function nextStep(fromAuto = false) {
            if (!fromAuto && isAutoPlaying) stopAutoplay();
            if (isAnimating) return;
            if (currentStep >= steps.length - 1) {
                initProblem();
                return;
            }
            currentStep++;
            animateStep(currentStep);
        }

        async function animateStep(stepIndex) {
            isAnimating = true;
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');
            if (btnNext) btnNext.disabled = true;
            if (btnPrev) btnPrev.disabled = true;
            
            document.querySelectorAll('.highlight-cell-active, .hl-text-active').forEach(e => {
                e.classList.remove('highlight-cell-active', 'hl-text-active');
            });

            let logicalStepId = steps[stepIndex].id;
            const container = document.getElementById(`step-desc-${logicalStepId}`);
            if (container) {
                container.classList.remove('hidden');
                
                const elements = Array.from(container.querySelectorAll('.anim-element'));
                
                for (let i = 0; i < elements.length; i++) {
                    const el = elements[i];
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    el.classList.add('revealed');
                    
                    if (el.dataset.hlClear === "true") {
                        document.querySelectorAll('.highlight-cell-active').forEach(e => e.classList.remove('highlight-cell-active'));
                        document.querySelectorAll('.hl-text-active').forEach(e => e.classList.remove('hl-text-active'));
                    }
                    
                    if (el.dataset.hlIds) {
                        el.classList.add('hl-text-active');
                        enter(el.dataset.hlIds, true);
                    }

                    let delay = isAutoPlaying ? 1000 : (el.classList.contains('fast') ? 300 : 400);
                    await sleep(delay); 
                }
            }

            let stepObj = steps[stepIndex];
            if (stepObj && stepObj.targetCardId) {
                let cardRow = document.getElementById(stepObj.targetCardId);
                if (cardRow) {
                    let cardEl = cardRow.querySelector('span[id^="card-"]');
                    if (cardEl) {
                        cardEl.classList.remove('opacity-0', 'translate-y-2');
                    }
                    cardRow.classList.add('highlight-cell-active');
                    await sleep(400);
                    cardRow.classList.remove('highlight-cell-active');
                }
            }

            resetCardState(stepIndex);
            
            await sleep(isAutoPlaying ? 500 : 200);

            isAnimating = false;
            if (btnNext) btnNext.disabled = false;
            updateButtons();
            
            if (isAutoPlaying) {
                if (currentStep < steps.length - 1) {
                    autoPlayTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStep(true);
                    }, 1000); 
                } else {
                    stopAutoplay();
                }
            }
        }
    </script>
</body>
</html>
