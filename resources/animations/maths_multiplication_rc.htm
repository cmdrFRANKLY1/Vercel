<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schriftliches Multiplizieren — interaktiv</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'hand': ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Clean Dark Card */
        .clean-bg {
            background-color: #18181b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #27272a;
        }

        /* Custom Scrollbar for Erklärungen */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #3f3f46;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #52525b;
        }

        /* Text animation base classes */
        .anim-element {
            clip-path: inset(0 100% 0 0);
            display: inline-block;
            white-space: nowrap;
            opacity: 0;
        }
        .anim-element.revealed {
            opacity: 1;
            clip-path: inset(0 0 0 0);
            transition: clip-path 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anim-element.fast.revealed {
            transition: clip-path 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .anim-wrap {
            display: block;
        }

        /* Sync Highlight applied dynamically during animation step */
        .hl-text-active {
            background-color: rgba(59, 130, 246, 0.25); /* blue-500 tint */
            border-radius: 0.25rem;
        }

        /* Auto-Animation Highlights (Solid Backgrounds in Grid) */
        .highlight-cell-active {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem;
            transition: background-color 0.15s ease;
        }

        /* Mouse-Hover Highlights (Yellow Borders via inset box-shadow) */
        .hover-highlight-cell {
            box-shadow: inset 0 0 0 2px rgba(234, 179, 8, 0.9) !important;
            border-radius: 0.5rem;
            transition: box-shadow 0.15s ease;
        }
    </style>
</head>
<body class="font-sans antialiased bg-zinc-950 text-zinc-200 min-h-screen flex justify-center items-center p-2 sm:p-4 selection:bg-blue-500/30">

    <div class="max-w-6xl w-full flex flex-col gap-4">

        <!-- Controls Header -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-wrap justify-between items-center z-50 sticky top-2 gap-2">
            <h1 class="font-bold text-base sm:text-lg text-white hidden md:block tracking-wide">Schriftliches Multiplizieren</h1>
            <div class="flex gap-2 w-full md:w-auto justify-end items-center flex-grow">
                <button onclick="initProblem()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300">
                    Neue Zahlen
                </button>

                <div class="h-6 border-l border-zinc-700 mx-1"></div>

                <!-- AUTOSTART BUTTON -->
                <button id="btn-auto" onclick="toggleAutoplay()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 w-20 justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Auto</span>
                </button>

                <div class="h-6 border-l border-zinc-700 mx-1"></div>

                <!-- ZURÜCK BUTTON -->
                <button id="btn-prev" onclick="prevStep()" class="px-3 py-1.5 bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:text-white rounded-lg transition shadow-sm font-semibold text-sm text-zinc-300 flex items-center gap-1 opacity-50 cursor-not-allowed" disabled>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    <span>Zurück</span>
                </button>

                <!-- WEITER/START BUTTON -->
                <button id="btn-next" onclick="nextStep()" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg transition shadow-sm font-semibold text-sm flex items-center gap-2 w-28 justify-center">
                    <span>Start</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Two Panels Layout -->
        <div class="flex flex-col lg:flex-row gap-4 w-full h-[520px]">

            <!-- LEFT PANEL: Explanations -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-6 pt-4 overflow-y-auto custom-scrollbar font-hand text-xl leading-[40px] text-zinc-100 relative">
                <div class="sticky top-0 -ml-2 mb-2 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest bg-[#18181b]/95 w-fit px-2 py-1 rounded z-10 backdrop-blur-sm">
                    Erklärungen
                </div>
                <div id="explanations-container" class="pb-10"></div>
            </div>

            <!-- RIGHT PANEL: Calculations -->
            <div class="clean-bg w-full lg:w-1/2 rounded-xl h-full p-4 sm:p-6 pt-6 font-hand text-xl leading-[40px] text-zinc-100 relative overflow-y-auto custom-scrollbar flex flex-col">
                <div class="absolute top-3 left-4 text-xs font-sans font-bold text-zinc-500 uppercase tracking-widest mt-1">
                    Rechnung
                </div>

                <div class="flex-grow flex items-center justify-center mt-2 min-h-max w-full max-w-full overflow-x-auto">
                    <!-- RELATIVE WRAPPER FOR GRID + ARROW SVG -->
                    <div class="relative inline-block min-w-max p-2 mt-4">
                        <!-- SVG OVERLAY FOR DYNAMIC ARROWS -->
                        <svg id="arrow-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none z-50">
                            <defs>
                                <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                                    <polygon points="0 0, 8 3, 0 6" fill="rgba(234, 179, 8, 0.9)" />
                                </marker>
                            </defs>
                            <g id="arrow-paths"></g>
                        </svg>

                        <!-- THE ACTUAL MATH GRID -->
                        <div id="math-grid" class="font-hand text-4xl sm:text-5xl grid relative font-semibold tracking-wider">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentStep = -1;
        let steps = [];
        let gridData = [];
        let totalCols = 8;
        let isAnimating = false;
        let isAutoPlaying = false;
        let autoPlayTimeout = null;
        let num1, num2;

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        window.onload = initProblem;

        // --- Drawing Arrows Logic ---
        function drawArrows(pathStr) {
            if (!pathStr || pathStr.indexOf('->') === -1) return;
            let paths = '';
            let nodes = pathStr.split('->');
            for (let i = 0; i < nodes.length - 1; i++) {
                let el1 = document.getElementById(nodes[i]);
                let el2 = document.getElementById(nodes[i+1]);
                if (!el1 || !el2) continue;

                // Koordinaten relativ zum gemeinsamen Elterlement (.relative inline-block)
                let x1 = el1.offsetLeft + el1.offsetWidth / 2;
                let y1 = el1.offsetTop + el1.offsetHeight / 2;
                let x2 = el2.offsetLeft + el2.offsetWidth / 2;
                let y2 = el2.offsetTop + el2.offsetHeight / 2;

                let dx = x2 - x1;
                let dy = y2 - y1;
                let dist = Math.sqrt(dx*dx + dy*dy);

                // Verkürze den Pfeil, damit er die Zahl nicht überschreibt (Radius ca. 14px)
                let offset = 14;
                let angle = Math.atan2(dy, dx);

                if (dist > offset * 2) {
                    x1 += Math.cos(angle) * offset;
                    y1 += Math.sin(angle) * offset;
                    x2 -= Math.cos(angle) * (offset + 4); // Pfeilspitze braucht extra Platz

                    let ndx = x2 - x1;
                    let ndy = y2 - y1;
                    let nDist = Math.sqrt(ndx*ndx + ndy*ndy);

                    // Normale Vektoren für die Kurvenbiegung
                    let nx = -ndy / nDist;
                    let ny = ndx / nDist;

                    // Biege den Pfeil um 20px nach außen, damit er nicht durch Zahlen kreuzt
                    let cx = x1 + ndx/2 + nx * 20;
                    let cy = y1 + ndy/2 + ny * 20;

                    paths += `<path d="M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}" fill="none" stroke="rgba(234, 179, 8, 0.9)" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead)" />`;
                }
            }
            document.getElementById('arrow-paths').innerHTML = paths;
        }

        // --- Mouse Hover Highlight Logic ---
        function enter(ids, isAnim = false, arrowPath = "") {
            let cls = isAnim ? 'highlight-cell-active' : 'hover-highlight-cell';
            if (ids) {
                ids.split(',').forEach(id => {
                    let el = document.getElementById(id);
                    if (el && el.innerText.trim() !== '') el.classList.add(cls);
                });
            }
            if (!isAnim && arrowPath) {
                drawArrows(arrowPath);
            }
        }
        function leave(ids, isAnim = false) {
            let cls = isAnim ? 'highlight-cell-active' : 'hover-highlight-cell';
            if (ids) {
                ids.split(',').forEach(id => document.getElementById(id)?.classList.remove(cls));
            }
            if (!isAnim) {
                document.getElementById('arrow-paths').innerHTML = ''; // Clear arrows
            }
        }

        // --- Autoplay Logic ---
        function toggleAutoplay() {
            isAutoPlaying = !isAutoPlaying;
            updateAutoButton();

            if (isAutoPlaying) {
                if (!isAnimating) {
                    if (currentStep >= steps.length - 1) {
                        initProblem();
                        setTimeout(() => { if(isAutoPlaying) nextStep(true); }, 800);
                    } else {
                        nextStep(true);
                    }
                }
            } else {
                clearTimeout(autoPlayTimeout);
            }
        }

        function stopAutoplay() {
            isAutoPlaying = false;
            clearTimeout(autoPlayTimeout);
            updateAutoButton();
        }

        function updateAutoButton() {
            const btn = document.getElementById('btn-auto');
            if (isAutoPlaying) {
                btn.classList.add('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.remove('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
            } else {
                btn.classList.remove('bg-yellow-600/20', 'border-yellow-500', 'text-yellow-400');
                btn.classList.add('bg-zinc-800', 'border-zinc-700', 'text-zinc-300');
            }
        }

        // --- Initialization & Setup ---
        function initProblem() {
            if(isAnimating && !isAutoPlaying) return;
            if (!isAutoPlaying) stopAutoplay();
            document.getElementById('arrow-paths').innerHTML = '';

            num1 = Math.floor(Math.random() * 899) + 100; // 100 to 999
            num2 = Math.floor(Math.random() * 89) + 10;   // 10 to 99

            let n1Str = num1.toString();
            let n2Str = num2.toString();

            gridData = Array.from({length: 7}, () => Array(totalCols).fill(null));
            steps = [];
            let stepCounter = 1;

            gridData[0][1] = {val: n1Str[0], type: 'n1', showOnStep: 0};
            gridData[0][2] = {val: n1Str[1], type: 'n1', showOnStep: 0};
            gridData[0][3] = {val: n1Str[2], type: 'n1', showOnStep: 0};
            gridData[0][4] = {val: '·', type: 'op', showOnStep: 0};
            gridData[0][5] = {val: n2Str[0], type: 'n2', showOnStep: 0};
            gridData[0][6] = {val: n2Str[1], type: 'n2', showOnStep: 0};

            const TEXT = (text, ids, colorClass, animClass = "fast", clear = true, arrowPath = "") =>
                `<span class="anim-element ${animClass} px-1 my-0.5 transition-colors duration-300 inline-block" data-hl-clear="${clear}" data-hl-ids="${ids}">
                    <span class="cursor-help border-b border-dashed border-zinc-600 hover:border-yellow-400 ${colorClass} transition-colors" onmouseenter="enter('${ids}', false, '${arrowPath}')" onmouseleave="leave('${ids}')">${text}</span>
                </span>`;
            const PLAIN = (text, animClass = "fast", clear = true) =>
                `<span class="anim-element ${animClass} px-1 my-0.5 text-zinc-400 inline-block" data-hl-clear="${clear}">${text}</span>`;

            steps.push({
                id: 0,
                html: `<div class="step-container hidden mb-6" id="step-desc-0">
                          <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Aufgabe</div>
                          <div class="mt-1 leading-relaxed whitespace-nowrap flex flex-wrap items-center">
                              ${PLAIN("Multipliziere", "slow")}
                              ${TEXT(num1, "cell-0-1,cell-0-2,cell-0-3", 'text-white font-bold', 'slow')}
                              ${PLAIN("mit", "slow")}
                              ${TEXT(num2, "cell-0-5,cell-0-6", 'text-white font-bold', 'slow')}
                          </div>
                      </div>`
            });

            // --- PHASE 1: MULTIPLIKATION ---
            for(let j = 0; j < n2Str.length; j++) {
                let n2Digit = parseInt(n2Str[j]);
                let n2Col = 5 + j;
                let pRow = 2 + j;
                let carry = 0;
                let writeCol = n2Col;

                let introHtml = `
                    <div class="step-container hidden mb-4" id="step-desc-${stepCounter}">
                        <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100">Rechne mit Ziffer ${TEXT(n2Digit, `cell-0-${n2Col}`, 'text-blue-300')}</div>
                    </div>`;
                steps.push({ id: stepCounter, html: introHtml });
                stepCounter++;

                for(let i = n1Str.length - 1; i >= 0; i--) {
                    let n1Digit = parseInt(n1Str[i]);
                    let n1Col = 1 + i;
                    let prod = n1Digit * n2Digit + carry;
                    let resDigit = prod % 10;
                    let nextCarry = Math.floor(prod / 10);
                    let isLast = (i === 0);
                    let writeVal = isLast ? prod : resDigit;

                    let qId = `cell-0-${n2Col}`;
                    let pId = `cell-0-${n1Col}`;
                    let resIdStr = "";
                    let targetArrowId = "";

                    if(isLast) {
                       let str = writeVal.toString();
                       let ids = [];
                       for(let k = 0; k < str.length; k++) {
                           let col = writeCol - str.length + 1 + k;
                           gridData[pRow][col] = {val: str[k], type: 'partial', showOnStep: stepCounter};
                           ids.push(`cell-${pRow}-${col}`);
                       }
                       resIdStr = ids.join(',');
                       targetArrowId = ids[ids.length - 1]; // Letzte Ziffer für den Pfeil
                    } else {
                       gridData[pRow][writeCol] = {val: resDigit.toString(), type: 'partial', showOnStep: stepCounter};
                       resIdStr = `cell-${pRow}-${writeCol}`;
                       targetArrowId = resIdStr;
                    }

                    let expText = `<div class="step-container hidden mb-4" id="step-desc-${stepCounter}">`;
                    expText += `<div class="leading-relaxed flex flex-wrap items-center">`;

                    // Arrow logic for hover
                    let arrPathMult1 = `${qId}->${pId}`;
                    let arrPathMult2 = `${pId}->${targetArrowId}`;
                    let arrPathMultAll = `${qId}->${pId}->${targetArrowId}`;

                    expText += TEXT(n2Digit, qId, 'text-blue-300 font-bold', 'fast', true, arrPathMult1);
                    expText += PLAIN('·');
                    expText += TEXT(n1Digit, pId, 'text-white font-bold', 'fast', false, arrPathMult2);

                    if (carry > 0) {
                        expText += PLAIN('+');
                        expText += PLAIN(`${carry} (Ü)`, 'fast', false);
                    }
                    expText += PLAIN('=');
                    expText += TEXT(prod, resIdStr, 'text-green-400 font-bold', 'fast', false, arrPathMultAll);
                    expText += `</div>`;

                    expText += `<div class="mt-1 text-blue-300 flex items-center text-lg">`;
                    if (isLast) {
                        expText += PLAIN("Schreibe", "fast", false);
                        expText += TEXT(writeVal, resIdStr, 'text-green-400', 'fast', false, arrPathMultAll);
                    } else {
                        if (nextCarry > 0) {
                            expText += PLAIN("Schreibe", "fast", false);
                            expText += TEXT(resDigit, resIdStr, 'text-green-400', 'fast', false, arrPathMultAll);
                            expText += PLAIN(`, merke ${nextCarry}.`, "fast", false);
                        } else {
                            expText += PLAIN("Schreibe", "fast", false);
                            expText += TEXT(resDigit, resIdStr, 'text-green-400', 'fast', false, arrPathMultAll);
                        }
                    }
                    expText += `</div></div>`;

                    steps.push({ id: stepCounter, html: expText });
                    writeCol--;
                    carry = nextCarry;
                    stepCounter++;
                }
            }

            // --- PHASE 2: ADDITION ---
            gridData[3][1] = {val: '+', type: 'op', showOnStep: stepCounter};

            for(let c = 0; c < totalCols; c++) {
                gridData[5][c] = {val: '', type: 'line', showOnStep: stepCounter};
            }

            let addIntroHtml = `
                <div class="step-container hidden mb-6" id="step-desc-${stepCounter}">
                    <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100 border-t border-zinc-700 pt-4 mt-2">Addition</div>
                    <div class="mt-1 leading-relaxed text-zinc-400">Addiere nun die Zwischenergebnisse spaltenweise.</div>
                </div>`;
            steps.push({ id: stepCounter, html: addIntroHtml });
            stepCounter++;

            let addCarry = 0;
            for(let c = 7; c >= 1; c--) {
                let v1 = gridData[2][c] ? parseInt(gridData[2][c].val) : 0;
                let v2 = gridData[3][c] ? parseInt(gridData[3][c].val) : 0;

                if(isNaN(v1) && isNaN(v2) && addCarry === 0) continue;
                if(gridData[2][c] == null && gridData[3][c] == null && addCarry === 0 && c <= 2) break;

                v1 = isNaN(v1) ? 0 : v1;
                v2 = isNaN(v2) ? 0 : v2;

                let sum = v1 + v2 + addCarry;
                let resDigit = sum % 10;
                let nextAddCarry = Math.floor(sum / 10);

                gridData[6][c] = {val: resDigit.toString(), type: 'res', showOnStep: stepCounter};
                let carryIdStr = "";
                if (nextAddCarry > 0) {
                    gridData[4][c-1] = {val: nextAddCarry.toString(), type: 'carry', showOnStep: stepCounter};
                    carryIdStr = `cell-4-${c-1}`;
                }

                let id1 = gridData[2][c] ? `cell-2-${c}` : null;
                let id2 = gridData[3][c] && gridData[3][c].val !== '+' ? `cell-3-${c}` : null;
                let idC = (addCarry > 0) ? `cell-4-${c}` : null;
                let resId = `cell-6-${c}`;

                let idsToHl = [id1, id2, idC].filter(Boolean).join(',');

                // Construct Arrow Path for Addition
                let arrP = [];
                if(id1) arrP.push(id1);
                if(id2) arrP.push(id2);
                if(idC) arrP.push(idC);
                arrP.push(resId);
                let aPath = arrP.join('->');

                let expText = `<div class="step-container hidden mb-4" id="step-desc-${stepCounter}">`;
                expText += `<div class="leading-relaxed flex flex-wrap items-center">`;

                let parts = [];
                if(id1) parts.push(TEXT(v1, id1, 'text-white', 'fast', true));
                if(id2) parts.push(TEXT(v2, id2, 'text-white', 'fast', false));
                if(idC) parts.push(TEXT(addCarry + " (Ü)", idC, 'text-red-400', 'fast', false));

                expText += parts.join(PLAIN(" + ", "fast", false));
                expText += PLAIN(" = ", "fast", false);
                expText += TEXT(sum, resId, 'text-blue-400 font-bold', 'fast', false, aPath);
                expText += `</div>`;

                expText += `<div class="mt-1 text-blue-300 flex items-center text-lg">`;
                if(nextAddCarry > 0) {
                    expText += PLAIN("Schreibe", "fast", false);
                    expText += TEXT(resDigit, resId, 'text-blue-400', 'fast', false, aPath);
                    expText += PLAIN(", Übertrag", "fast", false);
                    expText += TEXT(nextAddCarry, carryIdStr, 'text-red-400', 'fast', false);
                } else {
                    expText += PLAIN("Schreibe", "fast", false);
                    expText += TEXT(resDigit, resId, 'text-blue-400', 'fast', false, aPath);
                }
                expText += `</div></div>`;

                steps.push({ id: stepCounter, html: expText });

                addCarry = nextAddCarry;
                stepCounter++;
            }

            // --- DONE ---
            let finalResStr = (num1 * num2).toString();
            let finalResIds = Array.from({length: finalResStr.length}, (_, i) => `cell-6-${6 - finalResStr.length + 1 + i}`).join(',');

            steps.push({
                id: stepCounter,
                html: `
                    <div class="step-container hidden mb-6" id="step-desc-${stepCounter}">
                        <div class="anim-element font-bold text-2xl sm:text-3xl mb-1 text-zinc-100 border-t border-zinc-700 pt-4 mt-2">Fertig! 🎉</div>
                        <div class="mt-1 leading-relaxed flex flex-wrap items-center">
                            ${PLAIN("Das Ergebnis ist")}
                            ${TEXT(finalResStr, finalResIds, 'text-green-400 font-bold')}
                        </div>
                    </div>`
            });

            renderGrid();
            renderExplanations();

            currentStep = 0;
            resetGridState(0);

            document.getElementById(`step-desc-0`).classList.remove('hidden');
            document.querySelectorAll('#step-desc-0 .anim-element').forEach(el => el.classList.add('revealed'));

            updateButtons();
        }

        function renderGrid() {
            let grid = document.getElementById('math-grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${totalCols}, minmax(1.8rem, 2.5rem))`;

            for(let r=0; r<7; r++) {
                if(r === 1) {
                    for(let c=0; c<totalCols; c++) {
                        let borderClass = (c > 0 && c < 7) ? "border-b-[3px] border-zinc-200/50" : "";
                        grid.innerHTML += `<div class="h-[12px] ${borderClass} mb-2"></div>`;
                    }
                    continue;
                }

                // Bottom border line for addition
                if(r === 5) {
                    for(let c=0; c<totalCols; c++) {
                        let cell = gridData[r][c];
                        let step = cell ? cell.showOnStep : 999;
                        let borderClass = (c > 0 && c < 7) ? "border-b-[3px] border-zinc-200/50" : "";
                        grid.innerHTML += `<div data-step="${step}" class="h-[12px] ${borderClass} mb-2 transition-all duration-300 opacity-0 transform translate-y-2"></div>`;
                    }
                    continue;
                }

                for(let c=0; c<totalCols; c++) {
                    let cell = gridData[r][c];
                    let id = `cell-${r}-${c}`;

                    if(!cell) {
                        grid.innerHTML += `<div id="${id}" class="h-[44px]"></div>`;
                        continue;
                    }

                    let colorClass = "text-zinc-100";
                    if(cell.type === 'res') colorClass = "text-green-400 font-bold";
                    if(cell.type === 'carry') colorClass = "text-red-400 text-2xl mt-4";
                    if(cell.type === 'op') colorClass = "text-zinc-500";

                    grid.innerHTML += `
                        <div id="${id}" data-step="${cell.showOnStep}" class="h-[44px] flex items-center justify-center transition-all duration-300 ${colorClass} opacity-0 transform translate-y-2">
                            <span>${cell.val}</span>
                        </div>
                    `;
                }
            }
        }

        function renderExplanations() {
            const container = document.getElementById('explanations-container');
            container.innerHTML = '';
            steps.forEach(step => {
                container.innerHTML += step.html;
            });
        }

        // --- Core UI Navigation ---
        function updateButtons() {
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');

            if (currentStep <= 0) {
                btnPrev.disabled = true;
                btnPrev.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnPrev.disabled = false;
                btnPrev.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            if (currentStep >= steps.length - 1) {
                btnNext.innerHTML = `<span>Neustart</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>`;
            } else {
                btnNext.innerHTML = `<span>Weiter</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            }
        }

        function resetGridState(targetStepIndex) {
            let maxStepId = steps[targetStepIndex].id;
            document.querySelectorAll('#math-grid > div[data-step]').forEach(el => {
                let stepVal = parseInt(el.dataset.step);
                if(stepVal > maxStepId) {
                    el.classList.add('opacity-0', 'translate-y-2');
                    el.classList.remove('opacity-100', 'translate-y-0');
                } else {
                    el.classList.remove('opacity-0', 'translate-y-2');
                    el.classList.add('opacity-100', 'translate-y-0');
                }
            });
        }

        function prevStep() {
            if (isAutoPlaying) stopAutoplay();
            if (isAnimating || currentStep <= 0) return;

            let container = document.getElementById(`step-desc-${steps[currentStep].id}`);
            container.classList.add('hidden');
            container.querySelectorAll('.anim-element').forEach(el => el.classList.remove('revealed'));

            currentStep--;

            document.querySelectorAll('.highlight-cell-active, .hl-text-active').forEach(e => {
                e.classList.remove('highlight-cell-active', 'hl-text-active');
            });
            document.getElementById('arrow-paths').innerHTML = ''; // Clear arrows

            resetGridState(currentStep);

            if (currentStep > 0) {
                document.getElementById(`step-desc-${steps[currentStep].id}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                document.getElementById(`explanations-container`).scrollTo({top: 0, behavior: 'smooth'});
            }

            updateButtons();
        }

        function nextStep(fromAuto = false) {
            if (!fromAuto && isAutoPlaying) stopAutoplay();
            if (isAnimating) return;
            if (currentStep >= steps.length - 1) {
                initProblem();
                return;
            }
            currentStep++;
            animateStep(currentStep);
        }

        async function animateStep(stepIndex) {
            isAnimating = true;
            document.getElementById('btn-next').disabled = true;
            document.getElementById('btn-prev').disabled = true;

            document.querySelectorAll('.highlight-cell-active, .hl-text-active').forEach(e => {
                e.classList.remove('highlight-cell-active', 'hl-text-active');
            });
            document.getElementById('arrow-paths').innerHTML = ''; // Clear arrows

            let logicalStepId = steps[stepIndex].id;
            const container = document.getElementById(`step-desc-${logicalStepId}`);
            container.classList.remove('hidden');

            const elements = Array.from(container.querySelectorAll('.anim-element'));

            for (let i = 0; i < elements.length; i++) {
                const el = elements[i];
                el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                el.classList.add('revealed');

                if (el.dataset.hlClear === "true") {
                    document.querySelectorAll('.highlight-cell-active').forEach(e => e.classList.remove('highlight-cell-active'));
                    document.querySelectorAll('.hl-text-active').forEach(e => e.classList.remove('hl-text-active'));
                }

                if (el.dataset.hlIds) {
                    el.classList.add('hl-text-active');
                    enter(el.dataset.hlIds, true);
                }

                let delay = isAutoPlaying ? 1000 : (el.classList.contains('fast') ? 300 : 400);
                await sleep(delay);
            }

            resetGridState(stepIndex);

            await sleep(isAutoPlaying ? 500 : 200);

            isAnimating = false;
            document.getElementById('btn-next').disabled = false;
            updateButtons();

            if (isAutoPlaying) {
                if (currentStep < steps.length - 1) {
                    autoPlayTimeout = setTimeout(() => {
                        if (isAutoPlaying) nextStep(true);
                    }, 1000);
                } else {
                    stopAutoplay();
                }
            }
        }
    </script>
</body>
</html>
